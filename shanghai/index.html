<style>

 --ground: #f7f6f3;

}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; font-size: 17px; }
body { background: var(--ground); color: var(--ink); font-family: var(--serif); line-height: 1.72; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.wrap { max-width: var(--col); margin: 0 auto; padding: 0 var(--pad); }

/* ── NO GLOW ON LIGHT ─────────────────────────────────────── */
.glow { display: none; }
.content { position: relative; }

/* ── MASTHEAD ─────────────────────────────────────────────── */
.masthead { padding: 3.5rem 0 2rem; }
.mast-city { font-family: var(--display); font-size: clamp(3rem, 9vw, 5.5rem); font-weight: 400; line-height: 0.88; letter-spacing: -0.03em; font-optical-sizing: auto; color: var(--ink); }
.mast-city em { font-style: italic; color: var(--accent); font-weight: 300; }
.mast-bar { display: flex; align-items: center; gap: 1.2rem; margin-top: 1.4rem; padding-top: 1rem; border-top: 1px solid var(--rule); }

.mast-weather-temp { color: var(--ink-2); font-weight: 500; }

/* ── PLANE PIECE ──────────────────────────────────────────── */
.plane-piece { padding: 2.5rem 0 3rem; border-bottom: 1px solid var(--rule); }
.kicker { font-family: var(--mono); font-size: 0.65rem; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 0.9rem; }
.plane-piece h2 { font-family: var(--display); font-size: clamp(1.9rem, 5vw, 3rem); font-weight: 400; line-height: 1.02; letter-spacing: -0.02em; font-optical-sizing: auto; margin-bottom: 0.8rem; color: var(--ink); }
.standfirst { font-family: var(--serif); font-size: 1.18rem; font-weight: 300; font-style: italic; color: var(--accent); line-height: 1.45; margin-bottom: 2rem; max-width: 32ch; }

/* ── PROSE ────────────────────────────────────────────────── */
.prose p { margin-bottom: 1.25em; color: var(--ink-2); font-size: 1rem; }
.prose p:last-child { margin-bottom: 0; }
.prose-drop > p:first-of-type::first-letter {
 font-family: var(--display); float: left; font-size: 4em; line-height: 0.76;
 font-weight: 400; padding: 0.04em 0.1em 0 0; color: var(--accent); font-optical-sizing: auto; }

/* ── EXPAND TOGGLE ────────────────────────────────────────── */
.expand { margin-top: 0.8rem; }
.expand-btn {
 display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer;
 background: none; border: none; padding: 0.2rem 0;
 font-family: var(--mono); font-size: 0.65rem; font-weight: 500;
 letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);
 transition: color 0.12s;
}
.expand-btn:hover { color: var(--accent-2); }
.expand-btn .chevron { display: inline-block; transition: transform 0.18s; font-style: normal; }
.expand-btn.open .chevron { transform: rotate(90deg); }
.expand-body {
 display: none; margin-top: 1rem;
 padding: 1.2rem 1.4rem;
 background: var(--ground-2);
 border-left: 2px solid var(--accent);
}
.expand-body.open { display: block; }
.expand-body .prose p { font-size: 0.92rem; color: var(--ink-2); }
.expand-body .prose-drop > p:first-of-type::first-letter { font-size: 3em; color: var(--accent); }

/* ── ESSAY TEASER ─────────────────────────────────────────── */
.essay-teaser { margin-bottom: 0.5rem; }
.essay-teaser p { font-family: var(--serif); font-size: 1rem; color: var(--ink-3); line-height: 1.7; margin: 0; display: inline; }
.essay-continue { display: inline; font-family: var(--serif); font-size: 1rem; color: var(--ink-3); }
.essay-continue::before { content: '\2026\00a0'; color: var(--rule-2); }
.essay-continue a { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); font-family: var(--mono); font-size: 0.65rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; vertical-align: baseline; }
.essay-continue a:hover { color: var(--accent-2); border-color: var(--accent); }


.chapter { padding: 3rem 0; border-bottom: 1px solid var(--rule); }
.chapter.is-past { opacity: 0.45; }
.chapter.is-today { border-left: 2px solid var(--accent); padding-left: 1.5rem; margin-left: -1.5rem; }
.chapter-label { font-family: var(--mono); font-size: 0.62rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.6rem; }
.chapter-head { margin-bottom: 1.8rem; }
.chapter-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 0.5rem; }
.chapter-meta { font-family: var(--mono); font-size: 0.65rem; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 0.5rem; }
.chapter-meta .date-accent { color: var(--accent); }
.chapter-title { font-family: var(--display); font-size: clamp(1.7rem, 4.5vw, 2.4rem); font-weight: 400; line-height: 1.04; letter-spacing: -0.02em; font-optical-sizing: auto; color: var(--ink); }
.day-weather { display: flex; flex-direction: column; align-items: flex-end; gap: 0.1rem; flex-shrink: 0; padding-top: 0.1rem; }

/* ── SPINE ────────────────────────────────────────────────── */
.spine { position: relative; padding-left: 2rem; margin-top: 1.5rem; }
.spine::before { content: ''; position: absolute; left: 0; top: 0.6rem; bottom: 0.6rem; width: 1px; background: var(--rule); }
.stop { position: relative; margin-bottom: 1.8rem; }
.stop:last-child { margin-bottom: 0; }
.stop::before {
 content: ''; position: absolute; left: -2rem; top: 0.52rem;
 width: 7px; height: 7px; border-radius: 50%;
 background: var(--ground); border: 1px solid var(--rule-2);
}
.stop[data-kind="food"]::before { border-color: var(--accent); background: var(--ground); }
.stop[data-kind="culture"]::before { background: var(--accent); border-color: var(--accent); }
.stop-time { font-family: var(--mono); font-size: 0.62rem; font-weight: 500; letter-spacing: 0.1em; color: var(--accent); text-transform: uppercase; margin-bottom: 0.15rem; }
.stop-head { display: flex; align-items: baseline; gap: 0.7rem; flex-wrap: wrap; margin-bottom: 0.2rem; }
.stop-title { font-family: var(--display); font-size: 1.1rem; font-weight: 400; color: var(--ink); line-height: 1.2; font-optical-sizing: auto; }

.stop-title a:hover { color: var(--accent); border-color: var(--accent); }
.stop-tag { font-family: var(--mono); font-size: 0.58rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.15em 0.55em; border-radius: 1px; flex-shrink: 0; }

.bib-badge .dot { width: 5px; height: 5px; border-radius: 50%; background: #fff; display: inline-block; }
.stop-note { font-family: var(--serif); font-size: 0.88rem; color: var(--ink-3); line-height: 1.65; }
.stop-ref { font-family: var(--mono); font-size: 0.62rem; color: var(--rule-2); margin-top: 0.3rem; letter-spacing: 0.04em; }

.ledger-ref { font-family: var(--mono); font-size: 0.6rem; color: var(--rule-2); margin-top: 0.15rem; }

.ledger-link { font-family: var(--mono); font-size: 0.62rem; color: var(--accent); text-decoration: none; flex-shrink: 0; }

/* ── BACK POCKET ──────────────────────────────────────────── */

/* ── SECTION LABEL ────────────────────────────────────────── */

/* ── FAB / NOTES ──────────────────────────────────────────── */
footer { padding: 3rem 0 4rem; text-align: center; font-family: var(--mono); font-size: 0.62rem; color: var(--rule-2); letter-spacing: 0.12em; text-transform: uppercase; }

.notepanel.open { display: block; }

.notepanel textarea:focus { outline: 1px solid var(--accent); }

.notelist { margin-top: 0.5rem; max-height: 120px; overflow-y: auto; }
.noteitem { font-family: var(--mono); font-size: 0.65rem; color: var(--ink-2); padding: 0.35rem 0; border-bottom: 1px solid var(--rule); line-height: 1.4; }

<script>
const TRIP = {
 meta: {
 city: "Shanghai",
 dates: "24 Oct – 1 Nov 2026",
 flights: { out: "NZ289 · AKL 11:45pm → PVG 6:55am", ret: "NZ288 · PVG 2:15pm → AKL 6:45am +1", ref: "D52ZEH" },
 base: { name: "OPARTMENT The Far Eastern, 90 Xizang Middle Rd, Huangpu", url: "https://www.trip.com/hotels/shanghai-hotel-detail-8378334", map: "https://maps.google.com/?q=90+Xizang+Middle+Road+Huangpu+Shanghai" },
 plane: {
 kicker: "Read on the plane",
 title: "The Second Look",
 standfirst: "A city rewards a second visit only when you stop looking for what impressed you the first time.",
 preview: `<p>Six months ago you stood on the Bund and turned around. That gesture, so obvious as to be almost automatic, is what the city trains you to perform. The colonial facade behind you, the corkscrew of Pudong opposite, the argument between them running back and forth across the Huangpu like a rally in a tennis match neither player is prepared to concede. Everyone who visits Shanghai does this. The Chinese state, in ways it does not need to explain, wants you to. The whole city has been arranged so that the visual grammar of the encounter is difficult to avoid. It is not a small thing. It is the argument that Shanghai wanted to have with the twentieth century, and now with the twenty-first, and it is a good argument. You could spend a week looking at that river and never come to the end of what it is trying to tell you.</p>`,
 full: `<p>But you have already had that conversation. The question a second visit poses is a different one. What is left of a city once you have seen the version of itself it prepared for you, the polished sequence of Rockbund and Xintiandi and Fuxing Park and Wukang Road, the walking tours and the wet markets, the food streets that appear in every English-language guide? What remains, when the performance is over, is the room itself.</p>

<p>Consider the room. Not the stage, the room. There is a story Ballard tells in the memoir he wrote after Empire of the Sun. He returned to Shanghai in the 1990s, forty years after being interned as a child in Lunghua camp, and went to look at the Amherst Avenue house where his family had lived before the Japanese arrived. The building was still there, in what is now Xinhua Road in the western reach of the old French Concession. Someone had subdivided it, packed families into every room, hung laundry across the veranda where his mother had held cocktail parties. He was not distressed by this. He was, he wrote, oddly reassured. The house had gone on. The stage set of his colonial childhood had proved less durable than the walls that had held it. The lives being lived in those rooms in 1991 were closer to the real Shanghai than anything his family had ever seen, and this seemed to him not an indictment but a kind of grace.</p>

<p>This is the thing worth carrying with you into the October week. Shanghai is a city that has spent every one of the last hundred and eighty years being reoccupied by whatever regime happens to be in charge. British and French merchants first, then Japanese soldiers, then the Nationalists briefly, then the Communist Party for three decades of dormancy, then Deng Xiaoping's economic reforms, then the state's rediscovery of soft power and the private capital that has followed it. Each occupation has left behind buildings that it built to announce its permanence. Each has been replaced. The Sassoons expected the Cathay Hotel to be theirs forever. The Kadoories expected the Marble Hall. The People's Liberation Army marched into the International Settlement in May 1949 and reappropriated both. Deng Xiaoping declared Pudong a special economic zone in 1990 and the Chinese state, over the following three decades, built a new skyline on rice paddies and cotton fields to make a rhetorical point that had nothing to do with either. Every one of these was, in its moment, going to last forever. None of them did. What lasted was the water they were all built beside, the streets they were all built along, and the people who had been living in Shanghai before any of them arrived and were living there after each of them was gone.</p>

<p>The second visit is a visit to the room, not the stage. It is possible to arrange a trip to Shanghai that spends most of a week in the Concession alone, walking the same plane-tree streets you walked in April, and to call this a second look. It would not be. It would be watching the same performance from a slightly different seat. What the room offers is different. Yangpu, north of the reclaimed West Bund, where the wharves and cotton mills that fed the concessions from beyond their own borders still stand because nobody has yet had the money or the will to convert them into anything else. Nanshi, the old walled city, which the concession-era treaty maps drew a red line around so that Western law and Chinese law would not overlap. Hongkou, north of Suzhou Creek, the neighbourhood where twenty thousand Jewish refugees from Nazi Europe settled between 1933 and 1941 because Shanghai was the only city in the world that would accept them without a visa, and where, later, the writer Lu Xun spent his final years diagnosing what he saw as the moral pathology of the country he loved. These are the rooms. None of them was built for you. None of them will perform.</p>

<p>There is a specific pleasure available in this. Anyone who has spent time in a foreign city learns eventually that the good hours are the ones spent in places that have no obligation to notice you are there. A wet market at seven in the morning. A hutong lane where an old man is repairing a radio on the pavement. A restaurant with no English menu whose regulars have been eating there for thirty years. These are not authentic in the sense that word is usually deployed, which is to say marketable. They are simply not staged. And what a city is, underneath its stagecraft, is the sum of all the moments in which it is not being asked to prove anything to anyone.</p>

<p>Consider also what has changed in the six months since April. The trip you took then was structured around a specific framing, the Four Waterfronts, the argument that Shanghai's identity could be read off its treatment of the Huangpu at four distinct points. It was a good framing. It got you inside the city in a way that a more scattered itinerary would not have. But every framing is also a limit, and one of the things a second visit is for is to notice the limit. The waterfront thesis is Shanghai's own story about itself. The Bund is Shanghai's face to the West. Pudong is Shanghai's face to itself. West Bund is Shanghai's face to the future it wants. Yangpu, the fourth waterfront you did not fully walk in April, is Shanghai's face to its own working past. All of these are theses. All of them are true. And all of them position Shanghai as a city best understood in relation to what is happening at its edge, where the water meets the land. Which is to say, the city as seen from a boat.</p>

<p>What Shanghai looks like from inside, from a lane house courtyard or an artist's studio or someone's kitchen, is a different city. It is more ordinary and more strange. The lane house is the actual unit of Shanghai. Not the Bund building, not the Pudong tower, not the West Bund museum. The shikumen. Two storeys of grey brick, an internal courtyard, a stone arched doorway. Between the mid-nineteenth century and the mid-twentieth, most of Shanghai's population lived in some version of this. Many of them still do. Every time the international press produces one of its periodic laments about Shanghai's disappearing old neighbourhoods, this is what it is lamenting: the demolition of shikumen. The city has demolished tens of thousands of them since 1990 to make way for the towers that appear on every guidebook cover. It has also preserved some, most famously Xintiandi, which is now a shopping district in shikumen costume. What it has done less visibly is leave a great number of them alone, still occupied, still functioning, in neighbourhoods where nothing else has changed enough to make them worth photographing. The old walled city is one of these. Hongkou is another. If you want to know what Shanghai actually is, as opposed to what it wants you to think it is, you go to the shikumen the city has forgotten to demolish or restore.</p>

<p>A word about art. Shanghai's gallery scene has, over the past ten years, become one of the two or three most serious in Asia. This is not a projection. Auction volumes, primary sales, the fair calendar around West Bund Art and Design and Art021 in November, the international dealers who have opened Shanghai outposts, the private museums that have proliferated along the reclaimed West Bund waterfront, all of this represents a genuine consolidation of Chinese contemporary art around this city. The important thing for a visitor to understand is that the museums are not where the interesting work is. The museums are where the story of the interesting work gets told. The work itself is in the small galleries, the ones that operate from converted lane houses in the Concession, from upper floors on Anfu Road, from spaces at the top of former textile mills at M50. Capsule at 275 Anfu Road, in a 1930s garden house. BANK, now in the White Building at 457 North Shaanxi Road after two previous addresses. Antenna Space up at M50. These are galleries you should walk into by appointment, when the shows are quiet, and where, if you are alert enough to notice, you may be looking at the artists who will define the next twenty years of Chinese art before anyone outside a very small world knows their names.</p>

<p>And a word about eating. There is a coincidence of timing that matters. Late October in Shanghai is hairy crab season, the six or seven weeks when the male mitten crabs mature in the tenth lunar month and the females in the ninth, and the best restaurants in the city serve almost nothing else. It is also, as it happens, the season when the Michelin Guide is at its most useful in Shanghai, which is to say when the Bib Gourmand list is a genuinely reliable filter rather than a suggestion. The 2026 guide runs to thirty-five Bib Gourmand entries in the city, most of them Chinese kitchens serving one thing at a serious level, and this is the register the eating on this trip should be tuned to. Not the fine dining rooms, which are excellent but which perform for you. The one-dish shops. The noodle counters. The neighbourhood banquet halls that have been at the same address for thirty years. Twelve of the thirty-five Bibs are within a fifteen-minute walk of the hotel. That is unusual. Take advantage. The week that follows tries, without making a project of it, to work through as many of them as the itinerary can reasonably hold, on the theory that a city's Bib Gourmand list is a better index of what it actually eats than any other single source available to a visitor.</p>

<p>What you are looking for, then, in the week that follows, is not the city Shanghai wants to show you. That city you already saw. You are looking for what remains when the show is over: the rooms, the meals, the small studios, the water at Yangpu that is still a working river rather than a stage. The person who sees a city twice sees it differently the second time not because the city has changed, though of course it has, but because they know what to ignore. In April you ignored nothing. In October you can afford to. That is the whole discipline of a second look. Choose what to walk past. The city will notice you doing it, in the way that cities notice the visitors who have started to see them clearly, and it will begin, however imperceptibly, to offer you the things it did not offer the first time.</p>

<p>The plane will land at six fifty-five in the morning. There will be light on the tarmac. The immigration hall will be full and then, an hour later, empty. You will get in a car and be driven forty-five minutes to a hotel two minutes from the old walled city, and the driver will not ask you what you have come to see, because he assumes, correctly, that a foreigner arriving in Shanghai in late October has come to see the same things every other foreigner has come to see. What he will not know, and what you will begin to demonstrate over the eight days that follow, is that the visitor who comes back the second time is a different visitor entirely. The river is the same river. The city is the same city. The disciplines you bring to it are what has changed. Bring the discipline of the second look, and Shanghai will meet you there.</p>`
 }
 },

 voices: [
 {
 author: "David Sedaris",
 title: "A Man Walks Into a Country He's Already Been To",
 body: `<p>My sister Amy called while I was packing and asked what I was bringing to Shanghai, and I said a suitcase, and she said no, what was I bringing, like an offering, the way you'd bring a casserole to a wake, and I understood she meant a gift, and I said I hadn't thought about it, and she said that was because I never think about anything until I'm already being judged for not having thought about it, which is fair, and also unrelated to the topic of Shanghai, which was supposed to be the topic.</p>

<p>I have been to Shanghai once before, in April, for eight days, at the end of which I felt I understood the city roughly as well as I understand my own liver, which is to say I trust it's back there doing something and I choose not to interfere. I have decided to go back in October, partly because there is a specific crab that is only good for six weeks a year, which strikes me as an excellent reason to travel and also the exact kind of thing that gets you handed a pamphlet at immigration.</p>

<p>The crab situation deserves its own paragraph, and here it is. The crab is called a hairy crab, which is not a nickname bestowed by an unkind child but the actual, agreed-upon, printed-on-the-menu name, and it has hair on its legs the way certain uncles have hair on their knuckles, presented without apology, and the crab is, at its peak, mostly a delivery mechanism for a small custardy roe that people in Shanghai discuss the way people in France discuss Bordeaux vintages, except with more pointing. I am told there is a correct way to eat it involving eight separate tools, none of which resemble a fork, all of which resemble things you would find in a dentist's second drawer, the one he doesn't want you looking in.</p>

<p>I have also decided, this time, to eat alone, mostly, which people find sad until I explain that eating alone in Shanghai simply means eating at a counter, on a stool, facing a wall, next to eleven other people also eating alone at a counter on a stool facing a wall, which is not solitude so much as a very quiet party where nobody has to talk to you about their start-up. I find I like a restaurant with one thing on the menu. It removes the possibility of regret. You cannot order the wrong noodle if there is only one noodle. This is, I think, the beginning of wisdom, or at least the beginning of a pleasant Tuesday.</p>

<p>The hotel is not the hotel I stayed at in April, on account of a booking mix-up I am choosing not to relitigate here, except to say that somewhere a hotel with my name in its system is holding a room it does not know I am not coming to, the way a dog holds a stick you've clearly stopped throwing. The new hotel is near the old walled city, which delights me, because the old walled city is the one part of Shanghai that has consistently declined to be improved, the way certain relatives decline to be improved, and I mean this as the highest compliment available to a neighbourhood or a relative.</p>

<p>I've been practicing my four words of Mandarin in the shower, which my husband finds unbearable, mostly because I do the tones with my whole body, like a man conducting an orchestra that has fired him. Xie xie. Bu yao. Wo bu dong. That last one means I don't understand, and I intend to say it so often and with such conviction that the city will eventually just leave me be, the way a teacher stops calling on the kid who's clearly not going to know the answer, out of what I choose to interpret as mercy.</p>

<p>What I actually love about going back somewhere is that the second time, nobody expects you to marvel. Nobody stands you in front of a very tall building and waits for your face to do the thing. You get to walk past the tall building like you have somewhere to be, which you do, because there is a noodle situation forty minutes north involving a river nobody photographs, and I intend to be standing in front of it at the exact moment my body finally agrees to be in this time zone, whichever hour that turns out to be.</p>

<p>In the meantime I am bringing my sister a gift, because she was right and I am wrong, which I will also not be relitigating. I am bringing her a hairy crab keychain, which does not exist yet, but which I intend to locate, by force if necessary, somewhere in a market stall between here and the noodle situation, because there is nothing I love more in this world than handing someone a small ugly object and watching them try to figure out how they're supposed to feel about it. That, I have decided, is the whole of travel. You go somewhere far away, and you come back with a small ugly object, and everyone pretends, briefly and with real tenderness, that the object explains everything.</p>`
 }
 ],

 title: "Where the River Is Still Working",
 essay: `<p>An early landing has, in this city, a specific quality. Shanghai at seven is already three hours into its day. The delivery scooters are on the second run. The dumpling shops on Xizang Middle Road have been open since five. By the time the taxi from Pudong clears the Yan'an tunnel and drops you at the hotel, the working city has already, invisibly, made all its most important decisions of the morning: what is being cooked for lunch, what will arrive at the wet market this afternoon, whose grandchild will be walked to school and by whom.</p>
<p>There is no point trying to insert yourself into any of this before nightfall. Jet lag has its own timetable and it is worth respecting. What the day is really for is the walk after dark, north of the Bund, past the point where the promenade stops being maintained and the tourists stop appearing on the map. Yangpu Binjiang was cotton mills and shipyards and a power station until the 2010s. Some of it has been converted into museums by the same municipal reclamation project that produced the West Bund. Most of it has not. The cranes are still standing over water that no longer needs them.</p>
<p>Walk east from there as the light fails and the light on the far bank comes up, and you are looking at a version of the Bund view that almost nobody sees, from an angle almost nobody uses, because it involves walking somewhere the city has not yet invited you to walk. This is the room, not the stage. Begin here, and begin gently. The first day of a long trip is not the day to prove anything.</p>`,

 { time: "6:30pm", title: "Yu Du Lao Wei Mian", kind: "food", state: "open", bib: true,

 expand: {
 label: "About the shop",
 body: `<p>The owner grew up in Zhoushan, the fishing archipelago off the Zhejiang coast, and learned to make noodles from his mother before opening this shop in Huangpu more than a decade ago. Everything on the menu is built around seafood shipped in from home: a milky broth studded with yellow croaker, or with beltfish, which only shows up boned and at its best in October and November, which means this week is the correct week to order it. The yellow croaker spring rolls are the other thing regulars order without fail. It runs long hours, from eight in the morning to three the next morning, and the seafood is kept visibly on ice at the counter so you can point at what you want added to the bowl. Nearest metro is Madang Road (Line 9/13) or Lujiabang Road (Line 8), both about a ten-minute walk - closer than the DiDi drop-off will feel after traffic, worth using on the way back if you'd rather walk off the flight.</p>`

 id: "d2", dow: "Sunday", date: "25 October", chapter: "II",
 arc: "Waterfronts · II of II",
 title: "Concrete That Remembers What It Was",
 essay: `<p>West Bund is what happens when a state government identifies eleven kilometres of decommissioned industrial waterfront and, rather than sell it to residential developers, hands it to museums. The result, over about fifteen years, is a corridor of contemporary art institutions built inside the shells of what was there before. Cement silos. Fuel tanks. Coal handling docks. Every architect involved was told, explicitly, not to hide the original bones.</p>
<p>This is why, walking through Tank Shanghai at ten in the morning with the door just opened and the first light on the concrete, you have the experience so specific to Shanghai's contemporary museum quarter: standing in a room whose ceiling is thirty metres above your head and whose original purpose was to hold two thousand tonnes of aviation fuel for the airport that no longer exists.</p>
<p>The Long Museum, ten minutes north on the same waterfront path, is the private collection of Liu Yiqian and Wang Wei, a couple who made their money in mainland Chinese finance and then spent the next twenty years assembling one of the largest private holdings of postwar Chinese art in the world. The columns of the old coal wharf are still visible in the museum's basement. It is closer to what the Rockefellers or the Fricks were doing in New York in 1910 than to anything comparable in Europe now. Take it seriously, and take your time - there is nowhere else to be today.</p>`,
 events: [
 { time: "9:00am", title: "Da Hu Chun", kind: "food", bib: true,
 note: "136 Sichuan Middle Rd, 6 min walk. The Shanghainese pan-fried bun in its original form.",
 map: "https://maps.google.com/?q=136+Sichuan+Middle+Road+Shanghai",
 expand: {
 label: "About the shop, and what to order",
 body: `<p>Da Hu Chun opened at this address in 1932, moved away for a period and returned, and has now held its Bib Gourmand for eight consecutive years. The style here is the qingshui, or plain-water, school of shengjianbao: a fully fermented dough with almost no gelatin added, which gives a drier, breadier bun than the soupier versions sold elsewhere, and is the reason locals distinguish this shop from the rest of the city's pan-fried bun trade. Order the classic pork, and if you're curious, the crabmeat-and-roe version sold alongside it in season. The mini wontons in clear broth make a good palate cleanser between rounds, and the curry beef soup on the side menu is the shop's other quiet signature. Nearest metro is Nanjing East Road (Line 2), about an eight-minute walk - comparable to the DiDi at this time of morning, so either works.</p>`
 }
 },
 { time: "10:00am", title: "Tank Shanghai", kind: "culture",
 url: "https://www.tankshanghai.com/",
 note: "2380 Longteng Ave, Xuhui. DiDi, ~35 min - the metro route (Line 10 to Yuqiao, then a 20-minute walk) is technically possible but adds half an hour over the DiDi, not worth it for a single museum stop.",

 expand: {
 label: "About the building",
 body: `<p>The five cylinders were aviation fuel tanks for the old Longhua Airport, decommissioned when the airport closed and left standing on reclaimed riverfront land until the architect Li Hu, trained at OMA under Rem Koolhaas, was given the site around 2015. He kept the tanks' original steel skins and cut new openings between them rather than building a conventional gallery shell inside, so the exhibition spaces still read as industrial vessels rather than white cubes. The complex opened in 2019 and has become one of the anchor stops on the West Bund museum strip, alongside a large public lawn that fills with people flying kites on weekend afternoons regardless of what's showing inside.</p>`
 } },
 { time: "12:30pm", title: "Long Museum West Bund", kind: "culture",
 url: "http://www.thelongmuseum.com/",
 note: "3398 Longteng Ave. 20-minute walk north along the river path from Tank Shanghai - walk it, don't DiDi, the path itself is the point.",
 map: "https://maps.google.com/?q=Long+Museum+West+Bund+Shanghai",
 expand: {
 label: "About the collection",
 body: `<p>Liu Yiqian made his money in Shanghai's early stock and real-estate markets and, with his wife Wang Wei, has spent more than two decades building one of the largest private collections of modern and contemporary Chinese art anywhere, alongside a significant holding of classical Chinese painting and revolutionary-era propaganda art housed at their other Long Museum branch in Pudong. This West Bund building, by the Shanghai-based architect Liu Yichun, sits on the site of a former coal transfer dock; the concrete umbrella vaults that support the roof are the original wharf structure, left exposed rather than clad over. The rotating contemporary shows tend to favour Chinese painters who came of age after 1989, hung without much wall text, on the theory that the work should carry the room rather than the labels.</p>`
 } },
 { time: "2:30pm", title: "Wei Xiang Zhai", kind: "food",
 note: "14 Yandang Rd, near Fuxing Park. DiDi, ~20 min from West Bund - no useful direct metro from this stretch of river. Sesame-paste noodles the neighbourhood has eaten for eighty years. Small counter, no menu in English, easy alone.",
 map: "https://maps.google.com/?q=14+Yandang+Road+Shanghai",
 expand: {
 label: "About the noodle",
 body: `<p>Wei Xiang Zhai has been on Yandang Road, a short pedestrian street tucked behind Huaihai Road near Fuxing Park, since the early 1990s, and the shop still runs the same single dish it opened with: dry-tossed noodles in a toasted sesame and peanut paste, served either with a clear beef broth on the side or with wontons stirred through the same sauce. It's a small, plain room, closer to a canteen than a restaurant, and the appeal is entirely in the paste itself, nuttier and less sweet than most sesame noodle preparations sold to tourists elsewhere in the city. No English menu, but the two options (noodles with broth, or wontons in sauce) cover almost everything anyone orders.</p>`
 } },

 {
 id: "d3", dow: "Monday", date: "26 October", chapter: "III",
 arc: "Gallery Circuit · I of II",
 title: "Behind Which Door the Work Is Made",
 essay: `<p>A working artist's studio is not a gallery. In a gallery the work has been chosen, framed, priced and lit; you are seeing what has already been decided about it. In a studio the work is still being made, which means the room contains a version of a thing that does not yet know what it is going to be. To walk into that room is to be given, briefly, the private phase of the making. Almost nobody who visits a city as a tourist ever sees it.</p>
<p>Shanghai's gallery scene has, over the past decade, developed a genuinely useful convention. The serious primary-market galleries, the ones that represent artists rather than resell them, will, if asked in the right way, arrange a studio visit. It is not a service they advertise. Capsule at 275 Anfu Road, in a 1930s garden house behind an unmarked gate, is the gallery most consistently willing to do this. Enrico Polato, who founded it in 2016, is a working curator with genuine relationships to his artists. The gallery is by appointment in any case, which means the visit is already conducted at a different register from a walk-in.</p>
<p>The rest of the day is what the neighbourhood offers if you stop looking for its highlights. Anfu Road on a Monday morning has a domestic quality that vanishes by Friday. This is the Concession as an actual place, briefly, before it becomes a photograph again.</p>`,
 events: [
 { time: "9:30am", title: "Yangzhou Fan Dian", kind: "food", bib: true,
 note: "308 Fuzhou Rd, 8 min walk. Huaiyang cooking from Yangzhou. A neighbourhood kitchen with a counter section - ask for the counter seats, not the dining room.",
 map: "https://maps.google.com/?q=308+Fuzhou+Road+Shanghai",
 expand: {
 label: "About the kitchen",
 body: `<p>Yangzhou Fan Dian is one of the older Huaiyang addresses left in central Shanghai, the cuisine of the Yangzhou–Zhenjiang corridor along the lower Yangtze, prized for delicate knife work and restraint rather than heat or salt. The braised lion's head meatball, a large, loosely packed pork ball simmered until it barely holds together, is the dish the kitchen is known for. The fried rice, studded with egg and ham, and a plate of dry-fried river shrimp are the two other things worth ordering alongside it if the appetite allows. It's a bigger room than most of the week's other stops, with a proper dining hall, but there's a counter section near the entrance set up for quick, solo bowls - ask for that specifically when you're seated.</p>`
 }
 },
 { time: "11:00am", title: "Capsule Shanghai", kind: "culture", state: "open",
 url: "https://capsuleshanghai.com/",
 note: "1st floor, Building 16, Lane 275 Anfu Rd. DiDi, ~20 min - the nearest metro (Changshu Road, Line 1/7) is a similar door-to-door time with a ten-minute walk at the end, a reasonable alternative if you'd rather not deal with Monday traffic. By appointment: info@capsuleshanghai.com. Tue–Sat 11am–6pm - worth confirming this Monday slot directly when you write.",
 map: "https://maps.google.com/?q=275+Anfu+Road+Shanghai",
 expand: {
 label: "How to try for a studio visit - and how not to overstate it",
 body: `<p>Write from New Zealand at least three weeks out. Address the email to Enrico Polato and the gallery team. Mention two specific roster artists whose work you are interested in - Pixy Liao (Shanghai-born, Brooklyn-based, autobiographical photography) or Gao Yuan (Kunming-born, Beijing-based, mixed-media) are both plausible names to raise, though neither is guaranteed to be in Shanghai that week. Ask whether a studio visit might be possible during 24 October to 1 November. Explain briefly what you do and why you're interested. Be honest with yourself about the odds: this is a real, occasionally-granted courtesy from a small gallery, not a bookable product, and there is a genuine chance the answer is no or simply doesn't get a reply in time. If it doesn't happen, the gallery itself is still worth the visit - Capsule's own programme is one of the best in the Concession.</p>`
 }
 },
 { time: "12:30pm", title: "BANK / MABSOCIETY", kind: "culture",
 url: "https://bankmabsociety.com/",
 note: "White Building 5F, 457 North Shaanxi Rd, Jing'an. DiDi, ~15 min. Mathieu Borysevicz's gallery, moved here in 2024. Tue–Sat 10:30am–6:30pm.",
 map: "https://maps.google.com/?q=457+North+Shaanxi+Road+Shanghai" },
 { time: "2:00pm", title: "Qiao Ai Lai Lai Xiao Long", kind: "food", bib: true,
 note: "150 Yunnan South Rd. DiDi, ~15 min from BANK, tucked in an alley - worth confirming the exact lane on the map before setting off, DiDi drivers sometimes stop short of the entrance.",
 map: "https://maps.google.com/?q=150+Yunnan+South+Road+Shanghai",
 expand: {
 label: "About the shop",
 body: `<p>This is a small shop, easy to miss from the street, that has been packed since it opened about twenty years ago. The crab roe xiaolongbao is what draws the queue, and in hairy crab season, which this week sits inside, the kitchen loads wontons and spring rolls with crabmeat as well as the standard dumplings, so it's worth ordering a mixed plate rather than committing to one thing. The plain pork soup dumplings are the reliable fallback if the crab versions have sold out by the time you arrive. Kitchen visible from the pavement, a handful of stools at the window facing in - genuinely easy to eat here alone, nobody blinks at a single diner mid-afternoon.</p>`
 }
 },
 { time: "3:30pm", title: "Anfu and Wukang, unhurried", kind: "explore",
 note: "Walk or short DiDi back to the Concession. No further stops planned - Harmay at 122 Anfu Rd is there if you want an hour indoors, otherwise just walk." },
 { time: "6:30pm", title: "Rongjia Yellow Croaker Noodle", kind: "food", bib: true,
 note: "Room L105A-1, 688 Nanjing West Rd, Jing'an. Metro is the better call here: Line 2/12/13 to West Nanjing Road, exit 5, then a five-to-six-minute walk - faster and cheaper than DiDi at evening peak.",
 map: "https://maps.google.com/?q=688+Nanjing+West+Road+Shanghai",
 expand: {
 label: "About the shop",
 body: `<p>Rongjia is the casual sibling of Xin Rong Ji, the one-Michelin-star Taizhou seafood house, and draws its yellow croaker from the same supplier network, which is the reason a shop this modest can serve fish this good. The signature bowl comes two ways: a limited version using small wild croaker from the East China Sea, more expensive and more delicately flavoured, and a standard version using farmed croaker from Dachen Island, which is the one most people order and is entirely satisfying on its own. The broth is a thick, milky fish stock, finished with a sheet of egg and a few pickled vegetables on the side. Beyond the noodle, the Chaozhou-style marinated goose and the handmade Taizhou dim sum, made fresh each morning, are both worth a side order if you're hungry enough for two dishes. The room is clean and a little more formal-looking than the week's other counters, but the seating includes small two-tops that work fine solo.</p>`
 }
 }
 ]
 },

 {
 id: "d4", dow: "Tuesday", date: "27 October", chapter: "IV",
 arc: "Gallery Circuit · II of II",
 title: "An Inland Waterway",
 essay: `<p>The Huangpu is the river Shanghai is known for. Suzhou Creek is the river Shanghai was built on. Before the Bund existed, the creek carried the cotton and silk of the Jiangsu hinterland into the port, and the manufactories that grew along its banks between 1860 and 1937 produced the industrial base of what became modern China. The best of those buildings are still standing near Moganshan Road, and at the far western end, in an old textile mill complex, someone had the idea in 2000 to let contemporary artists rent studio space by the square metre. M50 was supposed to be demolished. It never was.</p>
<p>What survived is rougher than the Concession galleries, larger, more experimental. Antenna Space, on the second floor of Building 17, represents a roster whose work is difficult in a way that rewards patience. ShanghART in Building 16 has been there since the mill became galleries and is the closest thing Shanghai has to a foundational contemporary art institution.</p>
<p>Shanghai's big two annual fairs, West Bund Art & Design and Art021, land in mid-November this year, after this trip, not during it. That means these rooms will be quiet this week in a way they won't be in a fortnight. Worth knowing, and worth using.</p>`,
 events: [
 { time: "9:00am", title: "A Niang Mian Guan", kind: "food", bib: true,
 note: "36 Sinan Rd. DiDi, ~20 min - the metro option from the hotel involves a change and comes in slower door to door, DiDi wins this hop. On the Bib list since 2017.",
 map: "https://maps.google.com/?q=36+Sinan+Road+Shanghai",
 expand: {
 label: "About the shop",
 body: `<p>A Niang has been a Bib Gourmand every year since the Shanghai guide began recognising the category, and the reason is a single dish: huangyu mian, eel noodles, made with a butterflied, deep-fried eel dressed in a slightly sweet dark sauce and laid over a bowl of soup noodles. The broth arrives on the side, so you can pour it in for a wetter bowl or eat the noodles dry with just the eel sauce, both are how regulars order it. Around fifteen stools, no English menu, but the eel bowl is really the only order that matters, so pointing at the picture on the wall or saying "huangyu mian" gets you exactly what you came for. It opens at eight and reliably sells out by early afternoon, so this is a morning stop, not a lunch one.</p>`
 }
 },
 { time: "11:00am", title: "Antenna Space", kind: "culture",
 url: "http://antenna-space.com/en/",
 note: "Room 202, Building 17, 50 Moganshan Rd, Putuo. Two ways from Sinan Rd: DiDi direct, ~20 min, straightforward and no changes. Or metro to Changping Road (Line 7), then an 800-metre walk to the north gate - closer to 35–40 minutes door to door once you account for the change at People's Square. DiDi wins this hop; the metro is worth it only if you're already near Line 7.",
 map: "https://maps.google.com/?q=Antenna+Space+M50+Shanghai",
 expand: {
 label: "About the gallery",
 body: `<p>Simon Wang opened Antenna Space in 2013 after several years working at other Shanghai galleries, and built a roster around artists making work that resists an easy sales pitch: video, installation, and sculpture that asks for time in the room rather than a quick read. Yu Honglei and Guan Xiao, both included in recent editions of the Shanghai Biennale, are the two names most likely to have work up on any given visit. The space itself is unglamorous, a converted mill floor with concrete columns and minimal lighting design, which is more or less the house style across M50, and is part of why the district still feels like a working art district rather than a finished one.</p>`
 } },
 { time: "12:00pm", title: "ShanghART and the M50 complex", kind: "culture",
 url: "http://www.shanghartgallery.com/",
 note: "Building 16, 50 Moganshan Rd. Walk the whole complex, no fixed order - Vanguard, EastLink, OFOTO, Chronus. Map at the north gate.",
 map: "https://maps.google.com/?q=M50+Creative+Park+Shanghai",
 expand: {
 label: "About ShanghART, and the wider complex",
 body: `<p>Lorenz Helbling, a Swiss art dealer, opened ShanghART in 1996, before most of the artists it now represents had left art school, and before M50 existed as a gallery district at all, the gallery moved here when the mill complex opened to studios in the early 2000s. Its roster reads as a rough who's who of the generation that built Chinese contemporary art's international reputation: Ding Yi, Zhang Enli, Yang Fudong, Sun Xun. The gallery occupies two full floors of Building 16 and shows both established names and younger artists it has picked up more recently. The smaller galleries scattered through the rest of the complex, Vanguard, EastLink, OFOTO for photography, Chronus for a rotating mix, are inconsistent by nature, some closed, some between shows, and the only way to find the good one is to walk past all of them.</p>`
 } },
 { time: "2:30pm", title: "Jingmei Wuxi Noodle", kind: "food", bib: true,
 note: "138 Yanping Rd, 10 min walk south of M50. Wuxi-style noodles, one of the least-touristed Bibs in the city.",
 map: "https://maps.google.com/?q=138+Yanping+Road+Shanghai",
 expand: {
 label: "About the shop",
 body: `<p>The owner is from Wuxi, on the shore of Lake Tai in southern Jiangsu, and the menu leans on the sweeter, richer style of that region rather than Shanghai's own. The signature is the Wuxi braised pork rib noodle, ribs simmered until the meat comes away from the bone with no resistance, in a broth with a faint caramelised sweetness that marks it out from the plainer Shanghainese noodle shops elsewhere on this trip. It's a genuinely small, family-run counter, first awarded a Bib in the early 2020s and held it since, and it sees almost no foreign visitors, which is part of the appeal after a morning at two contemporary galleries.</p>`
 }
 },
 { time: "4:00pm", title: "Suzhou Creek walk, east from M50", kind: "explore",
 note: "On foot. The creek path runs toward the North Bund, ~90 min if you walk the whole thing - do the first half and stop when it's enough. Ends near the Waibaidu Bridge.",
 map: "https://maps.google.com/?q=Suzhou+Creek+Moganshan+Road+Shanghai" },
 { time: "6:30pm", title: "Delivery night", kind: "rest",
 note: "A full gallery-and-creek day is a lot of walking across a lot of the city. Order in, put your feet up. Second delivery night of the trip." }
 ]

 id: "d5", dow: "Wednesday", date: "28 October", chapter: "V",
 arc: "A slower day",
 title: "Someone Else Doing the Cooking",
 essay: `<p>Shanghainese home cooking is a genre almost impossible to eat in a restaurant. Restaurants require dishes that hold at temperature and travel from the pass to the table, which optimises out most of the classic ben bang preparations, the slow-simmered pork belly, the drunken chicken steeped overnight, the river shrimp stir-fried in ninety seconds and served immediately. What people actually cook at home requires a home, and someone to cook it, and a small enough gathering that the timing can be controlled by one person.</p>
<p>A private cooking class held in an actual family apartment, rather than a commercial teaching kitchen, is the honest way to get close to this. It's not a home-cooked dinner arranged for you, it's a few hours in someone's kitchen, hands in the dough, which turns out to be a better and more solo-friendly format anyway, since there's something to do with your hands and no table of strangers to navigate.</p>
<p>The rest of the day stays light on purpose. A late-morning museum, a long lunch break, nothing scheduled between two and five. After four days of walking, the trip can afford an afternoon that goes nowhere.</p>`,
 events: [
 { time: "9:30am", title: "Slow start, no alarm", kind: "rest",
 note: "Breakfast at the hotel or a walk to whichever noodle counter is closest. No fixed plan for the morning." },
 { time: "11:00am", title: "Shanghai Museum East", kind: "culture", state: "open",
 url: "https://www.shanghaimuseum.net/en/mus-east",
 note: "1952 Century Blvd, Pudong. DiDi, ~30 min through the tunnel - the metro (Line 6 or 7 to Century Avenue, then a walk) is comparable in time but involves at least one change, DiDi is the simpler choice here. Timed entry - book via the museum's WeChat mini-program a day ahead, or ask the concierge to do it.",
 map: "https://maps.google.com/?q=Shanghai+Museum+East+Pudong",
 expand: {
 label: "About the branch",
 body: `<p>The Shanghai Museum's People's Square building, opened in 1996, has been the city's main repository of bronze, ceramic and calligraphy for thirty years and is genuinely excellent, which is exactly why the East branch matters: rather than duplicating that collection, the Pudong building, opened in phases from 2023 to 2024, was built to hold material that had been in storage for lack of space, alongside a dedicated Chinese-antiquities-abroad gallery repatriated or purchased back from overseas collections. The bronze holdings on the ground floor include Warring States period vessels that hadn't been on public display in decades. It's a larger, more modern building than the original, with none of the queueing culture that's built up around the People's Square branch, worth knowing if you'd rather see this collection without a crowd.</p>`
 } },
 { time: "1:30pm", title: "Lunch near the museum", kind: "food",
 note: "No reservation needed. Several counters in the Century Ave underground mall, five minutes' walk." },
 { time: "3:00pm", title: "Open afternoon", kind: "rest",
 note: "Nothing planned. Back to the hotel by DiDi (~30 min), rest before this evening." },
 { time: "6:00pm", title: "Shanghai Mama, private cooking class", kind: "food", state: "open",
 url: "https://www.tripadvisor.com/AttractionProductReview-g308272-d15658232-Private_Home_Cooking_Class_with_Shanghai_Mama-Shanghai.html",
 note: "In a family apartment, French Concession area - exact address sent after booking. DiDi from the hotel, ~20 min. This is dinner as well as the activity.",
 expand: {
 label: "What this actually is",
 body: `<p>This is a real, reviewed product, a private dumpling and home-cooking class run in an actual Shanghai family's apartment, not a commercial teaching kitchen. It typically includes a wet-market stop, a hands-on dumpling-folding session, and a shared meal of what's made. Solo bookings are accepted; some operators ask you to confirm ahead if you're travelling alone rather than as a pair, since the class is priced and staffed per group. Book at least three weeks out and confirm the solo rate when you do. This is the honest substitute for the "dinner cooked by an ayi" idea, a home-visit cooking class, not a private chef arrangement, which doesn't really exist as an off-the-shelf product in Shanghai the way it's sometimes described.</p>`
 }
 }
 ]
 },

 {
 id: "d6", dow: "Thursday", date: "29 October", chapter: "VI",
 arc: "A slower day",
 title: "Two Ways of Walking Old Shanghai",
 essay: `<p>There's a version of "closed-door access" sold to visitors in Shanghai that promises private entry to shuttered heritage buildings, the Astor House, the old Jewish synagogues, the Cercle Sportif. Most of it doesn't really exist as a bookable thing for one or two people; what's real is smaller and better: private, theme-led walking tours through the neighbourhoods themselves, run by people who've spent decades researching them.</p>
<p>Historic Shanghai, founded by the writer and photographer Katya Knyazeva, runs exactly this. Among the standing private-tour themes is one built around J.G. Ballard's Empire of the Sun, the streets, the house, the internment camp geography that the plane essay opened with. It's a genuine private booking, priced for one or two people, not a group product with your name added to a roster.</p>
<p>The afternoon anchors on something real and freshly timed: Rockbund's new show, stuck in movement (in the tide) by the Macau-born, Rio-based artist Jota Mombaça, opens on the 22nd of October, two days before you land, and runs through February. You'll be seeing it in its first week.</p>`,
 events: [
 { time: "9:00am", title: "Breakfast near the hotel", kind: "food",
 note: "Da Hu Chun or Nanxiang again, whichever queue looks shorter. Both are close enough to alternate all week without planning." },
 { time: "10:30am", title: "Historic Shanghai - Empire of the Sun walk", kind: "explore", state: "open",
 url: "https://www.historic-shanghai.com/historic-shanghai-tours/",
 note: "Meeting point confirmed on booking, usually former French Concession. DiDi to the meeting point, ~15–20 min. Private tours run roughly 2.5–3 hours and start around RMB 3,500 for one or two people. Book 2–3 weeks ahead.",
 map: "https://maps.google.com/?q=Historic+Shanghai" },
 { time: "1:00pm", title: "Lunch, wherever the walk ends", kind: "food",
 note: "No plan - the guide will end the walk somewhere with food nearby; ask for a Bib Gourmand or counter-style suggestion on the spot." },
 { time: "3:00pm", title: "Rockbund Art Museum", kind: "culture",
 url: "https://www.rockbundartmuseum.org",
 note: "20 Huqiu Rd, Huangpu. Walk from the hotel, ~10 min. Jota Mombaça: stuck in movement (in the tide) opens 22 October, you'll catch it days into its run.",
 map: "https://maps.google.com/?q=Rockbund+Art+Museum+Shanghai",
 expand: {
 label: "About the show",
 body: `<p>Jota Mombaça is a Macau-born, Rio de Janeiro-based artist working across performance, writing, and installation, with a practice built around questions of colonial violence, water, and bodies in transit. Stuck in movement (in the tide) is a new commission for Rockbund's ground and upper floors, opening 22 October 2026 and running through 21 February 2027, which means the version you'll see in the show's first week is likely to be its least worn-in, before the museum settles into a fixed run of public programming around it. Rockbund itself occupies the 1932 Royal Asiatic Society building, one of the few pre-1949 gallery interiors in the city that survives more or less intact, so the container is worth as much attention as the work inside it.</p>`
 } },
 { time: "6:30pm", title: "Delivery night", kind: "rest",
 note: "A full walking day. Third and last scheduled delivery night of the trip." }
 ]

 id: "d7", dow: "Friday", date: "30 October", chapter: "VII",
 arc: "The walled city",
 title: "Two Minutes South of the Door",
 essay: `<p>Everything Shanghai calls its old city is younger than the old city. The Bund is 1840s and after. The French Concession is 1849 forward. What was Shanghai before any of these arrived was a walled Ming-dynasty market town dating to the 1550s. That city is Nanshi. The wall came down in 1912 for a ring road, which is still there. Everything inside the ring predates every other Shanghai you know.</p>
<p>Most visitors who come to the old city come for Yu Garden and the reconstructed bazaar around it and leave without going three streets deeper, into the neighbourhood where the actual old Shanghai still lives, the alley where children play on paved stones, the men playing xiangqi at the small square, the shop selling paper offerings for funerals. This is the city Ballard's Amherst Avenue villa, and everything you saw of it yesterday, was built to distinguish itself from. It is still here, and it is two minutes from the hotel door.</p>`,
 events: [
 { time: "9:00am", title: "Yu Garden, briefly", kind: "explore",
 note: "Yuyuan Rd, 4 min walk. North gate. Fifteen minutes, no more, the rockery and ponds are enough to set the scale before the walk that follows.",
 map: "https://maps.google.com/?q=Yu+Garden+Shanghai",
 expand: {
 label: "Why fifteen minutes is enough",
 body: `<p>Yu Garden was built in the 1560s by a Ming dynasty official, Pan Yunduan, as a private garden for his father, and took nearly twenty years to complete. It survived war damage, occupation as a militia headquarters during the Small Swords Society uprising in the 1850s, and a lengthy restoration completed in the 1960s, and is genuinely one of the finer classical Chinese gardens left standing, closer in quality to the famous gardens of Suzhou than most visitors expect from a stop wedged into a shopping bazaar. The rockery near the entrance, built from Lake Tai limestone, and the Exquisite Jade Rock behind it are the two things worth the short visit. Anything past fifteen minutes here on a Friday morning means fighting a crowd that only gets denser as the day goes on, which is why the walk that follows, into the old town proper, is the better use of the remaining morning.</p>`
 } },
 { time: "10:15am", title: "Fangbang Middle Road, unhurried", kind: "explore",
 note: "On foot, south from Yu Garden along the ring road, then east on Fangbang Middle. No destination, follow whichever alley looks interesting.",
 map: "https://maps.google.com/?q=Fangbang+Middle+Road+Shanghai",
 expand: {
 label: "What to notice",
 body: `<p>Fangbang Middle Road roughly traces the old town's original main east-west axis, inside the vanished city wall, and the blocks south of it toward Xiaonanmen are where the reconstruction money that transformed Yu Garden's bazaar simply ran out. What's left is un-prettified: two-storey tenements with laundry strung between them, traditional medicine shops selling dried roots out of glass jars, a knife sharpener working a foot-pedal grinding wheel on the pavement, small temples to local deities squeezed between shopfronts. None of it is curated for a visitor's benefit, which is exactly the point after a week that has, at various points, walked through several very curated versions of old Shanghai. Follow whichever side alley looks like it's going somewhere; most of them are barely wide enough for two people to pass.</p>`
 } },
 { time: "12:30pm", title: "Tan", kind: "food", bib: true,
 note: "Yu Garden precinct. Walk, ~10 min from Fangbang Middle.",
 map: "https://maps.google.com/?q=Tan+Sichuan+Yu+Garden+Shanghai",
 expand: {
 label: "About the kitchen, and why it's new to the list",
 body: `<p>Tan opened in the Yu Garden precinct in 2025 and picked up a Bib Gourmand within its first year, one of eight new additions to the 2026 Shanghai list. It's run by the team behind The BRIDGE in Chengdu, widely regarded as one of the reference kitchens for serious Sichuan food outside Sichuan itself, which is a real pedigree rather than a marketing line. Order two or three small plates rather than a set menu: mapo tofu, made properly numbing rather than just hot, shuizhuyu, fish poached in chilli oil, and fuqi feipian, a sliced beef and offal salad in an aggressively fragrant dressing, are the three dishes reviewers keep returning to. Prices sit at ordinary Yu Garden levels, which makes the kitchen's actual quality a genuine surprise for the neighbourhood.</p>`
 }
 },
 { time: "2:00pm", title: "City God Temple", kind: "explore",
 note: "249 Fangbang Middle Rd. Walk, ~10 min. Active place of worship, Ming foundation. Sit for ten minutes.",
 map: "https://maps.google.com/?q=Shanghai+City+God+Temple",
 expand: {
 label: "What it is",
 body: `<p>The City God Temple, or Chenghuang Miao, has stood at roughly this spot since 1403, dedicated to the Taoist deity believed to protect the city and oversee the moral conduct of its residents, a role something like a municipal magistrate for the afterlife. It was badly damaged during the Japanese occupation and again during the Cultural Revolution, and the buildings standing today are largely a 1990s reconstruction, though the temple has functioned as an active place of worship more or less continuously since. Incense smoke, offerings of fruit and paper money, and a steady trickle of older worshippers rather than tour groups. It gives the old town a genuine centre of gravity that Yu Garden, for all its polish, doesn't quite have.</p>`
 } },
 { time: "3:00pm", title: "Open afternoon", kind: "rest",
 note: "Back to the hotel on foot, ~5 min. Nothing further planned." },
 { time: "6:30pm", title: "Lu Bo Lang counter", kind: "food", bib: true,
 note: "115 Yuyuan Rd, inside the Yu Garden bazaar. Walk, ~10 min. This is a large, multi-floor restaurant, but there's a ground-floor counter section serving the same kitchen's classics at speed, ask for counter seating specifically, not the dining rooms upstairs.",
 map: "https://maps.google.com/?q=115+Yuyuan+Road+Shanghai",
 expand: {
 label: "About the counter section",
 body: `<p>Lu Bo Lang is a large, multi-storey restaurant inside a reconstructed Ming-style pavilion in the middle of the Yu Garden bazaar, and its upstairs rooms are exactly the kind of tour-group banquet setting this trip has been avoiding. The ground floor is different: a fast counter selling the kitchen's core dishes, xiaolongbao, pan-fried buns, a handful of ben bang classics, at speed and without the upstairs formality. It's the version of the restaurant locals actually use on a weeknight. Ask specifically for the counter, not a table, when you arrive, since staff will otherwise default to walking a foreign visitor upstairs.</p>`
 }
 }
 ]
 },

 {
 id: "d8", dow: "Saturday", date: "31 October", chapter: "VIII",
 arc: "Hongkou finale",
 title: "Twelve Crabs to a Bowl",
 essay: `<p>Hairy crab is a national obsession that runs almost entirely on the honour system of season. The male mitten crab peaks in the tenth lunar month, which lands in the last week of October this year. Cejerdary at 59 Guangdong Road has been the most influential single restaurant in Shanghai's hairy crab culture for the past decade, a single dish, crab roe noodles, twelve crabs picked by hand into each bowl, the price unchanged since 2010. The room seats about twenty on stools at a long counter, more noodle bar than restaurant, and it is, structurally, one of the easiest places in the city to eat alone.</p>
<p>The morning is Hongkou, Duolun Road, where Lu Xun and half of Shanghai's 1930s literary left lived, and Lu Xun Park, where he's buried. April went into this district once, briefly, from a different corner. This is the same neighbourhood approached properly, on the trip's last full day.</p>`,
 events: [
 { time: "9:00am", title: "One more counter breakfast", kind: "food",
 note: "Last morning near the walled city, Nanxiang or Da Hu Chun, whichever hasn't been tried yet this week." },
 { time: "10:30am", title: "Duolun Road Cultural Street", kind: "explore",
 note: "Hongkou. DiDi, ~20 min - no direct metro that beats this without a change; the closest station, Dongbaoxing Road (Line 3/4), is still a ten-minute walk from the street itself, so DiDi door to door is the simpler call.",
 map: "https://maps.google.com/?q=Duolun+Road+Hongkou+Shanghai",
 expand: {
 label: "Who lived here",
 body: `<p>Duolun Road runs about four hundred metres and was, between roughly 1927 and 1936, the address of most of the writers associated with China's League of Left-Wing Writers, including Lu Xun himself for a period, alongside Mao Dun, Guo Moruo, and Rou Shi, who was among five young writers executed by the Nationalist government in 1931 in an event Lu Xun wrote about at length afterward. The street has been restored with unusual care by Shanghai standards: original shikumen and Art Deco facades rather than reconstructions, bronze statues of the writers set into small plazas along the route, and a small dedicated museum roughly at the midpoint. It's quiet enough on most days, weekday mornings especially, that it's possible to actually read the plaques rather than negotiate a crowd for them.</p>`
 } },
 { time: "12:30pm", title: "Lu Xun Park and Lu Xun Museum", kind: "explore",
 note: "288 Sichuan North Rd. Walk from Duolun Road, ~10 min. His grave, the small museum, and a park full of Saturday life, dancing, birdcages, cards on stone tables.",
 map: "https://maps.google.com/?q=Lu+Xun+Park+Shanghai",
 expand: {
 label: "About the park and the writer",
 body: `<p>Lu Xun spent the last years of his life, from 1927 until his death in 1936, living in this part of Hongkou, and the park, then called Hongkou Park, was renamed for him after 1949. His tomb sits in a quiet section toward the rear, moved here in 1956 from an earlier burial site, with a bronze bust and calligraphy by Mao Zedong on the stone behind it. The attached museum is small and old-fashioned in its display style, manuscripts and personal effects in glass cases rather than anything interactive, which suits the subject. The park around it functions the way most Shanghai parks do on a Saturday, ballroom dancing to a portable speaker, men with birdcages hung from tree branches, card games at the stone tables, and it's worth simply sitting in for twenty minutes rather than treating it as a walk-through.</p>`
 } },
 { time: "2:00pm", title: "Rongjia Yellow Croaker, if not already tried", kind: "food", bib: true,
 note: "688 Nanjing West Rd. Metro Line 3 to Hongkou Football Stadium, then change to Line 2/12/13 toward West Nanjing Road, ~30 min total - or DiDi direct, ~20 min, the simpler choice on a Saturday. Skip entirely if you already went Monday and use the time to rest instead." },
 { time: "3:30pm", title: "Open afternoon, rest", kind: "rest",
 note: "Back to the hotel. The crab dinner deserves an empty stomach and no more walking than necessary." },
 { time: "6:30pm", title: "Cejerdary", kind: "food", state: "open",
 note: "59 Guangdong Rd, Huangpu. Walk, ~10 min, or DiDi ~5 min. Counter seating, single dish, easy alone. Walk-ins queue after 6pm, ask the concierge to call ahead if you'd rather not wait.",
 map: "https://maps.google.com/?q=59+Guangdong+Road+Shanghai",
 expand: {
 label: "What to order",
 body: `<p>The golden crab roe noodles, around 360 yuan. If the appetite holds, a small dish of drunken crab, marinated raw in Shaoxing wine. Free ginger tea and roasted peanuts to close. The room moves in fast sittings, a reservation, arranged through the concierge, is what gets you a stool without the queue on a Saturday night. This is the meal the week has been building toward.</p>`
 }
 }
 ]
 },

 {
 id: "d9", dow: "Sunday", date: "1 November", chapter: "IX",
 arc: "Departure",
 title: "An Airport Is a Kind of Sequel",
 essay: `<p>The flight home departs at 2:15 in the afternoon, one of the more generous departure times in the international schedule. It gives back the morning. Checkout is before noon. Pudong, from the old walled city, is a comfortable forty-five minutes with the Sunday traffic. There is no rush.</p>
<p>The natural last move is the Bund at daybreak, not because it's what you saw first in April, but because, having spent a week not looking at it, you can now look at it clearly. Almost nobody is there at that hour. The old men doing tai chi under the plane trees. A fisherman on the promenade wall. The city taking its own morning at its own pace, the same way it does when nobody is looking.</p>`,
