      id: "d8", dow: "Saturday", date: "31 October", chapter: "VIII",
      arc: "Hongkou finale",
      title: "Twelve Crabs to a Bowl",
      essay: `<p>In April you ate the fennel beans in the tavern he put them in.</p>
<p>Xianheng, in Shaoxing, rebuilt on the original site: one bowl of warm Huadiao, one dish of beans, which is exactly what Kong Yiji orders at the bar in the story before he crawls out of it on his hands and is never seen again. You had walked his childhood home that morning, and the Three Flavours Study where he was taught to recite, and the canal streets he spent his whole life trying to leave.</p>
<p>Today you stand at the grave. Lu Xun came to Hongkou in 1927 and died here in 1936, in a Japanese-owned apartment on a street north of Suzhou Creek, having spent his last decade writing about a country he loved in terms it has never quite forgiven and has never once stopped teaching in schools. Duolun Road is where he and half of Shanghai's literary left lived and argued and denounced each other. The park at the end of it, then called Hongkou Park, holds his tomb, moved there in 1956, with calligraphy by Mao on the stone behind it, which is its own quiet joke at the expense of a man whose entire subject was what a society does to the people who tell it the truth. Six months and two thousand kilometres apart, you will have seen where he started and where he stopped. That was not planned. It is worth noticing anyway.</p>
<p>The evening closes a different loop. Hairy crab is a national obsession that runs almost entirely on the honour system of season. The male mitten crab peaks in the tenth lunar month, which lands in the last week of October this year. Cejerdary at 59 Guangdong Road has been the most influential single restaurant in Shanghai's crab culture for the past decade: one dish, crab roe noodles, twelve crabs picked by hand into every bowl, the price unchanged since 2010. The room seats about twenty on stools at a long counter, more noodle bar than restaurant, and it is, structurally, one of the easiest places in the city to eat alone. On Monday you did the crab the hard way, one animal and forty-five minutes and your hands in it up to the wrist. Tonight somebody else does the work, and the difference between those two meals is most of what there is to say about this city.</p>`,

          note: "Last morning near the walled city. Nanxiang or Da Hu Chun, whichever hasn't been tried yet this week. Then north." },

          map: "https://maps.google.com/?q=Duolun+Road+Hongkou+Shanghai",
          expand: {
            label: "Who lived here",
            body: `<p>Duolun Road runs about four hundred metres and was, between roughly 1927 and 1936, the address of most of the writers associated with China's League of Left-Wing Writers, including Lu Xun himself for a period, alongside Mao Dun, Guo Moruo, and Rou Shi, who was among five young writers executed by the Nationalist government in 1931 in an event Lu Xun wrote about at length afterward. The street has been restored with unusual care by Shanghai standards: original shikumen and Art Deco facades rather than reconstructions, bronze statues of the writers set into small plazas along the route, and a small dedicated museum roughly at the midpoint. It's quiet enough on most days that it's possible to actually read the plaques rather than negotiate a crowd for them.</p>`
          }

          note: "288 Sichuan North Rd. Walk from Duolun Road, ~10 min. His grave, the small museum, and a park full of Saturday life: dancing, birdcages, cards on stone tables.",
          map: "https://maps.google.com/?q=Lu+Xun+Park+Shanghai",
          expand: {
            label: "About the park and the writer",
            body: `<p>Lu Xun spent the last years of his life, from 1927 until his death in 1936, living in this part of Hongkou, and the park, then called Hongkou Park, was renamed for him after 1949. His tomb sits in a quiet section toward the rear, moved here in 1956 from an earlier burial site, with a bronze bust and calligraphy by Mao Zedong on the stone behind it. The attached museum is small and old-fashioned in its display style, manuscripts and personal effects in glass cases rather than anything interactive, which suits the subject. The park around it functions the way most Shanghai parks do on a Saturday: ballroom dancing to a portable speaker, men with birdcages hung from tree branches, card games at the stone tables. Sit in it for twenty minutes rather than treating it as a walk-through. He would have hated the bust and he would have recognised the card games.</p>`

          map: "https://maps.google.com/?q=59+Guangdong+Road+Shanghai",
          expand: {
            label: "What to order",
            body: `<p>The golden crab roe noodles, around 360 yuan. If the appetite holds, a small dish of drunken crab, marinated raw in Shaoxing wine, which is the same wine you drank at the source in April and the same correction it was making on Monday night, applied cold this time. Free ginger tea and roasted peanuts to close. The room moves in fast sittings; a reservation arranged through the concierge is what gets you a stool without the queue on a Saturday night. This is the meal the week has been building toward and it is the last one.</p>`

      arc: "Departure",
      title: "An Airport Is a Kind of Sequel",
      essay: `<p>Two-fifteen in the afternoon is when the flight home leaves, one of the more generous departure times in the international schedule.</p>
<p>It gives back the morning. It does not give back quite as much of it as it appears to. Bag drop for NZ288 closes at 12:45, Pudong is forty-five to sixty minutes from here depending on the tunnel, and the difference between leaving at half past ten and leaving at half past eleven is the difference between an hour of margin and fifteen minutes of it. Leave at half past ten. The morning survives intact anyway, and the checkout you do not need is the one you were going to ask the concierge to extend.</p>
<p>The natural last move is the Bund at daybreak, not because it is what you saw first in April, but because, having spent a week not looking at it, you can now look at it clearly. Sunrise is at ten past six. Almost nobody is there at that hour. The old men doing tai chi under the plane trees, which are yellow this week, same as the ginkgos, and which the French put there. A fisherman on the promenade wall. The city taking its own morning at its own pace, the same way it does when nobody is looking, which is the only condition under which you were ever going to see it.</p>`,

      ["Space 185, Bund Art Center", "185 Sichuan Middle Rd. Free. Renaissance-style 1903 building, international and Chinese contemporary.", "https://maps.google.com/?q=185+Sichuan+Middle+Road+Shanghai"],
      ["Shanghai Museum, People's Square", "201 Renmin Ave. Closed Mondays. Bronze and ceramic galleries alone are a half-day. Free timed tickets via WeChat, released 12 days out at 12:10pm sharp and gone in twenty minutes.", "https://www.shanghaimuseum.net/en/"],
      ["Sinan Books", "517 Fuxing Middle Rd. Bookshop in a heritage villa. An hour, a coffee, a chair by the window.", "https://maps.google.com/?q=517+Fuxing+Middle+Road+Shanghai"],
      ["The Bund Sightseeing Tunnel", "Genuine mid-1990s municipal camp. Six minutes of animated lights under the Huangpu. Absurd. Recommended.", "https://maps.google.com/?q=Bund+Sightseeing+Tunnel+Shanghai"]
    ]},
    { group: "Practical, near the hotel", items: [
      ["Watsons pharmacy", "Common chain along Nanjing Road East and Middle: basic medication, sunscreen, toiletries. Ask the front desk for the nearest branch.", "https://maps.google.com/?q=Watsons+Nanjing+Road+East+Shanghai"],
      ["Hema Fresh (盒马)", "Alibaba's grocery chain. Snacks, water, fruit, and a genuinely interesting supermarket to wander even without buying much.", "https://maps.google.com/?q=Hema+Fresh+Huangpu+Shanghai"],
      ["7-Eleven / FamilyMart", "Several within a few minutes' walk. Water, phone data top-ups, ATMs, open late."],
      ["ATMs", "Bank of China or ICBC branches on Nanjing Road East reliably accept foreign cards; smaller bank ATMs sometimes don't.", "https://maps.google.com/?q=Bank+of+China+Nanjing+Road+East+Shanghai"]
    ]},
    { group: "Ask the concierge to book", items: [
      ["Wang Bao He, Monday", "Two questions, both before you walk over: will they seat one, and what does a single male crab cost. If the answer to either is bad, cancel and let Saturday be the crab."],
      ["Tan, Monday opening hours", "Worth a call ahead. Small Yu Garden kitchens take a weekday off and this one's Monday schedule was not independently confirmed."],
      ["Cejerdary reservation", "Phone or WeChat on the day, especially for the Saturday. The front desk calling in Mandarin will get a stool faster than a foreign number will."],
      ["Shanghai Museum East timed tickets", "Books out fast via the WeChat mini-program at short notice. The concierge can usually do it same-day."],
      ["Shanghai Mama confirmation", "A third-party booking made from home. Once you have landed, the concierge can re-confirm by phone, which local operators often prefer to email."],
      ["Any Bib Gourmand walk-in queue", "If a queue looks long, ask the concierge to call. Several of the smaller shops will hold a stool for a phone booking even without an English line."],
      ["Laundry / pressing", "Same-day service, usually collected by 10am for return that evening."]
    ]},
    { group: "If it rains for a day", items: [
      ["Shanghai Museum, People's Square", "The default. Closed Mondays. Book via WeChat 12 days out.", "https://www.shanghaimuseum.net/en/"],
      ["Hive, then Space 185", "270 East Beijing Rd and 185 Sichuan Middle Rd, both free, both indoors, ten minutes apart, both within twenty minutes of the hotel on foot.", "https://maps.google.com/?q=270+East+Beijing+Road+Shanghai"],
      ["Any lane in the old city on a wet morning", "Rain makes Nanshi look like a different city, and it empties the bazaar completely. The alleys south of Fangbang Middle are the ones to take.", "https://maps.google.com/?q=Fangbang+Middle+Road+Shanghai"]
    ]},
    { group: "Worth arranging yourself, if you want more than the itinerary", items: [
      ["A bespoke Historic Shanghai walk", "Not a standard bookable tour. historic-shanghai.com is a small heritage society running mostly member events plus occasional private walks by request. Email a few weeks out and ask, but don't count on it landing on a specific day.", "https://www.historic-shanghai.com/"],
      ["Capsule studio visit", "The one real long shot on this trip. Write three weeks out, name two roster artists, explain what you do. A genuine occasional courtesy, not a product.", "mailto:info@capsuleshanghai.com"]
    ]}
  ]
};






</script>
<script>
function el(tag, cls, html) {
 const e = document.createElement(tag);
 if (cls) e.className = cls;
 if (html != null) e.innerHTML = html;
 return e;
}

function makeExpand(label, bodyHtml, dropCap) {
 const wrap = el('div', 'sh26-panel');
 const btn = el('button', 'sh26-panel-btn', `<em class="sh26-chevron">›</em>&nbsp;${label}`);
 const body = el('div', 'sh26-panel-body');
 body.innerHTML = `<div class="prose${dropCap ? ' prose-drop' : ''}">${bodyHtml}</div>`;
 btn.addEventListener('click', () => {
 btn.classList.toggle('open');
 body.classList.toggle('open');
 });
 wrap.appendChild(btn);
 wrap.appendChild(body);
 return wrap;
}

function renderMasthead() {
 const m = TRIP.meta;
 document.getElementById('m-title').innerHTML = m.city + ' <em>in October</em>';
 document.getElementById('m-dates').textContent = m.dates;
}

function renderPlanePiece() {
 const p = TRIP.meta.plane;
 const sec = document.getElementById('plane');
 const previewDiv = el('div', 'prose prose-drop', p.preview);
 sec.appendChild(el('div', 'kicker', p.kicker));
 sec.appendChild(el('h2', null, p.title));
 const sf = el('p', 'standfirst', p.standfirst);
 sec.appendChild(sf);
 sec.appendChild(previewDiv);
 sec.appendChild(makeExpand('Continue reading', p.full, false));
}

function renderChapters() {
 const wrap = document.getElementById('chapters');
 const DAY_DATES = { d0:'2026-10-23', d1:'2026-10-24', d2:'2026-10-25', d3:'2026-10-26', d4:'2026-10-27', d5:'2026-10-28', d6:'2026-10-29', d7:'2026-10-30', d8:'2026-10-31', d9:'2026-11-01' };

 function getMelbDate() {
 return new Date().toLocaleString('en-CA', { timeZone: 'Asia/Shanghai' }).slice(0, 10);
 }

 const todayStr = getMelbDate();
 const tripActive = todayStr >= '2026-10-23' && todayStr <= '2026-11-01';
 const chapters = [];

 TRIP.days.forEach(day => {
 const ch = el('section', 'chapter');
 ch.id = day.id;
 const dayDate = DAY_DATES[day.id];

 if (tripActive) {
 if (dayDate < todayStr) ch.classList.add('is-past');
 else if (dayDate === todayStr) {
 ch.classList.add('is-today');
 ch.appendChild(el('div', 'chapter-label', 'Today'));
 }
 }

 const head = el('div', 'chapter-head');
 const arcTag = day.arc ? `<div style="font-family:var(--mono);font-size:0.6rem;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent);margin-bottom:0.35rem;">${day.arc}</div>` : '';
 head.innerHTML = `<div class="chapter-top"><div><div class="chapter-meta">${day.dow} &nbsp;·&nbsp; <span class="date-accent">${day.date}</span></div>${arcTag}<div class="chapter-title">${day.title}</div></div><div class="day-weather" id="wx-${day.id}"></div></div>`;
 ch.appendChild(head);

 // Essay teaser: first sentence visible, rest behind toggle
 const essayWrap = el('div', null);
 // Extract first sentence from first <p>
 const firstPMatch = day.essay.match(/<p>([\s\S]*?)<\/p>/);
 let teaser = '', rest = day.essay;
 if (firstPMatch) {
 const firstP = firstPMatch[1];
 // Split on first sentence boundary (. followed by space or end)
 const sentMatch = firstP.match(/^(.*?(?:\.|!|\?)(?:\s|$))([\s\S]*)$/);
 if (sentMatch && sentMatch[1].length > 40) {
 teaser = sentMatch[1].trim();
 const remainder = sentMatch[2].trim();
 rest = remainder
 ? `<p>${remainder}</p>` + day.essay.replace(firstPMatch[0], '').trim()
 : day.essay.replace(firstPMatch[0], '').trim();
 } else {
 teaser = firstP;
 rest = day.essay.replace(firstPMatch[0], '').trim();
 }
 }
 const teaserDiv = el('div', 'essay-teaser');
 teaserDiv.innerHTML = `<p>${teaser}</p>`;
 essayWrap.appendChild(teaserDiv);
 if (rest) {
 const continueSpan = el('span', 'essay-continue');
 const expandId = 'essay-' + day.id;
 continueSpan.innerHTML = `<a href="#" id="btn-${expandId}">Continue reading</a>`;
 teaserDiv.appendChild(continueSpan);
 const fullBody = el('div', null);
 fullBody.id = expandId;
 fullBody.style.display = 'none';
 fullBody.innerHTML = `<div class="prose prose-drop" style="margin-top:0.9rem;">${rest}</div>`;
 essayWrap.appendChild(fullBody);
 continueSpan.querySelector('a').addEventListener('click', e => {
 e.preventDefault();
 fullBody.style.display = 'block';
 continueSpan.style.display = 'none';
 });
 }
 ch.appendChild(essayWrap);

 // Spine
 const spine = el('div', 'spine');
 day.events.forEach(ev => {
 const stop = el('div', 'stop');
 stop.dataset.kind = ev.kind;

 const tag = ev.state === 'confirmed' ? '<span class="stop-tag confirmed">Booked</span>'
 : ev.state === 'open' ? '<span class="stop-tag open">To book</span>' : '';
 const bibBadge = ev.bib ? (ev.bibUrl ? `<a class="bib-badge" href="${ev.bibUrl}" target="_blank" rel="noopener">Bib Gourmand</a>` : '<span class="bib-badge">Bib Gourmand</span>') : '';

 // Title -- link if url provided
 const titleHtml = ev.url
 ? `<a href="${ev.url}" target="_blank" rel="noopener">${ev.title}</a>`
 : ev.title;

 stop.appendChild(el('div', 'stop-time', ev.time));
 stop.appendChild(el('div', 'stop-head', `<span class="stop-title">${titleHtml}</span>${bibBadge}${tag}`));
 if (ev.note) stop.appendChild(el('div', 'stop-note', ev.note));
 if (ev.ref) stop.appendChild(el('div', 'stop-ref', `<span>${ev.ref}</span>`));
 if (ev.map) {
 const ml = el('a', 'stop-map', '↗ Map');
 ml.href = ev.map; ml.target = '_blank'; ml.rel = 'noopener';
 stop.appendChild(ml);
 }
 if (ev.expand) stop.appendChild(makeExpand(ev.expand.label, ev.expand.body, false));
 spine.appendChild(stop);
 });

 ch.appendChild(spine);
 chapters.push({ el: ch, date: dayDate });
 });

 if (tripActive) {
 chapters.sort((a, b) => {
 const aT = a.date === todayStr, bT = b.date === todayStr;
 const aP = a.date < todayStr, bP = b.date < todayStr;
 if (aT && !bT) return -1; if (bT && !aT) return 1;
 if (!aP && bP) return -1; if (aP && !bP) return 1;
 return a.date < b.date ? -1 : 1;
 });
 }
 const GINKGO = '<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 66C29 62 7 45 9 24 11 11 30 3 46 10L50 23 54 10C70 3 89 11 91 24 93 45 71 62 50 66Z"/><path d="M48.6 65.5C48.6 78 48 86 47 94L53 94C52 86 51.4 78 51.4 65.5Z"/></svg>';
 chapters.forEach((c, i) => {
 wrap.appendChild(c.el);
 if (i < chapters.length - 1) wrap.appendChild(el('div', 'chapter-rule', GINKGO));
 });
}

function renderBookings() {
 const confirmedList = document.getElementById('ledger-confirmed');
 const openList = document.getElementById('ledger-open');
 TRIP.bookings.forEach(b => {
 const row = el('div', 'ledger-row');
 row.innerHTML = `<span class="ldot ${b.state}"></span>
 <div class="ledger-body">
 <div class="ledger-label">${b.label}</div>
 <div class="ledger-sub">${b.sub}</div>
 ${b.ref ? `<div class="ledger-ref"><span>${b.ref}</span></div>` : ''}
 </div>
 <span class="ledger-state ${b.state}">${b.state === 'confirmed' ? 'Booked' : 'To book'}</span>
 ${b.url ? `<a class="ledger-link" href="${b.url}" target="_blank" rel="noopener">↗</a>` : ''}`;
 (b.state === 'confirmed' ? confirmedList : openList).appendChild(row);
 });
}

function renderVoices() {
 const wrap = document.getElementById('sh26-voices-wrap');
 if (!TRIP.voices || !TRIP.voices.length) {
 document.getElementById('sh26-voices').style.display = 'none';
 return;
 }
 TRIP.voices.forEach(v => {
 const grp = el('div', 'sh26-row');
 const btn = el('button', 'sh26-row-btn', `${v.author} &middot; <em style="font-style:italic;">${v.title}</em><span class="sh26-chev">&rsaquo;</span>`);
 const body = el('div', 'sh26-row-panel');
 body.innerHTML = `<div class="prose prose-drop" style="padding-top:0.6rem;">${v.body}</div>`;
 btn.addEventListener('click', () => { btn.classList.toggle('open'); body.classList.toggle('open'); });
 grp.appendChild(btn); grp.appendChild(body); wrap.appendChild(grp);
 });
}

function renderPocket() {
 const wrap = document.getElementById('sh26-pocket-wrap');
 TRIP.pocket.forEach(g => {
 const grp = el('div', 'sh26-row');
 const btn = el('button', 'sh26-row-btn', `${g.group}<span class="sh26-chev">›</span>`);
 const body = el('div', 'sh26-row-panel');
 g.items.forEach(([n, d, u]) => {
 const link = u ? ` <a class="sh26-item-link" href="${u}" target="_blank" rel="noopener">↗</a>` : '';
 body.appendChild(el('div', 'sh26-item', `<div class="n">${n}${link}</div><div class="d">${d}</div>`));
 });
 btn.addEventListener('click', () => { btn.classList.toggle('open'); body.classList.toggle('open'); });
 grp.appendChild(btn); grp.appendChild(body); wrap.appendChild(grp);
 });
}

const SANDBOX_KEY = 'sha_sandbox';

function loadSandbox() {
 try { return JSON.parse(localStorage.getItem(SANDBOX_KEY) || '[]'); }
 catch (e) { return []; }
}
function saveSandbox(items) {
 localStorage.setItem(SANDBOX_KEY, JSON.stringify(items));
}

function initNotes() {
 const fab = document.getElementById('fab');
 const panel = document.getElementById('notepanel');
 const ta = document.getElementById('note-ta');
 fab.addEventListener('click', () => { panel.classList.toggle('open'); if (panel.classList.contains('open')) ta.focus(); });
 document.getElementById('note-save').addEventListener('click', () => {
 const v = ta.value.trim();
 if (!v) return;
 const items = loadSandbox();
 items.unshift({ id: 's' + Date.now().toString(36), text: v, date: new Date().toISOString() });
 saveSandbox(items);
 ta.value = '';
 panel.classList.remove('open');
 renderSandbox();
 });
 ta.addEventListener('keydown', e => {
 if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); document.getElementById('note-save').click(); }
 });
}

function renderSandbox() {
 const wrap = document.getElementById('sh26-sandbox-wrap');
 const items = loadSandbox();
 wrap.innerHTML = '';

 if (!items.length) {
 wrap.appendChild(el('div', 'sandbox-empty', 'Nothing saved yet. Use the + button to add the first one.'));
 return;
 }

 items.forEach(item => {
 const row = el('div', 'sandbox-item');
 row.dataset.id = item.id;

 const textWrap = el('div', null);
 const textEl = el('div', 'sandbox-item-text', item.text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'));
 const when = new Date(item.date).toLocaleDateString('en-NZ', { day: 'numeric', month: 'short' });
 const dateEl = el('div', 'sandbox-item-date', when);
 textWrap.appendChild(textEl);
 textWrap.appendChild(dateEl);
 textWrap.style.flex = '1';
 textWrap.style.minWidth = '0';

 textEl.addEventListener('click', () => {
 if (row.querySelector('textarea')) return;
 const ta = document.createElement('textarea');
 ta.className = 'sandbox-item-ta';
 ta.value = item.text;
 ta.rows = Math.min(8, Math.max(2, Math.ceil(item.text.length / 40)));
 textEl.replaceWith(ta);
 ta.focus();
 ta.setSelectionRange(ta.value.length, ta.value.length);
 let settled = false;
 const commit = () => {
 if (settled) return;
 settled = true;
 const v = ta.value.trim();
 const all = loadSandbox();
 const idx = all.findIndex(x => x.id === item.id);
 if (idx === -1) return;
 if (!v) { all.splice(idx, 1); saveSandbox(all); renderSandbox(); return; }
 all[idx].text = v;
 saveSandbox(all);
 item.text = v;
 if (!ta.isConnected) return;
 const fresh = el('div', 'sandbox-item-text', v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'));
 fresh.addEventListener('click', () => textEl.click());
 ta.replaceWith(fresh);
 };
 const cancel = () => {
 if (settled) return;
 settled = true;
 ta.removeEventListener('blur', commit);
 renderSandbox();
 };
 ta.addEventListener('blur', commit);
 ta.addEventListener('keydown', e => {
 if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); ta.blur(); }
 if (e.key === 'Escape') { e.preventDefault(); cancel(); }
 });
 });

 const del = el('button', 'sandbox-item-del', '\u00d7');
 del.setAttribute('aria-label', 'Remove');
 del.addEventListener('click', () => {
 const all = loadSandbox().filter(x => x.id !== item.id);
 saveSandbox(all);
 renderSandbox();
 });

 row.appendChild(textWrap);
 row.appendChild(del);
 wrap.appendChild(row);
 });
}

function initSandboxCopy() {
 const btn = document.getElementById('sandbox-copy');
 if (!btn) return;
 btn.addEventListener('click', async () => {
 const items = loadSandbox();
 if (!items.length) { btn.textContent = 'Nothing to copy'; setTimeout(() => btn.textContent = 'Copy for Claude', 1400); return; }
 const text = items.map(i => '- ' + i.text.replace(/\n/g, ' ')).join('\n');
 try { await navigator.clipboard.writeText(text); btn.textContent = 'Copied \u2014 paste into chat'; }
 catch (e) { btn.textContent = 'Copy failed'; }
 setTimeout(() => btn.textContent = 'Copy for Claude', 2000);
 });
}

async function fetchWeather() {
 try {
 // Open-Meteo's forecast window is ~16 days; the masthead's "current" reading only
 // means anything once we're inside that window relative to trip start, otherwise
 // it would show today's real Shanghai weather next to October trip dates, which
 // reads as wrong no matter how accurate the number technically is.
 const tripStart = new Date('2026-10-23T00:00:00+08:00');
 const now = new Date();
 const daysUntilTrip = (tripStart - now) / 86400000;
 const showCurrent = daysUntilTrip <= 16 && daysUntilTrip >= -8;

 const url = 'https://api.open-meteo.com/v1/forecast?latitude=31.2304&longitude=121.4737' +
 '&current=temperature_2m,weather_code' +
 '&daily=weather_code,temperature_2m_max,temperature_2m_min' +
 '&temperature_unit=celsius&timezone=Asia%2FShanghai' +
 '&start_date=2026-10-23&end_date=2026-11-01';
 const r = await fetch(url);
 if (!r.ok) return;
 const d = await r.json();

 const wmoIcon = c => c===0?'☀':c<=2?'⛅':c===3?'☁':c<=49?'🌫':c<=59?'🌦':c<=69?'🌧':c<=79?'❄':c<=82?'🌦':'⛈';

 // Masthead: current temp, only shown once it's actually relevant to the trip
 if (showCurrent && d.current) {
 const cur = Math.round(d.current.temperature_2m);
 const curIcon = wmoIcon(d.current.weather_code);
 document.getElementById('m-weather').innerHTML =
 `${curIcon} <span class="mast-weather-temp">${cur}°</span>`;
 }

 // Per-day: map date string to day id
 const dateToId = {
 '2026-10-23': 'd0',
 '2026-10-24': 'd1', '2026-10-25': 'd2', '2026-10-26': 'd3',
 '2026-10-27': 'd4', '2026-10-28': 'd5', '2026-10-29': 'd6',
 '2026-10-30': 'd7', '2026-10-31': 'd8', '2026-11-01': 'd9'
 };
 d.daily.time.forEach((date, i) => {
 const id = dateToId[date];
 if (!id) return;
 const slot = document.getElementById('wx-' + id);
 if (!slot) return;
 const icon = wmoIcon(d.daily.weather_code[i]);
 const hi = Math.round(d.daily.temperature_2m_max[i]);
 const lo = Math.round(d.daily.temperature_2m_min[i]);
 slot.innerHTML = `<span class="day-weather-icon">${icon}</span><span class="day-weather-temps"><span class="hi">${hi}°</span> / ${lo}°</span>`;
 });
 } catch(e) {}
}

document.addEventListener('DOMContentLoaded', () => {
 renderMasthead();
 renderPlanePiece();
 renderVoices();
 renderChapters();
 renderBookings();
 renderPocket();
 renderSandbox();
 initSandboxCopy();
 initNotes();
 fetchWeather();
});
</script>
