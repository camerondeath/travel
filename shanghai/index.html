<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shanghai · October 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,300;9..144,0,400;9..144,1,300;9..144,1,400&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
 --ground: #f7f6f3;
 --ground-2: #eeecea;
 --ground-3: #e4e2de;
 --ink: #1a1916;
 --ink-2: #3a3834;
 --ink-3: #6b6860;
 --accent: #2d5a3d;
 --accent-2: #1e3d29;
 --accent-lt: #e8f0eb;
 --rule: #dddbd7;
 --rule-2: #ccc9c4;
 --good: #2d5a3d;
 --open: #4a6fa5;
 --serif: 'Newsreader', Georgia, serif;
 --display: 'Fraunces', Georgia, serif;
 --mono: 'Inter', -apple-system, system-ui, sans-serif;
 --col: 720px;
 --pad: 1.5rem;
 --measure: 34em;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; font-size: 18px; }
body { background: var(--ground); color: var(--ink); font-family: var(--serif); line-height: 1.72; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.wrap { max-width: var(--col); margin: 0 auto; padding: 0 var(--pad); }

/* ── NO GLOW ON LIGHT ─────────────────────────────────────── */
.glow { display: none; }
.content { position: relative; }

/* ── MASTHEAD ─────────────────────────────────────────────── */
.masthead { padding: 3.5rem 0 2rem; position: relative; }
.masthead { overflow: hidden; }
.mast-leaf { position: absolute; top: 1.2rem; right: -2.4rem; width: 168px; height: 168px; opacity: 0.10; pointer-events: none; }
.mast-leaf path { fill: var(--accent); stroke: none; }
@media (max-width: 640px) { .mast-leaf { width: 104px; height: 104px; top: 1rem; right: -1.6rem; opacity: 0.09; } }
.mast-city { font-family: var(--display); font-size: clamp(3rem, 9vw, 5.5rem); font-weight: 400; line-height: 0.88; letter-spacing: -0.03em; font-optical-sizing: auto; color: var(--ink); }
.mast-city em { font-style: italic; color: var(--accent); font-weight: 300; }
.mast-bar { display: flex; align-items: center; gap: 1.2rem; margin-top: 1.4rem; padding-top: 1rem; border-top: 1px solid var(--rule); }
.mast-dates { font-family: var(--mono); font-size: 0.7rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
.mast-weather { display: inline-flex; align-items: center; gap: 0.4rem; font-family: var(--mono); font-size: 0.7rem; color: var(--ink-3); margin-left: auto; }
.mast-weather-temp { color: var(--ink-2); font-weight: 500; }

/* ── PLANE PIECE ──────────────────────────────────────────── */
.plane-piece { padding: 2.5rem 0 3rem; border-bottom: 1px solid var(--rule); }
.kicker { font-family: var(--mono); font-size: 0.65rem; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 0.9rem; }
.plane-piece h2 { font-family: var(--display); font-size: clamp(1.9rem, 5vw, 3rem); font-weight: 400; line-height: 1.02; letter-spacing: -0.02em; font-optical-sizing: auto; margin-bottom: 0.8rem; color: var(--ink); }
.standfirst { font-family: var(--serif); font-size: 1.18rem; font-weight: 300; font-style: italic; color: var(--accent); line-height: 1.45; margin-bottom: 2rem; max-width: 32ch; }

/* ── PROSE ────────────────────────────────────────────────── */
.prose p { margin-bottom: 1.25em; color: var(--ink-2); font-size: 1rem; max-width: var(--measure); }
.prose p:last-child { margin-bottom: 0; }
.prose-drop > p:first-of-type::first-letter {
 font-family: var(--display); float: left; font-size: 4em; line-height: 0.76;
 font-weight: 400; padding: 0.04em 0.1em 0 0; color: var(--accent); font-optical-sizing: auto; }

/* ── EXPAND TOGGLE ────────────────────────────────────────── */
.sh26-panel { margin-top: 0.8rem; }
.sh26-panel-btn {
 display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer;
 background: none; border: none; padding: 0.2rem 0;
 font-family: var(--mono); font-size: 0.65rem; font-weight: 500;
 letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);
 transition: color 0.12s;
}
.sh26-panel-btn:hover { color: var(--accent-2); }
.sh26-panel-btn .sh26-chevron { display: inline-block; transition: transform 0.18s; font-style: normal; }
.sh26-panel-btn.open .sh26-chevron { transform: rotate(90deg); }
.sh26-panel-body {
 display: none; margin-top: 1rem;
 padding: 1.2rem 1.4rem;
 background: var(--ground-2);
 border-left: 2px solid var(--accent);
}
.sh26-panel-body.open { display: block; }
.sh26-panel-body .prose p { font-size: 0.92rem; color: var(--ink-2); max-width: 38em; }
.sh26-panel-body .prose-drop > p:first-of-type::first-letter { font-size: 3em; color: var(--accent); }

/* ── ESSAY TEASER ─────────────────────────────────────────── */
.essay-teaser { margin-bottom: 0.5rem; }
.essay-teaser { max-width: var(--measure); }
.essay-teaser p { font-family: var(--serif); font-size: 1rem; color: var(--ink-3); line-height: 1.7; margin: 0; display: inline; }
.essay-continue { display: inline; font-family: var(--serif); font-size: 1rem; color: var(--ink-3); }
.essay-continue::before { content: '\2026\00a0'; color: var(--rule-2); }
.essay-continue a { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); font-family: var(--mono); font-size: 0.65rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; vertical-align: baseline; }
.essay-continue a:hover { color: var(--accent-2); border-color: var(--accent); }


.chapter { padding: 3rem 0 2.4rem; }
.chapter-rule { display: flex; align-items: center; gap: 1rem; }
.chapter-rule::before, .chapter-rule::after { content: ''; flex: 1; height: 1px; background: var(--rule); }
.chapter-rule svg { width: 15px; height: 15px; flex-shrink: 0; opacity: 0.5; }
.chapter-rule svg path { fill: var(--accent); stroke: none; }
.chapter.is-past { opacity: 0.45; }
.chapter.is-today { border-left: 2px solid var(--accent); padding-left: 1.5rem; margin-left: -1.5rem; }
.chapter-label { font-family: var(--mono); font-size: 0.62rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.6rem; }
.chapter-head { margin-bottom: 1.8rem; }
.chapter-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 0.5rem; }
.chapter-meta { font-family: var(--mono); font-size: 0.65rem; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 0.5rem; }
.chapter-meta .date-accent { color: var(--accent); }
.chapter-title { font-family: var(--display); font-size: clamp(1.7rem, 4.5vw, 2.4rem); font-weight: 400; line-height: 1.04; letter-spacing: -0.02em; font-optical-sizing: auto; color: var(--ink); }
.day-weather { display: flex; flex-direction: column; align-items: flex-end; gap: 0.1rem; flex-shrink: 0; padding-top: 0.1rem; }
.day-weather-icon { font-size: 1.3rem; line-height: 1; }
.day-weather-temps { font-family: var(--mono); font-size: 0.62rem; color: var(--ink-3); white-space: nowrap; }
.day-weather-temps .hi { color: var(--ink-2); }

/* ── SPINE ────────────────────────────────────────────────── */
.spine { position: relative; padding-left: 2rem; margin-top: 1.5rem; }
.spine::before { content: ''; position: absolute; left: 0; top: 0.6rem; bottom: 0.6rem; width: 1px; background: var(--rule); }
.stop { position: relative; margin-bottom: 1.8rem; }
.stop:last-child { margin-bottom: 0; }
.stop::before {
 content: ''; position: absolute; left: -2rem; top: 0.52rem;
 width: 7px; height: 7px; border-radius: 50%;
 background: var(--ground); border: 1px solid var(--rule-2);
}
.stop[data-kind="food"]::before { border-color: var(--accent); background: var(--ground); }
.stop[data-kind="culture"]::before { background: var(--accent); border-color: var(--accent); }
.stop-time { font-family: var(--mono); font-size: 0.62rem; font-weight: 500; letter-spacing: 0.1em; color: var(--accent); text-transform: uppercase; margin-bottom: 0.15rem; }
.stop-head { display: flex; align-items: baseline; gap: 0.7rem; flex-wrap: wrap; margin-bottom: 0.2rem; }
.stop-title { font-family: var(--display); font-size: 1.1rem; font-weight: 400; color: var(--ink); line-height: 1.2; font-optical-sizing: auto; }
.stop-title a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule-2); }
.stop-title a:hover { color: var(--accent); border-color: var(--accent); }
.stop-tag { font-family: var(--mono); font-size: 0.58rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.15em 0.55em; border-radius: 1px; flex-shrink: 0; }
.stop-tag.confirmed { color: var(--good); border: 1px solid color-mix(in srgb, var(--good) 40%, transparent); background: var(--accent-lt); }
.stop-tag.open { color: var(--open); border: 1px solid color-mix(in srgb, var(--open) 35%, transparent); }
.bib-badge { font-family: var(--serif); font-style: italic; font-size: 0.7rem; letter-spacing: 0.02em; color: #a8522f; text-decoration: none; border-bottom: 1px solid #d9a688; padding-bottom: 1px; flex-shrink: 0; }
.bib-badge:hover { color: #7d3c22; border-color: #a8522f; }
.stop-note { font-family: var(--serif); font-size: 0.88rem; color: var(--ink-3); line-height: 1.65; max-width: 40em; }
.stop-ref { font-family: var(--mono); font-size: 0.62rem; color: var(--rule-2); margin-top: 0.3rem; letter-spacing: 0.04em; }
.stop-ref span { color: var(--ink-3); }
.stop-map { font-family: var(--mono); font-size: 0.62rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); text-decoration: none; margin-top: 0.35rem; display: inline-block; }
.stop-map:hover { color: var(--accent-2); }

/* ── BOOKINGS LEDGER ──────────────────────────────────────── */
.bookings-section { padding: 3rem 0; border-bottom: 1px solid var(--rule); }
.ledger { margin-top: 1.2rem; }
.ledger-row { display: flex; align-items: baseline; gap: 0.9rem; padding: 0.65rem 0; border-bottom: 1px solid var(--rule); }
.ledger-row:first-child { border-top: 1px solid var(--rule); }
.ldot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; align-self: center; }
.ldot.confirmed { background: var(--good); }
.ldot.open { background: var(--open); }
.ledger-body { flex: 1; min-width: 0; }
.ledger-label { font-family: var(--display); font-size: 0.98rem; font-weight: 400; color: var(--ink); font-optical-sizing: auto; }
.ledger-sub { font-family: var(--mono); font-size: 0.62rem; color: var(--ink-3); margin-top: 0.1rem; letter-spacing: 0.02em; }
.ledger-ref { font-family: var(--mono); font-size: 0.6rem; color: var(--rule-2); margin-top: 0.15rem; }
.ledger-ref span { color: var(--accent); }
.ledger-state { font-family: var(--mono); font-size: 0.58rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; flex-shrink: 0; }
.ledger-state.confirmed { color: var(--good); }
.ledger-state.open { color: var(--open); }
.ledger-link { font-family: var(--mono); font-size: 0.62rem; color: var(--accent); text-decoration: none; flex-shrink: 0; }
.ledger-link:hover { color: var(--accent-2); }

/* ── BACK POCKET ──────────────────────────────────────────── */
.sh26-section { padding: 3rem 0; border-bottom: 1px solid var(--rule); }
.sh26-row { margin-bottom: 0.25rem; }
.sh26-row-btn {
 width: 100%; display: flex; align-items: center; justify-content: space-between;
 background: none; border: none; border-bottom: 1px solid var(--rule);
 padding: 0.85rem 0; cursor: pointer; color: var(--ink);
 font-family: var(--serif); font-size: 1rem; font-weight: 400; text-align: left;
}
.sh26-row-btn .sh26-chev { font-family: var(--mono); color: var(--ink-3); font-size: 0.8rem; transition: transform 0.18s; }
.sh26-row-btn.open .sh26-chev { transform: rotate(90deg); }
.sh26-row-panel { display: none; padding: 0.4rem 0 0.9rem; }
.sh26-row-panel.open { display: block; }
.sh26-item { padding: 0.5rem 0; border-bottom: 1px solid var(--rule); }
.sh26-item:last-child { border-bottom: none; }
.sh26-item .n { font-family: var(--serif); font-size: 0.95rem; color: var(--ink-2); }
.sh26-item .d { font-family: var(--mono); font-size: 0.65rem; color: var(--ink-3); line-height: 1.55; margin-top: 0.1rem; letter-spacing: 0.01em; }
.sh26-item-link { font-family: var(--mono); font-size: 0.62rem; color: var(--accent); text-decoration: none; }
.sh26-item-link:hover { text-decoration: underline; }
.sh26-item-link-block { display: block; text-decoration: none; cursor: pointer; }
.sh26-item-link-block:hover .n { color: var(--accent); }

/* ── SECTION LABEL ────────────────────────────────────────── */
.section-label { font-family: var(--mono); font-size: 0.65rem; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 0; }
.section-sub { font-family: var(--serif); font-size: 0.9rem; font-style: italic; color: var(--ink-3); margin: 0.5rem 0 1rem; max-width: 40em; }
.section-sub code { font-family: var(--mono); font-style: normal; font-size: 0.78rem; background: var(--ground-2); padding: 0.1em 0.35em; }
.notepanel-label { font-family: var(--mono); font-size: 0.6rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 0.5rem; }

.sh26-sandbox-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: 0.5rem; }
.sandbox-copy-btn { flex-shrink: 0; padding: 0.4rem 0.8rem; background: none; border: 1px solid var(--rule-2); color: var(--ink-3); font-family: var(--mono); font-size: 0.6rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; border-radius: 2px; transition: color 0.12s, border-color 0.12s; }
.sandbox-copy-btn:hover { color: var(--accent); border-color: var(--accent); }
.sandbox-item { display: flex; align-items: flex-start; gap: 0.6rem; padding: 0.7rem 0; border-bottom: 1px solid var(--rule); }
.sandbox-item:last-child { border-bottom: none; }
.sandbox-item-text { flex: 1; min-width: 0; font-family: var(--serif); font-size: 0.92rem; color: var(--ink-2); line-height: 1.55; white-space: pre-wrap; cursor: text; padding: 0.1rem 0; }
.sandbox-item-text:hover { color: var(--ink); }
.sandbox-item-date { font-family: var(--mono); font-size: 0.58rem; color: var(--rule-2); letter-spacing: 0.04em; margin-top: 0.3rem; }
.sandbox-item-ta { flex: 1; min-width: 0; font-family: var(--serif); font-size: 0.92rem; color: var(--ink); line-height: 1.55; background: var(--ground-2); border: 1px solid var(--accent); border-radius: 2px; padding: 0.4rem 0.5rem; resize: vertical; }
.sandbox-item-del { flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; border: none; background: none; color: var(--ink-3); font-family: var(--mono); font-size: 0.85rem; line-height: 1; cursor: pointer; margin-top: 0.15rem; }
.sandbox-item-del:hover { color: #a8522f; }
.sandbox-empty { font-family: var(--serif); font-style: italic; font-size: 0.9rem; color: var(--ink-3); padding: 0.5rem 0; }

/* ── FAB / NOTES ──────────────────────────────────────────── */
footer { padding: 3rem 0 4rem; text-align: center; font-family: var(--mono); font-size: 0.62rem; color: var(--rule-2); letter-spacing: 0.12em; text-transform: uppercase; }
.fab { position: fixed; bottom: 1.4rem; right: 1.4rem; z-index: 50; width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: var(--ground); border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 12px rgba(45,90,61,0.25); transition: transform 0.12s; }
.fab svg { pointer-events: none; }
.fab:hover { transform: scale(1.06); }
.notepanel { position: fixed; bottom: 5rem; right: 1.4rem; z-index: 50; width: min(300px, calc(100vw - 2.8rem)); background: var(--ground); border: 1px solid var(--rule); border-radius: 4px; padding: 1rem; box-shadow: 0 4px 24px rgba(0,0,0,0.12); display: none; }
.notepanel.open { display: block; }
.notepanel textarea { width: 100%; height: 76px; resize: none; background: var(--ground-2); color: var(--ink); border: 1px solid var(--rule); border-radius: 2px; padding: 0.55rem; font-family: var(--mono); font-size: 0.78rem; }
.notepanel textarea:focus { outline: 1px solid var(--accent); }
.notepanel .save { margin-top: 0.45rem; width: 100%; padding: 0.45rem; background: var(--accent); color: var(--ground); border: none; border-radius: 2px; font-family: var(--mono); font-weight: 500; font-size: 0.72rem; letter-spacing: 0.06em; cursor: pointer; text-transform: uppercase; }
.notelist { margin-top: 0.5rem; max-height: 120px; overflow-y: auto; }
.noteitem { font-family: var(--mono); font-size: 0.65rem; color: var(--ink-2); padding: 0.35rem 0; border-bottom: 1px solid var(--rule); line-height: 1.4; }
.noteitem:last-child { border-bottom: none; }
.notelist .empty { font-family: var(--mono); font-size: 0.65rem; color: var(--ink-3); }
a:focus-visible, button:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="content"><div class="wrap">

<header class="masthead">
 <svg class="mast-leaf" viewBox="0 0 100 100" aria-hidden="true">
 <path d="M50 66C29 62 7 45 9 24 11 11 30 3 46 10L50 23 54 10C70 3 89 11 91 24 93 45 71 62 50 66Z"/><path d="M48.6 65.5C48.6 78 48 86 47 94L53 94C52 86 51.4 78 51.4 65.5Z"/>
 </svg>
 <div class="mast-city" id="m-title"></div>
 <div class="mast-bar">
 <span class="mast-dates" id="m-dates"></span>
 <span class="mast-weather" id="m-weather"></span>
 </div>
</header>

<section class="plane-piece" id="plane"></section>

<section class="sh26-section" id="sh26-voices">
 <div class="section-label">Other voices</div>
 <div class="section-sub">The same trip, reread in a writer's register. More to come here over time.</div>
 <div id="sh26-voices-wrap"></div>
</section>

<main id="chapters"></main>

<section class="sh26-section" id="sh26-pocket">
 <div class="section-label">Back pocket</div>
 <div id="sh26-pocket-wrap"></div>
</section>

<section class="sh26-section" id="sh26-sandbox">
 <div class="sh26-sandbox-head">
 <div>
 <div class="section-label">Sandbox</div>
 <div class="section-sub">Saved on this phone. Tap any item to edit it, tap × to remove it.</div>
 </div>
 <button class="sandbox-copy-btn" id="sandbox-copy">Copy for Claude</button>
 </div>
 <div id="sh26-sandbox-wrap"></div>
</section>

<section class="bookings-section" id="bookings-section">
 <div class="section-label" style="margin-bottom:1rem;">Confirmed</div>
 <div class="ledger" id="ledger-confirmed"></div>
 <div class="section-label" style="margin:2rem 0 1rem;">Still to book</div>
 <div class="ledger" id="ledger-open"></div>
</section>

<footer>Shanghai · October 2026</footer>
</div></div>

<button class="fab" id="fab" aria-label="Save a find">
 <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
 <path d="M12 5v14M5 12h14"/>
 </svg>
</button>
<div class="notepanel" id="notepanel">
 <div class="notepanel-label">Save a find</div>
 <textarea id="note-ta" placeholder="Paste a link, a name, an address, a thought…"></textarea>
 <button class="save" id="note-save">Add</button>
</div>

<script>
const TRIP = {
  meta: {
    city: "Shanghai",
    dates: "24 Oct – 1 Nov 2026",
    flights: { out: "NZ289 · AKL 11:45pm → PVG 6:55am", ret: "NZ288 · PVG 2:15pm → AKL 6:45am +1", ref: "D52ZEH" },
    base: { name: "OPARTMENT The Far Eastern, 90 Xizang Middle Rd, Huangpu", url: "https://www.trip.com/hotels/shanghai-hotel-detail-8378334", map: "https://maps.google.com/?q=90+Xizang+Middle+Road+Huangpu+Shanghai" },
    plane: {
      kicker: "Read on the plane",
      title: "The Second Look",
      standfirst: "A city rewards a second visit only when you stop looking for what impressed you the first time.",
      preview: `<p>Six months ago you stood on the Bund and turned around. That gesture, so obvious as to be almost automatic, is what the city trains you to perform. The colonial facade behind you, the corkscrew of Pudong opposite, the argument between them running back and forth across the Huangpu like a rally in a tennis match neither player is prepared to concede. Everyone who visits Shanghai does this. The Chinese state, in ways it does not need to explain, wants you to. The whole city has been arranged so that the visual grammar of the encounter is difficult to avoid. It is not a small thing. It is the argument that Shanghai wanted to have with the twentieth century, and now with the twenty-first, and it is a good argument. You could spend a week looking at that river and never come to the end of what it is trying to tell you.</p>`,
      full: `<p>But you have already had that conversation. The question a second visit poses is a different one. What is left of a city once you have seen the version of itself it prepared for you, the polished sequence of Rockbund and Xintiandi and Fuxing Park and Wukang Road, the walking tours and the wet markets, the food streets that appear in every English-language guide? What remains, when the performance is over, is the room itself.</p>

<p>Consider the room. Not the stage, the room. There is a story Ballard tells in the memoir he wrote after Empire of the Sun. He returned to Shanghai in the 1990s, forty years after being interned as a child in Lunghua camp, and went to look at the Amherst Avenue house where his family had lived before the Japanese arrived. The building was still there, in what is now Xinhua Road in the western reach of the old French Concession. Someone had subdivided it, packed families into every room, hung laundry across the veranda where his mother had held cocktail parties. He was not distressed by this. He was, he wrote, oddly reassured. The house had gone on. The stage set of his colonial childhood had proved less durable than the walls that had held it. The lives being lived in those rooms in 1991 were closer to the real Shanghai than anything his family had ever seen, and this seemed to him not an indictment but a kind of grace.</p>

<p>This is the thing worth carrying with you into the October week. Shanghai is a city that has spent every one of the last hundred and eighty years being reoccupied by whatever regime happens to be in charge. British and French merchants first, then Japanese soldiers, then the Nationalists briefly, then the Communist Party for three decades of dormancy, then Deng Xiaoping's economic reforms, then the state's rediscovery of soft power and the private capital that has followed it. Each occupation has left behind buildings that it built to announce its permanence. Each has been replaced. The Sassoons expected the Cathay Hotel to be theirs forever. The Kadoories expected the Marble Hall. The People's Liberation Army marched into the International Settlement in May 1949 and reappropriated both. Deng Xiaoping declared Pudong a special economic zone in 1990 and the Chinese state, over the following three decades, built a new skyline on rice paddies and cotton fields to make a rhetorical point that had nothing to do with either. Every one of these was, in its moment, going to last forever. None of them did. What lasted was the water they were all built beside, the streets they were all built along, and the people who had been living in Shanghai before any of them arrived and were living there after each of them was gone.</p>

<p>It is possible to arrange a trip to Shanghai that spends most of a week in the Concession alone, walking the same plane-tree streets you walked in April, and to call this a second look. It would not be. It would be watching the same performance from a slightly different seat. What the room offers is different. Yangpu, north of the reclaimed West Bund, where the wharves and cotton mills that fed the concessions from beyond their own borders still stand because nobody has yet had the money or the will to convert them into anything else. Nanshi, the old walled city, which the concession-era treaty maps drew a red line around so that Western law and Chinese law would not overlap. Hongkou, north of Suzhou Creek, the neighbourhood where twenty thousand Jewish refugees from Nazi Europe settled between 1933 and 1941 because Shanghai was the only city in the world that would accept them without a visa, and where, later, the writer Lu Xun spent his final years diagnosing what he saw as the moral pathology of the country he loved. None of these was built for you. None of them will perform.</p>

<p>There is a specific pleasure available in this. Anyone who has spent time in a foreign city learns eventually that the good hours are the ones spent in places that have no obligation to notice you are there. A wet market at seven in the morning. A lane where an old man is repairing a radio on the pavement. A restaurant with no English menu whose regulars have been eating there for thirty years. These are not authentic in the sense that word is usually deployed, which is to say marketable. They are simply not staged. And what a city is, underneath its stagecraft, is the sum of all the moments in which it is not being asked to prove anything to anyone.</p>

<p>Consider also what has changed in the six months since April. The trip you took then was structured around a framing you called the Two Waterfronts: the Bund with its back to the river, Pudong across the water, the two of them arguing. It was a good framing. It got you inside the city in a way that a more scattered itinerary would not have. But every framing is also a limit, and one of the things a second visit is for is to notice the limit. The two-waterfront thesis is Shanghai's own story about itself, and it is a story with only two characters in it. The Bund is Shanghai's face to the West. Pudong is Shanghai's face to itself. Both position the city as something best read from the water, at a distance, at the edge where the land stops. Which is to say, the city as seen from a boat. There are other waterfronts, and two of them are in this trip. West Bund is the face Shanghai has built for the future it wants. Yangpu, which you did not walk in April at all, is the face it has not bothered to build, because it is still the working past and nobody has yet found a use for it. But a face is still a thing pointed outward, and four faces are not better than two if you never go inside.</p>

<p>What Shanghai looks like from inside, from a lane house courtyard or an artist's studio or someone's kitchen, is a different city. It is more ordinary and more strange. The lane house is the actual unit of Shanghai. Not the Bund building, not the Pudong tower, not the West Bund museum. The shikumen. Two storeys of grey brick, an internal courtyard, a stone arched doorway. Between the mid-nineteenth century and the mid-twentieth, most of Shanghai's population lived in some version of this. Many of them still do. Every time the international press produces one of its periodic laments about Shanghai's disappearing old neighbourhoods, this is what it is lamenting: the demolition of shikumen. The city has demolished tens of thousands of them since 1990 to make way for the towers that appear on every guidebook cover. It has also preserved some, most famously Xintiandi, which is now a shopping district in shikumen costume. What it has done less visibly is leave a great number of them alone, still occupied, still functioning, in neighbourhoods where nothing else has changed enough to make them worth photographing. The old walled city is one of these. Hongkou is another. If you want to know what Shanghai actually is, as opposed to what it wants you to think it is, you go to the shikumen the city has forgotten to demolish or restore.</p>

<p>A word about art. Shanghai's gallery scene has, over the past ten years, become one of the two or three most serious in Asia. This is not a projection. Auction volumes, primary sales, the fair calendar around West Bund Art and Design and Art021 in November, the international dealers who have opened Shanghai outposts, the private museums that have proliferated along the reclaimed West Bund waterfront, all of this represents a genuine consolidation of Chinese contemporary art around this city. The important thing for a visitor to understand is that the museums are not where the interesting work is. The museums are where the story of the interesting work gets told. The work itself is in the small galleries, the ones that operate from converted lane houses in the Concession, from upper floors on Anfu Road, from spaces at the top of former textile mills at M50. Capsule at 275 Anfu Road, in a 1930s garden house. BANK, now in the White Building at 457 North Shaanxi Road after two previous addresses. Antenna Space up at M50. These are galleries you should walk into by appointment, when the shows are quiet, and where, if you are alert enough to notice, you may be looking at the artists who will define the next twenty years of Chinese art before anyone outside a very small world knows their names.</p>

<p>And a word about eating. There is a coincidence of timing that matters. Late October in Shanghai is hairy crab season, the six or seven weeks when the male mitten crabs mature in the tenth lunar month and the females in the ninth, and the best kitchens in the city serve almost nothing else. It is also the season when the Michelin Guide is at its most useful in Shanghai, which is to say when the Bib Gourmand list works as a filter rather than a suggestion. The 2026 guide runs to thirty-five Bib entries in the city, most of them Chinese kitchens serving one thing at a serious level, and this is the register the eating on this trip should be tuned to. Not the fine dining rooms, which are excellent but which perform for you. The one-dish shops. The noodle counters. The neighbourhood halls that have been at the same address for thirty years. Several are within twenty minutes on foot of the hotel, and several more are a short DiDi, which is unusual and worth using.</p>

<p>But a filter is also a limit, and this one has an obvious one: the Bib list is overwhelmingly Jiangnan counters selling wheat and pork and river fish, which means a week built strictly on it produces a week of wheat and pork and river fish. So the week below breaks it three times, on purpose. Once for whole crab, because a bowl of crab roe noodles is not the same thing as sitting in front of a single animal for forty-five minutes with a dish of ginger vinegar and a warm carafe of Shaoxing beside it, which is what the season actually is. Once for Xinjiang, because cumin and lamb over charcoal is as far from this city's cooking as Chinese food gets, and April proved that the contrast is worth a whole evening. And once for a kitchen that is not a restaurant at all.</p>

<p>There is a thread here worth pulling. In April you went to Shaoxing and drank the wine at the source, in the town where it has been made for two thousand years, and by then you had already spent five days eating it without being in it: in the drunken chicken at Jesse, in the red-braised pork at Chun. The crab you eat in October is served with that wine, warmed, because the crab is cold in the Chinese medical sense and the wine is warm, and the pairing is not a suggestion, it is a correction. You will be closing a loop you opened six months ago and did not know you had opened.</p>

<p>What you are looking for, then, in the week that follows, is not the city Shanghai wants to show you. That city you already saw. You are looking for what remains when the show is over: the rooms, the meals, the small studios, the water at Yangpu that is still a working river rather than a stage. The person who sees a city twice sees it differently the second time not because the city has changed, though of course it has, but because they know what to ignore. In April you ignored nothing. In October you can afford to. That is the whole discipline of a second look. Choose what to walk past. The city will notice you doing it, in the way that cities notice the visitors who have started to see them clearly, and it will begin, however imperceptibly, to offer you the things it did not offer the first time.</p>

<p>The plane will land at six fifty-five in the morning. There will be light on the tarmac. The immigration hall will be full and then, an hour later, empty. You will get in a car and be driven forty-five minutes to a hotel on Xizang Middle Road at the People's Square end, a kilometre and a half north of the old walled city, which is to say a walk rather than a step, and the driver will not ask you what you have come to see, because he assumes, correctly, that a foreigner arriving in Shanghai in late October has come to see the same things every other foreigner has come to see.</p>

<p>The trees will tell you what week it is. Late October is when the ginkgos turn, and the ginkgo is worth a moment, because Shanghai's other famous tree is not from here. The plane trees on Wukang Road and Anfu Road and around Fuxing Park, the ones every photograph of the French Concession is taken under, were planted by the French municipal council: an imported tree lining an imported street grid in a zone where Chinese law did not apply. The ginkgo was already here, and had been for two hundred million years, which is a span that makes the Opium Wars look like a scheduling conflict. Both go yellow in the same fortnight. One of them is a decision somebody made. The other one is just the ground.</p>

<p>What the driver will not know, and what you will begin to demonstrate over the eight days that follow, is that the visitor who comes back the second time is a different visitor entirely. The river is the same river. The city is the same city. The disciplines you bring to it are what has changed. Bring the discipline of the second look, and Shanghai will meet you there.</p>`
    }
  },

  voices: [
    {
      author: "In the manner of David Sedaris",
      title: "Crab Season",
      body: `<p>The first thing anyone tells you about Shanghai in late October is the crab, and by the third or fourth person you start to suspect it isn't really about the crab at all, the way nobody in a small Alabama town is really talking about the weather. What they mean is: something is happening that has a deadline, and they would like you to be aware of the deadline, and possibly to feel some anxiety about it on their behalf. The crab in question is a freshwater species with hair on its legs, actual hair, not a metaphor, and for about six weeks a year it is, apparently, the only correct thing to be eating, after which it reverts to being merely a crab, a demotion nobody seems willing to elaborate on further.</p>

<p>I want to be clear that I have no real feelings about crustaceans one way or the other. I feel about crab the way I feel about golf, which is to say I understand that other people organize entire personalities around it and I am prepared to be polite about that for as long as the conversation requires. But there is something contagious about a city taking a shellfish this seriously, the same way it's hard not to get swept up in a wedding you have no emotional stake in, and by day three I found myself standing in front of a tank of live crabs outside a restaurant, watching them try to climb over one another in a manner that struck me as less "seasonal delicacy" and more "several hundred small angry men trying to get out of a meeting," and I thought, yes, actually, I do have feelings about this. I feel sorry for them. I feel sorry for them and I am going to eat one anyway, which is, if you want the whole tragedy of being a person in one sentence, that one.</p>

<p>Shanghai in October operates at a completely different pitch than the Shanghai you've been warned about, the one with the skyline and the neon and the elevator that plays a jingle every time it passes a floor with a Cartier on it. That Shanghai is still there, obviously, you can't misplace an entire skyline, but October has a light to it that seems to want to talk you out of the more aggressive version of the city. The mornings come in soft and a little grey, the way mornings do in cities that have decided, collectively and without a vote, that everyone will be up and outside by seven regardless of what time anyone went to bed. There is a specific hour, somewhere around dawn, when the whole city appears to be doing tai chi. Not everyone, obviously, but enough people, in enough parks, moving with enough unified slowness, that a visitor starts to feel a little frantic by comparison, like someone who showed up to a yoga class already vibrating with espresso.</p>`
    }
  ],

      title: "Where the River Is Still Working",
      essay: `<p>An early landing has, in this city, a specific quality. Shanghai at seven is already three hours into its day. The delivery scooters are on the second run. The dumpling shops on Xizang Middle Road have been open since five. By the time the taxi from Pudong clears the Yan'an tunnel and drops you at the hotel, the working city has already, invisibly, made all its most important decisions of the morning: what is being cooked for lunch, what will arrive at the wet market this afternoon, whose grandchild will be walked to school and by whom.</p>
<p>The arithmetic is friendlier than it looks. Auckland is five hours ahead of Shanghai, so a 6:55am landing arrives at what your body is calling midday, after a flat bed on a red-eye. You are not wrecked. You are mid-afternoon. The cost comes later: at half past six this evening it will be half past eleven at home and you will fall over where you stand. So the day is built to spend itself in daylight and end early, rather than to be nursed through and then wasted.</p>
<p>The one real variable is the room, which is yours from three. Ask about early check-in when the bags go in at half past eight, at the desk, then, not later. If it comes through you get a shower and an hour, and that is the whole difference in this day. If it doesn't, the room waits until half past five and the day runs unwashed, which is survivable and, on the riverfront you are going to, entirely unremarkable.</p>
<p>Yangpu Binjiang was cotton mills and shipyards and a power station until the 2010s. Some of it has been converted into museums by the same municipal reclamation project that produced the West Bund. Most of it has not. The cranes are still standing over water that no longer needs them. Walk it in the afternoon and walk downstream into the light as it goes, because sunset on the 24th is at two minutes past five, and the twenty minutes either side of that are the only time this stretch of river looks like anything at all: the far bank coming up, the near bank going black, an angle on the Pudong skyline that almost nobody uses because it involves standing somewhere the city has not yet invited you to stand. Begin here, and begin gently. The first day of a long trip is not the day to prove anything.</p>`,

      title: "Concrete That Remembers What It Was",
      essay: `<p>West Bund is what happens when a state government identifies eleven kilometres of decommissioned industrial waterfront and, rather than sell it to residential developers, hands it to museums.</p>
<p>The result, over about fifteen years, is a corridor of contemporary art institutions built inside the shells of what was there before. Cement silos. Fuel tanks. Coal handling docks. Every architect involved was told, explicitly, not to hide the original bones. This is why, walking through Tank Shanghai at ten in the morning with the door just opened and the first light on the concrete, you have the experience so specific to Shanghai's contemporary museum quarter: standing in a room whose ceiling is thirty metres above your head and whose original purpose was to hold two thousand tonnes of aviation fuel for the airport that no longer exists.</p>
<p>The Long Museum, twenty minutes north on the same waterfront path, is the private collection of Liu Yiqian and Wang Wei, a couple who made their money in mainland Chinese finance and then spent the next twenty years assembling one of the largest private holdings of postwar Chinese art in the world. The columns of the old coal wharf are still visible in the museum's basement. It is closer to what the Rockefellers or the Fricks were doing in New York in 1910 than to anything comparable in Europe now. Take it seriously, and take your time, there is nowhere else you need to be.</p>
<p>Before any of that, breakfast, which this week is going to be taken seriously rather than left to whichever counter happens to be closest. Shanghai's street breakfast has a canon and a name: si da jin gang, the four heavenly kings, or, less reverently, the four warriors. Da bing, a flaky baked flatbread, sweet or savoury. You tiao, the fried dough stick. Ci fan tuan, a fist of glutinous rice packed around a you tiao and whatever else is going that morning. And dou jiang, hot soy milk, which comes sweet or, much better, salty, curdled at the table with vinegar and dried shrimp and pickle and chilli oil until it collapses into something between a soup and a custard. The four are eaten together, and they are eaten before eight, and no single shop is worth naming here because the point is the format rather than the address.</p>`,

            body: `<p>The five cylinders were aviation fuel tanks for the old Longhua Airport, decommissioned when the airport closed and left standing on reclaimed riverfront land until the architect Li Hu, trained at OMA under Rem Koolhaas, was given the site around 2015. He kept the tanks' original steel skins and cut new openings between them rather than building a conventional gallery shell inside, so the exhibition spaces still read as industrial vessels rather than white cubes. The complex opened in 2019 and has become one of the anchor stops on the West Bund museum strip, alongside a large public lawn that fills with people flying kites on weekend afternoons regardless of what's showing inside.</p>`
          }
        },
        { time: "12:30pm", title: "Long Museum West Bund", kind: "culture",
          url: "http://www.thelongmuseum.com/",
          note: "3398 Longteng Ave. Tue-Sun 9:30am-5:30pm, closed Monday, so Sunday is fine. 20-minute walk north along the river path from Tank Shanghai. Walk it, don't DiDi, the path itself is the point of the corridor.",
          map: "https://maps.google.com/?q=Long+Museum+West+Bund+Shanghai",
          expand: {
            label: "About the collection",
            body: `<p>Liu Yiqian made his money in Shanghai's early stock and real-estate markets and, with his wife Wang Wei, has spent more than two decades building one of the largest private collections of modern and contemporary Chinese art anywhere, alongside a significant holding of classical Chinese painting and revolutionary-era propaganda art housed at their other Long Museum branch in Pudong. This West Bund building, by the Shanghai-based architect Liu Yichun, sits on the site of a former coal transfer dock; the concrete umbrella vaults that support the roof are the original wharf structure, left exposed rather than clad over. The rotating contemporary shows tend to favour Chinese painters who came of age after 1989, hung without much wall text, on the theory that the work should carry the room rather than the labels.</p>`

        { time: "2:30pm", title: "Wei Xiang Zhai", kind: "food",
          note: "14 Yandang Rd, near Fuxing Park. DiDi, ~20 min from West Bund, there is no useful direct metro from this stretch of river. Sesame-paste noodles the neighbourhood has eaten for eighty years. Small counter, no English menu, easy alone. Martina's pick in April, unused.",

          expand: {
            label: "About the noodle",
            body: `<p>Wei Xiang Zhai has been on Yandang Road, a short pedestrian street tucked behind Huaihai Road near Fuxing Park, since the early 1990s, and the shop still runs the same single dish it opened with: dry-tossed noodles in a toasted sesame and peanut paste, served either with a clear beef broth on the side or with wontons stirred through the same sauce. It's a small, plain room, closer to a canteen than a restaurant, and the appeal is entirely in the paste itself, nuttier and less sweet than most sesame noodle preparations sold to tourists elsewhere in the city. No English menu, but the two options, noodles with broth, or wontons in sauce, cover almost everything anyone orders.</p>`

    {
      id: "d3", dow: "Monday", date: "26 October", chapter: "III",
      arc: "The walled city",
      title: "Inside the Red Line",
      essay: `<p>Everything Shanghai calls its old city is younger than the old city.</p>
<p>The Bund is 1840s and after. The French Concession is 1849 forward. What was Shanghai before any of these arrived was a walled Ming-dynasty market town dating to the 1550s. That city is Nanshi. The wall came down in 1912 for a ring road, which is still there, and the treaty maps drew a red line around what had been inside it so that Western law and Chinese law would not overlap. Everything inside that line predates every other Shanghai you know.</p>
<p>It is not two minutes from the hotel door. It is twenty-five, and that is the day's first useful fact. The hotel sits at the People's Square end of Xizang Middle Road, on ground the International Settlement laid out as a racecourse, which is to say on the concession's own idea of itself. The old city is a kilometre and a half south. You have to walk to it, across Yan'an Road, which was Avenue Édouard VII, which was the creek that formed the boundary between the International Settlement and the French Concession, which is why it is wider today than everything around it. The distance is the argument. Nothing about the walled city was ever convenient to the people who ran Shanghai, and the walk south is the shortest way to feel that.</p>
<p>Yu Garden is closed on Mondays, which is this day's best accident. Most visitors who come to the old city come for the garden and the reconstructed bazaar around it and leave without going three streets deeper. With the gate shut, the day has nothing to do but the thing it was always supposed to do: the alley where children play on paved stones, the men playing xiangqi at the small square, the shop selling paper offerings for funerals. And Monday works for the rest of it precisely because the walled city runs on temple hours and market hours. The City God Temple is open. So is every kitchen. Most of Shanghai's galleries and museums are not, which is exactly why this day sits here and not somewhere else.</p>`,
      events: [
        { time: "9:15am", title: "The walk south", kind: "explore",
          note: "On foot, ~25 min: Xizang Middle Rd, across Yan'an Rd (the old creek boundary, which is why it is so wide), into the grid. Do not DiDi this one. The distance is the point of the day and it takes twenty-five minutes to make it.",
          map: "https://maps.google.com/?q=Yan'an+East+Road+Xizang+Middle+Road+Shanghai" },
        { time: "9:45am", title: "Nanxiang Steamed Bun", kind: "food", bib: true,
          bibUrl: "https://guide.michelin.com/en/shanghai-municipality/shanghai/restaurant/nanxiang-steamed-bun-city-god-temple",
          note: "85 Yuyuan Rd, in the Yu Garden bazaar, ~25 min walk from the hotel, not the seven the map implies. Careful with the pin: there are several Nanxiang branches around the city and Google returns the Jing'an ones first. The Bib listing is the City God Temple original and it is the one you want. Monday morning is a fraction of the weekend queue, which is why this sits here and not on the Saturday you land.",
          map: "https://maps.google.com/?q=Nanxiang+Mantou+Dian+Yu+Garden+Shanghai",
          expand: {
            label: "About the shop, and what to order",
            body: `<p>Nanxiang Mantou Dian opened at this address in 1900 and is the shop most food historians credit with the modern Shanghai xiaolongbao. It has held its Bib Gourmand every year the guide has run in the city. There are two counters at street level and a slower sit-down room upstairs; the counters are the point and the faster option. Order the standard pork xiaolongbao, sixteen to a steamer, and if it's on, the crab meat variety, which only appears for about six weeks a year centred on the autumn crab season, so this week is exactly the window. Alipay only. A queue at the ground-floor counter moves fast, usually under fifteen minutes even when it looks long from the street, and on a Monday at a quarter to ten it will barely exist.</p>`
          }
        },
        { time: "10:45am", title: "Fangbang Middle Road, unhurried", kind: "explore",
          note: "On foot, south from the bazaar along the ring road, then east on Fangbang Middle. No destination. Follow whichever alley looks interesting. Nearly two hours, and it is the day.",
          map: "https://maps.google.com/?q=Fangbang+Middle+Road+Shanghai",
          expand: {
            label: "What to notice",
            body: `<p>Fangbang Middle Road roughly traces the old town's original main east-west axis, inside the vanished city wall, and the blocks south of it toward Xiaonanmen are where the reconstruction money that transformed Yu Garden's bazaar simply ran out. What's left is un-prettified: two-storey tenements with laundry strung between them, traditional medicine shops selling dried roots out of glass jars, a knife sharpener working a foot-pedal grinding wheel on the pavement, small temples to local deities squeezed between shopfronts. None of it is curated for a visitor's benefit. Follow whichever side alley looks like it's going somewhere; most of them are barely wide enough for two people to pass.</p>`
          }
        },
        { time: "12:30pm", title: "Tan", kind: "food", bib: true,
          bibUrl: "https://guide.michelin.com/en/cn/shanghai-municipality/shanghai/restaurants/bib-gourmand",
          note: "Yu Garden precinct. Walk, ~10 min from Fangbang Middle. Have the concierge confirm it opens on Mondays before you set off; small kitchens take a weekly rest day and this one's schedule was not independently confirmed.",
          map: "https://maps.google.com/?q=Tan+Sichuan+Yu+Garden+Shanghai",
          expand: {
            label: "About the kitchen, and why it's new to the list",
            body: `<p>Tan opened in the Yu Garden precinct in 2025 and picked up a Bib Gourmand within its first year, one of eight new additions to the 2026 Shanghai list. It's run by the team behind The BRIDGE in Chengdu, widely regarded as one of the reference kitchens for serious Sichuan food outside Sichuan itself, which is a real pedigree rather than a marketing line. Order two or three small plates rather than a set menu: mapo tofu, made properly numbing rather than just hot, shuizhuyu, fish poached in chilli oil, and fuqi feipian, a sliced beef and offal salad in an aggressively fragrant dressing, are the three dishes reviewers keep returning to, and all three are sized for one person to order alongside just one other dish. Prices sit at ordinary Yu Garden levels, which makes the kitchen's actual quality a genuine surprise for the neighbourhood. It is also, this week, the only thing standing between you and eight days of wheat and river fish, so order the numbing one.</p>`

        { time: "2:00pm", title: "City God Temple", kind: "explore",
          note: "249 Fangbang Middle Rd. Walk, ~10 min. Open Mondays, 8:30 to 4:30, unlike almost everything else in this city today. Active place of worship, Ming foundation. Sit for ten minutes.",
          map: "https://maps.google.com/?q=Shanghai+City+God+Temple",
          expand: {
            label: "What it is",
            body: `<p>The City God Temple, or Chenghuang Miao, has stood at roughly this spot since 1403, dedicated to the Taoist deity believed to protect the city and oversee the moral conduct of its residents, a role something like a municipal magistrate for the afterlife. It was badly damaged during the Japanese occupation and again during the Cultural Revolution, and the buildings standing today are largely a 1990s reconstruction, though the temple has functioned as an active place of worship more or less continuously since. Incense smoke, offerings of fruit and paper money, and a steady trickle of older worshippers rather than tour groups. It gives the old town a genuine centre of gravity that Yu Garden, for all its polish, doesn't quite have, and today the garden is shut anyway.</p>`
          }
        },
        { time: "3:00pm", title: "The walk back, or don't", kind: "rest",
          note: "~25 min north on foot, or a DiDi in ten. Nothing further planned before dinner, and dinner is the biggest thing on the page." },
        { time: "6:30pm", title: "Wang Bao He", kind: "food", state: "open",
          note: "603 Fuzhou Rd, ~12 min walk from the hotel. Founded 1744, which makes it older than every Shanghai in the plane essay: it predates the concessions by a century, which is why it is on this day and not another one. Whole steamed hairy crab, ginger vinegar, warm Shaoxing. Concierge to confirm two things before you go: that they will seat one, and what a single male crab actually costs, because the room leans banquet and the pricing is not always on the menu.",
          map: "https://maps.google.com/?q=603+Fuzhou+Road+Shanghai",
          expand: {
            label: "Why whole crab, and why alone",
            body: `<p>A bowl of crab roe noodles, which is Saturday's dinner, is crab that somebody else has already picked for you. It is a magnificent thing and it is not the same experience. Whole crab is forty-five minutes of work: the shell off, the roe out with a spoon, the legs cracked and worked through, the vinegar for the sweetness, the ginger and the warm yellow wine for the cold, because the crab is cold in the Chinese medical sense and the wine is not a pairing, it is a correction. It is also, structurally, the easiest banquet dish in Chinese food to eat by yourself: one animal, one person, nothing to share and nothing to negotiate. Male crab in the tenth lunar month, which is this week, is the one you want; the roe is the whole point.</p>
<p>The risk is honest. Wang Bao He has been at this address since 1744 and has spent the last thirty years drifting toward the tourist end of its own history, and the back-pocket note in April already flagged it as leaning banquet. Confirm the format before you commit. If it comes back as a set menu only, or if the number is absurd, let it go and take Saturday's noodles as the week's crab. This is worth attempting and it is not worth defending.</p>`
          }
        }

      id: "d4", dow: "Tuesday", date: "27 October", chapter: "IV",
      arc: "Gallery Circuit · I of II",
      title: "Behind Which Door the Work Is Made",
      essay: `<p>A working artist's studio is not a gallery.</p>
<p>In a gallery the work has been chosen, framed, priced and lit; you are seeing what has already been decided about it. In a studio the work is still being made, which means the room contains a version of a thing that does not yet know what it is going to be. To walk into that room is to be given, briefly, the private phase of the making. Almost nobody who visits a city as a tourist ever sees it.</p>
<p>Shanghai's gallery scene has, over the past decade, developed a genuinely useful convention. The serious primary-market galleries, the ones that represent artists rather than resell them, will, if asked in the right way, arrange a studio visit. It is not a service they advertise. Capsule at 275 Anfu Road, in a 1930s garden house behind an unmarked gate, is the gallery most consistently willing to do this. Enrico Polato, who founded it in 2016, is a working curator with genuine relationships to his artists. The gallery is by appointment in any case, which means the visit is already conducted at a different register from a walk-in.</p>
<p>Tuesday is the first day of the week these galleries are actually open; most of the serious ones in Shanghai keep the same Tuesday-to-Saturday rhythm as galleries everywhere, closed Sunday and Monday. It is also the day the map cooperates, if you let it. Capsule is on Anfu Road, so the walk down Anfu and Wukang happens the moment you step out of the gate rather than as a separate expedition doubled back to later in the afternoon. From there the day runs in a single line northeast, Jinxian to North Shaanxi to Nanjing West, and never crosses its own path once.</p>`,

            body: `<p>This is a small shop, easy to miss from the street, that has been packed since it opened about twenty years ago. The crab roe xiaolongbao is what draws the queue, and in hairy crab season, which this week sits inside, the kitchen loads wontons and spring rolls with crabmeat as well as the standard dumplings, so it's worth ordering a mixed plate rather than committing to one thing. The plain pork soup dumplings are the reliable fallback if the crab versions have sold out. Kitchen visible from the pavement, a handful of stools at the window facing in, genuinely easy to eat here alone, nobody blinks at a single diner mid-morning.</p>`

          map: "https://maps.google.com/?q=275+Anfu+Road+Shanghai",
          expand: {
            label: "How to try for a studio visit, and how not to overstate it",
            body: `<p>Write from New Zealand at least three weeks out. Address the email to Enrico Polato and the gallery team. Mention two specific roster artists whose work you are interested in; Pixy Liao (Shanghai-born, Brooklyn-based, autobiographical photography) or Gao Yuan (Kunming-born, Beijing-based, mixed-media) are both plausible names to raise, though neither is guaranteed to be in Shanghai that week. Ask whether a studio visit might be possible during 24 October to 1 November. Explain briefly what you do and why you're interested. Be honest with yourself about the odds: this is a real, occasionally-granted courtesy from a small gallery, not a bookable product, and there is a genuine chance the answer is no or simply doesn't get a reply in time. If it doesn't happen, the gallery itself is still worth the visit, Capsule's own programme is one of the best in the Concession.</p>`

        { time: "12:15pm", title: "The walk to lunch", kind: "explore",
          note: "On foot, ~20 min northwest: Anfu, across Wulumuqi, onto Changshu. You come out of Capsule onto Anfu Road anyway, so this is a walk rather than a stop. It deliberately does not go to the Wukang Mansion corner, which is four minutes the other way and is the single most photographed junction in the old Concession, which is reason enough on this trip.",
          map: "https://maps.google.com/?q=Anfu+Road+Changshu+Road+Shanghai" },
        { time: "12:45pm", title: "Xibo", kind: "food",
          url: "https://maps.google.com/?q=83+Changshu+Road+Shanghai",
          note: "83 Changshu Rd, Jing'an. Lunch 12:00–2:30, dinner 6:00–11:00, daily. Xinjiang: cumin lamb over charcoal, hand-torn flatbread, lamb chops, the fried pie stuffed with lamb and onion, marinated wild chives. Salty milk tea if it is on. The owner is from the region. This is the one meal of the week that is not Jiangnan, and after four days of wheat and river fish it is the only correction on the page.",
          map: "https://maps.google.com/?q=83+Changshu+Road+Shanghai",
          expand: {
            label: "Why this is here and not somewhere else",
            body: `<p>The Bib Gourmand list that shapes most of this week is a list of Jiangnan counters: wheat, pork, river fish, sugar in places you would not expect it. It is an excellent filter and it has one blind spot, which is everything west of about Xi'an. Xinjiang cooking is as far from Shanghainese as Chinese food gets, and not by a little: lamb rather than pork, charcoal rather than braise, cumin and chilli and coriander seed rather than soy and rock sugar and rice wine, flatbread rather than noodles, and a Central Asian lineage that runs toward Samarkand rather than down the Yangtze. A week of one thing at a high level stops registering as a high level by about day four. This is the reset, and it lands on the day the map allows it, a kilometre from where the morning ends.</p>`

        { time: "3:00pm", title: "BANK / MABSOCIETY", kind: "culture",
          url: "https://bankmabsociety.com/",
          note: "White Building 5F, 457 North Shaanxi Rd, Jing'an. Tue-Sat 10:30am-6:30pm. DiDi from Jinxian Rd, ~10 min. Mathieu Borysevicz's gallery, moved here in 2024.",
          map: "https://maps.google.com/?q=457+North+Shaanxi+Road+Shanghai",
          expand: {
            label: "About the gallery",
            body: `<p>Mathieu Borysevicz, an American curator and filmmaker who has lived in Shanghai since the early 2000s, opened BANK in 2013 as MABSOCIETY before folding the two names together. The gallery has moved twice, first from a former bank building on the Bund (the source of the name) to a space near Fuxing Park, and now to the fifth floor of the White Building, a 1930s heritage block on North Shaanxi Road once occupied by the family of the Hong Kong tycoon Robert Hotung. The programme mixes emerging Chinese artists with a smaller roster of international names, and Borysevicz himself is often around and willing to talk about the current show if you ask.</p>`

        { time: "6:30pm", title: "Rongjia Yellow Croaker Noodle", kind: "food", bib: true,
          bibUrl: "https://guide.michelin.com/en/shanghai-municipality/shanghai/restaurant/rongjia-noodle-soup-with-yellow-croaker",
          note: "Room L105A-1, 688 Nanjing West Rd, Jing'an. Open daily. ~15 min walk from BANK, or Line 2/12/13 to West Nanjing Road, exit 5. This is the week's croaker bowl and it is the right one: ask for the wild small croaker from the East China Sea rather than the standard farmed Dachen version if it is on.",
          map: "https://maps.google.com/?q=688+Nanjing+West+Road+Shanghai",
          expand: {
            label: "About the shop",
            body: `<p>Rongjia is the casual sibling of Xin Rong Ji, the one-Michelin-star Taizhou seafood house, and draws its yellow croaker from the same supplier network, which is the reason a shop this modest can serve fish this good. The signature bowl comes two ways: a limited version using small wild croaker from the East China Sea, more expensive and more delicately flavoured, and a standard version using farmed croaker from Dachen Island, which is the one most people order and is entirely satisfying on its own. The broth is a thick, milky fish stock, finished with a sheet of egg and a few pickled vegetables on the side. The room is clean and a little more formal-looking than the week's other counters, but the seating includes small two-tops that work fine solo, and it's a single bowl ordered per person, not a shared-plate kitchen.</p>`

    {
      id: "d5", dow: "Wednesday", date: "28 October", chapter: "V",
      arc: "Gallery Circuit · II of II",
      title: "An Inland Waterway",
      essay: `<p>Suzhou Creek is the river Shanghai was actually built on, unglamorous next to the Huangpu but the one that mattered first.</p>
<p>Before the Bund existed, the creek carried the cotton and silk of the Jiangsu hinterland into the port, and the manufactories that grew along its banks between 1860 and 1937 produced the industrial base of what became modern China. The best of those buildings are still standing near Moganshan Road, and at the far western end, in an old textile mill complex, someone had the idea in 2000 to let contemporary artists rent studio space by the square metre. M50 was supposed to be demolished. It never was.</p>
<p>What survived is rougher than the Concession galleries, larger, more experimental. Antenna Space, on the second floor of Building 17, represents a roster whose work is difficult in a way that rewards patience. ShanghART in Building 16 has been there since the mill became galleries and is the closest thing Shanghai has to a foundational contemporary art institution.</p>
<p>Shanghai's big two annual fairs, West Bund Art & Design and Art021, land in mid-November this year, after this trip, not during it. That means these rooms will be quiet this week in a way they will not be in a fortnight. Worth knowing, and worth using. The other constraint is the light. Sunset is at 4:56 and the creek path from M50 down to the Waibaidu Bridge is ninety minutes, so it starts at half past two or it happens in the dark, and a derelict industrial waterway in the dark is just a dark walk.</p>`,
      events: [
        { time: "9:00am", title: "A Niang Mian Guan", kind: "food", bib: true,
          bibUrl: "https://guide.michelin.com/en/cn/shanghai-municipality/shanghai/restaurants/bib-gourmand",
          note: "36 Sinan Rd. Opens 8am, reliably sold out by early afternoon, which is why the day starts on the wrong side of town from where it is going. DiDi, ~20 min. On the Bib list since 2017.",
          map: "https://maps.google.com/?q=36+Sinan+Road+Shanghai",
          expand: {
            label: "About the shop",
            body: `<p>A Niang has been a Bib Gourmand every year since the Shanghai guide began recognising the category, and the reason is a single dish: huangyu mian, eel noodles, made with a butterflied, deep-fried eel dressed in a slightly sweet dark sauce and laid over a bowl of soup noodles. The broth arrives on the side, so you can pour it in for a wetter bowl or eat the noodles dry with just the eel sauce; both are how regulars order it. Around fifteen stools, no English menu, but the eel bowl is really the only order that matters, so pointing at the picture on the wall or saying "huangyu mian" gets you exactly what you came for.</p>`
          }
        },
        { time: "10:00am", title: "Sinan Mansions garden", kind: "explore",
          note: "Sinan Rd, ~5 min walk. A courtyard in the French Concession that is somehow quiet, in a neighbourhood where nothing is. Free. Twenty minutes with a coffee, then go north. It sat unused in April's back pocket for ten days.",
          map: "https://maps.google.com/?q=Sinan+Mansions+Shanghai" },
        { time: "11:00am", title: "Antenna Space", kind: "culture",
          url: "http://antenna-space.com/en/",
          note: "Room 202, Building 17, 50 Moganshan Rd, Putuo. Tue-Sat 11am-6:30pm. DiDi from Sinan Rd, ~25 min, no changes, and the metro alternative runs closer to forty minutes door to door once you account for the change at People's Square.",
          map: "https://maps.google.com/?q=Antenna+Space+M50+Shanghai",
          expand: {
            label: "About the gallery",
            body: `<p>Simon Wang opened Antenna Space in 2013 after several years working at other Shanghai galleries, and built a roster around artists making work that resists an easy sales pitch: video, installation, and sculpture that asks for time in the room rather than a quick read. Yu Honglei and Guan Xiao, both included in recent editions of the Shanghai Biennale, are the two names most likely to have work up on any given visit. The space itself is unglamorous, a converted mill floor with concrete columns and minimal lighting design, which is more or less the house style across M50, and is part of why the district still feels like a working art district rather than a finished one.</p>`
          }
        },
        { time: "12:00pm", title: "ShanghART and the M50 complex", kind: "culture",
          url: "http://www.shanghartgallery.com/",
          note: "Building 16, 50 Moganshan Rd. Park open daily; individual galleries generally Tue-Sun, so Wednesday is a safe day for all of them. Walk the whole complex, no fixed order: Vanguard, EastLink, OFOTO, Chronus. Map at the north gate.",
          map: "https://maps.google.com/?q=M50+Creative+Park+Shanghai",
          expand: {
            label: "About ShanghART, and the wider complex",
            body: `<p>Lorenz Helbling, a Swiss art dealer, opened ShanghART in 1996, before most of the artists it now represents had left art school, and before M50 existed as a gallery district at all; the gallery moved here when the mill complex opened to studios in the early 2000s. Its roster reads as a rough who's who of the generation that built Chinese contemporary art's international reputation: Ding Yi, Zhang Enli, Yang Fudong, Sun Xun. The gallery occupies two full floors of Building 16 and shows both established names and younger artists it has picked up more recently. The smaller galleries scattered through the rest of the complex, Vanguard, EastLink, OFOTO for photography, Chronus for a rotating mix, are inconsistent by nature, some closed, some between shows, and the only way to find the good one is to walk past all of them.</p>`
          }

      id: "d6", dow: "Thursday", date: "29 October", chapter: "VI",
      arc: "A slower day",
      title: "Someone Else Doing the Cooking",
      essay: `<p>Shanghainese home cooking is a genre almost impossible to eat in a restaurant.</p>
<p>Restaurants require dishes that hold at temperature and travel from the pass to the table, which optimises out most of the classic ben bang preparations: the slow-simmered pork belly, the drunken chicken steeped overnight, the river shrimp stir-fried in ninety seconds and served immediately. What people actually cook at home requires a home, and someone to cook it, and a small enough gathering that the timing can be controlled by one person.</p>
<p>There is a version of this sold to visitors as a private chef, or a dinner in a local family's apartment, and it mostly does not exist as an off-the-shelf product in Shanghai, whatever the listings imply. What does exist is a cooking class held in an actual apartment rather than a commercial teaching kitchen, and that is a substitution, and it should be named as one rather than dressed up. It is not a home-cooked dinner arranged for you. It is a few hours in someone's kitchen with your hands in the dough. As it happens the substitution suits a man travelling alone better than the thing it substitutes for, because there is something to do with your hands and no table of strangers to negotiate.</p>
<p>The rest of the day stays light on purpose. A late-morning museum, a long lunch break, nothing scheduled between two and five. After five days of walking, the trip can afford an afternoon that goes nowhere at all.</p>`,

        { time: "9:30am", title: "Slow start, no alarm", kind: "rest",
          note: "Breakfast at the hotel or the four warriors off Yunnan South Rd a second time, now that you know what to point at. Nothing fixed for the morning. This is the only unstructured morning in the week and it is deliberate." },
        { time: "11:00am", title: "Shanghai Museum East", kind: "culture", state: "open",
          url: "https://www.shanghaimuseum.net/en/mus-east",
          note: "1952 Century Blvd, Pudong. Closed Mondays; Thursday is a normal open day. DiDi, ~30 min through the tunnel; the metro (Line 6 or 7 to Century Avenue, then a walk) is comparable in time but involves at least one change. Timed entry: book via the museum's WeChat mini-program a day ahead, or ask the concierge.",

          expand: {
            label: "About the branch",
            body: `<p>The Shanghai Museum's People's Square building, opened in 1996, has been the city's main repository of bronze, ceramic and calligraphy for thirty years and is genuinely excellent, which is exactly why the East branch matters: rather than duplicating that collection, the Pudong building, opened in phases from 2023 to 2024, was built to hold material that had been in storage for lack of space, alongside a dedicated gallery of Chinese antiquities repatriated or purchased back from overseas collections. The bronze holdings on the ground floor include Warring States period vessels that hadn't been on public display in decades. It's a larger, more modern building than the original, with none of the queueing culture that's built up around the People's Square branch, worth knowing if you'd rather see this collection without a crowd.</p>`
          }

        { time: "1:30pm", title: "Lunch near the museum", kind: "food",
          note: "Counters in the Century Ave underground mall, five minutes' walk. This is a mall lunch and there is no way around it: Pudong does not do the thing the rest of this week does, and pretending otherwise would mean a forty-minute round trip for a bowl of noodles. Eat lightly. Dinner is a class." },

          note: "In a family apartment, French Concession area, exact address sent after booking. DiDi from the hotel, ~20 min. This is dinner as well as the activity.",

            label: "The practical side",
            body: `<p>It typically includes a wet-market stop, a hands-on dumpling-folding session, and a shared meal of what gets made. Solo bookings are accepted, but some operators ask you to confirm ahead if you're travelling alone rather than as a pair, since the class is priced and staffed per group. Book at least three weeks out and confirm the solo rate at the same time rather than discovering it at the door. Once you have landed, the concierge can re-confirm by phone, which local operators often prefer to an email from a foreign address.</p>`

      id: "d7", dow: "Friday", date: "30 October", chapter: "VII",
      arc: "A slower day",
      title: "The House on Amherst Avenue",
      essay: `<p>There is a version of closed-door access sold to visitors in Shanghai that promises private entry to shuttered heritage buildings: the Astor House, the old synagogues, the Cercle Sportif.</p>
<p>Most of it does not really exist as a systematic, bookable thing. What is real, in this particular corner, is smaller and requires no booking at all: the actual streets Ballard wrote about are still there, still findable, and the walk to them is free.</p>
<p>Xinhua Road, in the far western reach of the old French Concession, was Amherst Avenue before 1949. The Ballard family house, the one the plane essay described him returning to in the 1990s, is somewhere on this street, still standing, still subdivided into apartments the way he found it. The exact number is not worth pinning down here; better to walk the street itself and take in the general run of 1920s and 30s villas than to hunt a single door. Nobody runs a tour of this. You go and look, from the pavement, the way any resident's neighbour would.</p>
<p>The afternoon anchors on something real and freshly timed. Rockbund's new commission, stuck in movement (in the tide) by the Macau-born, Rio-based artist Jota Mombaça, opened on the 22nd of October, two days before you landed, and runs through February. Rockbund is closed Mondays only, so Friday is a normal open day. The 30th is eight days after the opening, which is the second week: after the opening crowd has gone and before the museum settles into a fixed run of public programming around it, which is the least worn-in a show ever is.</p>
<p>Then a drink in the room where the taipans drank, seated by seniority, the most senior nearest the door. Ballard's father ran a textile company in this city and would have known that room, or one exactly like it. It is the right hour and the right seat for the day that is in it.</p>`,

          note: "Da Hu Chun again if the Saturday queue put you off it, or the four warriors off Yunnan South Rd. Both are about twenty minutes on foot and both are better the second time, when you know what to point at and how to ask for it." },
        { time: "10:30am", title: "Xinhua Road, on foot", kind: "explore",
          note: "Former Amherst Avenue, western French Concession. DiDi, ~25 min. A residential road of 1920s and 30s villas, still lived in, still unrestored in the way the Wukang corner is not. No fixed address beyond the street itself. Walk it slowly and look at the houses as houses, not exhibits.",
          map: "https://maps.google.com/?q=Xinhua+Road+Shanghai",
          expand: {
            label: "Why this street",
            body: `<p>Xinhua Road runs for about a kilometre through what was, before 1949, one of the most desirable residential pockets of the International Settlement's western extension: garden villas built for taipans and diplomats on generous plots, unlike the terraced lane houses that make up most of the old Concession. J.G. Ballard's family lived on this street, then called Amherst Avenue, until the Japanese occupation forced them into Lunghua internment camp in 1943, the experience that became Empire of the Sun. Ballard returned in the 1990s and found the house still standing, subdivided, lived in by families with no particular knowledge of who had been there before them, which he wrote about as a kind of grace rather than a loss. The street today is much as he found it then: residential, ungentrified, unmarked. There is no plaque. That is more or less the point of coming.</p>`

        { time: "3:00pm", title: "Rockbund Art Museum", kind: "culture",
          url: "https://www.rockbundartmuseum.org",
          note: "20 Huqiu Rd, Huangpu. Closed Mondays, open every other day of the week. DiDi from Xinhua Rd, ~30 min. From the hotel it is ~25 min on foot, not the ten it looks like on a map.",
          map: "https://maps.google.com/?q=Rockbund+Art+Museum+Shanghai",
          expand: {
            label: "About the show",
            body: `<p>Jota Mombaça is a Macau-born, Rio de Janeiro-based artist working across performance, writing, and installation, with a practice built around questions of colonial violence, water, and bodies in transit, which makes the Bund a loaded place to install it. Stuck in movement (in the tide) is a new commission for Rockbund's ground and upper floors, opening 22 October 2026 and running through 21 February 2027. Rockbund itself occupies the 1932 Royal Asiatic Society building, one of the few pre-1949 gallery interiors in the city that survives more or less intact, so the container deserves as much attention as the work inside it. The Society was the cultural institution the International Settlement built to give its merchant population a sense of intellectual credibility, and it is now showing an artist whose subject is what that arrangement cost.</p>`
