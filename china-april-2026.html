<style>

}

      full: `<p>Two long-haul flights with a Guangzhou transit. First entry immigration in China takes 45&ndash;60 minutes regardless of queue. By the time bags are collected and you reach the hotel it will be close to midnight. There is nothing to do in Shanghai that first night. The city is patient.</p>

    {
      id: "d2", iso: "2026-04-03", hood: "The Bund", hoodShort: "Bund", dow: "Friday", date: "3 April", chapter: "II",
      arc: "Shanghai &middot; I",
      title: "Soft landing",
      teaser: "The Bund announces itself at its own pace. Let it.",
      essay: `<div class="essay-pull">&ldquo;Shanghai is the city China shows the world. The question worth carrying all week is what it shows itself.&rdquo;</div>
<p>You arrived past midnight and the instinct will be to get out early and prove something. Resist it. The Bund is 15 minutes by DiDi. Rockbund is directly behind it and happens to be the same neighbourhood where Sunday&rsquo;s city walk starts &mdash; useful early orientation.</p>
<p>There is a passage early in <em>Empire of the Sun</em> &mdash; you are perhaps fifty pages in &mdash; where eleven-year-old Jim, newly separated from his parents in the chaos of the Japanese occupation, walks back through the deserted International Settlement. The Packards are gone. The cocktail parties have stopped. The White Russian doormen have evaporated. The city that was stage-set for his parents&rsquo; social calendar has simply revealed itself as something else: real, vast, indifferent to the concerns of the people who thought they owned it. What Ballard captures is that Jim is not frightened. He is, for the first time, paying attention. The city has been there all along. He has just, until now, been looking past it.</p>
<p>You will have a version of this experience this morning, minus the occupation. You arrived after midnight into a city of 26 million people and you have not yet seen any of it. The Bund is fifteen minutes by DiDi. Go.</p>
<h3>How a fishing village became the most interesting city in the world</h3>
<p>The compressed version, because you need it to make sense of everything you&rsquo;ll see this week: Shanghai was a minor cotton-trading port at the mouth of the Yangtze Delta until 1842, when Britain concluded the First Opium War and forced China to open five coastal cities to foreign commerce. The Opium Wars are worth understanding because they are the foundational grievance that underpins almost everything China does geopolitically today, and because their logic is so nakedly cynical it still has the power to startle. Britain had a trade deficit with China &mdash; buying enormous quantities of tea, porcelain, and silk &mdash; and couldn&rsquo;t find anything Chinese consumers wanted in exchange. A British trader in Calcutta solved the problem by flooding China with Indian opium. When the Chinese government seized and destroyed twenty thousand chests of it in 1839, Britain went to war to protect the right to keep selling drugs to Chinese people. Won. Extracted trading rights, reparations, and the principle &mdash; enshrined in what China still calls the &ldquo;unequal treaties&rdquo; &mdash; that foreigners in China would be governed by their own laws, not Chinese ones.</p>
<p>That last clause built Shanghai. The foreign concessions that took shape over the following decades were self-governing zones in the middle of a sovereign country. The International Settlement &mdash; British and American, later joined by most of the world &mdash; covered the Bund and the commercial grid behind it. The French had their own concession to the south, where they planted plane trees and built a residential neighbourhood that still has a faintly Mediterranean quality. In these concessions, Chinese law did not apply. Foreign courts heard foreign cases. The arrangement was called &ldquo;extraterritoriality&rdquo; and it was, by any honest accounting, a form of occupation conducted with paperwork rather than garrisons.</p>
<p>What happened inside that arrangement was extraordinary. Between 1842 and 1941, Shanghai became one of the five most important cities on earth. The most sophisticated financial centre in Asia. White Russians arrived in waves after 1917, bringing their restaurants and their violins and their particular gift for melancholy. Sephardic Jewish traders &mdash; the Sassoons, the Kadoories &mdash; built the great Art Deco towers on the Bund with fortunes made in the opium trade and diversified into cotton, property, and hotels. German and Austrian Jews fleeing the Nazi persecution found that Shanghai was one of the only cities on earth that required no visa, no sponsor, no proof of anything, and twenty thousand of them arrived between 1933 and 1941, settling in the Hongkou district north of Suzhou Creek, opening cafés and delicatessens and small orchestras. The Chinese Communist Party held its first congress in 1921 in a shikumen house in what is now Xintiandi &mdash; you&rsquo;ll walk past the site tonight. The Green Gang ran opium distribution, protection rackets, and taxi-dance halls. When Chiang Kai-shek wanted the Communists purged in 1927, he contracted the work to the Green Gang, and a thousand people died in a week. Noël Coward finished <em>Private Lives</em> at the Cathay Hotel in 1930 while recovering from flu. Ballard&rsquo;s family lived in Amherst Avenue in the French Concession, attended cocktail parties on Saturday nights, and drove past beggars every morning.</p>
<div class="essay-aside"><strong>Then 1949</strong>On May 25th, the People&rsquo;s Liberation Army marched into Shanghai. Within months, every foreign business, every foreign resident, and every institution that had defined the city&rsquo;s cosmopolitan character was gone. The jazz clubs closed. The racetrack became a public park &mdash; it&rsquo;s still there, called People&rsquo;s Square, with the Shanghai Museum sitting roughly where the finish line used to be. For thirty years, Shanghai was a city that had been switched off. Not destroyed &mdash; the buildings survived &mdash; but dormant. Then 1990: Deng Xiaoping designates Pudong a Special Economic Zone and switches it back on. What you see across the river this morning is thirty-five years of that decision running at full speed.</div>
<h3>The two waterfronts</h3>
<p>Stand on the Bund with your back to the river and look west. Thirty-two buildings, mostly between 1900 and 1937, built to house the commercial infrastructure of Western capitalism in Asia: the Hong Kong and Shanghai Bank, the Customs House (whose clock tower has kept time since 1927), the Fairmont Peace Hotel where Wallis Simpson and Charlie Chaplin both stayed. These buildings were designed to communicate permanence and the invincibility of Western capital in Asia. The people who built them expected to be here forever. They were gone within a generation. Now turn around. The skyline across the Huangpu &mdash; the corkscrew of the Pearl Tower, the tapered glass of the Shanghai Tower (the world&rsquo;s second-tallest building), the bottle-opener silhouette of the World Financial Centre &mdash; is thirty-five years old. Pudong was rice paddies in 1990. The Chinese state built a rival skyline in a generation, deliberately, as a statement. The message is not subtle: we can do this too, faster, without asking anyone&rsquo;s permission, and we didn&rsquo;t have to sell anyone drugs to fund it. The two waterfronts are in permanent pointed dialogue across the Huangpu. No guide required to feel the argument.</p>
<h3>Rockbund and what it tells you</h3>
<p>The building you&rsquo;ll visit this morning &mdash; the Rockbund Art Museum at 20 Huqiu Lu &mdash; is the former Royal Asiatic Society, completed in 1932. The RAS was the cultural institution the International Settlement built to give its merchant population a sense of intellectual credibility: lectures, a natural history collection, a library, the pretence of scholarship. Stand in the entry hall and notice the quality of light and proportion. These rooms were built for men in suits who expected to be here for centuries. The building has outlasted them, the settlement, and three political systems, and is now showing contemporary Chinese art. That particular irony &mdash; the colonial infrastructure repurposed by the culture it was designed to manage &mdash; is worth sitting with. It is also, incidentally, where Sunday&rsquo;s Monster Day Tours walk begins. Come here first and the streets will feel pre-loaded with context when the guide arrives.</p>
<h3>This evening: why Xintiandi is more interesting than it looks</h3>
<p>Xintiandi is ten minutes on foot from the Pullman. Before you arrive this evening, it&rsquo;s worth understanding what you&rsquo;re walking into. In the mid-1990s, the Hong Kong developer Shui On Group acquired twenty-three blocks of dense, deteriorating shikumen housing in the old French Concession. The standard approach in 1990s Shanghai was demolition &mdash; the economics of land in central Shanghai, the government&rsquo;s desire for modern infrastructure, the perceived backwardness of pre-Liberation housing stock. Shui On made a different argument: that the stone facades, the lane networks, the architectural texture of the neighbourhood could be preserved and given commercial purpose. The government agreed. What opened in 2001 was the first major historic preservation development in modern China, and a template that has since been replicated across the country.</p>
<p>The shikumen gates are original. The grey brick, the heavy timber doors, the characteristic arched stone frames that give the buildings their name &mdash; all real, all restored. The interiors have been gutted and replaced with restaurants, boutiques, and bars. The residents were relocated. The people who come now are the Chinese upper-middle class and international visitors in roughly equal measure, which is its own statement about how Shanghai has moved. At night, lit by low lanterns, with the plane trees overhead and the crowd doing its evening drift through the lanes, it is genuinely beautiful. It is also, one remove back, a kind of museum to a way of living that the modernisation of Shanghai has almost entirely erased. Every city makes choices about what to preserve and what to demolish. Xintiandi is Shanghai&rsquo;s most deliberate one.</p>
<p>Dinner at Polux, inside the North Block: Paul Pairet, the French chef behind Ultraviolet, opened this bistro as his stated rejection of the concept restaurant. A café, he said. Simple. By which he means the complexity is entirely hidden. The French onion soup has been engineered. The burger patty sits in a hollowed bottom bun designed to fit it exactly. The steak tartare echoes Mr &amp; Mrs Bund, simplified and freed of ceremony. Book the terrace if you can. After dinner, walk the lanes. North Block to South Block. The shikumen doorways are at their best after dark. One drink somewhere with outdoor seating. Tomorrow&rsquo;s tour starts at 7:45am &mdash; be in bed by eleven.</p>
<div class="essay-links"><a href="https://www.newyorker.com/magazine/2015/04/06/born-red" target="_blank" rel="noopener">Born Red &mdash; Evan Osnos on Xi Jinping (New Yorker, 2015)</a><a href="https://www.smartshanghai.com/venue/15993/polux_taicang_lu" target="_blank" rel="noopener">Polux &mdash; SmartShanghai listing</a></div>`,

        { time: "2:30pm", title: "Xintiandi (新天地) &mdash; or branch here", kind: "explore",

          expand: { label: "Choose your afternoon &mdash; three directions from Huangpu, near the hotel", body: `<p><strong>Call it</strong> (hotel, 10 min walk) &mdash; Back to the Pullman. Bath, read, nap. The Bund at dusk at 8pm is the only remaining ambition and it&rsquo;s a low bar to clear. Seesaw Coffee at Xintiandi is ten minutes if you need one more coffee first. Being rested tomorrow is worth more than another gallery today.</p><p><strong>Wander</strong> (Fuxing Park, 20 min walk south) &mdash; Walk into the French Concession without a destination. Fuxing Park is 20 min on foot &mdash; a French-era park where locals do ballroom dancing to portable speakers, chess on stone tables, tai chi in the rose garden. Sit for a while. Then pick any side street and follow it. Come back to the Bund at dusk. <a href="https://maps.apple.com/?q=Fuxing+Park,+105+Fuxing+Middle+Road,+Shanghai" target="_blank" rel="noopener">Map</a></p><p><strong>Off-map</strong> (Yangpu waterfront, 25 min DiDi) &mdash; Take a DiDi to the Yangpu Binjiang industrial waterfront. Former wharves and warehouses the renovation projects haven&rsquo;t reached. Nobody from the hotel&rsquo;s world. Walk the river from the other direction entirely. Come back by DiDi when it feels right &mdash; find whatever grill is smoking near the hotel at 8pm and eat on the street. You will almost certainly be the only foreigner there. <a href="https://maps.apple.com/?q=Yangpu+Binjiang+Waterfront,+Shanghai" target="_blank" rel="noopener">Map</a></p>` } },

      essay: `<div class="essay-pull">&ldquo;The wet market is the most honest place in Shanghai. Everything upstream from here &mdash; the restaurants, the menus, the Michelin stars &mdash; depends entirely on what happens in this room at six in the morning.&rdquo;</div>
<p>The breakfast tour drops you into the French Concession&rsquo;s food culture at street level &mdash; wet markets, the spots the neighbourhood actually eats at, the vendors that have nothing to do with the polished Huaihai Rd shopfronts. Power Station of Art is the deliberate gear change: from the intimate scale of lane house yards to the vertiginous interior of a building that used to generate electricity for the whole city. Qingming Festival runs Apr 4&ndash;6 &mdash; a major public holiday. Parks are more animated than usual. Look out for qingtuan &mdash; green rice dumplings flavoured with wormwood, filled with red bean paste. A genuinely seasonal thing only available in early April.</p>
<p>Today is structured around a contrast that is the whole shape of Shanghai compressed into one day: the wet market and lane house scale of the morning food tour, then the vertiginous industrial interior of the Power Station of Art in the afternoon. Both are the real city. They just operate at completely different registers, and the juxtaposition is the point.</p>
<p>The UnTour Street Eats breakfast tour is three hours in the French Concession at street level &mdash; wet markets, the spots the neighbourhood actually eats at, vendors with no English menu and no tourist markup. By 11am you will understand the food logic of a Shanghai neighbourhood in a way that no guidebook achieves. The &ldquo;four heavenly kings&rdquo; of Shanghai breakfast &mdash; you&rsquo;ll encounter all of them: cifantuan (glutinous rice balls wrapped around crullers and pickled vegetables), youtiao (fried dough sticks), jianbing (the Chinese crepe being assembled fresh in front of you), and doujiang (sweetened soy milk from a vat). Soup dumplings. Hand-pulled noodles in under a minute. Arrive genuinely hungry &mdash; you will not need to eat again until this evening.</p>
<h3>Qingming and what it means that China still does this</h3>
<p>Today is Qingming Festival (清明节) &mdash; Tomb-Sweeping Day &mdash; one of China&rsquo;s major public holidays and one of its most ancient. For 2,500 years, Chinese families have spent this day visiting the graves of their ancestors: cleaning the stones, leaving food and flowers, burning paper offerings &mdash; paper money, paper iPhones, paper houses &mdash; to send goods to the dead through smoke. The practice was suppressed during the Cultural Revolution and reinstated as an official public holiday in 2008. The Communist Party, which spent a significant portion of its first three decades trying to break the back of traditional Chinese culture, eventually recognised that ancestor veneration was too deeply embedded in Chinese identity to abolish. You can ban the practice; you cannot remove the instinct.</p>
<p>What Qingming shows you is something important about the relationship between Chinese identity and time. In Western secular culture, the dead recede into the past. In Chinese tradition, the relationship between the living and the dead is continuous and obligatory: you owe your ancestors care, and the failure to provide it has consequences. It survived Marxist materialism, the Cultural Revolution, and forty years of urbanisation because it answers a question that ideology cannot.</p>
<h3>The Power Station of Art and what it used to be</h3>
<p>The afternoon move to the Power Station of Art is a deliberate gear change. You will walk into a building with a 27-metre internal ceiling height that was, until 2007, generating electricity for this part of Shanghai. The Nanshi Power Plant was built in the 1930s on the west bank of the Huangpu. It operated for seventy years, survived the Japanese occupation and the Cultural Revolution and the Reform era, and was finally shut down in 2007 when the land was needed for the 2010 World Expo site. After the Expo it was converted into China&rsquo;s first state-owned contemporary art museum, which opened in 2012. The chimney &mdash; 165 metres, still standing &mdash; has become part of the Shanghai skyline.</p>
<div class="essay-aside"><strong>On the 15th Shanghai Biennale</strong>&ldquo;Does the Flower Hear the Bee?&rdquo; &mdash; 250+ works from 67 international artists, examining interspecies communication, plant consciousness, and the porous boundaries between nature and culture. The building is worth the visit regardless of what you think of the show. Free on weekends, closes 5pm &mdash; don&rsquo;t arrive after 3:30.</div>
<h3>The food logic of a city under pressure</h3>
<p>You run a rural buying co-operative in New Zealand. Walking through Shanghai&rsquo;s wet market this morning, you will be in the presence of a food distribution system serving 26 million people through centralised state logistics, small-scale private vendors, and informal networks evolved over centuries. China has 20% of the world&rsquo;s population and approximately 7% of its arable land. Food security is an existential preoccupation that runs through agricultural policy, foreign policy, and the state&rsquo;s relationship with rural communities in ways that have no Western parallel.</p>
<p>Tomorrow is a structured tour with a guide. Tonight, after the Power Station, find somewhere to eat near the hotel and rest. The week compounds.</p>

      essay: `<div class="essay-pull">&ldquo;The International Settlement was built to announce permanence. The skyline across the river is what China built when it decided to make the same announcement, without asking.&rdquo;</div>
<p>The morning tour covers the former International Settlement &mdash; the same neighbourhood where Rockbund sits, which you saw on Friday without the full context. By the time the guide is done, the Art Deco facades will make a different kind of sense. The afternoon move to Hongkou is deliberate: where the French Concession is leafy, where the Bund is monumental, 1933 is strange and slightly uncanny &mdash; largely off the tourist circuit, rougher, less reconstructed.</p>
<div class="essay-aside"><strong>Before you commit</strong>Confirm 1933 Shanghai is open before committing &mdash; occasional event closures. Check 1933shanghai.com. Monster Day Tours can be cancelled with 24h+ notice for a one-year credit.</div>
<p>Two days ago you walked the Bund as a visitor who had just arrived in China. This morning you walk it again, or rather the streets immediately behind it, with a guide who will explain what you were actually looking at. By 1:15pm, the Art Deco facades of the International Settlement will mean something specific to you rather than something vaguely impressive, which is the only way architecture is worth seeing.</p>
<h3>What the International Settlement actually was</h3>
<p>A brief note on the distinction that matters this morning, because it trips up most visitors: the International Settlement and the French Concession were two separate administrations with different histories, different characters, and different fates. The International Settlement &mdash; which covered the Bund and the grid of streets running north and west behind it &mdash; was governed by a joint municipal council of foreign powers, initially British and American, eventually joined by most of the industrialised world. The Shanghai Club on the Bund had the longest bar in Asia &mdash; 34 metres &mdash; and a seating arrangement in which the most senior members sat at the end closest to the door and the most junior at the far end. Status in the International Settlement was explicit and hierarchical and encoded in the built environment.</p>
<p>The French Concession, which you&rsquo;ve been walking through for two days, was different: residential, leafy, administered by French civil law, and chosen by wealthy Chinese families as the place to build their homes precisely because the legal framework offered more security of property than the Chinese-administered city. The Communist Party held its first congress there in 1921 &mdash; in a shikumen house in what is now Xintiandi &mdash; because the French police were less likely to raid it than the Chinese authorities.</p>
<div class="essay-aside"><strong>The Ballard connection</strong>In <em>Empire of the Sun</em>, Jim&rsquo;s family home is in Amherst Avenue &mdash; present-day Xinhua Lu &mdash; in the French Concession. The walk he takes after his parents disappear covers ground you have already walked: through the settlement, past the Bund, down to the waterfront.</div>
<h3>Why Pudong is the retort to all of this</h3>
<p>One of the most instructive exercises of the morning tour is to listen to the guide describe what the International Settlement was communicating &mdash; permanence, Western commercial dominance, the architecture of confident empire &mdash; and then think about Pudong. The Shanghai Tower, completed in 2015 at 632 metres, is the second-tallest building in the world and is, from the Bund, directly aligned with the Customs House. That alignment is not accidental.</p>
<p>From a New Zealand perspective, there is something worth holding in mind as you walk these streets: China is by far New Zealand&rsquo;s largest export market. The decisions made in the kind of buildings visible from the Bund ripple directly into the commodity prices that determine Farmlands shareholder returns.</p>
<h3>1933 and the afternoon detour</h3>
<p>The afternoon option in Hongkou &mdash; specifically 1933, the former municipal slaughterhouse &mdash; is the right complement to the structured morning. It was built in 1933 by a British architect (known only as &ldquo;Balfours&rdquo;), commissioned by the Shanghai Municipal Council as the largest abattoir in East Asia. The design is Gotham-Deco: Art Deco ornamentation on a poured-concrete industrial machine, five storeys of interlocking ramps, 26 &ldquo;air bridges&rdquo; of varying widths spiralling around a vertiginous central void. The windows all face west, toward the Buddhist holy land, to aid the reincarnation of the slaughtered animals. In the absence of beams, the building is supported by over 300 umbrella-shaped columns.</p>
<p>Tomorrow is the recovery day: spa at 2pm, and the Night Eats tour at 6pm. Rest well tonight.</p>

      essay: `<div class="essay-pull">&ldquo;Qingming means pure and bright &mdash; a description of the weather, not the mood. The festival is both solemn and alive. Families sweep the tombs, burn paper money, leave food. Then they go to the park.&rdquo;</div>
<div class="essay-aside"><strong>Before you commit</strong>Confirm 1933 Shanghai is open before committing &mdash; occasional event closures on public holidays. Check 1933shanghai.com the evening before.</div>
<p>Three days of Shanghai behind you. Today goes north into Hongkou &mdash; rougher, more residential, the version of the city that runs on its own logic. Leave the hotel late, move slowly, eat on the street, stand in Amy&rsquo;s grandfather&rsquo;s shop for twenty minutes without needing to do anything with that.</p>
<p>Today is Qingming &mdash; 清明节, Tomb Sweeping Day. One of the four great traditional festivals, the one organised entirely around the dead. It falls on the fifteenth day after the spring equinox; in 2026 it lands on Sunday, April 5, making the long weekend run from April 4 to 6.</p>
<p>What this means on the ground: the city is not emptied, it is redistributed. Families who live in Shanghai will have visited graves this morning or yesterday. By 10am they are in the parks &mdash; Fuxing, Century, Zhongshan &mdash; flying kites, eating qingtuan, sitting on grass. Hongkou &mdash; where you&rsquo;re going &mdash; is residential and working-class. On Qingming it will have more of itself on display: incense burning at doorsteps, paper being folded, the particular quality of a neighbourhood that isn&rsquo;t performing for anyone.</p>
<p>The route today is deliberately north, away from the French Concession you&rsquo;ve spent the previous days in. Taikang, then 1933, then Zhapu Lu, then M50 along the creek. The thread running through it is transformation &mdash; a family shop that persists across generations, a slaughterhouse remade as event space, a food street that predates the city&rsquo;s glamour, a textile mill turned gallery district.</p>
<div class="essay-aside"><strong>Things to notice today</strong>Incense smoke at residential doorsteps in Hongkou &mdash; families burning offerings, mid-morning. Qingtuan at street stalls near any park &mdash; green wormwood rice dumplings, only available in the two weeks around Qingming. The cattle bridges at 1933: concrete ramps spiralling around a void; the Baroque ornamentation is on walls designed to drain blood. At Zhapu Lu: order by watching what arrives at adjacent tables &mdash; river shrimp are in season in April. At M50: ShanghART (Building 16) has been here since 2002. The Suzhou Creek from Moganshan Rd bridge is worth a pause.</div>
<h3>Qingming and the city&rsquo;s texture</h3>
<p>One Qingming custom worth knowing: it&rsquo;s considered inauspicious to visit friends and relatives today &mdash; the day belongs to the dead. Restaurants on Zhapu Lu will be busy with families eating together after the morning ceremonies.</p>
<p>Qingtuan (青团) &mdash; green glutinous rice dumplings, wormwood-tinted, filled with sweet red bean &mdash; are the seasonal food of Qingming. Only available in early April. Find them from a street vendor or Shen Dacheng confectionery if you pass one.</p>
<h3>M50 &mdash; confirmed open</h3>
<p>M50 Creative Park at 50 Moganshan Rd: park open daily 8am&ndash;10pm, individual galleries 10am&ndash;6pm, free entry. On a Qingming public holiday the galleries will be quieter than a normal weekend &mdash; the crowds are in the parks. ShanghART (Building 16) is the anchor; it has been representing serious Chinese contemporary artists since 1996.</p>

      essay: `<div class="essay-pull">&ldquo;Four full days of Shanghai and you still haven&rsquo;t seen it after dark. That changes tonight.&rdquo;</div>
<p>Four full days of Shanghai behind you. Monday closes the museums &mdash; here that&rsquo;s a gift. The Night Eats tour at 6pm bookends Saturday&rsquo;s breakfast tour: same neighbourhood, same streets, but the city after dark is a completely different thing. The only fixed points are the spa at 2pm and the tour at 6pm.</p>
<p>Monday closes the museums. In Shanghai, this is a gift. Three days of structured itinerary and today the city gives you a morning without agenda, an afternoon in the hands of a therapeutic masseuse, and then, starting at 6pm, three hours in the French Concession after dark.</p>
<p>The only constraint before 2pm: do not eat anything substantial. The Night Eats tour is not a tasting menu &mdash; it is three hours of genuine eating across multiple stops. A coffee at Seesaw or Manner is fine. A full lunch is a mistake you will regret by 8pm when you are full but still on the third stop.</p>
<h3>The city that appears at night</h3>
<p>You have been walking the French Concession for three days. You know the morning version: delivery riders, wet market stragglers, retirees in Fuxing Park with their badminton rackets. What you have not yet seen is what happens after 7pm.</p>
<p>The French Concession after dark operates at a completely different frequency. The lane houses &mdash; which by day look residential and slightly sealed-off &mdash; are lit from inside: warm light through the wooden lattice windows, the smell of cooking from upper-floor apartments. The bar strips on Yongkang Lu, Nanchang Lu, and Wuyuan Lu are full in a way that has nothing to do with tourism. The shaokao grills appear on residential corners after dark &mdash; charcoal braziers loaded with lamb skewers, tofu, corn.</p>
<p>UnTour&rsquo;s Night Eats is the best way into this version of the city because the guide knows which vendors have been operating from the same corner for twenty years and which restaurants require a local to order for you.</p>
<div class="essay-aside"><strong>On Dragonfly</strong>The 90-minute full-body massage at 268 Xujiahui Road is the right investment at this point in the trip. Four days of walking &mdash; probably 12&ndash;15 kilometres a day &mdash; has accumulated in your legs and lower back. Arrive five minutes early. Don&rsquo;t eat after the massage finishes; you want a clean appetite for 6pm.</div>
<h3>Five days in: what you have accumulated</h3>
<p>You have now seen the Bund twice, been inside Rockbund, walked the wet markets at 8am with a guide, stood inside the Power Station of Art, walked the International Settlement with a guide who explained what you were looking at, been to 1933. What this adds up to is a working understanding of how Shanghai is layered: colonial infrastructure repurposed by the state, the state&rsquo;s infrastructure repurposed by private commerce, private commerce operating at street level in spaces that have been contested and re-contested for 180 years.</p>
<p>Tomorrow is the best day: Jesse for lunch, the French Concession walk in the afternoon, the last Shanghai evening. Also: ask the concierge to confirm the Jesse lunch booking for tomorrow at 12:30pm if this hasn&rsquo;t already been done, and confirm late checkout on Wednesday.</p>

      essay: `<div class="essay-pull">&ldquo;By the time the tour ends this evening, everything you&rsquo;ve been walking through all week will have a coherence it didn&rsquo;t quite have before. You will have understood the streets before the history, which is the right order.&rdquo;</div>
<div class="essay-aside"><strong>Before you commit</strong>Monster Day Tours can be cancelled with 24h+ notice for a credit valid one year. The tour isn&rsquo;t the only way to spend this afternoon &mdash; see the fork below.</div>
<p>The French Concession gets its full day. Today is the best day of the Shanghai leg. Not because of any single thing on the itinerary, but because of accumulation: five days of the city have been building toward a day when you have the context to understand what you&rsquo;re looking at. Fotografiska in the morning, Jesse for lunch &mdash; the best meal of the trip &mdash; the French Concession walk in the afternoon, Wukang Road and Yongkang Lu in the evening.</p>
<h3>What the French Concession actually was</h3>
<p>You have been walking through the French Concession for five days. Today the guide will explain it. The French Concession was not a French colony in any standard sense. It was a zone administered under French civil law, established by treaty in 1849, where the French municipal council had authority but French sovereignty did not technically apply. Wealthy Chinese families chose to build their homes here because French civil law offered more stable property rights than the alternatives. The plane trees were planted by the French Concession municipal council. The shikumen lane houses are a hybrid form invented specifically for this context: European street grid with Chinese domestic courtyard logic.</p>
<p>The Concession sheltered people the authorities wanted. The Communist Party held multiple congresses in buildings you will walk past. The Nationalist intelligence services operated here because the French police were more amenable to arrangements than the Chinese authorities. Jewish refugees from central Europe in the 1930s lived here. The novelist Zhang Ailing &mdash; the great chronicler of Shanghai&rsquo;s wartime bourgeoisie &mdash; wrote here.</p>
<div class="essay-aside"><strong>On Jesse</strong>This is the meal to build the day around. Drunken chicken with Shaoxing wine, braised yellow croaker, red-braised pork belly, green onion tofu &mdash; classic Shanghainese cooking at the top of its register. The concierge confirmed 12:30pm. Order generously &mdash; the kitchen is better with a full table spread, even solo. The drunken chicken is the anchor: cold, steeped overnight in rice wine, served at room temperature. Notice the wine. You are eating Shaoxing rice wine today in the French Concession. Tomorrow you will drink it at the source, in Shaoxing itself.</div>
<h3>Wukang Road and what to find there</h3>
<p>The post-tour wander on Wukang Road &mdash; Le Labo, Harmay, the Wukang Mansion corner &mdash; is the right way to end the last full Shanghai day. Le Labo at 135 Wukang occupies a heritage villa and stocks Myrrh 55, a Shanghai-exclusive fragrance not sold outside China. Harmay on Anfu Road is what happens when a Chinese retailer tries to reimagine what a beauty and fragrance destination should feel like: serious, considered, multiple floors.</p>
<p>The Wukang Mansion at the corner of Wukang and Huaihai is a 1924 Art Deco building shaped like the prow of a ship &mdash; it follows the curve of the road junction in a way that no right-angled building could.</p>
<h3>The last Shanghai evening</h3>
<p>Tomorrow you get on a train. Tonight is the last evening in Shanghai proper, and the only instruction is not to force it. Yongkang Lu at dusk &mdash; the bar strip that is neither tourist-polished nor authentically gritty but somewhere more interesting in between. Find a table. Stay until the light goes.</p>
<p>Shaoxing tomorrow is the other side of everything Shanghai is. The high-speed train takes 74 minutes. You will step off into a city operating at a completely different frequency.</p>

      teaser: "An hour by train and you step off into a place operating at a completely different tempo.",
      essay: `<div class="essay-pull">&ldquo;You have spent five days in the city China built to impress the world. You are about to spend two nights in the city China forgets to mention.&rdquo;</div>
<div class="essay-aside"><strong>Checkout timing</strong>Pullman standard checkout is 14:00. Your train target is ~1:30pm. Hongqiao is 30&ndash;40 min by DiDi. Leave the hotel by 12:30pm. Request 12:30 checkout on arrival &mdash; listed as a Trip.com benefit.</div>
<p>Five days of Shanghai. An hour by high-speed rail and you step off into a place that doesn&rsquo;t assert itself. Canal towns operate at their own pace. The evening&rsquo;s only instruction is to let it arrive on its own terms.</p>
<p>The high-speed train from Shanghai Hongqiao to Shaoxing North takes 74 minutes. In that time you will cross the Yangtze Delta &mdash; flat, green, intensively cultivated &mdash; and arrive at a city of five million people that most international visitors drive straight through on their way to Hangzhou. Shaoxing does not have a skyline. What it has is canals, grey-tile lane houses, rice wine, and a disproportionate claim on Chinese cultural history that its size in no way explains.</p>
<h3>What you have been drinking and eating all week</h3>
<p>Shaoxing wine (绍兴黄酒) &mdash; a golden, slightly sweet, deeply complex amber rice wine aged in clay pots &mdash; is the foundational ingredient of Shanghainese cooking. The drunken chicken you had at Jesse: Shaoxing wine. The red-braised pork belly at Chun: Shaoxing wine. You have been eating and drinking Shaoxing for five days without being in it. This is the source. The Jian Lake region around the city has been producing this wine since the Han Dynasty, over 2,000 years ago. Mao Zedong served it at state banquets. Zhou Enlai &mdash; China&rsquo;s first Premier under Mao, whose family roots were in Shaoxing &mdash; apparently drank it his entire life.</p>
<p>Shaoxing is also where Lu Xun was born. His childhood landscape is embedded in his most important stories in the way that Dublin is embedded in Joyce. The stinky tofu that Shaoxing is equally famous for &mdash; fermented tofu, deep-fried, served with chilli sauce from a street cart &mdash; appears in his writing too.</p>
<div class="essay-aside"><strong>On deceleration</strong>The transition from Shanghai to Shaoxing is abrupt by design. Shanghai is one of the fastest, most overstimulating cities on earth. Shaoxing operates on canal time, the pace of a city that does not need to prove anything because it has already been here for 2,500 years. The hotel sits in Jinghu Wetland Park, which means the evening will be genuinely quiet. Let it be quiet.</div>
<h3>The canal this evening</h3>
<p>After the taxi from Shaoxing North station, check in, and some version of horizontal rest, there is one evening instruction: walk Cangqiao Zhijie (仓桥直街) at dusk. It is the spine of historic Shaoxing &mdash; a stone-paved canal street running through Qing-dynasty houses, lit in the evening by red lanterns. Walk its full length and then find somewhere near the water to eat: stinky tofu from a street cart, warm Huadiao rice wine, the fennel broad beans that will feature tomorrow&rsquo;s lunch.</p>
<p>One practical note: set an alarm for 5:30am on Thursday. The train from Shaoxing North leaves early and the hotel departure is 5:45am. This is the tightest timing constraint of the entire trip. Get it locked in your phone tonight.</p>

      id: "d8", iso: "2026-04-09", hood: "Lu Xun&rsquo;s Shaoxing", hoodShort: "Lu Xun", dow: "Thursday", date: "9 April", chapter: "VIII",
      arc: "Shaoxing &middot; II",
      title: "The slow day",
      teaser: "Where Shanghai layers Art Deco over brutalism in an afternoon, Shaoxing has been essentially the same for centuries.",
      essay: `<div class="essay-pull">&ldquo;&lsquo;The people of Luzhen are very conservative,&rsquo; Lu Xun wrote. He meant it as an indictment. The town never forgave him. The town now sells his image on everything.&rdquo;</div>
<p>The furthest the trip gets from Shanghai in every sense. Shaoxing has canals, wine, pickled vegetables, and the weight of literary history. Lu Xun grew up here. The tavern where his characters drank exists, rebuilt, a few minutes from where he was born.</p>
<p>This is the most literary day of the trip, and possibly the best. Three things &mdash; Shen&rsquo;s Garden, Lu Xun&rsquo;s birthplace complex, lunch at Xianheng &mdash; are within walking distance in the old town, and they add up to something that cannot be planned for.</p>
<h3>The garden and its eight-hundred-year-old love story</h3>
<p>Shen&rsquo;s Garden (沈园) is a Song Dynasty garden, roughly 900 years old. Go before 9:30am. After that, the tour groups arrive. What makes the garden worth the early hour is not its beauty &mdash; it is modest, deliberately understated &mdash; but its story. The poet Lu You (陆游, 1125&ndash;1210) married his cousin Tang Wan. His mother, disapproving, forced the marriage to end. Both remarried. Years later, they happened to encounter each other in this garden. Lu You was overwhelmed. He wrote a poem on the garden wall. Tang Wan read it, and wrote a response. Both poems &mdash; &ldquo;Phoenix Hairpin&rdquo; (钗头凤) &mdash; have been memorised by Chinese schoolchildren for eight hundred years.</p>
<h3>Lu Xun and why he still matters</h3>
<p>Lu Xun (鲁迅, born Zhou Shuren, 1881&ndash;1936) is the most important writer in modern Chinese literature. He grew up in Shaoxing in a declining scholar-gentry family. He went to Japan to study medicine. He was watching a lantern-slide presentation about the Russo-Japanese War when an image appeared of a Chinese man about to be beheaded by Japanese soldiers while a crowd of Chinese onlookers watched impassively. The expressions on the faces of the crowd &mdash; not horrified, not resistant, simply watching &mdash; struck him as the central problem of China. He dropped medicine and became a writer.</p>
<p>His most famous stories &mdash; &ldquo;A Madman&rsquo;s Diary&rdquo; (1918), &ldquo;The True Story of Ah Q&rdquo; (1921), &ldquo;Kong Yiji&rdquo; (1919) &mdash; are savage examinations of Chinese social conformity and what he called the &ldquo;cannibalism&rdquo; of Chinese society: the way in which the social order devoured the people within it.</p>
<div class="essay-aside"><strong>On &ldquo;Kong Yiji&rdquo; and lunch at Xianheng</strong>&ldquo;Kong Yiji&rdquo; is a short story published in 1919. It takes place in the Xianheng Tavern &mdash; the restaurant where you are having lunch &mdash; narrated by a young bar assistant who describes the periodic appearances of Kong Yiji, a failed examination scholar who wears the long gown of the educated class despite being destitute. The story ends with Kong Yiji arriving one day, having had his legs broken as punishment for theft, crawling on his hands. He drinks his last bowl of wine and is never seen again. In March 2023, Chinese youth who couldn&rsquo;t find employment despite their university degrees started calling themselves Kong Yijis. The story is still active.</div>
<p>Order the fennel broad beans (茴香豆) and warm Huadiao wine. These are the exact items Kong Yiji orders at the bar in the story.</p>
<h3>The week, tied together</h3>
<p>Tomorrow at 5:45am you leave this hotel and begin the journey home via Shanghai. You arrived in Shanghai and spent five days watching how a society operates when it is moving at full speed after a long stall. Now you are in Shaoxing, which has been here for 2,500 years and which produced the rice wine that underpins all that Shanghai food, and the writer who diagnosed China&rsquo;s central pathology a century ago. The contrast between Shanghai and Shaoxing is not the contrast between modernity and tradition. It is the contrast between two kinds of persistence: the city that burned everything and rebuilt at speed, and the city that simply stayed.</p>

function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

function makeExpand(label, bodyHtml, dropCap) {
  const wrap = el('div', 'sh26-panel');
  const btn = el('button', 'sh26-panel-btn', `<em class="sh26-chevron">&rsaquo;</em>&nbsp;${label}`);
  const body = el('div', 'sh26-panel-body');
  body.innerHTML = `<div class="prose${dropCap ? ' prose-drop' : ''}">${bodyHtml}</div>`;
  const pid = 'x-' + Math.random().toString(36).slice(2, 8);
  body.id = pid; btn.setAttribute('aria-expanded', 'false'); btn.setAttribute('aria-controls', pid);
  btn.addEventListener('click', () => {
    const open = btn.classList.toggle('open');
    body.classList.toggle('open');
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  });
  wrap.appendChild(btn);
  wrap.appendChild(body);
  return wrap;
}

      teaserDiv.appendChild(continueSpan);
      const fullBody = el('div', null);
      fullBody.id = 'essay-' + day.id;
      fullBody.style.display = 'none';
      fullBody.innerHTML = `<div class="prose prose-drop" style="margin-top:0.9rem;">${day.essay}</div>`;
      const collapseWrap = el('div', 'essay-collapse');
      collapseWrap.innerHTML = `<button type="button" class="essay-collapse-btn">Collapse</button>`;
      fullBody.appendChild(collapseWrap);
      essayWrap.appendChild(fullBody);
      continueSpan.querySelector('button').addEventListener('click', () => {
        fullBody.style.display = 'block';
        teaserDiv.style.display = 'none';
        ch.classList.add('open');
        head.setAttribute('aria-expanded', 'true');
      });
      collapseWrap.querySelector('button').addEventListener('click', () => {
        fullBody.style.display = 'none';
        teaserDiv.style.display = 'block';
      });
    }
    ch.appendChild(essayWrap);

    const spine = el('div', 'spine');
    day.events.forEach(ev => {
      const stop = el('div', 'stop');
      stop.dataset.kind = ev.kind;

      const tag = ev.state === 'confirmed' ? '<span class="stop-tag confirmed">Booked</span>'
        : ev.state === 'open' ? '<span class="stop-tag open">To book</span>' : '';

      const titleHtml = ev.url
        ? `<a href="${ev.url}" target="_blank" rel="noopener">${ev.title}</a>`
        : ev.title;

      stop.appendChild(el('div', 'stop-time', ev.time));
      stop.appendChild(el('div', 'stop-head', `<span class="stop-title">${titleHtml}</span>${tag}`));
      if (ev.note) stop.appendChild(el('div', 'stop-note', ev.note));
      if (ev.ref) stop.appendChild(el('div', 'stop-ref', `<span>${ev.ref}</span>`));
      if (ev.map) {
        const ml = el('a', 'stop-map', '&#8599; Map');
        ml.href = ev.map; ml.target = '_blank'; ml.rel = 'noopener';
        stop.appendChild(ml);
      }
      if (ev.expand) stop.appendChild(makeExpand(ev.expand.label, ev.expand.body, false));
      spine.appendChild(stop);
    });

    ch.appendChild(spine);
    wrap.appendChild(ch);
  });
}

function renderBookings() {
  const confirmedList = document.getElementById('ledger-confirmed');
  const openList = document.getElementById('ledger-open');
  const openLabel = document.getElementById('ledger-open-label');
  let anyOpen = false;
  TRIP.bookings.forEach(b => {
    const row = el('div', 'ledger-row');
    row.innerHTML = `<span class="ldot ${b.state}"></span>
      <div class="ledger-body">
        <div class="ledger-label">${b.label}</div>
        <div class="ledger-sub">${b.sub}</div>
        ${b.ref ? `<div class="ledger-ref"><span>${b.ref}</span></div>` : ''}
      </div>
      <span class="ledger-state ${b.state}">${b.state === 'confirmed' ? 'Booked' : 'To book'}</span>
      ${b.url ? `<a class="ledger-link" href="${b.url}" target="_blank" rel="noopener">&#8599;</a>` : ''}`;
    if (b.state === 'confirmed') confirmedList.appendChild(row);
    else { openList.appendChild(row); anyOpen = true; }
  });
  if (!anyOpen && openLabel) { openLabel.style.display = 'none'; }
}

function renderPocket() {
  const wrap = document.getElementById('sh26-pocket-wrap');
  TRIP.pocket.forEach(g => {
    const grp = el('div', 'sh26-row');
    const btn = el('button', 'sh26-row-btn', `${g.group}<span class="sh26-chev">&rsaquo;</span>`);
    const body = el('div', 'sh26-row-panel');
    g.items.forEach(([n, d, u]) => {
      const link = u ? ` <a class="sh26-item-link" href="${u}" target="_blank" rel="noopener">&#8599;</a>` : '';
      body.appendChild(el('div', 'sh26-item', `<div class="n">${n}${link}</div><div class="d">${d}</div>`));
    });
    const gid = 'g-' + Math.random().toString(36).slice(2, 8);
    body.id = gid; btn.setAttribute('aria-expanded', 'false'); btn.setAttribute('aria-controls', gid);
    btn.addEventListener('click', () => { const open = btn.classList.toggle('open'); body.classList.toggle('open'); btn.setAttribute('aria-expanded', open ? 'true' : 'false'); });
    grp.appendChild(btn); grp.appendChild(body); wrap.appendChild(grp);
  });
}

function renderChips(wrap) {
  TRIP.days.forEach(function (day) {
    const chip = el('a', 'day-chip');
    chip.href = '#' + day.id;
    chip.innerHTML =
      '<span class="dc-num">Ch. ' + (day.chapter) + '</span>' +
      '<span class="dc-date">' + day.dow.slice(0, 3) + ' ' + day.date.split(' ')[0] + '</span>' +
      '<span class="dc-hood">' + (day.hoodShort || '') + '</span>';
    chip.addEventListener('click', function (e) {
      e.preventDefault();
      const target = document.getElementById(day.id);
      if (target) { target.classList.add('open'); target.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
    });
    wrap.appendChild(chip);
  });
  [['Bookings', 'bookings-section'], ['Back pocket', 'sh26-pocket']].forEach(function (pair) {
    const chip = el('a', 'day-chip day-chip-jump');
    chip.href = '#' + pair[1];
    chip.innerHTML = '<span class="dc-jump">' + pair[0] + '</span>';
    chip.addEventListener('click', function (e) {
      e.preventDefault();
      const target = document.getElementById(pair[1]);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
    wrap.appendChild(chip);
  });
}

function renderDayIndex() {
  const wrap = document.getElementById('day-index');
  if (!wrap) return;
  wrap.innerHTML = '';
  renderChips(wrap);
}

function initExpandAll() {
  const btn = document.getElementById('expand-all-btn');
  if (!btn) return;
  btn.addEventListener('click', function () {
    const chapters = Array.from(document.querySelectorAll('.chapter'));
    const anyClosed = chapters.some(function (c) { return !c.classList.contains('open'); });
    chapters.forEach(function (c) {
      c.classList.toggle('open', anyClosed);
      const head = c.querySelector('.chapter-head');
      if (head) head.setAttribute('aria-expanded', anyClosed ? 'true' : 'false');
      if (anyClosed) {
        const teaser = c.querySelector('.essay-teaser');
        const full = c.querySelector('[id^="essay-"]');
        if (teaser && full) { teaser.style.display = 'none'; full.style.display = 'block'; }
      }
    });
    btn.textContent = anyClosed ? 'Close all days' : 'Open all days';
    btn.setAttribute('aria-pressed', anyClosed ? 'true' : 'false');
  });
}

document.addEventListener('DOMContentLoaded', () => {
  renderMasthead();
  renderPlanePiece();
  renderChapters();
  renderBookings();
  renderDayIndex();
  initExpandAll();
  renderPocket();
});
</script>
</body>
</html>
