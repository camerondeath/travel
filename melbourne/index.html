<style>
:root {

.content { position: relative; z-index: 1; }

.ctx-toggle {

.ctx-body {

footer { padding: 3rem 0 4rem; text-align: center; font-family: var(--sans); font-size: var(--fs-xs); color: var(--line-2); letter-spacing: 0.1em; }

.fab { position: fixed; bottom: 1.4rem; right: 1.4rem; z-index: 50; width: 50px; height: 50px; border-radius: 50%; background: var(--brass); color: var(--night); border: none; cursor: pointer; font-family: var(--display); font-size: 1.3rem; box-shadow: 0 6px 20px rgba(0,0,0,0.4); transition: transform 0.15s; }

a:focus-visible, button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
</style>
</head>

<p>You have arrived in the only season that shows you the real place. Summer Melbourne belongs to the tourism board, all rooftop bars and cricket and harsh northern light. Winter Melbourne belongs to the people who live here. The Paris End of Collins Street goes the colour of a bruise around four in the afternoon. The trams throw their light across wet bluestone. Everyone is dressed in black and moving with purpose toward something warm, and the coffee, which is a genuine civic religion here, tastes better for the cold. This is a city that eats late, takes its theatre seriously, and treats a good dinner as a reason to leave the house rather than an interruption to the evening.</p>

<p>Your apartment sits on Little Collins between Swanston and Russell, which is not an accident of booking but the most useful position in the city. Chinatown is three minutes east, the oldest continuous Chinese settlement in the western world, still serving at two in the morning. Flinders Lane, the spine of the laneway dining culture, is four minutes south. The Nicholas Building on Swanston Street -- a heritage tower full of printmakers, perfumers and vintage dealers working with their studio doors open -- is a five-minute walk and one of the great free pleasures of the CBD. You are staying inside the machine, not beside it.</p>

<p>The temptation with a city like this is to schedule it tightly, to treat the laneways as a checklist and the days as a route to be optimised. Resist that completely. The trip is built around a handful of fixed points that genuinely matter: Eddie Izzard performing Hamlet alone in a studio theatre; Cartier's jewelled century spread across the lower galleries of the NGV; a heritage Indian kitchen on Punch Lane doing something nobody else in the city is doing. Around those anchors there is deliberate slack, and the slack is where Melbourne actually happens. A morning with no alarm. An afternoon that drifts from one end of Gertrude Street to the other. The decision, made at five in the cold, about whether to keep walking or duck into the nearest warm room. Leave room to be diverted. That is the whole method.</p>`

<p>That shape is Bar Lourinhã, three minutes on foot from your door, where a seat at the bar has your name on it. It is the right first meal in Melbourne: unpretentious, confident, deeply good.</p>`,

            label: "About Bar Lourinhã",
            body: `<p>Matt McConnell and his partner Jo Gamvros opened this room in 2006, and it has been part of the city's dining furniture ever since -- one of the venues that anchored what the CBD laneway culture later became. Twenty years on, the room still does what it was always designed to do: feed people well at the bar, without ceremony.</p>
<p>The decor resists description and rewards inspection. A Russian vodka bottle shaped like a rifle. Religious iconography from several traditions, none of them serious. Op-shop paintings massed floor to ceiling. The accumulated curiosity of two decades of passionate collecting by people who have eaten their way around the Iberian Peninsula many times. It is someone's living room if that someone happened to also be an acclaimed chef.</p>
<p>The food is Iberian and Mediterranean, and it is deeply interested in good ingredients: pipis steamed with fino sherry; spiced chickpeas and spinach that reviewers have mentioned for fifteen years without it getting old; grilled chorizo and pork liver pintxos; the kingfish pancetta tostada that Gourmet Traveller once called a signature not just for this room but for Victoria. The blackboard wine list leans Spanish without being didactic. Ask the kitchen what is good tonight and order accordingly. This is not a place for main-and-sides thinking; three or four plates across the evening is the method.</p>`

            label: "What to do on Gertrude Street",
            body: `<p>Gertrude Street runs only six blocks from Smith to Nicholson, but it concentrates more of what makes Melbourne interesting per metre than almost anywhere in the city. Time Out ranked it the second coolest street in the world in 2022, which is both accurate and beside the point -- the locals who eat and drink here have not noticed the accolade and do not behave accordingly.</p>
<p>Walk west from the Smith Street corner. On your left almost immediately: Gertrude Contemporary at 21-31 High Street (the Gertrude Street end), an artist-run space that has been showing emerging and mid-career work since 1985. Free entry, always worth fifteen minutes if there is an exhibition on. Further along: Marion at number 53, Andrew McConnell's wine bar, which does 25-plus wines by the glass and plates of mussels on fried bread and nduja. It is one of the better places to sit alone in Melbourne with a glass of something and no agenda. Cutler and Co a little further, McConnell's fine-dining flagship in a converted metalworks factory -- a different occasion, but worth knowing it exists. The Australian Print Workshop. Archie's All Day at 189 for coffee. The Everleigh upstairs at around 150 -- a pre-Prohibition cocktail parlour in a 1920s room, open Thursday to Saturday from 5pm -- if you find yourself still there at that hour, which is not impossible.</p>
<p>Brunswick Street is longer, louder and more tourist-aware. It has good bookshops (Brunswick Street Bookstore, Polyester Records for vinyl), and is worth the overflow if Gertrude has not taken all your time. But Gertrude is the one to prioritise. The neighbourhood rewards a slow pace and punishes a checklist mentality. Leave Fitzroy by half four or five at the latest -- dinner has a deadline tonight.</p>`

          expand: {
            label: "About Tipo 00",
            body: `<p>Andreas Papadakis spent four years at Vue de Monde before opening this room in 2014, and his fine-dining instincts are what make it different from every other pasta bar in the city. The name refers to the finest grade of Italian flour -- tipo 00 -- and the menu is built around fresh pasta made daily in a kitchen visible from the counter. In 2022 it was named one of the best Italian restaurants in the world. That is not the kind of claim this place makes about itself; it just keeps being excellent and the recognition arrives.</p>
<p>The menu is short by design: a handful of starters, five or six pastas, a couple of mains for anyone who has found themselves in an Italian restaurant and does not want pasta. The right answer is pasta. Specifically the tagliolini al nero -- squid ink, seafood broth, a dish that reviewers keep returning to as the single thing you must order. The gnocchi with braised duck and porcini runs it close in winter. The Tipomisu is the dessert, a riff on tiramisu that is both better than it sounds and easier to eat than the original. The counter seats eight or ten and faces the open kitchen; for one diner it is the only seat worth having.</p>
<p>This is not a relaxed long dinner -- it moves efficiently, which is the point tonight. Arrive at 5:30, order quickly, eat well, be walking south toward the Fairfax Studio by 6:15.</p>`

          expand: {
            label: "About the show",
            body: `<p>Suzy Izzard performs all 23 characters of Shakespeare's Hamlet alone on a bare stage with no set, no props, no costume changes. The adaptation is by her brother Mark Izzard and the direction by Selina Cadell, who came from the RSC; the production itself came from triple-extended runs in New York, Chicago and London, where it was nominated for the Drama League's Distinguished Performance Award. Judi Dench called it spectacular. The Chicago Tribune said Izzard "smashes all three of the great soliloquies." Melbourne has the longest run on the Australian tour -- three weeks, closing 12 July, so you are there two days before the end.</p>
<p>The Limelight review from the Sydney season is worth reading before you go. The critic found it better than anticipated but honest about the trade-offs: 23 characters voiced by one person means narrative clarity sometimes suffers, particularly the supernatural elements and the final sword fight, which is reduced to what the reviewer called "a comical pantomime." What it gains in return is the text at its purest -- no set to look at, no other actors to watch, just Shakespeare's language and one performer's complete attention to it. Izzard, 64, trained for years as a street performer and stand-up before turning to theatre, and the soliloquies in particular -- "To be or not to be," "What a piece of work is a man," the graveyard scene -- are delivered with what reviewers describe as genuine force.</p>
<p>F15 is front stalls, close enough to see her face. That is the right ticket for a show built on one person's expression.</p>`

      essay: `<p>Today you go inward, in every sense. No trams out of town. The whole day lives inside the few hundred metres around your door, which turns out to be enough for a city built in layers.</p>
<p>Start in the Nicholas Building on Swanston Street. Thread south by laneway -- Tattersalls, Caledonian, Duckboard Place -- until you come out on Flinders Lane for lunch at Cumulus Inc. Then south along St Kilda Road to the NGV for Cartier. Then Saadi on Punch Lane at half six. The day is a straight line from north to south, with the best things waiting at the far end of each stretch.</p>`,

          expand: {
            label: "About the Nicholas Building",
            body: `<p>Built in 1926, the Nicholas Building is a heritage office tower on the corner of Swanston and Flinders Lane that most people walk past every day without entering. The ground floor is retail. Everything above it is studios, workshops, and small galleries rented by the kinds of creative people who need a physical space but not a shopfront.</p>
<p>Take the original lift to any floor and push on the doors that are unlocked. Behind them on a Friday morning you might find: a letterpress studio with a Heidelberg press still in daily use; a vintage clothing dealer with stock that has been accumulating since the 1970s; a milliner; a small gallery changing shows every month or two; a perfumer making fragrance to commission; a printmaker. Nobody is performing for visitors. The doors are open because it is a working building and there is no reason to close them. That is the texture of what you find.</p>
<p>The Cathedral Arcade on the ground floor, accessible from Swanston Street, has been there since 1927 and has the same quality: independent, idiosyncratic, genuinely old rather than vintage-branded. Allow an hour in the building and do not try to see everything. Follow what interests you.</p>`

        { time: "12:30pm", title: "Cumulus Inc", kind: "food",

          expand: {
            label: "About Cumulus Inc",
            body: `<p>Andrew McConnell opened this room in 2008 and it changed how Melbourne understood lunch. The long marble counter facing the open kitchen -- walk-in welcome, no reservations during the day, wine by the glass from early -- became the template that every subsequent laneway room has tried to copy. The fact that most of them have succeeded is a tribute to how right the format was; the fact that Cumulus still draws a full counter on a Friday is a tribute to how well it executes.</p>
<p>McConnell is the most influential figure in Melbourne dining of the last twenty years, responsible for Cutler and Co, Marion, Gimlet and others. Cumulus is not his most ambitious room; it is his most loved. The menu rotates seasonally and does not try to surprise you -- it tries to be impeccably cooked food that you want to eat. The taramasalata with grilled flatbread has been on the menu in various forms since the beginning. The kingfish and whatever accompanies it changes, but is always worth ordering. The wine list is long and intelligent and the staff actually know it.</p>
<p>It is on the back-pocket list for a reason: it is reliable in a way that more ambitious rooms are not. Using it as the Friday lunch anchor is not a compromise; it is the right call for a midday meal before two hours of Cartier.</p>`

          note: "180 St Kilda Road, 15-minute walk south. 2pm timed entry. Free guided tour at 2:30pm -- register at the info desk on arrival. Helen Molesworth audio guide $7, worth downloading beforehand. Allow 2 hours minimum.",
          map: "https://maps.google.com/?q=NGV+International+180+St+Kilda+Road+Melbourne",
          expand: {
            label: "About the exhibition",
            body: `<p>The exhibition begins chronologically with the moment the company stopped being a competent Parisian jeweller and became something else entirely. In 1900, Louis, Pierre and Jacques Cartier inherited their grandfather's firm and opened branches in London and New York within a decade. They also started collecting clients: the Maharaja of Patiala, King Edward VII, the Duchess of Manchester, Dame Nellie Melba. The Maharaja commissioned a necklace requiring 2,930 diamonds anchored by a 234-carat yellow diamond; it was lost after Indian independence, rediscovered in 1998 stripped of its stones, and Cartier replaced them with replicas. Both versions are here.</p>
<p>The exhibition is organised thematically. A bold yellow room traces the brothers' world of inspiration across India, Egypt, Iran, China and Japan -- the Tutti Frutti collection has its own space: carved rubies, emeralds and sapphires stacked into bracelets and clips, the stones cut to echo Indian jewellery traditions, the settings unmistakably 1920s French. Jeanne Toussaint gets her own gallery. Creative director from 1933 to 1970, she elevated the panther from a repeating motif into an emblem -- the Duchess of Windsor's panther clip, a platinum cat crouching on a 152-carat cabochon sapphire, is here. The watches room sits midway as a palate cleanser: the 1914 Model A mystery clock, diamond-encrusted hands appearing to float with no visible mechanism, is the piece the Cartier Collection director said she would save in an emergency. The final gallery is entirely tiaras, twenty-four of them, including the Scroll Tiara of 1902 worn by Clementine Churchill at the coronation and later photographed on Rihanna for W Magazine.</p>
<p>The exhibition design is by Studio Sabine Marcelis and CLOUD from Rotterdam: coloured rooms that read as settings for the stones. An original score by Ai Yamamoto and Erkki Veltheim runs throughout. The guided tour at 2:30pm covers the key objects in 45 minutes; register at the desk on arrival. Allow two hours minimum for the full exhibition.</p>`

          map: "https://maps.google.com/?q=18+Punch+Lane+Melbourne",
          expand: {
            label: "About Saadi",
            body: `<p>Saavni Krishnan and Sriram Aditya spent three years running Saadi as a pop-up around Melbourne -- one night at Etta, a residency at Public Wine Shop, a run at Manzé -- before Adipoetra Halim, who also owns the Hotel Windsor and Aru, offered them the former Sunda space on Punch Lane. They took a month-long residency in May 2025, extended it through July, and then made it permanent. It opened as a restaurant in September 2025.</p>
<p>Krishnan was raised in Mumbai to Punjabi and Tamilian parents, worked at Fred's in Sydney and then as sous-chef at Manzé in Melbourne. Aditya is Tamilian, his father's postings with the Indian Navy exposing him to food cultures across the subcontinent; he was most recently head chef at Gemini in Coburg. Their menu is pan-Indian rather than regionally specific, and it is explicitly not curry -- "Indian food that is unique to us, mostly gluten-free, can be made vegan, and is not curry" is how they put it on the website. What it is instead: family recipes from both sides, reworked with the technique of twelve years in serious Australian kitchens. A celeriac achar based on Krishnan's grandmother's recipe. Pulikachal -- a simmered tamarind sauce from Aditya's mother -- served with Corner Inlet flathead or lamb brisket. Idli topped with spiced Dutch carrots. The menu changes quarterly with the produce.</p>

      essay: `<p>No alarm. One long coffee somewhere near home before the day has any demands. When you are ready, walk fifteen minutes north to the Queen Victoria Market. Go for the deli hall and the produce sheds rather than to shop -- the atmosphere is the point. The fresh food halls wind down around midday, so arrive between ten and eleven for the full range.</p>
<p>From there, walk or tram twenty minutes northeast to Carlton. Lygon Street has gone somewhat touristic, but the Carlton Gardens behind it have not, and they deserve an afternoon. Dinner is five minutes from home: Lee Ho Fook on Duckboard Place, the most interesting Chinese cooking in the city.</p>`,

<p>The Carlton Gardens are the destination. The Royal Exhibition Building stands in the centre, a World Heritage listed hall built for the 1880 Melbourne International Exhibition -- predating Federation by twenty years -- that hosted the first sitting of the Australian Parliament in 1901. It is still absurdly grand from the outside: a central dome flanked by pavilions, the whole thing built in thirteen months by a city that needed to impress the world and had the money to do it. The gardens themselves were designed by William Sangster in the 1870s and have the slightly formal quality of Victorian municipal ambition -- axial paths, a fountain, mature elms. In July they are bare and cold and completely without tourists, which makes them ideal.</p>
<p>If the afternoon has more hours than the gardens can fill, the Ian Potter Centre at Federation Square is a 25-minute walk south or a short tram -- free, no booking, Australian and Indigenous art, the counterweight to Friday's European jewels. Otherwise: walk back through the CBD grid at your own pace and be home in time to change before dinner.</p>`

        { time: "6:30pm", title: "Lee Ho Fook", kind: "food", state: "confirmed",

          expand: {
            label: "About Lee Ho Fook",
            body: `<p>Victor Liong arrived in Australia from Brunei at six, grew up in Sydney, trained at Marque under Mark Best and then at Mr Wong, and moved to Melbourne in 2013 to open this room. He named it after the Warren Zevon lyric in Werewolves of London -- "I saw Lee Ho Fook's, getting in a little face" -- which tells you something about the register: serious cooking, not taking itself seriously. The original Collingwood location outgrew itself and moved to Duckboard Place in 2015, where the laneway entrance and moody interior have become part of the identity.</p>
<p>The kitchen uses Chinese tradition as a starting point rather than a constraint -- "explode the atlas and just make sure it's delicious" was how one early reviewer put it. The tasting menu traces Liong's own eating history: mud crab in turmeric sauce references a dish he ate as a student at Flower Drum, Melbourne's other defining Chinese restaurant; braised brisket with elastic noodles recalls childhood trips to Sydney's Chinatown. What the 50 Best Discovery listing called "an emotional odyssey informed by his own experiences of being Malaysian and growing up in Australia."</p>
<p>The maltose-glazed Peking duck is the dish everyone mentions first, and it takes time to prepare -- order it when you sit down. The crispy eggplant with spiced red vinegar is lighter and sharper and worth ordering alongside. The cumin lamb shoulder is the one the kitchen is proudest of. The wine list runs to around 120 bins and includes a page of wines from China, which is unusual and worth exploring. The chef's counter is the right seat for one person: close to the pass, good service, the theatre of the kitchen visible throughout.</p>`

<script>
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

function renderMasthead() {
  document.getElementById('m-season').textContent = TRIP.meta.season;
  document.getElementById('m-title').innerHTML = TRIP.meta.city + ' <em>in July</em>';
  document.getElementById('m-meta').innerHTML = `
    <div class="row"><span class="lbl">When</span>${TRIP.meta.dates}</div>
    <div class="row"><span class="lbl">Base</span><a href="${TRIP.meta.base.url}" target="_blank" rel="noopener">${TRIP.meta.base.name}</a></div>
    <div class="row flight"><span class="lbl">Out</span>${TRIP.meta.flights.out}</div>
    <div class="row flight"><span class="lbl">Home</span>${TRIP.meta.flights.ret}</div>`;
}

function renderHero() {
  const h = TRIP.meta.hero;
  document.getElementById('hero').innerHTML = `<div class="kicker">${h.kicker}</div><h2>${h.title}</h2><p class="standfirst">${h.standfirst}</p><div class="prose">${h.body}</div>`;
}

let ctxId = 0;
function makeCtx(expand) {
  const id = 'ctx-' + (ctxId++);
  const wrap = el('div', 'ctx');
  const btn = el('button', 'ctx-toggle', `<span class="arr">›</span> ${expand.label}`);
  const body = el('div', 'ctx-body', `<div class="prose">${expand.body}</div>`);
  body.id = id;
  btn.addEventListener('click', () => { btn.classList.toggle('on'); body.classList.toggle('on'); });
  wrap.appendChild(btn); wrap.appendChild(body);
  return wrap;
}

function renderChapters() {
  const wrap = document.getElementById('chapters');
  TRIP.days.forEach(day => {
    const ch = el('section', 'chapter'); ch.id = day.id;
    ch.appendChild(el('div', 'chapter-head', `
      <div class="chapter-numeral">${day.chapter}</div>
      <div class="meta">
        <div class="chapter-dow">${day.dow} · <span class="date">${day.date}</span></div>
        <div class="chapter-title">${day.title}</div>
      </div>`));
    ch.appendChild(el('div', 'chapter-essay', `<div class="prose">${day.essay}</div>`));
    const spine = el('div', 'spine');
    day.events.forEach(ev => {
      const stop = el('div', 'stop'); stop.dataset.kind = ev.kind;
      const tag = ev.state === 'confirmed' ? '<span class="tag confirmed">Booked</span>'
                : ev.state === 'pending'   ? '<span class="tag pending">Waitlist</span>'
                : ev.state === 'open'      ? '<span class="tag open">To book</span>' : '';
      let links = '';
      if (ev.map)  links += `<a href="${ev.map}"  target="_blank" rel="noopener">Map</a>`;
      if (ev.book) links += `<a href="${ev.book}" target="_blank" rel="noopener">Book</a>`;
      stop.innerHTML = `
        <div class="stop-time">${ev.time}</div>
        <div class="stop-title">${ev.title}${tag}</div>
        <div class="stop-note">${ev.note}</div>
        ${links ? '<div class="stop-links">' + links + '</div>' : ''}`;
      if (ev.expand) stop.appendChild(makeCtx(ev.expand));
      spine.appendChild(stop);
    });
    ch.appendChild(spine);
    wrap.appendChild(ch);
  });
}

function renderLedger() {
  const list = document.getElementById('ledger-list');
  const order = { open: 0, pending: 1, confirmed: 2 };
  const label = { confirmed: 'Booked', pending: 'Waitlist', open: 'To book' };
  TRIP.bookings.slice().sort((a,b) => order[a.state] - order[b.state]).forEach(b => {
    const row = el('div', 'ledger-row');
    row.innerHTML = `<span class="ldot ${b.state}"></span>
      <div class="ledger-main">
        <div class="ledger-label">${b.label}</div>
        <div class="ledger-sub">${b.sub}${b.ref ? ' · ' + b.ref : ''}</div>
      </div>
      <span class="ledger-state ${b.state}">${label[b.state]}</span>
      ${b.url ? '<a class="go" href="' + b.url + '" target="_blank" rel="noopener">↗</a>' : ''}`;
    list.appendChild(row);
  });
}

function renderPocket() {
  const wrap = document.getElementById('pocket-wrap');
  TRIP.pocket.forEach(g => {
    const grp = el('div', 'pocket-group');
    const btn = el('button', 'pocket-toggle', `${g.group}<span class="chev">›</span>`);
    const body = el('div', 'pocket-body');
    g.items.forEach(([n,d]) => body.appendChild(el('div', 'pocket-item', `<div class="n">${n}</div><div class="d">${d}</div>`)));
    btn.addEventListener('click', () => { btn.classList.toggle('on'); body.classList.toggle('on'); });
    grp.appendChild(btn); grp.appendChild(body); wrap.appendChild(grp);
  });
}

function initNotes() {
  const fab = document.getElementById('fab'), panel = document.getElementById('notepanel');
  const ta = document.getElementById('note-ta'), list = document.getElementById('notelist');
  const draw = () => {
    const n = JSON.parse(localStorage.getItem('mel_notes') || '[]');
    list.innerHTML = n.length ? n.map(x => `<div class="noteitem">${x}</div>`).join('') : '<div class="empty">No notes yet.</div>';
  };
  fab.addEventListener('click', () => panel.classList.toggle('on'));
  document.getElementById('note-save').addEventListener('click', () => {
    const v = ta.value.trim(); if (!v) return;
    const n = JSON.parse(localStorage.getItem('mel_notes') || '[]');
    n.unshift(v); localStorage.setItem('mel_notes', JSON.stringify(n));
    ta.value = ''; draw();
  });
  draw();
}

document.addEventListener('DOMContentLoaded', () => {
  renderMasthead(); renderHero(); renderChapters(); renderLedger(); renderPocket(); initNotes();
});
</script>
