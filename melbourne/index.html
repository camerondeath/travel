<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melbourne · Winter 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500;9..144,600&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --night:    #14161d;
  --night-2:  #1b1e27;
  --night-3:  #21252f;
  --paper:    #efe9dd;
  --paper-dim:#cbc6bb;
  --brass:    #cf9a52;
  --brass-dim:#9a7740;
  --mist:     #8b919e;
  --line:     #2b2f3b;
  --line-2:   #363b48;
  --good:     #7faf7a;
  --pend:     #cf9a52;
  --open:     #7d93c4;
  --serif:    'Newsreader', Georgia, serif;
  --display:  'Fraunces', Georgia, serif;
  --sans:     'Inter', -apple-system, system-ui, sans-serif;
  --max: 760px;
  --fs-xs: 0.7rem; --fs-sm: 0.82rem; --fs-md: 1.05rem; --fs-lg: 1.3rem;
  --fs-2xl: clamp(2.6rem, 7vw, 4.4rem);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { background: var(--night); color: var(--paper); font-family: var(--serif); font-size: var(--fs-md); line-height: 1.75; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.wrap { max-width: var(--max); margin: 0 auto; padding: 0 1.5rem; }
.skyglow { position: fixed; top: 0; left: 0; right: 0; height: 60vh; background: radial-gradient(120% 80% at 70% -10%, rgba(207,154,82,0.10), transparent 60%); pointer-events: none; z-index: 0; }
.content { position: relative; z-index: 1; }

/* MASTHEAD */
.masthead { padding: 4.5rem 0 2.5rem; }
.masthead .eyebrow { font-family: var(--sans); font-size: var(--fs-xs); font-weight: 500; letter-spacing: 0.32em; text-transform: uppercase; color: var(--brass); margin-bottom: 1.4rem; }
.masthead h1 { font-family: var(--display); font-size: var(--fs-2xl); font-weight: 400; line-height: 0.92; letter-spacing: -0.02em; font-optical-sizing: auto; }
.masthead h1 em { font-style: italic; font-weight: 300; color: var(--brass); }
.masthead .meta { font-family: var(--sans); font-size: var(--fs-sm); color: var(--mist); margin-top: 1.6rem; border-top: 1px solid var(--line); padding-top: 1.2rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem 1.5rem; }
@media (max-width: 480px) { .masthead .meta { grid-template-columns: 1fr; } }
.masthead .meta .row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.masthead .meta .lbl { color: var(--mist); flex-shrink: 0; }
.masthead .meta a { color: var(--paper-dim); text-decoration: none; border-bottom: 1px solid var(--line-2); }
.masthead .meta a:hover { color: var(--brass); }
.masthead .meta .flight { font-size: var(--fs-xs); color: var(--paper-dim); }

/* WEATHER WIDGET */
.weather-widget { display: inline-flex; align-items: center; gap: 0.5rem; margin-top: 1rem; font-family: var(--sans); font-size: var(--fs-xs); color: var(--mist); }
.weather-icon { font-size: 1.1rem; line-height: 1; }
.weather-temp { color: var(--paper-dim); font-weight: 500; }
.weather-desc { color: var(--mist); }

/* PLANE PIECE */
.plane-piece { padding: 1.5rem 0 3.5rem; border-bottom: 1px solid var(--line); }
.plane-piece .kicker { font-family: var(--sans); font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--brass-dim); margin-bottom: 1rem; }
.plane-piece h2 { font-family: var(--display); font-size: clamp(1.8rem, 4.5vw, 2.7rem); font-weight: 400; line-height: 1.05; letter-spacing: -0.015em; margin-bottom: 1rem; font-optical-sizing: auto; }
.plane-piece .standfirst { font-family: var(--serif); font-size: var(--fs-lg); font-weight: 300; font-style: italic; color: var(--brass); line-height: 1.4; margin-bottom: 2rem; max-width: 34ch; }
.prose p { margin-bottom: 1.3em; color: var(--paper-dim); }
.prose p:last-child { margin-bottom: 0; }
.plane-piece .prose-preview > p:first-of-type::first-letter { font-family: var(--display); float: left; font-size: 4.2em; line-height: 0.74; font-weight: 400; padding: 0.05em 0.1em 0 0; color: var(--brass); }
.plane-piece .prose-full > p:first-of-type::first-letter { font-family: var(--display); float: left; font-size: 4.2em; line-height: 0.74; font-weight: 400; padding: 0.05em 0.1em 0 0; color: var(--brass); }

/* DAY CHAPTERS */
.chapter { padding: 3.5rem 0; border-bottom: 1px solid var(--line); }
.chapter.is-past { opacity: 0.55; }
.chapter.is-today { border-left: 2px solid var(--brass-dim); padding-left: 1.25rem; margin-left: -1.25rem; }
.chapter-status { font-family: var(--sans); font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--brass); margin-bottom: 0.5rem; }
.chapter-head { margin-bottom: 2rem; display: flex; gap: 1.25rem; align-items: baseline; }
.chapter-numeral { font-family: var(--display); font-size: 2.4rem; font-weight: 300; font-style: italic; color: var(--brass-dim); line-height: 1; flex-shrink: 0; width: 1.6em; text-align: center; }
.chapter-head .meta { flex: 1; }
.chapter-dow { font-family: var(--sans); font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mist); margin-bottom: 0.4rem; }
.chapter-dow .date { color: var(--brass); }
.chapter-title { font-family: var(--display); font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 400; line-height: 1.05; letter-spacing: -0.01em; font-optical-sizing: auto; }
.chapter-essay { margin-bottom: 2.5rem; }
.chapter-essay .prose { font-size: 1.02rem; }
.chapter-essay .prose > p:first-of-type::first-letter { font-family: var(--display); float: left; font-size: 3.2em; line-height: 0.76; font-weight: 400; padding: 0.06em 0.09em 0 0; color: var(--brass-dim); }

/* SPINE */
.spine { position: relative; padding-left: 2.5rem; }
.spine::before { content: ''; position: absolute; left: 5px; top: 0.5rem; bottom: 0.5rem; width: 1px; background: linear-gradient(var(--brass-dim), var(--line) 90%); }
.stop { position: relative; margin-bottom: 2rem; }
.stop:last-child { margin-bottom: 0; }
.stop::before { content: ''; position: absolute; left: calc(-2.5rem + 1px); top: 0.45rem; width: 11px; height: 11px; border-radius: 50%; background: var(--night); border: 1.5px solid var(--brass-dim); }
.stop[data-kind="food"]::before { border-color: var(--brass); }
.stop[data-kind="culture"]::before { background: var(--brass); border-color: var(--brass); }
.stop[data-kind="rest"]::before { border-style: dotted; }
.stop-time { font-family: var(--sans); font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.08em; color: var(--brass); text-transform: uppercase; }
.stop-title { font-family: var(--display); font-size: 1.18rem; font-weight: 500; color: var(--paper); margin: 0.1rem 0 0.25rem; line-height: 1.25; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
.stop-note { font-family: var(--sans); font-size: var(--fs-sm); color: var(--mist); line-height: 1.6; }
.stop-links { margin-top: 0.45rem; display: flex; gap: 1.1rem; }
.stop-links a { font-family: var(--sans); font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--brass-dim); text-decoration: none; }
.stop-links a:hover { color: var(--brass); }

/* TAGS */
.tag { font-family: var(--sans); font-size: 0.6rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.18em 0.6em; border-radius: 2px; white-space: nowrap; }
.tag.confirmed { color: var(--good); border: 1px solid color-mix(in srgb, var(--good) 40%, transparent); }
.tag.pending { color: var(--pend); border: 1px solid color-mix(in srgb, var(--pend) 40%, transparent); }
.tag.open { color: var(--open); border: 1px solid color-mix(in srgb, var(--open) 40%, transparent); }

/* CONTEXT EXPAND */
.ctx { margin-top: 0.75rem; }
.ctx-toggle {
  display: inline-flex; align-items: center; gap: 0.45rem; cursor: pointer;
  background: none; border: none; padding: 0;
  font-family: var(--sans); font-size: var(--fs-xs); font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--brass-dim);
  transition: color 0.15s;
}
.ctx-toggle:hover { color: var(--brass); }
.ctx-toggle .arr { font-size: 0.75rem; transition: transform 0.2s; display: inline-block; }
.ctx-toggle.on .arr { transform: rotate(90deg); }
.ctx-body {
  display: none; margin-top: 1rem;
  padding: 1.1rem 1.25rem; background: var(--night-2);
  border-left: 2px solid var(--brass-dim); border-radius: 0 4px 4px 0;
}
.ctx-body.on { display: block; }
.ctx-body .prose p { font-size: var(--fs-sm); color: var(--paper-dim); margin-bottom: 1em; }
.ctx-body .prose p:last-child { margin-bottom: 0; }
.ctx-body .prose > p:first-of-type::first-letter { font-family: var(--display); float: left; font-size: 2.8em; line-height: 0.76; font-weight: 400; padding: 0.06em 0.08em 0 0; color: var(--brass-dim); }

/* LEDGER */
.ledger { padding: 3.5rem 0; border-bottom: 1px solid var(--line); }
.section-label { font-family: var(--sans); font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--brass-dim); margin-bottom: 1.5rem; }
.ledger-list { display: flex; flex-direction: column; }
.ledger-row { display: flex; align-items: baseline; gap: 1rem; padding: 0.7rem 0; border-bottom: 1px solid var(--line); }
.ledger-row:first-child { border-top: 1px solid var(--line); }
.ldot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; align-self: center; }
.ldot.confirmed { background: var(--good); }
.ldot.pending { background: var(--pend); }
.ldot.open { background: var(--open); }
.ledger-main { flex: 1; min-width: 0; }
.ledger-label { font-family: var(--display); font-size: 1.05rem; font-weight: 500; }
.ledger-sub { font-family: var(--sans); font-size: var(--fs-xs); color: var(--mist); margin-top: 0.1rem; }
.ledger-state { font-family: var(--sans); font-size: 0.62rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; flex-shrink: 0; }
.ledger-state.confirmed { color: var(--good); }
.ledger-state.pending { color: var(--pend); }
.ledger-state.open { color: var(--open); }
.ledger-row a.go { font-family: var(--sans); font-size: var(--fs-xs); color: var(--brass-dim); text-decoration: none; flex-shrink: 0; }
.ledger-row a.go:hover { color: var(--brass); }

/* POCKET */
.pocket { padding: 3.5rem 0; }
.pocket-group { margin-bottom: 0.5rem; }
.pocket-toggle { width: 100%; display: flex; align-items: center; justify-content: space-between; background: none; border: none; border-bottom: 1px solid var(--line); padding: 0.9rem 0; cursor: pointer; color: var(--paper); font-family: var(--display); font-size: 1.15rem; font-weight: 500; text-align: left; }
.pocket-toggle .chev { font-family: var(--sans); color: var(--brass-dim); font-size: 0.9rem; transition: transform 0.2s; }
.pocket-toggle.on .chev { transform: rotate(90deg); }
.pocket-body { display: none; padding: 0.5rem 0 1rem; }
.pocket-body.on { display: block; }
.pocket-item { padding: 0.55rem 0; border-bottom: 1px solid var(--line); }
.pocket-item:last-child { border-bottom: none; }
.pocket-item .n { font-family: var(--display); font-size: 1rem; font-weight: 500; color: var(--paper-dim); }
.pocket-item .d { font-family: var(--sans); font-size: var(--fs-sm); color: var(--mist); line-height: 1.5; margin-top: 0.1rem; }

footer { padding: 3rem 0 4rem; text-align: center; font-family: var(--sans); font-size: var(--fs-xs); color: var(--line-2); letter-spacing: 0.1em; }

/* FAB */
.fab { position: fixed; bottom: 1.4rem; right: 1.4rem; z-index: 50; width: 50px; height: 50px; border-radius: 50%; background: var(--brass); color: var(--night); border: none; cursor: pointer; font-family: var(--display); font-size: 1.3rem; box-shadow: 0 6px 20px rgba(0,0,0,0.4); transition: transform 0.15s; }
.fab:hover { transform: scale(1.06); }
.notepanel { position: fixed; bottom: 5.2rem; right: 1.4rem; z-index: 50; width: min(310px, calc(100vw - 2.8rem)); background: var(--night-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 1rem; box-shadow: 0 10px 40px rgba(0,0,0,0.5); display: none; }
.notepanel.on { display: block; }
.notepanel textarea { width: 100%; height: 80px; resize: none; background: var(--night); color: var(--paper); border: 1px solid var(--line-2); border-radius: 4px; padding: 0.6rem; font-family: var(--sans); font-size: var(--fs-sm); }
.notepanel textarea:focus { outline: 1px solid var(--brass-dim); }
.notepanel .save { margin-top: 0.5rem; width: 100%; padding: 0.5rem; background: var(--brass); color: var(--night); border: none; border-radius: 4px; font-family: var(--sans); font-weight: 600; font-size: var(--fs-sm); cursor: pointer; }
.notelist { margin-top: 0.6rem; max-height: 130px; overflow-y: auto; }
.noteitem { font-family: var(--sans); font-size: var(--fs-xs); color: var(--paper-dim); padding: 0.4rem 0; border-bottom: 1px solid var(--line); line-height: 1.4; }
.noteitem:last-child { border-bottom: none; }
.notelist .empty { font-family: var(--sans); font-size: var(--fs-xs); color: var(--mist); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
</style>
</head>
<body>
<div class="skyglow"></div>
<div class="content"><div class="wrap">

<header class="masthead">
  <div class="eyebrow" id="m-season"></div>
  <h1 id="m-title"></h1>
  <div class="meta" id="m-meta"></div>
  <div id="m-weather"></div>
</header>

<section class="plane-piece" id="plane"></section>

<main id="chapters"></main>

<section class="ledger"><div class="section-label">The bookings</div><div class="ledger-list" id="ledger-list"></div></section>

<section class="pocket"><div class="section-label">Back pocket</div><div id="pocket-wrap"></div></section>

<footer>MELBOURNE · JULY 2026</footer>
</div></div>

<button class="fab" id="fab" aria-label="Add a note">✎</button>
<div class="notepanel" id="notepanel">
  <textarea id="note-ta" placeholder="A thought, an address, a reminder…"></textarea>
  <button class="save" id="note-save">Keep note</button>
  <div class="notelist" id="notelist"></div>
</div>

<script>const TRIP = {
  meta: {
    city: "Melbourne",
    season: "Four nights, deep winter",
    dates: "8–12 July 2026",
    flights: { out: "QF170 CHC 3:45pm → MEL 5:35pm · E8GW8J", ret: "QF167 MEL 9:15am → CHC 2:45pm · E8GW8J · check-in closes 8:15am" },
    base: { name: "192 Little Collins Street", url: "https://maps.google.com/?q=192+Little+Collins+Street+Melbourne" },
    plane: {
      kicker: "Read on the plane",
      title: "You Will Be Let In",
      standfirst: "Melbourne has no view. That is not a flaw in the city. It is the whole argument.",
      preview: `<p>At the entrance to the National Gallery of Victoria, on St Kilda Road, there is a wall of water. It runs down a pane of glass two storeys high, even and unhurried, lit from somewhere you cannot quite locate, and you walk in beside it. Almost everyone touches it. Children press their whole hands flat to the glass and the water parts around their fingers and closes again the instant they pull away. Adults do it too, quickly, and then pretend they had not. Nobody photographs it, or nobody who tries comes away with anything. It is a thing you have to be standing in front of, with your hand out, to understand at all. And that is the first instruction Melbourne gives you, before you have seen a single painting: the reward here is on the inside, and the way to it runs through a surface.</p>`,
      full: `<p>At the entrance to the National Gallery of Victoria, on St Kilda Road, there is a wall of water. It runs down a pane of glass two storeys high, even and unhurried, lit from somewhere you cannot quite locate, and you walk in beside it. Almost everyone touches it. Children press their whole hands flat to the glass and the water parts around their fingers and closes again the instant they pull away. Adults do it too, quickly, and then pretend they had not. Nobody photographs it, or nobody who tries comes away with anything. It is a thing you have to be standing in front of, with your hand out, to understand at all. And that is the first instruction Melbourne gives you, before you have seen a single painting: the reward here is on the inside, and the way to it runs through a surface.</p>

<p>Consider what that building declines to do. It does not face the river. It does not climb a hill to hand you a panorama. It sits flat on a wide grey boulevard behind a moat of its own water, a bluestone keep by the architect Roy Grounds, and it keeps its best things indoors, where neither the weather nor the street can reach them -- the Tiepolo of Cleopatra at her banquet, the Leonard French ceiling of coloured glass that you have to lie on the floor of the Great Hall to see properly, on your back, like everyone else who has worked out that this is the only correct posture for it. Melbourne is a city organised around that instinct. And the instinct exists because Melbourne, almost uniquely among the cities people fly a long way to see, has no view.</p>

<p>Most great cities are conducting a love affair with their own geography, and the affair is the first thing you are shown. You are over the water and then the bridge is there, and the white sails, and you have seen the famous thing before the wheels are down. Sydney does this to you. Sydney has the harbour, which is not a body of water so much as a permanent argument in the city's favour, settled in advance of any conversation. You can photograph Sydney before you have landed in it. Melbourne offers the descending passenger almost nothing. A flat brown plain. A river the colour of weak tea that appears, from above, to be running the wrong way. Weather that will change its mind four times before you reach the carousel. There is no single image of the place, because the place was not built to be looked at from outside. It was built to be entered.</p>

<p>The two cities have spent the better part of two centuries in a rivalry so old that Australians have stopped noticing it is strange. Sydney came first, in 1788, as a prison -- a beautiful one, but a prison, founded by people who had not chosen to be there. Melbourne was settled free, in 1835, by men who came overland and by sea for grass and stayed for something far better than grass. The competition between the two for primacy was real, and it was so genuinely unresolvable that when the colonies federated in 1901 the new country could not bring itself to name either as its capital. The compromise was to invent a third city, from nothing, in a sheep paddock at a careful distance from both, and to call it Canberra. In the meantime Melbourne kept the federal parliament as a lodger for twenty-six years, in a borrowed chamber on Spring Street, and then stood on the platform and watched the Commonwealth pack up and leave for the paddock it had commissioned. This is worth holding onto. Melbourne was, for a quarter of a century, the centre of the country. And then it was not. It has never entirely stopped being the kind of place that knows, in its bones, what it is to be the one passed over.</p>

<p>The money for all of it -- the boulevards, the gallery, the swagger that made the rivalry worth having -- came straight up out of the ground. Gold was found in the colony of Victoria in 1851, at Ballarat and then Bendigo, in fields so rich they had no rival anywhere on earth. The effect on Melbourne was not growth so much as detonation. The population multiplied in a decade. The harbour filled with ships that simply stopped, because the crews had walked off them and up to the diggings, and for a while the bay was a forest of abandoned masts. By the 1880s the city was, per head, among the wealthiest on the planet, and it built exactly the way a place builds when it has more money than memory. A visiting English journalist, George Augustus Sala, supplied the slogan in 1885 -- Marvellous Melbourne -- and the marvel was largely architectural. The cathedral-scaled banks on Collins Street. The glass-roofed arcades, the Block and the Royal, dropped into the middle of the grid like jewel cases. The cast-iron terraces marching out through Carlton and Fitzroy and East Melbourne, lace verandahs on every one. The Royal Exhibition Building, thrown up in Carlton Gardens in 1880 for an international fair, a dome on a hill, grand out of all proportion to anything the young colony actually needed it to do.</p>

<p>The gold did more than fill the banks. It brought a particular kind of person and bred a particular kind of temper. The people who poured into Victoria in the 1850s had, almost all of them, chosen to come, which set them apart from the reluctant founders of the colony to the north. They had crossed the world on a rumour and then stood knee-deep in the same freezing mud as the man beside them, gentleman and labourer levelled by the same creek, and the experience left a mark on the place that has never quite worn off. In 1854 a few hundred of them, sick of licence fees and high-handed troopers, threw up a rough timber stockade at Ballarat called Eureka and were shot down inside it before dawn, and the colony has been telling itself the story ever since as a sort of founding myth -- self-made men declining, fatally, to be told what to do by their betters. Some of that is sentiment. The residue, though, is real, and you can still feel it: a city congenitally suspicious of inherited authority, faintly allergic to being instructed in what it ought to admire. A place put together like that was never going to fall for an obvious view.</p>

<p>And then, in the early 1890s, it stopped. The land boom that had inflated the whole spectacle collapsed inside about two years. Banks shut their doors. The speculative fortune that had paid for Marvellous Melbourne turned out to have been mostly paper, and the paper burned. Here is the part the boosters leave out, and the part that explains more about the city you are about to walk through than any amount of talk about coffee. The crash is the reason the architecture survived. Confident cities knock their grandeur down -- they demolish one era's masterpieces to make room for the next era's, because each new wave of money wants its own monument. Melbourne's confidence broke early and stayed broken long enough that the boom city had no chance to be replaced. It fossilised. The Melbourne you move through is the preserved exuberance of a single hysterical generation, kept intact by the poverty that came after it. Marvellous Melbourne is, in the most literal sense, a city that could not afford to stop looking like itself.</p>

<p>Now look down, away from the grand fronts, into the spaces between them. The plan of the central city was pegged out in 1837 by a surveyor named Robert Hoddle, and it is the reason the place reads, on a map, like graph paper. Wide main streets, each a chain across. Between them, the so-called little streets -- Little Collins, Little Bourke, Little Lonsdale -- and behind and between those, narrower still, the service lanes. This is the crucial fact, and it is the opposite of romantic: the lanes were never meant to be seen. They were the working underside of a Victorian city. Deliveries came through them. Stables opened onto them. Nightcarts ran along them in the dark, and the rear doors of every shop and chophouse faced into them. For most of a century the lanes of Melbourne were precisely the parts of the city you were not supposed to look at, the back-of-house of the whole grand performance happening one street over.</p>

<p>The transformation came late, and it came partly by policy. In the 1990s the city council, alarmed at a hollow centre that emptied at six o'clock, set out deliberately to put residents back into the grid. At around the same time the liquor laws changed, and it became possible to open a small bar without first proving you would also run a restaurant. Those two dry administrative facts did more for the texture of Melbourne than any amount of civic poetry. Coffee moved into the lanes first, then bars, then galleries up unmarked stairs, then the rest. And so the city took the part of itself it had been built to conceal and made it the part it is now known for, which is the whole Melbourne manoeuvre in miniature. The good room is up a stair behind a kitchen, with no sign. You will not find it by looking. You have to be told. The reward, once again, is conditional, and interior, and given only to the person who already knows to go down the lane that looks like it leads nowhere.</p>

<p>What grew up in those lanes rewards the specific over the general, which is the only honest way to speak about them at all. Hosier Lane, off Flinders Street, where the walls are repainted by strangers faster than anyone can keep up. Centre Place and Degraves Street, each barely wide enough for two people and a chalkboard, lined the whole length with the small tables of rooms that seat eleven. Hardware Lane at lunch, loud with cutlery. The unmarked door on Meyers Place, where the small-bar movement is usually said to have begun, opening onto a stair, and at the top of the stair a low room of forty people who all somehow knew. None of it announces itself. A first-time visitor walks straight past the best of it, every time, and is meant to. The pleasure is built to be earned, and the earning turns out to be half the pleasure.</p>

<p>There is one stretch of the grid that did not wait for the 1990s to learn how to be itself. Chinese arrivals came to Victoria for the same gold as everyone else, from the 1850s, in numbers that frightened the colony into some of its uglier laws, and they settled along Little Bourke Street. That settlement has been continuously inhabited ever since. It is the oldest continuous Chinese settlement in the western world, and the load-bearing word is continuous -- not the biggest, not the most photographed, but the longest unbroken. While the wider city boomed and crashed and re-skinned its surface every generation or two, these few blocks simply went on being what they were. The herbalists and the family associations. The banquet rooms up the narrow stairs, the ones with the lazy Susans and the fluorescent light and the food that has nothing to apologise for. A lunar new year that has run, with pauses only for plague and war, for the better part of a hundred and seventy years. It is the deepest version of the Melbourne instinct there is: a whole culture that has survived by happening indoors, in rooms you have to know how to enter, handed down without interruption while everything around it was knocked over and built again.</p>

<p>Even the gallery's greatness arrived in this manner -- quietly, from inside, as a gift. The National Gallery of Victoria was founded in 1861, which made it older than most institutions in the country and considerably older than the country itself, an early and faintly outrageous bet that a raw gold town at the bottom of the world ought to own art on the scale of an old European capital. The bet was paid off by a man almost nobody had heard of. Alfred Felton was a reclusive bachelor chemist who lived out his last years in a boarding house in St Kilda, and when he died in 1904 he left half of a very large fortune in trust, to be spent buying pictures for the gallery, in perpetuity. That single bequest is the reason a provincial city at the edge of everything owns a Rembrandt and a Poussin and the Tiepolo, why the collection punches so far above the town's size that first-time visitors assume some administrative error has occurred. The ambition was always there, plain and a little absurd. What made it real was a fortune handed over in private by a man who wanted his name on nothing he would ever be in the room to see.</p>

<p>Put it together and a single shape emerges. A city with nothing to show from the outside. A city that expected to be the centre of its country and then watched the centre move elsewhere. A city sitting on the frozen wealth of one delirious decade, unable to tear it down. A place that took all of this and decided, more or less consciously, to make the interior the entire point -- the bar behind the kitchen, the gallery behind the water, the banquet room at the top of the stairs, the studio up in the old building where the printmaker and the perfumer keep their doors open. From outside, from the window seat, from Sydney, all of this can read as coldness, or worse, as a kind of snobbery -- the persistent sense that Melbourne is holding something back from you, that you are being kept just outside the door. And it is true that you are, at first. The city does not rush to be liked.</p>

<p>But the inwardness is not a refusal, and to read it as one is to miss the city entirely. It is the exact opposite of a refusal. It is what a place does when it has decided that, having nothing to display on the outside, it will put everything it has behind doors, up stairs, down lanes, on the far side of a wall of falling water, and give it -- generously, completely, without stinting -- to anyone who comes close enough to reach in. The selectiveness is the delivery mechanism, not the point. The point is what is on the other side, and there is a great deal on the other side.</p>

<p>Which is why the right season to arrive is the one most people are warned off. In July the boulevards are wet by four o'clock and dark not long after, the river goes from weak tea to ink, and the whole flat city stops pretending it has a single thing worth seeing out of doors -- because it never did, out there, and now it has the honesty not to bother. Everything that matters moves inside. Into the banquet rooms and the small bars and the gallery with the moat around it, into the warm and the low-ceilinged and the lit. The performance the city has been keeping back all summer, behind all those discreet fronts, is finally the only show in town. You came across the water from one island and you will land on the edge of another country with nothing to look at, and that is correct, and it is not a disappointment. You will not see Melbourne from the plane. There is nothing to see. You will be let into it instead, one room at a time, over four short nights, until the last of them, when you find you would rather not leave -- which is the one thing no view has ever managed to do for anyone.</p>

<p>Put your hand out. The water parts. That is how you go in.</p>`

      id: "wed", dow: "Wednesday", date: "8 July", chapter: "I",
      title: "Landing Into the Dark",
      essay: `<p>Descent into a winter city comes in two parts. First the lights -- the orange grid of the outer suburbs, the strung filaments of the freeways, the wet black shine of everything in the gaps between -- and then, without ceremony, the ground, and the particular cold that meets a body on the airbridge of a southern city in July. A cold with the sea somewhere in it. You crossed the water from one island and put down on the lip of a whole continent, and for the first hour none of it belongs to you. The taxi rank. The motorway. The green signs with names on them that mean nothing yet. This is the most foreign the place will ever feel, and the good news is that it lasts about forty minutes.</p>
<p>Then a door, and a set of stairs, and a flat above a street in the dead centre of the grid, with the bags finally down and the long sigh of having arrived somewhere. There is a version of this evening that ends here, with toast and an early collapse, and it is a mistake. Arrival is not a place you reach by landing. It is a thing that happens later, somewhere warm, the moment you sit down at a counter you did not have to find and order the first thing without thinking too hard about it.</p>
<p>So you go back out into the cold, which is shorter than you feared, the length of a narrow street, and into a long lit room that was full before you got there and will be full after you leave. Sherry, and small salted things, and the particular heat that comes off other people who are already mid-evening and have no idea you have just crossed a sea. A room that has held this same corner for twenty years and intends to hold it for twenty more. You are nobody here, which is the whole relief of it. The displacement of the airport drains out somewhere around the second glass, and the city, which showed you nothing on the way down, quietly opens its first door.</p>`,

            label: "About Bar Lourinhã",
            body: `<p>Matt McConnell and his partner Jo Gamvros opened this room in 2006, and it has been part of the city's dining furniture ever since -- one of the venues that anchored what the CBD laneway culture later became. Twenty years on, the room still does what it was always designed to do: feed people well at the bar, without ceremony.</p>
<p>The decor resists description and rewards inspection. A Russian vodka bottle shaped like a rifle. Religious iconography from several traditions, none of them serious. Op-shop paintings massed floor to ceiling. The accumulated curiosity of two decades of passionate collecting by people who have eaten their way around the Iberian Peninsula many times. It is someone's living room if that someone happened to also be an acclaimed chef.</p>
<p>The food is Iberian and Mediterranean, and it is deeply interested in good ingredients: pipis steamed with fino sherry; spiced chickpeas and spinach that reviewers have mentioned for fifteen years without it getting old; grilled chorizo and pork liver pintxos; the kingfish pancetta tostada that Gourmet Traveller once called a signature not just for this room but for Victoria. The blackboard wine list leans Spanish without being didactic. Ask the kitchen what is good tonight and order accordingly. This is not a place for main-and-sides thinking; three or four plates across the evening is the method.</p>`

      id: "thu", dow: "Thursday", date: "9 July", chapter: "II",
      title: "Work, Then the North, Then a Dane",
      essay: `<p>Few discomforts are as exquisite as having a city laid out below the window and choosing, for a morning, not to have it. Light comes up grey and then gold over the grid. Trams start their grinding down on the wide street. And you sit with a laptop and a coffee gone cold, doing the work that paid for the trip, while the most interesting place you have been in months waits on the other side of the glass with its hands in its pockets. There is a discipline to it, and a strange pleasure, the pleasure of deferral. The day is a held breath. You know exactly when it will be let out.</p>
<p>Two o'clock is the exhale. North on a rattling tram, out of the formality of the centre and across an invisible line into older, looser country -- nineteenth-century terraces with their iron lace, shopfronts that have been forty different things, a street that wears every decade it has lived through at once and apologises for none of them. The pace drops. The buildings come down to two storeys and human scale. You drift west on foot with no particular errand, past the galleries and the op shops and the front bars filling early, and the afternoon does the thing afternoons in this part of town are good at, which is to dissolve.</p>
<p>And then the day gathers itself for something it has been pointing at all along. A small room, a bare stage, the house lights down. One person, alone, with no set and no help, standing in for an entire poisoned court -- the prince and the ghost and the drowned girl and the clown with the skull, all of it passing through a single body in a single voice that keeps changing hands. There is nowhere to hide up there and nothing to hide behind, which is the entire point of attempting it this way. A whole kingdom of grief and delay and bad decisions, held for two hours inside one figure on an empty floor. You walk back out into the cold afterwards turning it over, the way the best evenings make you, slightly altered, not quite ready to talk.</p>`,

          expand: {
            label: "What to do on Gertrude Street",
            body: `<p>Gertrude Street runs only six blocks from Smith to Nicholson, but it concentrates more of what makes Melbourne interesting per metre than almost anywhere in the city. Time Out ranked it the second coolest street in the world in 2022, which is both accurate and beside the point -- the locals who eat and drink here have not noticed the accolade and do not behave accordingly.</p>
<p>Walk west from the Smith Street corner. On your left almost immediately: Gertrude Contemporary at 21-31 High Street (the Gertrude Street end), an artist-run space that has been showing emerging and mid-career work since 1985. Free entry, always worth fifteen minutes if there is an exhibition on. Further along: Marion at number 53, Andrew McConnell's wine bar, which does 25-plus wines by the glass and plates of mussels on fried bread and nduja. It is one of the better places to sit alone in Melbourne with a glass of something and no agenda. Cutler and Co a little further, McConnell's fine-dining flagship in a converted metalworks factory -- a different occasion, but worth knowing it exists. The Australian Print Workshop. Archie's All Day at 189 for coffee. The Everleigh upstairs at around 150 -- a pre-Prohibition cocktail parlour in a 1920s room, open Thursday to Saturday from 5pm -- if you find yourself still there at that hour, which is not impossible.</p>
<p>Brunswick Street is longer, louder and more tourist-aware. It has good bookshops (Brunswick Street Bookstore, Polyester Records for vinyl), and is worth the overflow if Gertrude has not taken all your time. But Gertrude is the one to prioritise. The neighbourhood rewards a slow pace and punishes a checklist mentality. Leave Fitzroy by half four or five at the latest -- dinner has a deadline tonight.</p>`

            label: "About Tipo 00",

<p>The menu is short by design: a handful of starters, five or six pastas, a couple of mains for anyone who has found themselves in an Italian restaurant and does not want pasta. The right answer is pasta. Specifically the tagliolini al nero -- squid ink, seafood broth, a dish that reviewers keep returning to as the single thing you must order. The gnocchi with braised duck and porcini runs it close in winter. The Tipomisu is the dessert, a riff on tiramisu that is both better than it sounds and easier to eat than the original. The counter seats eight or ten and faces the open kitchen; for one diner it is the only seat worth having.</p>

        { time: "7:00pm", title: "Eddie Izzard, Hamlet", kind: "culture", state: "confirmed",

          expand: {
            label: "About the show",
            body: `<p>Suzy Izzard performs all 23 characters of Shakespeare's Hamlet alone on a bare stage with no set, no props, no costume changes. The adaptation is by her brother Mark Izzard and the direction by Selina Cadell, who came from the RSC; the production itself came from triple-extended runs in New York, Chicago and London, where it was nominated for the Drama League's Distinguished Performance Award. Judi Dench called it spectacular. The Chicago Tribune said Izzard "smashes all three of the great soliloquies." Melbourne has the longest run on the Australian tour -- three weeks, closing 12 July, so you are there two days before the end.</p>
<p>The Limelight review from the Sydney season is worth reading before you go. The critic found it better than anticipated but honest about the trade-offs: 23 characters voiced by one person means narrative clarity sometimes suffers, particularly the supernatural elements and the final sword fight, which is reduced to what the reviewer called "a comical pantomime." What it gains in return is the text at its purest -- no set to look at, no other actors to watch, just Shakespeare's language and one performer's complete attention to it. Izzard, 64, trained for years as a street performer and stand-up before turning to theatre, and the soliloquies in particular -- "To be or not to be," "What a piece of work is a man," the graveyard scene -- are delivered with what reviewers describe as genuine force.</p>
<p>F15 is front stalls, close enough to see her face. That is the right ticket for a show built on one person's expression.</p>`

      id: "fri", dow: "Friday", date: "10 July", chapter: "III",
      title: "The City's Interior",
      essay: `<p>Some buildings cannot be read from the street at all. You can stand across the road and take in the 1920s stonework, the worn brass of the lobby, the lift with the folding gate, and understand almost nothing, because the building's entire life is happening on the upper floors, behind doors, in rooms the size of a generous cupboard. Go up. On the right day the doors stand open and the landings give off a confusion of smells -- cut paper and printing ink, hot wax, the strange dry sweetness of perfume oils being blended by hand. A milliner here. A bookbinder there. A painter who has held the same north light for thirty years. A working hive of people making small things slowly, stacked floor on floor in the middle of a city that mostly forgets they are up there.</p>
<p>Down at street level the lanes do the same trick in reverse, threading between the grand fronts, the city's working underside turned into its quiet pleasure. You move through them with no map worth the name, taking the turn that looks like it leads to a loading dock and finding it leads somewhere better. It is a morning spent going inward and upward, into the parts of the place that keep themselves just out of sight, and it tunes the eye for what the afternoon has in store.</p>
<p>Because the afternoon offers the opposite kind of interior. A gallery gone deliberately dark, and inside it, in case after lit case, a century of stones cut to do one thing only, which is to throw light back at you harder than it fell. Necklaces built like architecture. A tiara that outlived the head it was made for. The whole glittering logic of a house that decided rarity should be worn, and engineered, and kept. After a morning of ink and felt and patient hands, here is concentration of a different order -- value pressed down into the smallest possible space and made to shine in the dark. Two ways of keeping the best things inside, an afternoon apart, and the city fluent in both.</p>`,

          expand: {
            label: "About the Nicholas Building",
            body: `<p>Built in 1926, the Nicholas Building is a heritage office tower on the corner of Swanston and Flinders Lane that most people walk past every day without entering. The ground floor is retail. Everything above it is studios, workshops, and small galleries rented by the kinds of creative people who need a physical space but not a shopfront.</p>
<p>Take the original lift to any floor and push on the doors that are unlocked. Behind them on a Friday morning you might find: a letterpress studio with a Heidelberg press still in daily use; a vintage clothing dealer with stock that has been accumulating since the 1970s; a milliner; a small gallery changing shows every month or two; a perfumer making fragrance to commission; a printmaker. Nobody is performing for visitors. The doors are open because it is a working building and there is no reason to close them. That is the texture of what you find.</p>
<p>The Cathedral Arcade on the ground floor, accessible from Swanston Street, has been there since 1927 and has the same quality: independent, idiosyncratic, genuinely old rather than vintage-branded. Allow an hour in the building and do not try to see everything. Follow what interests you.</p>`

          map: "https://maps.google.com/?q=NGV+International+180+St+Kilda+Road+Melbourne",
          expand: {
            label: "About the exhibition",
            body: `<p>The exhibition begins chronologically with the moment the company stopped being a competent Parisian jeweller and became something else entirely. In 1900, Louis, Pierre and Jacques Cartier inherited their grandfather's firm and opened branches in London and New York within a decade. They also started collecting clients: the Maharaja of Patiala, King Edward VII, the Duchess of Manchester, Dame Nellie Melba. The Maharaja commissioned a necklace requiring 2,930 diamonds anchored by a 234-carat yellow diamond; it was lost after Indian independence, rediscovered in 1998 stripped of its stones, and Cartier replaced them with replicas. Both versions are here.</p>
<p>The exhibition is organised thematically. A bold yellow room traces the brothers' world of inspiration across India, Egypt, Iran, China and Japan -- the Tutti Frutti collection has its own space: carved rubies, emeralds and sapphires stacked into bracelets and clips, the stones cut to echo Indian jewellery traditions, the settings unmistakably 1920s French. Jeanne Toussaint gets her own gallery. Creative director from 1933 to 1970, she elevated the panther from a repeating motif into an emblem -- the Duchess of Windsor's panther clip, a platinum cat crouching on a 152-carat cabochon sapphire, is here. The watches room sits midway as a palate cleanser: the 1914 Model A mystery clock, diamond-encrusted hands appearing to float with no visible mechanism, is the piece the Cartier Collection director said she would save in an emergency. The final gallery is entirely tiaras, twenty-four of them, including the Scroll Tiara of 1902 worn by Clementine Churchill at the coronation and later photographed on Rihanna for W Magazine.</p>
<p>The exhibition design is by Studio Sabine Marcelis and CLOUD from Rotterdam: coloured rooms that read as settings for the stones. An original score by Ai Yamamoto and Erkki Veltheim runs throughout. The guided tour at 2:30pm covers the key objects in 45 minutes; register at the desk on arrival. Allow two hours minimum for the full exhibition.</p>`

        { time: "6:30pm", title: "Saadi", kind: "food", state: "confirmed",

          expand: {
            label: "About Saadi",
            body: `<p>Saavni Krishnan and Sriram Aditya spent three years running Saadi as a pop-up around Melbourne -- one night at Etta, a residency at Public Wine Shop, a run at Manzé -- before Adipoetra Halim, who also owns the Hotel Windsor and Aru, offered them the former Sunda space on Punch Lane. They took a month-long residency in May 2025, extended it through July, and then made it permanent. It opened as a restaurant in September 2025.</p>
<p>Krishnan was raised in Mumbai to Punjabi and Tamilian parents, worked at Fred's in Sydney and then as sous-chef at Manzé in Melbourne. Aditya is Tamilian, his father's postings with the Indian Navy exposing him to food cultures across the subcontinent; he was most recently head chef at Gemini in Coburg. Their menu is pan-Indian rather than regionally specific, and it is explicitly not curry -- "Indian food that is unique to us, mostly gluten-free, can be made vegan, and is not curry" is how they put it on the website. What it is instead: family recipes from both sides, reworked with the technique of twelve years in serious Australian kitchens. A celeriac achar based on Krishnan's grandmother's recipe. Pulikachal -- a simmered tamarind sauce from Aditya's mother -- served with Corner Inlet flathead or lamb brisket. Idli topped with spiced Dutch carrots. The menu changes quarterly with the produce.</p>
<p>Friday is the $85 four-course set menu. Broadsheet put it on their Hot List within weeks of opening. It is the most genuinely new thing you will eat on this trip.</p>`

      id: "sat", dow: "Saturday", date: "11 July", chapter: "IV",
      title: "Market, Gardens, a Laneway Kitchen",
      essay: `<p>No alarm. That alone changes the shape of the air in a room. Light arrives and is allowed to, and the first hour belongs to nobody and nothing, which after three scheduled days feels close to extravagant. A day with no time pinned to its front end tends to find its own pace, and its own pace, here, leads to a market.</p>
<p>Under the long sheds the cold is part of the point. Breath shows. Hands stay in pockets between stalls. The deli hall runs warm and dense with the smell of hung meat and cut cheese and coffee held in paper cups for the heat as much as the drink, and the produce rows out the back glisten with the particular self-respect of winter vegetables -- the brassicas, the bitter leaves, the muddy roots that actually want this weather. It is loud and social and faintly competitive, a few thousand people moving through the same cold space on the same loose errand, and it is at its best in the last hour before noon, when it begins, almost imperceptibly, to wind itself down.</p>
<p>From there the day opens out into green. Formal paths, bare plane trees, and rising out of the middle of it a great glass-and-brick hall with a dome, built for a fair a hundred and forty years ago and grand far beyond any use it has now -- a building that once held the opening of a nation's first parliament and these days mostly holds joggers, pigeons, and the long afternoon light. You walk it slowly. There is nowhere you have to be for hours.</p>
<p>And then, as the light goes, the day folds back in on itself. Off a lane, behind a plain door, a counter and a stool and a long sequence of small precise plates arriving one at a time from a kitchen close enough to watch -- one cook's whole argument about where his food comes from and where it has got to, made in courses. The most public day of the trip resolves, at its very end, into its most private hour. The city does this. It opens you all the way out, and then it brings you quietly back in.</p>`,
      events: [
        { time: "Slow", title: "No alarm", kind: "rest", note: "A long coffee. The morning owes you nothing." },
        { time: "~10:00am", title: "Queen Victoria Market", kind: "explore",
          note: "15-minute walk north. Deli hall and produce sheds. Fresh food winds down around midday.",
          map: "https://maps.google.com/?q=Queen+Victoria+Market+Melbourne"
        },
        { time: "~12:30pm", title: "Carlton and the Gardens", kind: "explore",
          note: "20-minute walk northeast or tram. Carlton Gardens and the Royal Exhibition Building. Back to the city by late afternoon.",
          map: "https://maps.google.com/?q=Carlton+Gardens+Melbourne",
          expand: {
            label: "Carlton and the Royal Exhibition Building",
            body: `<p>Lygon Street is Melbourne's Italian quarter and it is worth understanding what that means in practice before you walk down it. The south end near Grattan Street still has places where the chef has been making the same lasagne since 1982, but the north end has absorbed a lot of tourist traffic and adjusted its prices accordingly. The neighbourhood behind it -- Rathdowne Street, the back streets of Carlton -- is quieter and more genuine.</p>
<p>The Carlton Gardens are the destination. The Royal Exhibition Building stands in the centre, a World Heritage listed hall built for the 1880 Melbourne International Exhibition -- predating Federation by twenty years -- that hosted the first sitting of the Australian Parliament in 1901. It is still absurdly grand from the outside: a central dome flanked by pavilions, the whole thing built in thirteen months by a city that needed to impress the world and had the money to do it. The gardens themselves were designed by William Sangster in the 1870s and have the slightly formal quality of Victorian municipal ambition -- axial paths, a fountain, mature elms. In July they are bare and cold and completely without tourists, which makes them ideal.</p>
<p>If the afternoon has more hours than the gardens can fill, the Ian Potter Centre at Federation Square is a 25-minute walk south or a short tram -- free, no booking, Australian and Indigenous art, the counterweight to Friday's European jewels. Otherwise: walk back through the CBD grid at your own pace and be home in time to change before dinner.</p>`
          }
        },
        { time: "6:30pm", title: "Lee Ho Fook", kind: "food", state: "confirmed",
          note: "11-15 Duckboard Place, off Flinders Lane. 5-minute walk from home. Chef's counter, confirmation #11936. Smart business casual, no shorts or sandals. 15-minute grace period. $88/head cancellation within 24 hours.",
          map: "https://maps.google.com/?q=11+Duckboard+Place+Melbourne",
          expand: {
            label: "About Lee Ho Fook",
            body: `<p>Victor Liong arrived in Australia from Brunei at six, grew up in Sydney, trained at Marque under Mark Best and then at Mr Wong, and moved to Melbourne in 2013 to open this room. He named it after the Warren Zevon lyric in Werewolves of London -- "I saw Lee Ho Fook's, getting in a little face" -- which tells you something about the register: serious cooking, not taking itself seriously. The original Collingwood location outgrew itself and moved to Duckboard Place in 2015, where the laneway entrance and moody interior have become part of the identity.</p>
<p>The kitchen uses Chinese tradition as a starting point rather than a constraint -- "explode the atlas and just make sure it's delicious" was how one early reviewer put it. The tasting menu traces Liong's own eating history: mud crab in turmeric sauce references a dish he ate as a student at Flower Drum, Melbourne's other defining Chinese restaurant; braised brisket with elastic noodles recalls childhood trips to Sydney's Chinatown. What the 50 Best Discovery listing called "an emotional odyssey informed by his own experiences of being Malaysian and growing up in Australia."</p>
<p>The maltose-glazed Peking duck is the dish everyone mentions first, and it takes time to prepare -- order it when you sit down. The crispy eggplant with spiced red vinegar is lighter and sharper and worth ordering alongside. The cumin lamb shoulder is the one the kitchen is proudest of. The wine list runs to around 120 bins and includes a page of wines from China, which is unusual and worth exploring. The chef's counter is the right seat for one person: close to the pass, good service, the theatre of the kitchen visible throughout.</p>`
          }
        },
      ]
    },

    {
      id: "sun", dow: "Sunday", date: "12 July", chapter: "V",
      title: "The Early Door",
      essay: `<p>Waking in the dark to leave a place has its own particular flavour, half theft and half farewell. An alarm in the black hours. A flat you have only just learned the sounds of, quiet now in a way it has not been before. Bags by the door where you set them the night before, already half a stranger to the rooms behind you. There is no time for sentiment and that is a mercy, because the clock is the only thing in charge, and the clock says go.</p>
<p>Down on the street the city does, at last, the one thing it has refused to do all week. It shows you its outside. Nothing is open, so there is no inside to be let into -- only the wide wet road under the sodium lights, the shut grand fronts, the lanes black and giving nothing, the whole grid emptied of everyone and, for these few minutes, entirely yours. It is the most of Melbourne you have seen at once, and it is beautiful, and it is closed. You came in through a wall of water four nights ago. You go out through this, the cold and the dark and the empty.</p>
<p>The cab runs the motorway the other way, the green signs unspooling in reverse, the names that meant nothing on the first night meaning a little something now. A bright cold terminal. The long bones of a 737. And then the lift, and the brown plain dropping away below with its river the colour of ink, showing you, even at the end, nothing to photograph. That was always the deal. The city kept everything indoors and gave it to you a room at a time, and now you are taking the warm of it home in place of a view.</p>`,
      events: [
        { time: "5:45am", title: "Up", kind: "travel", note: "Check out before you leave -- key return per the host instructions in the 48-hour email." },

        { time: "9:15am", title: "QF167 home", kind: "travel", note: "Non-stop to Christchurch, in at 2:45pm.", map: "https://maps.google.com/?q=Christchurch+Airport" },
      ]

  ],

  pocket: [

      ["Chin Chin", "125 Flinders Lane. No bookings, always has room, loud and spicy Thai."],

    { group: "Also on right now", items: [
      ["QV Winter Night Market", "Every Wednesday 5-10pm through 26 August, Queen Victoria Market. Street food, fire pits, live music. Free entry."],

</script>
<script>
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

function renderMasthead() {
  document.getElementById('m-season').textContent = TRIP.meta.season;
  document.getElementById('m-title').innerHTML = TRIP.meta.city + ' <em>in July</em>';
  document.getElementById('m-meta').innerHTML = `
    <div class="row"><span class="lbl">When</span>${TRIP.meta.dates}</div>
    <div class="row"><span class="lbl">Base</span><a href="${TRIP.meta.base.url}" target="_blank" rel="noopener">${TRIP.meta.base.name}</a></div>
    <div class="row flight"><span class="lbl">Out</span>${TRIP.meta.flights.out}</div>
    <div class="row flight"><span class="lbl">Home</span>${TRIP.meta.flights.ret}</div>`;
}

function renderPlanePiece() {
  const p = TRIP.meta.plane;
  const sec = document.getElementById('plane');
  let ctxId = 'plane-full';
  sec.innerHTML = `
    <div class="kicker">${p.kicker}</div>
    <h2>${p.title}</h2>
    <p class="standfirst">${p.standfirst}</p>
    <div class="prose prose-preview">${p.preview}</div>
    <div class="ctx" style="margin-top:1.5rem;">
      <button class="ctx-toggle" id="plane-toggle" aria-expanded="false"><span class="arr">›</span> Continue reading</button>
      <div class="ctx-body" id="${ctxId}"><div class="prose prose-full">${p.full}</div></div>
    </div>`;
  document.getElementById('plane-toggle').addEventListener('click', function() {
    this.classList.toggle('on');
    const body = document.getElementById(ctxId);
    body.classList.toggle('on');
    this.setAttribute('aria-expanded', body.classList.contains('on'));
    this.querySelector('.arr').parentNode.childNodes[1].textContent = body.classList.contains('on') ? ' Collapse' : ' Continue reading';
  });
}

let ctxId = 0;
function makeCtx(expand) {
  const id = 'ctx-' + (ctxId++);
  const wrap = el('div', 'ctx');
  const btn = el('button', 'ctx-toggle', `<span class="arr">›</span> ${expand.label}`);
  const body = el('div', 'ctx-body', `<div class="prose">${expand.body}</div>`);
  body.id = id;
  btn.addEventListener('click', () => { btn.classList.toggle('on'); body.classList.toggle('on'); });
  wrap.appendChild(btn); wrap.appendChild(body);
  return wrap;
}

function renderChapters() {
  const wrap = document.getElementById('chapters');
  const DAY_DATES = { wed: '2026-07-08', thu: '2026-07-09', fri: '2026-07-10', sat: '2026-07-11', sun: '2026-07-12' };

  function getMelbourneDate() {
    return new Date().toLocaleString('en-CA', { timeZone: 'Australia/Melbourne' }).slice(0, 10);
  }

  const todayStr = getMelbourneDate();
  const tripActive = todayStr >= '2026-07-08' && todayStr <= '2026-07-12';

  const chapters = [];
  TRIP.days.forEach(day => {
    const ch = el('section', 'chapter'); ch.id = day.id;
    const dayDate = DAY_DATES[day.id];
    let statusLabel = '';

    if (tripActive) {
      if (dayDate < todayStr)        { ch.classList.add('is-past'); statusLabel = 'Yesterday'; }
      else if (dayDate === todayStr) { ch.classList.add('is-today'); statusLabel = 'Today'; }
    }

    if (statusLabel) ch.appendChild(el('div', 'chapter-status', statusLabel));

    ch.appendChild(el('div', 'chapter-head', `
      <div class="chapter-numeral">${day.chapter}</div>
      <div class="meta">
        <div class="chapter-dow">${day.dow} · <span class="date">${day.date}</span></div>
        <div class="chapter-title">${day.title}</div>
      </div>`));

    // Day essay behind expand toggle
    const essayCtxId = 'essay-' + day.id;
    const essayWrap = el('div', 'chapter-essay');
    const essayBtn = el('button', 'ctx-toggle', `<span class="arr">›</span> Read the day`);
    const essayBody = el('div', 'ctx-body', `<div class="prose">${day.essay}</div>`);
    essayBody.id = essayCtxId;
    essayBtn.addEventListener('click', () => { essayBtn.classList.toggle('on'); essayBody.classList.toggle('on'); });
    essayWrap.appendChild(essayBtn);
    essayWrap.appendChild(essayBody);
    ch.appendChild(essayWrap);

    const spine = el('div', 'spine');
    day.events.forEach(ev => {
      const stop = el('div', 'stop'); stop.dataset.kind = ev.kind;
      const tag = ev.state === 'confirmed' ? '<span class="tag confirmed">Booked</span>'
                : ev.state === 'pending'   ? '<span class="tag pending">Waitlist</span>'
                : ev.state === 'open'      ? '<span class="tag open">To book</span>' : '';
      let links = '';
      if (ev.map)  links += `<a href="${ev.map}"  target="_blank" rel="noopener">Map</a>`;
      if (ev.book) links += `<a href="${ev.book}" target="_blank" rel="noopener">Book</a>`;
      stop.innerHTML = `
        <div class="stop-time">${ev.time}</div>
        <div class="stop-title">${ev.title}${tag}</div>
        <div class="stop-note">${ev.note}</div>
        ${links ? '<div class="stop-links">' + links + '</div>' : ''}`;
      if (ev.expand) stop.appendChild(makeCtx(ev.expand));
      spine.appendChild(stop);
    });
    ch.appendChild(spine);
    chapters.push({ el: ch, date: dayDate });
  });

  if (tripActive) {
    chapters.sort((a, b) => {
      const aToday = a.date === todayStr, bToday = b.date === todayStr;
      const aPast  = a.date < todayStr,   bPast  = b.date < todayStr;
      if (aToday && !bToday) return -1;
      if (bToday && !aToday) return 1;
      if (!aPast && bPast)   return -1;
      if (aPast && !bPast)   return 1;
      return a.date < b.date ? -1 : 1;
    });
  }

  chapters.forEach(c => wrap.appendChild(c.el));
}

function renderLedger() {
  const list = document.getElementById('ledger-list');
  const order = { open: 0, pending: 1, confirmed: 2 };
  const label = { confirmed: 'Booked', pending: 'Waitlist', open: 'To book' };
  TRIP.bookings.slice().sort((a,b) => order[a.state] - order[b.state]).forEach(b => {
    const row = el('div', 'ledger-row');
    row.innerHTML = `<span class="ldot ${b.state}"></span>
      <div class="ledger-main">
        <div class="ledger-label">${b.label}</div>
        <div class="ledger-sub">${b.sub}${b.ref ? ' · ' + b.ref : ''}</div>
      </div>
      <span class="ledger-state ${b.state}">${label[b.state]}</span>
      ${b.url ? '<a class="go" href="' + b.url + '" target="_blank" rel="noopener">↗</a>' : ''}`;
    list.appendChild(row);
  });
}

function renderPocket() {
  const wrap = document.getElementById('pocket-wrap');
  TRIP.pocket.forEach(g => {
    const grp = el('div', 'pocket-group');
    const btn = el('button', 'pocket-toggle', `${g.group}<span class="chev">›</span>`);
    const body = el('div', 'pocket-body');
    g.items.forEach(([n,d]) => body.appendChild(el('div', 'pocket-item', `<div class="n">${n}</div><div class="d">${d}</div>`)));
    btn.addEventListener('click', () => { btn.classList.toggle('on'); body.classList.toggle('on'); });
    grp.appendChild(btn); grp.appendChild(body); wrap.appendChild(grp);
  });
}

function initNotes() {
  const fab = document.getElementById('fab'), panel = document.getElementById('notepanel');
  const ta = document.getElementById('note-ta'), list = document.getElementById('notelist');
  const draw = () => {
    const n = JSON.parse(localStorage.getItem('mel_notes') || '[]');
    list.innerHTML = n.length ? n.map(x => `<div class="noteitem">${x}</div>`).join('') : '<div class="empty">No notes yet.</div>';
  };
  fab.addEventListener('click', () => panel.classList.toggle('on'));
  document.getElementById('note-save').addEventListener('click', () => {
    const v = ta.value.trim(); if (!v) return;
    const n = JSON.parse(localStorage.getItem('mel_notes') || '[]');
    n.unshift(v); localStorage.setItem('mel_notes', JSON.stringify(n));
    ta.value = ''; draw();
  });
  draw();
}

async function fetchWeather() {
  const widget = document.getElementById('m-weather');
  if (!widget) return;
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=-37.8136&longitude=144.9631&current=temperature_2m,weather_code&temperature_unit=celsius&timezone=Australia%2FMelbourne';
    const res = await fetch(url);
    if (!res.ok) return;
    const data = await res.json();
    const temp = Math.round(data.current.temperature_2m);
    const code = data.current.weather_code;
    const conditions = (c) => {
      if (c === 0)   return ['☀', 'Clear'];
      if (c <= 2)    return ['⛅', 'Partly cloudy'];
      if (c === 3)   return ['☁', 'Overcast'];
      if (c <= 49)   return ['🌫', 'Fog'];
      if (c <= 59)   return ['🌦', 'Drizzle'];
      if (c <= 69)   return ['🌧', 'Rain'];
      if (c <= 79)   return ['❄', 'Snow'];
      if (c <= 82)   return ['🌦', 'Showers'];
      if (c <= 99)   return ['⛈', 'Thunderstorm'];
      return ['—', ''];
    };
    const [icon] = conditions(code);
    widget.innerHTML = `<div class="weather-widget"><span class="weather-icon">${icon}</span><span class="weather-temp">${temp}°</span><span class="weather-desc">Melbourne now</span></div>`;
  } catch(e) { /* silent fail */ }
}

document.addEventListener('DOMContentLoaded', () => {
  renderMasthead(); renderPlanePiece(); renderChapters(); renderLedger(); renderPocket(); initNotes(); fetchWeather();
});
</script>
