<style>
:root {
  --night:   #14161d;
  --night-2: #1b1e27;
  --night-3: #21252f;

  --max: 760px;
  --fs-xs: 0.7rem; --fs-sm: 0.82rem; --fs-md: 1.05rem;

}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body { background: var(--night); color: var(--paper); font-family: var(--serif); font-size: var(--fs-md); line-height: 1.75; }

.content { position: relative; z-index: 1; }

/* MASTHEAD */
.masthead { padding: 4.5rem 0 2.5rem; }
.masthead .eyebrow { font-family: var(--sans); font-size: var(--fs-xs); font-weight: 500; letter-spacing: 0.32em; text-transform: uppercase; color: var(--brass); margin-bottom: 1.4rem; }
.masthead h1 { font-family: var(--display); font-size: var(--fs-2xl); font-weight: 400; line-height: 0.92; letter-spacing: -0.02em; font-optical-sizing: auto; }
.masthead h1 em { font-style: italic; font-weight: 300; color: var(--brass); }
.masthead .meta { font-family: var(--sans); font-size: var(--fs-sm); color: var(--mist); margin-top: 1.6rem; border-top: 1px solid var(--line); padding-top: 1.2rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem 1.5rem; }
@media (max-width: 480px) { .masthead .meta { grid-template-columns: 1fr; } }

.masthead .meta .lbl { color: var(--mist); flex-shrink: 0; }

.hero-essay .kicker { font-family: var(--sans); font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: var(--brass-dim); margin-bottom: 1rem; }

.hero-essay .standfirst { font-family: var(--serif); font-size: var(--fs-lg); font-weight: 300; font-style: italic; color: var(--brass); line-height: 1.4; margin-bottom: 2rem; max-width: 34ch; }

.cartier-body .prose > p:first-of-type::first-letter { font-family: var(--display); float: left; font-size: 3.6em; line-height: 0.76; font-weight: 400; padding: 0.06em 0.1em 0 0; color: var(--brass-dim); }

.chapter-dow { font-family: var(--sans); font-size: var(--fs-xs); font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--mist); margin-bottom: 0.4rem; }

.chapter-essay { margin-bottom: 2.5rem; }
.chapter-essay .prose { font-size: 1.02rem; }

.spine { position: relative; padding-left: 2.5rem; }

.stop { position: relative; margin-bottom: 1.9rem; }
.stop:last-child { margin-bottom: 0; }
.stop::before { content: ''; position: absolute; left: calc(-2.5rem + 1px); top: 0.45rem; width: 11px; height: 11px; border-radius: 50%; background: var(--night); border: 1.5px solid var(--brass-dim); }
.stop[data-kind="food"]::before { border-color: var(--brass); }
.stop[data-kind="culture"]::before { background: var(--brass); border-color: var(--brass); }
.stop[data-kind="rest"]::before { border-style: dotted; }

.tag.open { color: var(--open); border: 1px solid color-mix(in srgb, var(--open) 40%, transparent); }

.pocket-group { margin-bottom: 0.5rem; }

.pocket-toggle.on .chev { transform: rotate(90deg); }
.pocket-body { display: none; padding: 0.5rem 0 1rem; }
.pocket-body.on { display: block; }
.pocket-item { padding: 0.55rem 0; border-bottom: 1px solid var(--line); }
.pocket-item:last-child { border-bottom: none; }
.pocket-item .n { font-family: var(--display); font-size: 1rem; font-weight: 500; color: var(--paper-dim); }

footer { padding: 3rem 0 4rem; text-align: center; font-family: var(--sans); font-size: var(--fs-xs); color: var(--line-2); letter-spacing: 0.1em; }

/* FAB */
.fab { position: fixed; bottom: 1.4rem; right: 1.4rem; z-index: 50; width: 50px; height: 50px; border-radius: 50%; background: var(--brass); color: var(--night); border: none; cursor: pointer; font-family: var(--display); font-size: 1.3rem; box-shadow: 0 6px 20px rgba(0,0,0,0.4); transition: transform 0.15s; }
.fab:hover { transform: scale(1.06); }
.notepanel { position: fixed; bottom: 5.2rem; right: 1.4rem; z-index: 50; width: min(310px, calc(100vw - 2.8rem)); background: var(--night-2); border: 1px solid var(--line-2); border-radius: 8px; padding: 1rem; box-shadow: 0 10px 40px rgba(0,0,0,0.5); display: none; }
.notepanel.on { display: block; }
.notepanel textarea { width: 100%; height: 80px; resize: none; background: var(--night); color: var(--paper); border: 1px solid var(--line-2); border-radius: 4px; padding: 0.6rem; font-family: var(--sans); font-size: var(--fs-sm); }

.notepanel .save { margin-top: 0.5rem; width: 100%; padding: 0.5rem; background: var(--brass); color: var(--night); border: none; border-radius: 4px; font-family: var(--sans); font-weight: 600; font-size: var(--fs-sm); cursor: pointer; }
.notelist { margin-top: 0.6rem; max-height: 130px; overflow-y: auto; }
.noteitem { font-family: var(--sans); font-size: var(--fs-xs); color: var(--paper-dim); padding: 0.4rem 0; border-bottom: 1px solid var(--line); line-height: 1.4; }

a:focus-visible, button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
</style>

      body: `<p>There is no single thing you have flown across the Tasman to see. No harbour bridge, no opera house, no postcard that organises the rest of the trip around it. Sydney has all that and wears it on the outside. Melbourne keeps its treasures one block back, one floor up, behind a door with no sign, and it will not tell you they are there. The city assumes you are the kind of person who turns down the laneway anyway. Over four nights you are going to prove it right.</p>

<p>You have arrived in the only season that shows you the real place. Summer Melbourne belongs to the tourism board, all rooftop bars and cricket and harsh northern light. Winter Melbourne belongs to the people who live here. The Paris End of Collins Street goes the colour of a bruise around four in the afternoon. The trams throw their light across wet bluestone. Everyone is dressed in black and moving with purpose toward something warm, and the coffee, which is a genuine civic religion here, tastes better for the cold. This is a city that eats late, takes its theatre seriously, and treats a good dinner as a reason to leave the house rather than an interruption to the evening.</p>

<p>Your apartment sits on Little Collins between Swanston and Russell, which is not an accident of booking but the most useful position in the city. Chinatown is three minutes east, the oldest continuous Chinese settlement in the western world, still serving at two in the morning. Flinders Lane, the spine of the laneway dining culture, is four minutes south. The Nicholas Building on Swanston Street -- a heritage tower full of printmakers, perfumers and vintage dealers working with their studio doors open -- is a five-minute walk and one of the great free pleasures of the CBD. You are staying inside the machine, not beside it.</p>

<p>The temptation with a city like this is to schedule it tightly, to treat the laneways as a checklist and the days as a route to be optimised. Resist that completely. The trip is built around a handful of fixed points that genuinely matter: Eddie Izzard performing Hamlet alone in a studio theatre; Cartier's jewelled century spread across the lower galleries of the NGV; a heritage Indian kitchen on Punch Lane doing something nobody else in the city is doing. Around those anchors there is deliberate slack, and the slack is where Melbourne actually happens. A morning with no alarm. An afternoon that drifts from one end of Gertrude Street to the other. The decision, made at five in the cold, about whether to keep walking or duck into the nearest warm room. Leave room to be diverted. That is the whole method.</p>`

    body: `<p>The exhibition begins, chronologically, with the moment the company stopped being a competent Parisian jeweller and became something else entirely. In 1900, Louis, Pierre and Jacques Cartier inherited their grandfather's firm and opened branches in London and New York within a decade. They also started collecting clients: the Maharaja of Patiala, King Edward VII, the Duchess of Manchester, Dame Nellie Melba. The Maharaja commissioned a necklace requiring 2,930 diamonds anchored by a 234-carat yellow diamond; it was lost after Indian independence, rediscovered in 1998 stripped of its stones, and Cartier replaced them with replicas. Both versions are here.</p>

<p>The exhibition is organised thematically rather than strictly by date, which means you move through ideas rather than decades. A bold yellow room traces the brothers' world of inspiration across India, Egypt, Iran, China and Japan. The Tutti Frutti collection occupies its own space: carved rubies, emeralds and sapphires stacked into bracelets and clips, the stones cut to echo Indian jewellery traditions, the settings unmistakably 1920s French. These are the pieces that showed up at Nancy Cunard's wrist in photographs and have been copied ever since without ever being equalled.</p>

<p>Jeanne Toussaint is the figure who earns her own gallery. Creative director from 1933 to 1970, she elevated the panther from a repeating motif into an emblem, a metaphor for a certain kind of woman at a moment when French women had not yet earned the right to vote. The Duchess of Windsor's panther clip -- a platinum and diamond cat crouching on a 152-carat cabochon sapphire -- is here, along with the story of Wallis Simpson's relationship with the house and what that patronage meant to both parties.</p>

<p>The watches room sits midway through as a palate cleanser, cool grey against the colour elsewhere. The 1914 Model A mystery clock -- diamond-encrusted hands that appear to float with no visible mechanism -- is the piece the Cartier Collection director named as the one she would save in an emergency. The film and celebrity room that follows it contains Elizabeth Taylor's Burmese ruby necklace from her third husband Mike Todd and pieces commissioned by Maria Felix: articulated snake and crocodile necklaces in diamonds and emeralds that move when worn, designed for a woman who kept real animals.</p>

<p>The final gallery is entirely tiaras, twenty-four of them, including the Scroll Tiara of 1902 worn by Lady Clementine Churchill at the Queen's coronation and later photographed on Rihanna's head for W Magazine in 2016. The connection between those two images -- the weight of a specific object moving through time, accumulating associations -- is something you can only understand standing in front of the thing.</p>

<p>The exhibition design is by Studio Sabine Marcelis and CLOUD from Rotterdam: coloured rooms that read as settings for the stones rather than neutral backgrounds. An original score by Japanese electronic composer Ai Yamamoto and Finnish composer Erkki Veltheim runs throughout. The V&A's Helen Molesworth narrates the audio guide if you want more -- $7, worth it, download before you go.</p>

<p>Allow at least two hours. The free guided tour at 2:30pm covers the panther brooch, the mystery clock, the Tank watch and the key themes in around 45 minutes. It is a good frame for the rooms that follow.</p>`

      essay: `<p>You land at twenty to six into a dark that arrived hours early. By the time the Uber comes down the Tullamarine freeway -- about 35 minutes from the terminal -- the city has switched fully into its winter evening self, and the drop into the grid feels less like arrival than absorption. Drop the bag, find the bin room, do not unpack. The night already has a shape.</p>
<p>That shape is Bar Lourinhã, three minutes on foot from your door, where a seat at the bar has your name on it. Matt McConnell and his partner Jo Gamvros opened this room twenty years ago and it has been an institution ever since, one of the venues that anchored what the CBD's laneway dining culture later became. The room is covered floor to ceiling in bric-a-brac -- a rifle that turns out to be a Russian vodka bottle, religious iconography, op-shop art, the accumulated curiosity of two decades of passionate collecting. It suits the food, which is Iberian and Mediterranean and deeply interested in good ingredients: the spiced chickpeas and spinach that reviewers have mentioned for fifteen years without it getting old; croquettes of corn and smoked chilli; pipis steamed with fino sherry; the kingfish pancetta tostada, which Gourmet Traveller once called a signature not just for this room but for the state. Order across the whole evening. This is the right first meal in Melbourne because it asks nothing of you but appetite.</p>`,

      title: "Work, Then the North, Then a Dane",
      essay: `<p>The morning belongs to the desk. Six hours of work from the apartment, which is no hardship in a flat with good light and a city waiting outside. If you need to break the mid-morning spell, Pellegrini's is around the corner on Bourke Street -- unchanged since 1954, a formica bar where the coffee is cheap and the welcome has not been refreshed by a brand consultant in seventy years. It is the antidote to everything curated.</p>
<p>At two the city opens up. Take the 86 tram from the Bourke Street stop and ride it north for fifteen minutes into Fitzroy, Melbourne's first suburb and still its most stubbornly itself. Get off at the Smith Street corner and walk west along Gertrude Street, the denser and more interesting of the neighbourhood's two arteries. Gertrude runs only six blocks, but it concentrates more of what makes this city interesting per square metre than almost anywhere. On your left as you walk west: Gertrude Contemporary, an artist-run space that has been showing emerging and mid-career work for thirty years, free, always worth fifteen minutes. Marion, Andrew McConnell's wine bar at number 53, doing 25-plus wines by the glass and plates of mussels and nduja. Cutler and Co further along, McConnell's fine-dining flagship in a former metalworks factory, white tablecloths and serious cooking for a different occasion. The Australian Print Workshop on the corner. Archie's All Day at 189 for coffee if you need one. The Everleigh upstairs at around 150 -- a pre-Prohibition cocktail bar in a 1920s parlour atmosphere, open Thursday to Saturday from 5pm -- if you are still there at that hour. Brunswick Street is longer and louder and you can give it whatever time remains. The neighbourhood rewards a slow pace; locals tend to stay for hours without particularly trying to.</p>
<p>Then the evening sharpens to a point. Dinner at the Tipo 00 counter -- fast, precise, pasta only, a glass of lambrusco standing in for ceremony -- because tonight ceremony is happening four minutes' walk south. Eddie Izzard, alone on the Fairfax Studio stage, performing the whole of Hamlet. One body, every part, the most famous play in the language compressed into a single nervous system. You are in seat F15, close enough to watch it cost something.</p>`,

      essay: `<p>Today you go inward, in every sense. No trams out of town, no excursions. The whole day lives inside the few hundred metres around your door.</p>
<p>Start in the Nicholas Building on Swanston Street, about a five-minute walk. Ride the old lift to any floor and push open the doors that are unlocked -- behind them are artists' studios, a letterpress workshop, vintage dealers, small galleries, milliners, a perfumer or two. Most work with doors open on weekday mornings. It is the actual working interior of creative Melbourne rather than its shopfront, free, unhurried, and rewarding of the kind of curiosity the rest of this trip is built on. Allow an hour. From there, thread south through the grid by laneway alone -- Tattersalls, which has rotating small galleries and is almost empty on a weekday; Caledonian off Little Bourke, paste-ups and stencils connecting through to Chinatown's back entrance; Duckboard Place off Flinders Lane, where tonight's dinner hides behind an unmarked door. Come out onto Flinders Lane around midday, which is the plan.</p>
<p>Lunch is the counter at Cumulus Inc at number 45 -- the room that wrote the playbook every other Melbourne kitchen has since copied. Andrew McConnell opened it here in 2008 and the long marble counter, walk-in welcome, all-day format became the template. Order what is seasonal. No rush. Leave by half one for the 15-minute walk south along St Kilda Road to the NGV.</p>
<p>Then Cartier, which has a section of its own below. The free guided tour runs at 2:30pm and covers the key works in 45 minutes; it is worth arriving a few minutes early to register. Allow at least two hours for the exhibition itself. Then the evening softens: Saadi on Punch Lane at half six, downstairs, reservation 7V9NFNX4NPW7. Saavni Krishnan and Sriram Aditya are two of the most interesting chefs working in the CBD right now. Arrive on time.</p>`,

      title: "Market, Gardens, a Laneway Kitchen",
      essay: `<p>No alarm. One long coffee somewhere near home before the day has any demands. When you are ready, walk fifteen minutes north to the Queen Victoria Market. Go for the covered deli hall and the produce sheds rather than to shop -- the atmosphere is the point, the accumulated smell of a market that has operated on this site since 1878, the stall holders who have been here for three generations, the food that is genuinely better than what you find in supermarkets. The fresh food halls wind down around midday; arrive between ten and eleven for the full range. It is also Wednesday night's Night Market location -- 5pm to 10pm, every Wednesday through winter, street food and fire pits and live music, if you find yourself in need of a Wednesday evening.</p>
<p>From the market, walk or tram twenty minutes northeast to Carlton, Melbourne's Italian quarter. Lygon Street itself has gone somewhat touristic, but the neighbourhood behind it has not, and the Carlton Gardens deserve an afternoon. The Royal Exhibition Building stands in the centre, a World Heritage hall built for the 1880 Melbourne International Exhibition that predates the Federation of Australia, still absurdly grand, worth a slow circle from outside. If the cold wins, the Ian Potter Centre at Federation Square -- a 25-minute walk south or a short tram -- is free and full of Australian and Indigenous art. It is the domestic counterweight to Friday's European opulence.</p>
<p>Dinner is five minutes from home: Lee Ho Fook on Duckboard Place, down a laneway you now recognise from Friday morning. Victor Liong arrived in Australia from Brunei at six, trained at Marque in Sydney under Mark Best and then at Mr Wong, and opened this room in 2013 in Collingwood before moving it to the CBD two years later. He named it after the Warren Zevon lyric in Werewolves of London and runs a kitchen that uses Chinese tradition as a starting point rather than a constraint. The maltose-glazed Peking duck is the dish everyone mentions first; the crispy eggplant with spiced vinegar and the cumin lamb shoulder are the ones you want alongside it. The chef's counter is booked -- for one diner it is always the better seat, close to the heat and the action, and the service around it tends to be more engaged.</p>`,

          fork: { q: "If the cold wins", a: { name: "Stay outdoors", desc: "Lygon Street, the gardens, the Exhibition Building. Back to the city by 4pm." }, b: { name: "Add Ian Potter Centre", desc: "Tram or 25-minute walk to Federation Square. NGV Australia, free, no booking. Australian and Indigenous art. 90 minutes, done by 5:30pm." } } },

</script>
<script>
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

function renderMasthead() {
  document.getElementById('m-season').textContent = TRIP.meta.season;
  document.getElementById('m-title').innerHTML = TRIP.meta.city + ' <em>in July</em>';
  const m = document.getElementById('m-meta');
  m.innerHTML = `
    <div class="row"><span class="lbl">When</span> ${TRIP.meta.dates}</div>
    <div class="row"><span class="lbl">Base</span> <a href="${TRIP.meta.base.url}" target="_blank" rel="noopener">${TRIP.meta.base.name}</a></div>
    <div class="row flight"><span class="lbl">Out</span> ${TRIP.meta.flights.out}</div>
    <div class="row flight"><span class="lbl">Home</span> ${TRIP.meta.flights.ret}</div>`;
}

function renderHero() {
  const h = TRIP.meta.hero;
  document.getElementById('hero').innerHTML = `<div class="kicker">${h.kicker}</div><h2>${h.title}</h2><p class="standfirst">${h.standfirst}</p><div class="prose">${h.body}</div>`;
}

function renderCartier() {
  const c = TRIP.cartier;
  document.getElementById('cartier-title').textContent = c.title;
  document.getElementById('cartier-standfirst').textContent = c.standfirst;
  document.getElementById('cartier-prose').innerHTML = c.body;
  document.getElementById('cartier-toggle').addEventListener('click', function() {
    const body = document.getElementById('cartier-body');
    const on = body.classList.toggle('on');
    this.classList.toggle('on', on);
    this.setAttribute('aria-expanded', on);
  });
}

function renderChapters() {
  const wrap = document.getElementById('chapters');
  TRIP.days.forEach(day => {
    const ch = el('section', 'chapter'); ch.id = day.id;
    ch.appendChild(el('div', 'chapter-head', `<div class="chapter-numeral">${day.chapter}</div><div class="meta"><div class="chapter-dow">${day.dow} · <span class="date">${day.date}</span></div><div class="chapter-title">${day.title}</div></div>`));
    ch.appendChild(el('div', 'chapter-essay', `<div class="prose">${day.essay}</div>`));
    const spine = el('div', 'spine');
    day.events.forEach((ev, i) => {
      const stop = el('div', 'stop'); stop.dataset.kind = ev.kind;
      let tag = ev.state === 'confirmed' ? '<span class="tag confirmed">Booked</span>' : ev.state === 'pending' ? '<span class="tag pending">Waitlist</span>' : ev.state === 'open' ? '<span class="tag open">To book</span>' : '';
      let links = '';
      if (ev.map) links += `<a href="${ev.map}" target="_blank" rel="noopener">Map</a>`;
      if (ev.book) links += `<a href="${ev.book}" target="_blank" rel="noopener">Book</a>`;
      stop.innerHTML = `<div class="stop-time">${ev.time}</div><div class="stop-title">${ev.title}${tag}</div><div class="stop-note">${ev.note}</div>${links ? '<div class="stop-links">' + links + '</div>' : ''}`;
      if (ev.fork) {
        const f = el('div', 'fork', `<div class="fork-q">${ev.fork.q}</div>`);
        const opts = el('div', 'fork-opts');
        const key = 'mel_fork_' + day.id + '_' + i;
        ['a','b'].forEach(k => {
          const o = ev.fork[k];
          const btn = el('button', 'fork-opt', `<span class="n">${o.name}</span><span class="d">${o.desc}</span>`);
          btn.addEventListener('click', () => { opts.querySelectorAll('.fork-opt').forEach(b => b.classList.remove('on')); btn.classList.add('on'); localStorage.setItem(key, k); });
          if (localStorage.getItem(key) === k) btn.classList.add('on');
          opts.appendChild(btn);
        });
        f.appendChild(opts); stop.appendChild(f);
      }
      spine.appendChild(stop);
    });
    ch.appendChild(spine); wrap.appendChild(ch);
  });
}

function renderLedger() {
  const list = document.getElementById('ledger-list');
  const order = { open: 0, pending: 1, confirmed: 2 };
  const label = { confirmed: 'Booked', pending: 'Waitlist', open: 'To book' };
  TRIP.bookings.slice().sort((a,b) => order[a.state] - order[b.state]).forEach(b => {
    const row = el('div', 'ledger-row');
    row.innerHTML = `<span class="ledger-dot ${b.state}"></span><div class="ledger-main"><div class="ledger-label">${b.label}</div><div class="ledger-sub">${b.sub}${b.ref ? ' · ' + b.ref : ''}</div></div><span class="ledger-state ${b.state}">${label[b.state]}</span>${b.url ? '<a class="go" href="' + b.url + '" target="_blank" rel="noopener">↗</a>' : ''}`;
    list.appendChild(row);
  });
}

function renderPocket() {
  const wrap = document.getElementById('pocket-wrap');
  TRIP.pocket.forEach((g, gi) => {
    const grp = el('div', 'pocket-group');
    const btn = el('button', 'pocket-toggle', `${g.group}<span class="chev">›</span>`);
    const body = el('div', 'pocket-body');
    g.items.forEach(([n,d]) => body.appendChild(el('div', 'pocket-item', `<div class="n">${n}</div><div class="d">${d}</div>`)));
    btn.addEventListener('click', () => { btn.classList.toggle('on'); body.classList.toggle('on'); });
    grp.appendChild(btn); grp.appendChild(body); wrap.appendChild(grp);
  });
}

function initNotes() {
  const fab = document.getElementById('fab'), panel = document.getElementById('notepanel'), ta = document.getElementById('note-ta'), list = document.getElementById('notelist');
  const draw = () => { const n = JSON.parse(localStorage.getItem('mel_notes') || '[]'); list.innerHTML = n.length ? n.map(x => `<div class="noteitem">${x}</div>`).join('') : '<div class="empty">No notes yet.</div>'; };
  fab.addEventListener('click', () => panel.classList.toggle('on'));
  document.getElementById('note-save').addEventListener('click', () => { const v = ta.value.trim(); if (!v) return; const n = JSON.parse(localStorage.getItem('mel_notes') || '[]'); n.unshift(v); localStorage.setItem('mel_notes', JSON.stringify(n)); ta.value = ''; draw(); });
  draw();
}

document.addEventListener('DOMContentLoaded', () => { renderMasthead(); renderHero(); renderCartier(); renderChapters(); renderLedger(); renderPocket(); initNotes(); });
</script>
