      title: "You Will Be Let In",
      standfirst: "Melbourne has no view. That is not a flaw in the city. It is the whole argument.",
      preview: `<p>At the entrance to the National Gallery of Victoria, on St Kilda Road, there is a wall of water. It runs down a pane of glass two storeys high, even and unhurried, lit from somewhere you cannot quite locate, and you walk in beside it. Almost everyone touches it. Children press their whole hands flat to the glass and the water parts around their fingers and closes again the instant they pull away. Adults do it too, quickly, and then pretend they had not. Nobody photographs it, or nobody who tries comes away with anything. It is a thing you have to be standing in front of, with your hand out, to understand at all. And that is the first instruction Melbourne gives you, before you have seen a single painting: the reward here is on the inside, and the way to it runs through a surface.</p>`,
      full: `<p>Consider what that building declines to do. It does not face the river. It does not climb a hill to hand you a panorama. It sits flat on a wide grey boulevard behind a moat of its own water, a bluestone keep by the architect Roy Grounds, and it keeps its best things indoors, where neither the weather nor the street can reach them -- the Tiepolo of Cleopatra at her banquet, the Leonard French ceiling of coloured glass that you have to lie on the floor of the Great Hall to see properly, on your back, like everyone else who has worked out that this is the only correct posture for it. Melbourne is a city organised around that instinct. And the instinct exists because Melbourne, almost uniquely among the cities people fly a long way to see, has no view.</p>

<p>Most great cities are conducting a love affair with their own geography, and the affair is the first thing you are shown. You are over the water and then the bridge is there, and the white sails, and you have seen the famous thing before the wheels are down. Sydney does this to you. Sydney has the harbour, which is not a body of water so much as a permanent argument in the city's favour, settled in advance of any conversation. You can photograph Sydney before you have landed in it. Melbourne offers the descending passenger almost nothing. A flat brown plain. A river the colour of weak tea that appears, from above, to be running the wrong way. Weather that will change its mind four times before you reach the carousel. There is no single image of the place, because the place was not built to be looked at from outside. It was built to be entered.</p>

<p>The two cities have spent the better part of two centuries in a rivalry so old that Australians have stopped noticing it is strange. Sydney came first, in 1788, as a prison -- a beautiful one, but a prison, founded by people who had not chosen to be there. Melbourne was settled free, in 1835, by men who came overland and by sea for grass and stayed for something far better than grass. The competition between the two for primacy was real, and it was so genuinely unresolvable that when the colonies federated in 1901 the new country could not bring itself to name either as its capital. The compromise was to invent a third city, from nothing, in a sheep paddock at a careful distance from both, and to call it Canberra. In the meantime Melbourne kept the federal parliament as a lodger for twenty-six years, in a borrowed chamber on Spring Street, and then stood on the platform and watched the Commonwealth pack up and leave for the paddock it had commissioned. This is worth holding onto. Melbourne was, for a quarter of a century, the centre of the country. And then it was not. It has never entirely stopped being the kind of place that knows, in its bones, what it is to be the one passed over.</p>

<p>The money for all of it -- the boulevards, the gallery, the swagger that made the rivalry worth having -- came straight up out of the ground. Gold was found in the colony of Victoria in 1851, at Ballarat and then Bendigo, in fields so rich they had no rival anywhere on earth. The effect on Melbourne was not growth so much as detonation. The population multiplied in a decade. The harbour filled with ships that simply stopped, because the crews had walked off them and up to the diggings, and for a while the bay was a forest of abandoned masts. By the 1880s the city was, per head, among the wealthiest on the planet, and it built exactly the way a place builds when it has more money than memory. A visiting English journalist, George Augustus Sala, supplied the slogan in 1885 -- Marvellous Melbourne -- and the marvel was largely architectural. The cathedral-scaled banks on Collins Street. The glass-roofed arcades, the Block and the Royal, dropped into the middle of the grid like jewel cases. The cast-iron terraces marching out through Carlton and Fitzroy and East Melbourne, lace verandahs on every one. The Royal Exhibition Building, thrown up in Carlton Gardens in 1880 for an international fair, a dome on a hill, grand out of all proportion to anything the young colony actually needed it to do.</p>

<p>The gold did more than fill the banks. It brought a particular kind of person and bred a particular kind of temper. The people who poured into Victoria in the 1850s had, almost all of them, chosen to come, which set them apart from the reluctant founders of the colony to the north. They had crossed the world on a rumour and then stood knee-deep in the same freezing mud as the man beside them, gentleman and labourer levelled by the same creek, and the experience left a mark on the place that has never quite worn off. In 1854 a few hundred of them, sick of licence fees and high-handed troopers, threw up a rough timber stockade at Ballarat called Eureka and were shot down inside it before dawn, and the colony has been telling itself the story ever since as a sort of founding myth -- self-made men declining, fatally, to be told what to do by their betters. Some of that is sentiment. The residue, though, is real, and you can still feel it: a city congenitally suspicious of inherited authority, faintly allergic to being instructed in what it ought to admire. A place put together like that was never going to fall for an obvious view.</p>

<p>And then, in the early 1890s, it stopped. The land boom that had inflated the whole spectacle collapsed inside about two years. Banks shut their doors. The speculative fortune that had paid for Marvellous Melbourne turned out to have been mostly paper, and the paper burned. Here is the part the boosters leave out, and the part that explains more about the city you are about to walk through than any amount of talk about coffee. The crash is the reason the architecture survived. Confident cities knock their grandeur down -- they demolish one era's masterpieces to make room for the next era's, because each new wave of money wants its own monument. Melbourne's confidence broke early and stayed broken long enough that the boom city had no chance to be replaced. It fossilised. The Melbourne you move through is the preserved exuberance of a single hysterical generation, kept intact by the poverty that came after it. Marvellous Melbourne is, in the most literal sense, a city that could not afford to stop looking like itself.</p>

<p>Now look down, away from the grand fronts, into the spaces between them. The plan of the central city was pegged out in 1837 by a surveyor named Robert Hoddle, and it is the reason the place reads, on a map, like graph paper. Wide main streets, each a chain across. Between them, the so-called little streets -- Little Collins, Little Bourke, Little Lonsdale -- and behind and between those, narrower still, the service lanes. This is the crucial fact, and it is the opposite of romantic: the lanes were never meant to be seen. They were the working underside of a Victorian city. Deliveries came through them. Stables opened onto them. Nightcarts ran along them in the dark, and the rear doors of every shop and chophouse faced into them. For most of a century the lanes of Melbourne were precisely the parts of the city you were not supposed to look at, the back-of-house of the whole grand performance happening one street over.</p>

<p>The transformation came late, and it came partly by policy. In the 1990s the city council, alarmed at a hollow centre that emptied at six o'clock, set out deliberately to put residents back into the grid. At around the same time the liquor laws changed, and it became possible to open a small bar without first proving you would also run a restaurant. Those two dry administrative facts did more for the texture of Melbourne than any amount of civic poetry. Coffee moved into the lanes first, then bars, then galleries up unmarked stairs, then the rest. And so the city took the part of itself it had been built to conceal and made it the part it is now known for, which is the whole Melbourne manoeuvre in miniature. The good room is up a stair behind a kitchen, with no sign. You will not find it by looking. You have to be told. The reward, once again, is conditional, and interior, and given only to the person who already knows to go down the lane that looks like it leads nowhere.</p>

<p>What grew up in those lanes rewards the specific over the general, which is the only honest way to speak about them at all. Hosier Lane, off Flinders Street, where the walls are repainted by strangers faster than anyone can keep up. Centre Place and Degraves Street, each barely wide enough for two people and a chalkboard, lined the whole length with the small tables of rooms that seat eleven. Hardware Lane at lunch, loud with cutlery. The unmarked door on Meyers Place, where the small-bar movement is usually said to have begun, opening onto a stair, and at the top of the stair a low room of forty people who all somehow knew. None of it announces itself. A first-time visitor walks straight past the best of it, every time, and is meant to. The pleasure is built to be earned, and the earning turns out to be half the pleasure.</p>

<p>There is one stretch of the grid that did not wait for the 1990s to learn how to be itself. Chinese arrivals came to Victoria for the same gold as everyone else, from the 1850s, in numbers that frightened the colony into some of its uglier laws, and they settled along Little Bourke Street. That settlement has been continuously inhabited ever since. It is the oldest continuous Chinese settlement in the western world, and the load-bearing word is continuous -- not the biggest, not the most photographed, but the longest unbroken. While the wider city boomed and crashed and re-skinned its surface every generation or two, these few blocks simply went on being what they were. The herbalists and the family associations. The banquet rooms up the narrow stairs, the ones with the lazy Susans and the fluorescent light and the food that has nothing to apologise for. A lunar new year that has run, with pauses only for plague and war, for the better part of a hundred and seventy years. It is the deepest version of the Melbourne instinct there is: a whole culture that has survived by happening indoors, in rooms you have to know how to enter, handed down without interruption while everything around it was knocked over and built again.</p>

<p>Even the gallery's greatness arrived in this manner -- quietly, from inside, as a gift. The National Gallery of Victoria was founded in 1861, which made it older than most institutions in the country and considerably older than the country itself, an early and faintly outrageous bet that a raw gold town at the bottom of the world ought to own art on the scale of an old European capital. The bet was paid off by a man almost nobody had heard of. Alfred Felton was a reclusive bachelor chemist who lived out his last years in a boarding house in St Kilda, and when he died in 1904 he left half of a very large fortune in trust, to be spent buying pictures for the gallery, in perpetuity. That single bequest is the reason a provincial city at the edge of everything owns a Rembrandt and a Poussin and the Tiepolo, why the collection punches so far above the town's size that first-time visitors assume some administrative error has occurred. The ambition was always there, plain and a little absurd. What made it real was a fortune handed over in private by a man who wanted his name on nothing he would ever be in the room to see.</p>

<p>Put it together and a single shape emerges. A city with nothing to show from the outside. A city that expected to be the centre of its country and then watched the centre move elsewhere. A city sitting on the frozen wealth of one delirious decade, unable to tear it down. A place that took all of this and decided, more or less consciously, to make the interior the entire point -- the bar behind the kitchen, the gallery behind the water, the banquet room at the top of the stairs, the studio up in the old building where the printmaker and the perfumer keep their doors open. From outside, from the window seat, from Sydney, all of this can read as coldness, or worse, as a kind of snobbery -- the persistent sense that Melbourne is holding something back from you, that you are being kept just outside the door. And it is true that you are, at first. The city does not rush to be liked.</p>

<p>But the inwardness is not a refusal, and to read it as one is to miss the city entirely. It is the exact opposite of a refusal. It is what a place does when it has decided that, having nothing to display on the outside, it will put everything it has behind doors, up stairs, down lanes, on the far side of a wall of falling water, and give it -- generously, completely, without stinting -- to anyone who comes close enough to reach in. The selectiveness is the delivery mechanism, not the point. The point is what is on the other side, and there is a great deal on the other side.</p>

<p>Which is why the right season to arrive is the one most people are warned off. In July the boulevards are wet by four o'clock and dark not long after, the river goes from weak tea to ink, and the whole flat city stops pretending it has a single thing worth seeing out of doors -- because it never did, out there, and now it has the honesty not to bother. Everything that matters moves inside. Into the banquet rooms and the small bars and the gallery with the moat around it, into the warm and the low-ceilinged and the lit. The performance the city has been keeping back all summer, behind all those discreet fronts, is finally the only show in town. You came across the water from one island and you will land on the edge of another country with nothing to look at, and that is correct, and it is not a disappointment. You will not see Melbourne from the plane. There is nothing to see. You will be let into it instead, one room at a time, over four short nights, until the last of them, when you find you would rather not leave -- which is the one thing no view has ever managed to do for anyone.</p>

<p>Put your hand out. The water parts. That is how you go in.</p>`
    }
  },

      id: "wed", iso: "2026-07-08", dow: "Wednesday", date: "8 July", chapter: "I",
      title: "Landing Into the Dark",
      essay: `<p>Descent into a winter city comes in two parts. First the lights -- the orange grid of the outer suburbs, the strung filaments of the freeways, the wet black shine of everything in the gaps between -- and then, without ceremony, the ground, and the particular cold that meets a body on the airbridge of a southern city in July. A cold with the sea somewhere in it. You crossed the water from one island and put down on the lip of a whole continent, and for the first hour none of it belongs to you. The taxi rank. The motorway. The green signs with names on them that mean nothing yet. This is the most foreign the place will ever feel, and the good news is that it lasts about forty minutes.</p>
<p>Then a door, and a set of stairs, and a flat above a street in the dead centre of the grid, with the bags finally down and the long sigh of having arrived somewhere. There is a version of this evening that ends here, with toast and an early collapse, and it is a mistake. Arrival is not a place you reach by landing. It is a thing that happens later, somewhere warm, the moment you sit down at a counter you did not have to find and order the first thing without thinking too hard about it.</p>
<p>So you go back out into the cold, which is shorter than you feared, the length of a narrow street, and into a long lit room that was full before you got there and will be full after you leave. Sherry, and small salted things, and the particular heat that comes off other people who are already mid-evening and have no idea you have just crossed a sea. A room that has held this same corner for twenty years and intends to hold it for twenty more. You are nobody here, which is the whole relief of it. The displacement of the airport drains out somewhere around the second glass, and the city, which showed you nothing on the way down, quietly opens its first door.</p>`,

        { time: "~6:15pm", title: "192 Little Collins Street", kind: "base", note: "Access instructions arrive 48 hours before.", url: "https://www.airbnb.co.nz/rooms/1832876", map: "https://maps.apple.com/?q=192+Little+Collins+Street+Melbourne" },
        { time: "7:30pm", title: "Bar Lourinhã", kind: "food", state: "confirmed",

          expand: {
            label: "About Bar Lourinhã",
            body: `<p>Matt McConnell and his partner Jo Gamvros opened this room in 2006, and it has been part of the city's dining furniture ever since -- one of the venues that anchored what the CBD laneway culture later became. Twenty years on, the room still does what it was always designed to do: feed people well at the bar, without ceremony.</p>
<p>The decor resists description and rewards inspection. A Russian vodka bottle shaped like a rifle. Religious iconography from several traditions, none of them serious. Op-shop paintings massed floor to ceiling. The accumulated curiosity of two decades of passionate collecting by people who have eaten their way around the Iberian Peninsula many times. It is someone's living room if that someone happened to also be an acclaimed chef.</p>
<p>The food is Iberian and Mediterranean, and it is deeply interested in good ingredients: pipis steamed with fino sherry; spiced chickpeas and spinach that reviewers have mentioned for fifteen years without it getting old; grilled chorizo and pork liver pintxos; the kingfish pancetta tostada that Gourmet Traveller once called a signature not just for this room but for Victoria. The blackboard wine list leans Spanish without being didactic. Ask the kitchen what is good tonight and order accordingly. Three or four plates across the evening is the method.</p>`

      id: "thu", iso: "2026-07-09", dow: "Thursday", date: "9 July", chapter: "II",
      title: "Work, Then the North, Then a Dane",
      essay: `<p>Few discomforts are as exquisite as having a city laid out below the window and choosing, for a morning, not to have it. Light comes up grey and then gold over the grid. Trams start their grinding down on the wide street. And you sit with a laptop and a coffee gone cold, doing the work that paid for the trip, while the most interesting place you have been in months waits on the other side of the glass with its hands in its pockets. There is a discipline to it, and a strange pleasure, the pleasure of deferral. The day is a held breath. You know exactly when it will be let out.</p>
<p>Two o'clock is the exhale. North on a rattling tram, out of the formality of the centre and across an invisible line into older, looser country -- nineteenth-century terraces with their iron lace, shopfronts that have been forty different things, a street that wears every decade it has lived through at once and apologises for none of them. The pace drops. The buildings come down to two storeys and human scale. You drift west on foot with no particular errand, past the galleries and the op shops and the front bars filling early, and the afternoon does the thing afternoons in this part of town are good at, which is to dissolve.</p>
<p>And then the day gathers itself for something it has been pointing at all along. A small room, a bare stage, the house lights down. One person, alone, with no set and no help, standing in for an entire poisoned court -- the prince and the ghost and the drowned girl and the clown with the skull, all of it passing through a single body in a single voice that keeps changing hands. There is nowhere to hide up there and nothing to hide behind, which is the entire point of attempting it this way. A whole kingdom of grief and delay and bad decisions, held for two hours inside one figure on an empty floor. You walk back out into the cold afterwards turning it over, the way the best evenings make you, slightly altered, not quite ready to talk.</p>`,

          expand: {
            label: "Gertrude Street guide",
            body: `<p>Gertrude Street runs only six blocks from Smith to Nicholson, but it concentrates more of what makes Melbourne interesting per metre than almost anywhere in the city. Time Out ranked it the second coolest street in the world in 2022, which is both accurate and beside the point -- the locals who eat and drink here have not noticed the accolade and do not behave accordingly.</p>
<p>Walk west from the Smith Street corner. Gertrude Contemporary at 21-31 High Street: artist-run space showing emerging and mid-career work since 1985, free entry. Marion at number 53: Andrew McConnell's wine bar, 25-plus wines by the glass, mussels on fried bread. The Everleigh upstairs at around 150 -- a pre-Prohibition cocktail parlour in a 1920s room, open from 5pm Thursday to Saturday. Brunswick Street is longer and louder; worth the overflow if time allows, good bookshops.</p>`

          expand: {
            label: "About Tipo 00",
            body: `<p>Andreas Papadakis spent four years at Vue de Monde before opening this room in 2014, and his fine-dining instincts are what make it different from every other pasta bar in the city. The name refers to the finest grade of Italian flour, and the menu is built around fresh pasta made daily in a kitchen visible from the counter. Named one of the best Italian restaurants in the world in 2022 -- not the kind of claim this place makes about itself; it just keeps being excellent.</p>
<p>Order the tagliolini al nero -- squid ink, seafood broth, the dish reviewers keep returning to. The gnocchi with braised duck and porcini in winter. The Tipomisu for dessert. The counter seats eight or ten and faces the open kitchen; for one diner it is the only seat worth having. This is not a relaxed long dinner -- it moves efficiently, which is the point tonight. Arrive at 5:15, order quickly, eat well, be walking south by 6:30.</p>`

          expand: {
            label: "About the show",
            body: `<p>Suzy Izzard performs all 23 characters of Shakespeare's Hamlet alone on a bare stage with no set, no props, no costume changes. The adaptation is by her brother Mark Izzard, direction by Selina Cadell from the RSC; the production ran triple-extended seasons in New York, Chicago and London, nominated for the Drama League's Distinguished Performance Award. Melbourne is the longest run on the Australian tour -- closing 12 July, two days after this performance.</p>
<p>The soliloquies -- "To be or not to be," "What a piece of work is a man," the graveyard scene -- are where reviewers consistently found the most force. F15 is front stalls, close enough to see her face. That is the right ticket for a show built entirely on one person's expression.</p>`

      title: "The City's Interior",
      essay: `<p>Some buildings cannot be read from the street at all. You can stand across the road and take in the 1920s stonework, the worn brass of the lobby, the lift with the folding gate, and understand almost nothing, because the building's entire life is happening on the upper floors, behind doors, in rooms the size of a generous cupboard. Go up. On the right day the doors stand open and the landings give off a confusion of smells -- cut paper and printing ink, hot wax, the strange dry sweetness of perfume oils being blended by hand. A milliner here. A bookbinder there. A painter who has held the same north light for thirty years. A working hive of people making small things slowly, stacked floor on floor in the middle of a city that mostly forgets they are up there.</p>
<p>Down at street level the lanes do the same trick in reverse, threading between the grand fronts, the city's working underside turned into its quiet pleasure. You move through them with no map worth the name, taking the turn that looks like it leads to a loading dock and finding it leads somewhere better. It is a morning spent going inward and upward, into the parts of the place that keep themselves just out of sight, and it tunes the eye for what the afternoon has in store.</p>
<p>Because the afternoon offers the opposite kind of interior. A gallery gone deliberately dark, and inside it, in case after lit case, a century of stones cut to do one thing only, which is to throw light back at you harder than it fell. Necklaces built like architecture. A tiara that outlived the head it was made for. The whole glittering logic of a house that decided rarity should be worn, and engineered, and kept. After a morning of ink and felt and patient hands, here is concentration of a different order -- value pressed down into the smallest possible space and made to shine in the dark. Two ways of keeping the best things inside, an afternoon apart, and the city fluent in both.</p>`,

      id: "sat", iso: "2026-07-11", dow: "Saturday", date: "11 July", chapter: "IV",
      title: "Market, Gardens, a Laneway Kitchen",
      essay: `<p>No alarm. That alone changes the shape of the air in a room. Light arrives and is allowed to, and the first hour belongs to nobody and nothing, which after three scheduled days feels close to extravagant. A day with no time pinned to its front end tends to find its own pace, and its own pace, here, leads to a market.</p>
<p>Under the long sheds the cold is part of the point. Breath shows. Hands stay in pockets between stalls. The deli hall runs warm and dense with the smell of hung meat and cut cheese and coffee held in paper cups for the heat as much as the drink, and the produce rows out the back glisten with the particular self-respect of winter vegetables -- the brassicas, the bitter leaves, the muddy roots that actually want this weather. It is loud and social and faintly competitive, a few thousand people moving through the same cold space on the same loose errand, and it is at its best in the last hour before noon, when it begins, almost imperceptibly, to wind itself down.</p>
<p>From there the day opens out into green. Formal paths, bare plane trees, and rising out of the middle of it a great glass-and-brick hall with a dome, built for a fair a hundred and forty years ago and grand far beyond any use it has now -- a building that once held the opening of a nation's first parliament and these days mostly holds joggers, pigeons, and the long afternoon light. You walk it slowly. There is nowhere you have to be for hours.</p>
<p>And then, as the light goes, the day folds back in on itself. Off a lane, behind a plain door, a counter and a stool and a long sequence of small precise plates arriving one at a time from a kitchen close enough to watch -- one cook's whole argument about where his food comes from and where it has got to, made in courses. The most public day of the trip resolves, at its very end, into its most private hour. The city does this. It opens you all the way out, and then it brings you quietly back in.</p>`,

          expand: {
            label: "About the market",
            body: `<p>Queen Victoria Market is the largest open-air market in the southern hemisphere and has operated on this site since 1878 -- the same era as the gold-rush architecture, the same unbroken continuity. It covers two city blocks. The upper market (Elizabeth Street side) is the tourist end: clothes, souvenirs, honey. Go instead to the deli hall on the north side, a long covered shed of European-style providores that has been feeding Melbourne since the 1920s. Polish smallgoods, Italian cheeses, Spanish olives, half a dozen Continental delis in a row. Take your time.</p>
<p>Behind the deli hall, the open sheds: fruit, vegetables, fish, meat. In July the produce is at its best -- root vegetables, brassicas, citrus, the dark leafy things that want cold soil. The fishmongers have the best of the Southern Ocean catch. The meat hall toward the Peel Street end is old-school butcher territory. Go for the atmosphere as much as anything else: this is Melbourne doing a thing it has been doing for a hundred and fifty years, without irony, without branding.</p>
<p>The market winds down around noon. There is a Wednesday Winter Night Market (5-10pm through August, free) if you find yourself passing midweek.</p>`

          expand: {
            label: "Carlton and the Royal Exhibition Building",
            body: `<p>The Royal Exhibition Building stands at the centre of the Carlton Gardens -- a World Heritage listed hall built for the 1880 Melbourne International Exhibition, predating Federation by twenty years, that hosted the first sitting of the Australian Parliament in 1901. Grand out of all proportion to any current use: a central dome flanked by pavilions, the whole thing raised in thirteen months by a city that needed to impress the world and had the money to do it. The gardens were designed by William Sangster in the 1870s -- axial paths, a fountain, mature elms. In July they are bare and cold and without tourists, which makes them ideal.</p>
<p>Lygon Street on the way back is worth knowing about: the south end near Grattan Street still has places where the chef has been making the same lasagne since 1982. The north end has gone touristic; the neighbourhood behind it -- Rathdowne Street, the back streets of Carlton -- is quieter. If the afternoon has more hours than the gardens can fill, the Ian Potter Centre at Federation Square is a 25-minute walk south: free, Australian and Indigenous art, no booking needed.</p>`

<p>Chinese tradition as starting point rather than constraint. The tasting menu traces Liong's eating history: mud crab in turmeric sauce referencing a dish from Flower Drum; braised brisket with elastic noodles recalling Sydney's Chinatown. Order the maltose-glazed Peking duck when you sit down -- it takes time to prepare. The crispy eggplant with spiced red vinegar alongside. The wine list includes a page of wines from China, unusual and worth exploring. The chef's counter is the right seat for one person: close to the pass, the kitchen visible throughout.</p>`

      id: "sun", iso: "2026-07-12", dow: "Sunday", date: "12 July", chapter: "V",
      title: "The Early Door",
      essay: `<p>Waking in the dark to leave a place has its own particular flavour, half theft and half farewell. An alarm in the black hours. A flat you have only just learned the sounds of, quiet now in a way it has not been before. Bags by the door where you set them the night before, already half a stranger to the rooms behind you. There is no time for sentiment and that is a mercy, because the clock is the only thing in charge, and the clock says go.</p>
<p>Down on the street the city does, at last, the one thing it has refused to do all week. It shows you its outside. Nothing is open, so there is no inside to be let into -- only the wide wet road under the sodium lights, the shut grand fronts, the lanes black and giving nothing, the whole grid emptied of everyone and, for these few minutes, entirely yours. It is the most of Melbourne you have seen at once, and it is beautiful, and it is closed. You came in through a wall of water four nights ago. You go out through this, the cold and the dark and the empty.</p>
<p>The cab runs the motorway the other way, the green signs unspooling in reverse, the names that meant nothing on the first night meaning a little something now. A bright cold terminal. The long bones of a 737. And then the lift, and the brown plain dropping away below with its river the colour of ink, showing you, even at the end, nothing to photograph. That was always the deal. The city kept everything indoors and gave it to you a room at a time, and now you are taking the warm of it home in place of a view.</p>`,
