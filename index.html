<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Trip notes</title>
<meta name="description" content="Working itineraries for Cameron's trips — Shanghai, Melbourne, and China April 2026.">
<!-- The hub runs on the shared Catalogue engine (site.css) so its look tracks the
     trip pages exactly. Only the trip register below is hub-specific. Grotesk +
     mono, no serif — the hub carries data, not essays, so Newsreader is not loaded. -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/bricolage.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/plex-mono.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="fonts/plex-mono-500.woff2">
<meta name="theme-color" content="#ecedea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131513" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="site.css">
<style>
/* ── HUB (index) ───────────────────────────────────────────────
   The catalogue's cover and its register of trips. Everything shared —
   tokens, fonts, the .lg gutter grid, the specimen masthead, the mono data
   voice, the footer — comes from site.css; only the trip register is defined
   here so it never ships to the trip pages. One idea, same as the itineraries:
   a left DATA GUTTER carrying the live fact (how close the trip is), the
   content column carrying the specimen title. */

/* Masthead — a specimen cover. Reuses .masthead / .mast-city / .mast-bar. */
.mast-kicker { font-family: var(--mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 1.5rem; }
.mast-city .lede { display: block; }
.mast-intro { font-family: var(--sans); font-size: 1.06rem; font-weight: 400; color: var(--ink-2); line-height: 1.5; margin-top: 1.5rem; max-width: 42ch; }
.mast-meta { font-family: var(--mono); font-size: 0.66rem; letter-spacing: 0.03em; text-transform: uppercase; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.mast-meta b { color: var(--accent); font-weight: 500; }
#m-next { margin-left: auto; text-align: right; }

/* Register header: label + sort control, on the trip list's 4px rule. */
.index-bar { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-top: 2.6rem; }
.sort-btn { font-family: var(--mono); font-size: 0.62rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); background: none; border: none; cursor: pointer; padding: 0; display: inline-flex; align-items: center; gap: 0.4rem; transition: color 0.12s; }
.sort-btn:hover { color: var(--accent-2); }
.sort-arrow { display: inline-block; transition: transform 0.2s; }
.sort-arrow.flipped { transform: rotate(180deg); }

/* Trip register — each row is a .lg grid; the gutter carries the live status. */
.trip-list { list-style: none; }
.trip { text-decoration: none; color: inherit; border-top: 4px solid var(--ink); padding: 1.4rem 0 1.6rem; }
/* The next (or on-now) trip carries a persimmon rule — the same signal the trip
   pages give today's chapter (.chapter.is-today). It marks the live entry. */
.trip.is-next { border-top-color: var(--accent); }
.trip-mark { align-self: start; }
.tstatus { display: block; font-family: var(--mono); font-weight: 500; font-size: 0.7rem; letter-spacing: 0.02em; text-transform: uppercase; line-height: 1.25; font-variant-numeric: tabular-nums; }
.tstatus.next, .tstatus.now { color: var(--accent); }
.tstatus.past, .tstatus.soon { color: var(--ink-3); }
.tdates-sm { display: block; font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.02em; color: var(--ink-3); margin-top: 0.45rem; font-variant-numeric: tabular-nums; }
.trip-body { min-width: 0; }
.trip-kicker { font-family: var(--mono); font-size: 0.6rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 0.5rem; }
.trip-title { font-family: var(--display); font-size: clamp(1.75rem, 4.6vw, 2.6rem); font-weight: 800; line-height: 1.0; letter-spacing: -0.035em; color: var(--ink); text-wrap: balance; margin-left: -0.02em; transition: color 0.12s; }
.trip-title em { font-style: normal; font-weight: 800; color: var(--ink-2); }
.trip:hover .trip-title { color: var(--accent); }
.trip:hover .trip-title em { color: var(--accent); }
.trip-desc { font-family: var(--sans); font-size: 0.95rem; color: var(--ink-2); line-height: 1.55; margin-top: 0.7rem; max-width: 54ch; }
.trip-foot { display: flex; align-items: center; gap: 0.7rem 1.1rem; margin-top: 0.95rem; flex-wrap: wrap; }
.trip-fresh { font-family: var(--mono); font-size: 0.56rem; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; color: var(--ground); background: var(--accent); padding: 0.24em 0.55em; }
.trip-go { font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); display: inline-flex; align-items: center; gap: 0.35rem; transition: transform 0.15s, color 0.12s; }
.trip:hover .trip-go { color: var(--accent-2); transform: translateX(3px); }
/* Past trips recede so the next trip reads first; they lift on interaction. */
.trip.is-past { opacity: 0.56; transition: opacity 0.15s; }
.trip.is-past:hover, .trip.is-past:focus-visible { opacity: 1; }
.trip.placeholder { opacity: 0.42; pointer-events: none; }

/* Add a trip — an action row, dashed to read as secondary. */
.add-trip { text-decoration: none; border-top: 2px dashed var(--rule-2); padding: 1.3rem 0; color: var(--ink-3); transition: color 0.12s; align-items: baseline; }
.add-trip:hover { color: var(--accent); }
.add-mark { font-family: var(--mono); font-size: 0.62rem; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); align-self: start; transition: color 0.12s; }
.add-trip:hover .add-mark { color: var(--accent); }
.add-label { font-family: var(--display); font-size: 1.2rem; font-weight: 800; letter-spacing: -0.02em; color: var(--ink-2); transition: color 0.12s; }
.add-trip:hover .add-label { color: var(--accent); }

/* Footer line reused from the engine; split left/right. */
.foot-line { display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }

@media (max-width: 640px) {
 /* Gutter collapses (engine): let the status + dates sit on one line above. */
 .trip-mark { display: flex; align-items: baseline; gap: 0.6rem 0.9rem; flex-wrap: wrap; margin-bottom: 0.15rem; }
 .tdates-sm { margin-top: 0; }
 #m-next { margin-left: 0; text-align: left; }
 .mast-bar { gap: 0.4rem 1.2rem; }
}
</style>
</head>
<body>
<div class="content"><div class="wrap">

 <header class="masthead">
 <div class="mast-kicker">Cameron Death · Personal itineraries</div>
 <h1 class="mast-city"><span class="lede">Trip</span><em>notes</em></h1>
 <p class="mast-intro">Working itineraries, not brochures — built to be walked, edited as they're used, and kept honest about what's confirmed and what's still just a plan.</p>
 <div class="mast-bar">
 <span class="mast-meta" id="m-count"></span>
 <span class="mast-meta" id="m-next"></span>
 </div>
 </header>

 <section>
 <div class="index-bar">
 <div class="section-label">Trips</div>
 <button class="sort-btn" id="sort-btn" onclick="toggleSort()" aria-label="Change trip order">
 <span id="sort-label">Newest first</span> <span class="sort-arrow" id="sort-arrow">↓</span>
 </button>
 </div>

 <ul class="trip-list" id="trip-list"></ul>

 <a class="add-trip lg" href="./new/">
 <span class="add-mark gut">＋ New</span>
 <span class="add-label">Add a trip</span>
 </a>
 </section>

 <footer>
 <div class="foot-line">
 <span>Personal use only</span>
 <span>Catalogue · a field dossier</span>
 </div>
 </footer>

</div></div>

<script>
const TRIPS = [
 {
 date: "2026-10-23",
 end: "2026-11-01",
 meta: "China · 2026",
 title: "China <em>October 2026</em>",
 desc: "Shanghai, second visit — Yangpu waterfront, small galleries, the old walled city, Hongkou, and hairy crab season, tuned toward Michelin Bib Gourmand and solo counter seats.",
 dates: "Oct 24 – Nov 1, 2026",
 href: "./shanghai/",
 feed: "./shanghai/events.json",
 placeholder: false
 },
 {
 date: "2026-07-08",
 end: "2026-07-12",
 meta: "Australia · 2026",
 title: "Melbourne <em>2026</em>",
 desc: "Food, laneways, art, and four nights of deliberate slow travel in winter.",
 dates: "8 – 12 July 2026",
 href: "./melbourne/",
 placeholder: false
 },
 {
 date: "2026-04-01",
 end: "2026-04-12",
 meta: "China · 2026",
 title: "China <em>April 2026</em>",
 desc: "Shanghai and Shaoxing — the Bund, French Concession, Qingming Festival, a day by high-speed rail.",
 dates: "1 – 12 April 2026",
 href: "./china-april-2026.html",
 placeholder: false
 }
];

// Live trip status from today's date, so the hub always shows what's next.
function tripStatus(t) {
 if (t.placeholder) return { kind: "soon", label: "Coming soon" };
 const today = new Date(); today.setHours(0, 0, 0, 0);
 const start = new Date(t.date + "T00:00:00");
 const end = new Date((t.end || t.date) + "T00:00:00");
 const DAY = 86400000;
 if (today < start) {
  const days = Math.round((start - today) / DAY);
  if (days === 0) return { kind: "next", label: "Starts today" };
  if (days === 1) return { kind: "next", label: "Starts tomorrow" };
  return { kind: "next", label: "In " + days + " days" };
 }
 if (today <= end) {
  const dayNum = Math.round((today - start) / DAY) + 1;
  const total = Math.round((end - start) / DAY) + 1;
  return { kind: "now", label: "On now · day " + dayNum + " of " + total };
 }
 return { kind: "past", label: "Past" };
}

const plain = s => s.replace(/<[^>]+>/g, "");

// The one "live" trip — on now, else the soonest upcoming. The masthead names
// it and its register row gets the persimmon rule, so both always agree.
function heroTrip() {
 const scored = TRIPS.filter(t => !t.placeholder).map(t => ({ t, s: tripStatus(t) }));
 const now = scored.find(x => x.s.kind === "now");
 if (now) return now;
 return scored.filter(x => x.s.kind === "next")
  .sort((a, b) => a.t.date.localeCompare(b.t.date))[0] || null;
}

let newestFirst = true;

function renderTrips() {
 const list = document.getElementById("trip-list");
 const hero = heroTrip();
 const heroHref = hero ? hero.t.href : null;
 const sorted = [...TRIPS].sort((a, b) => {
 return newestFirst
 ? b.date.localeCompare(a.date)
 : a.date.localeCompare(b.date);
 });

 list.innerHTML = sorted.map(t => {
 const s = tripStatus(t);
 const mark = `<div class="trip-mark gut">
 <span class="tstatus ${s.kind}">${s.label}</span>
 <span class="tdates-sm">${t.dates}</span>
 </div>`;
 if (t.placeholder) {
 return `<li class="trip lg placeholder">
 ${mark}
 <div class="trip-body">
 <div class="trip-kicker">${t.meta}</div>
 <h2 class="trip-title">${t.title}</h2>
 <p class="trip-desc">${t.desc}</p>
 </div>
 </li>`;
 }
 const fresh = freshFinds[t.href]
 ? `<span class="trip-fresh">${freshFinds[t.href]} new in What&rsquo;s on</span>` : "";
 return `<li>
 <a class="trip lg ${s.kind === 'past' ? 'is-past' : ''}${t.href === heroHref ? ' is-next' : ''}" href="${t.href}">
 ${mark}
 <div class="trip-body">
 <div class="trip-kicker">${t.meta}</div>
 <h2 class="trip-title">${t.title}</h2>
 <p class="trip-desc">${t.desc}</p>
 <div class="trip-foot">${fresh}<span class="trip-go">View itinerary →</span></div>
 </div>
 </a>
 </li>`;
 }).join("");
}

// The masthead states the single most useful live fact: the next trip and how
// close it is. Recomputed from today's date whenever the list re-renders.
function renderMastMeta() {
 const real = TRIPS.filter(t => !t.placeholder);
 document.getElementById("m-count").textContent =
  real.length + (real.length === 1 ? " trip logged" : " trips logged");
 const hero = heroTrip();
 const el = document.getElementById("m-next");
 if (!hero) { el.textContent = "All trips complete"; return; }
 el.innerHTML = hero.s.kind === "now"
  ? "On now — " + plain(hero.t.title) + " · <b>day " + hero.s.label.split("day ")[1] + "</b>"
  : "Next — " + plain(hero.t.title) + " · <b>" + hero.s.label + "</b>";
}

// A live pulse from any trip that publishes an events feed: count entries
// added in the last fortnight (matching the trip page's "New" flag) and note
// them on the card. Quietly does nothing if the feed is missing or offline.
const freshFinds = {};
TRIPS.filter(t => t.feed).forEach(t => {
 fetch(t.feed, { cache: "no-cache" }).then(r => r.ok ? r.json() : null).then(data => {
  if (!data || !data.events) return;
  const cutoff = Date.now() - 14 * 86400000;
  const n = data.events.filter(e => !e.archived && e.added &&
   new Date(e.added + "T00:00:00").getTime() >= cutoff).length;
  if (n) { freshFinds[t.href] = n; renderTrips(); }
 }).catch(() => {});
});

function toggleSort() {
 newestFirst = !newestFirst;
 document.getElementById("sort-label").textContent = newestFirst ? "Newest first" : "Oldest first";
 document.getElementById("sort-arrow").classList.toggle("flipped", !newestFirst);
 renderTrips();
}

renderMastMeta();
renderTrips();
</script>
</body>
</html>
