<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,300;9..144,0,400;9..144,1,300;9..144,1,400&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ground:   #f7f6f3;
  --ground-2: #eeecea;
  --ground-3: #e4e2de;
  --ink:      #1a1916;
  --ink-2:    #3a3834;
  --ink-3:    #6b6860;
  --accent:   #2d5a3d;
  --accent-2: #1e3d29;
  --accent-lt:#e8f0eb;
  --rule:     #dddbd7;
  --rule-2:   #ccc9c4;
  --serif:    'Newsreader', Georgia, serif;
  --display:  'Fraunces', Georgia, serif;
  --mono:     'Inter', -apple-system, system-ui, sans-serif;
  --col:      680px;
  --pad:      1.5rem;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; font-size: 17px; }
body { background: var(--ground); color: var(--ink); font-family: var(--serif); line-height: 1.72; min-height: 100vh; }
.wrap { max-width: var(--col); margin: 0 auto; padding: 0 var(--pad); }

/* ── MASTHEAD ─────────────────────────────────────────────── */
.masthead {
  padding: 3.5rem 0 2.5rem;
  border-bottom: 1px solid var(--rule);
}
.mast-kicker {
  font-family: var(--mono);
  font-size: 0.65rem;
  font-weight: 500;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 1rem;
}
.mast-title {
  font-family: var(--display);
  font-size: clamp(3rem, 9vw, 5.5rem);
  font-weight: 400;
  line-height: 0.88;
  letter-spacing: -0.03em;
  font-optical-sizing: auto;
  color: var(--ink);
}
.mast-title em {
  font-style: italic;
  color: var(--accent);
  font-weight: 300;
}

/* ── TRIPS SECTION ────────────────────────────────────────── */
.trips-section { padding: 3rem 0 4rem; }

.section-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 2rem;
}
.section-label {
  font-family: var(--mono);
  font-size: 0.65rem;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.sort-btn {
  font-family: var(--mono);
  font-size: 0.62rem;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--accent);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  transition: color 0.12s;
}
.sort-btn:hover { color: var(--accent-2); }
.sort-arrow { display: inline-block; transition: transform 0.2s; }
.sort-arrow.flipped { transform: rotate(180deg); }

/* ── TRIP CARDS ───────────────────────────────────────────── */
.trip-list { list-style: none; }

.trip {
  display: block;
  text-decoration: none;
  padding: 2rem 0;
  border-bottom: 1px solid var(--rule);
  position: relative;
}
.trip:first-child { border-top: 1px solid var(--rule); }
.trip:hover .trip-title { color: var(--accent); }
.trip:hover .trip-arrow { transform: translateX(4px); color: var(--accent); }
.trip.placeholder { pointer-events: none; opacity: 0.45; }

.trip-meta {
  font-family: var(--mono);
  font-size: 0.62rem;
  font-weight: 500;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--accent);
  margin-bottom: 0.5rem;
}
.trip.placeholder .trip-meta { color: var(--ink-3); }

.trip-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 1rem;
}
.trip-title {
  font-family: var(--display);
  font-size: clamp(1.7rem, 4.5vw, 2.4rem);
  font-weight: 400;
  line-height: 1.04;
  letter-spacing: -0.02em;
  font-optical-sizing: auto;
  color: var(--ink);
  transition: color 0.12s;
}
.trip-title em { font-style: italic; font-weight: 300; }
.trip-arrow {
  font-family: var(--mono);
  font-size: 1.1rem;
  color: var(--rule-2);
  flex-shrink: 0;
  transition: transform 0.15s, color 0.12s;
}
.trip-desc {
  font-family: var(--serif);
  font-size: 0.95rem;
  color: var(--ink-3);
  line-height: 1.7;
  margin-top: 0.6rem;
  max-width: 44ch;
}
.trip-dates {
  font-family: var(--mono);
  font-size: 0.62rem;
  color: var(--ink-3);
  margin-top: 0.5rem;
  letter-spacing: 0.04em;
}
.trip-pill {
  display: inline-block;
  font-family: var(--mono);
  font-size: 0.55rem;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-3);
  border: 1px solid var(--rule-2);
  border-radius: 2px;
  padding: 0.15em 0.55em;
  margin-top: 0.5rem;
}

/* ── FOOTER ───────────────────────────────────────────────── */
footer {
  padding: 2rem 0 4rem;
  font-family: var(--mono);
  font-size: 0.62rem;
  color: var(--rule-2);
  letter-spacing: 0.12em;
  text-transform: uppercase;
}
a:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

@media (max-width: 600px) {
  .masthead { padding: 2rem 0 1.8rem; }
  .trips-section { padding: 2rem 0 3rem; }
  .trip-title { font-size: 1.8rem; }
}
</style>
</head>
<body>
<div class="wrap">

  <header class="masthead">
    <div class="mast-kicker">Cameron Death</div>
    <div class="mast-title">Trip <em>notes</em></div>
  </header>

  <section class="trips-section">
    <div class="section-row">
      <div class="section-label">Trips</div>
      <button class="sort-btn" id="sort-btn" onclick="toggleSort()">
        Newest first <span class="sort-arrow" id="sort-arrow">↓</span>
      </button>
    </div>

    <ul class="trip-list" id="trip-list"></ul>
  </section>

  <footer>Personal use only</footer>

</div>

<script>
const TRIPS = [
  {
    date: "2026-10-24",
    meta: "China · 2026",
    title: "China <em>October 2026</em>",
    desc: "Shanghai, second visit — Yangpu waterfront, West Bund galleries, Hongkou, and hairy crab season.",
    dates: "Oct 24 – Nov 1, 2026",
    href: "./china-oct-2026.html",
    placeholder: false
  },
  {
    date: "2026-07-08",
    meta: "Australia · 2026",
    title: "Melbourne <em>2026</em>",
    desc: "Food, laneways, art, and four nights of deliberate slow travel in winter.",
    dates: "8 – 12 July 2026",
    href: "./melbourne/",
    placeholder: false
  },
  {
    date: "2026-04-01",
    meta: "China · 2026",
    title: "China <em>April 2026</em>",
    desc: "Shanghai and Shaoxing — the Bund, French Concession, Qingming Festival, a day by high-speed rail.",
    dates: "1 – 12 April 2026",
    href: "./china-april-2026.html",
    placeholder: false
  }
];

let newestFirst = true;

function renderTrips() {
  const list = document.getElementById("trip-list");
  const sorted = [...TRIPS].sort((a, b) => {
    return newestFirst
      ? b.date.localeCompare(a.date)
      : a.date.localeCompare(b.date);
  });

  list.innerHTML = sorted.map(t => {
    if (t.placeholder) {
      return `<li class="trip placeholder">
        <div class="trip-meta">${t.meta}</div>
        <div class="trip-row">
          <div class="trip-title">${t.title}</div>
        </div>
        <p class="trip-desc">${t.desc}</p>
        <div class="trip-dates">${t.dates}</div>
        <div class="trip-pill">Coming soon</div>
      </li>`;
    }
    return `<li>
      <a class="trip" href="${t.href}">
        <div class="trip-meta">${t.meta}</div>
        <div class="trip-row">
          <div class="trip-title">${t.title}</div>
          <span class="trip-arrow">›</span>
        </div>
        <p class="trip-desc">${t.desc}</p>
        <div class="trip-dates">${t.dates}</div>
      </a>
    </li>`;
  }).join("");
}

function toggleSort() {
  newestFirst = !newestFirst;
  const btn = document.getElementById("sort-btn");
  const arrow = document.getElementById("sort-arrow");
  btn.childNodes[0].textContent = newestFirst ? "Newest first " : "Oldest first ";
  arrow.classList.toggle("flipped", !newestFirst);
  renderTrips();
}

renderTrips();
</script>
</body>
</html>
