<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel</title>
<meta name="description" content="Working itineraries for Cameron's trips — Shanghai, Melbourne, and China April 2026.">
<meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171512" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,300;9..144,0,400;9..144,1,300;9..144,1,400&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Size-adjusted fallbacks so the web fonts swap in without resizing the page.
   Ratios measured against the real faces; see site.css for the full note. */
@font-face { font-family: 'Fraunces fallback';   src: local('Georgia'), local('Times New Roman'); size-adjust: 86.6%; }
@font-face { font-family: 'Newsreader fallback'; src: local('Georgia'), local('Times New Roman'); size-adjust: 101.7%; }
@font-face { font-family: 'Inter fallback';      src: local('Arial'), local('Helvetica Neue');    size-adjust: 105.9%; }
:root {
 --ground: #f7f6f3;
 --ground-2: #eeecea;
 --ground-3: #e4e2de;
 --ink: #1a1916;
 --ink-2: #3a3834;
 --ink-3: #6b6860;
 --accent: #2d5a3d;
 --accent-2: #1e3d29;
 --accent-lt:#e8f0eb;
 --rule: #dddbd7;
 --rule-2: #ccc9c4;
 --serif: 'Newsreader', 'Newsreader fallback', Georgia, serif;
 --display: 'Fraunces', 'Fraunces fallback', Georgia, serif;
 --sans: 'Inter', 'Inter fallback', -apple-system, system-ui, sans-serif;
 --col: 680px;
 --pad: 1.5rem;
}
@media (prefers-color-scheme: dark) {
 :root {
  --ground: #171512;
  --ground-2: #211e1a;
  --ground-3: #2b2723;
  --ink: #ece8e1;
  --ink-2: #c7c1b6;
  --ink-3: #8f887c;
  --accent-2: #4f9470;
  --accent-lt: #1c2b21;
  --rule: #34302a;
  --rule-2: #423d35;
 }
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; font-size: 17px; }
body { background: var(--ground); color: var(--ink); font-family: var(--serif); line-height: 1.72; min-height: 100vh; }
.wrap { max-width: var(--col); margin: 0 auto; padding: 0 var(--pad); }

/* ── MASTHEAD ─────────────────────────────────────────────── */
.masthead {
 padding: 3.5rem 0 2.5rem;
 border-bottom: 1px solid var(--rule);
}
.mast-kicker {
 font-family: var(--sans);
 font-size: 0.65rem;
 font-weight: 500;
 letter-spacing: 0.22em;
 text-transform: uppercase;
 color: var(--ink-3);
 margin-bottom: 1rem;
}
.mast-title {
 font-family: var(--display);
 font-size: clamp(3rem, 9vw, 5.5rem);
 font-weight: 400;
 line-height: 0.88;
 letter-spacing: -0.03em;
 font-optical-sizing: auto;
 color: var(--ink);
}
.mast-title em {
 font-style: italic;
 color: var(--accent);
 font-weight: 300;
}
.mast-intro {
 font-family: var(--serif);
 font-size: 1rem;
 color: var(--ink-3);
 line-height: 1.65;
 margin-top: 1.1rem;
 max-width: 46ch;
}

/* ── TRIPS SECTION ────────────────────────────────────────── */
.trips-section { padding: 3rem 0 4rem; }

.section-row {
 display: flex;
 align-items: baseline;
 justify-content: space-between;
 margin-bottom: 2rem;
}
.section-label {
 font-family: var(--sans);
 font-size: 0.65rem;
 font-weight: 500;
 letter-spacing: 0.2em;
 text-transform: uppercase;
 color: var(--ink-3);
}
.sort-btn {
 font-family: var(--sans);
 font-size: 0.62rem;
 font-weight: 500;
 letter-spacing: 0.12em;
 text-transform: uppercase;
 color: var(--accent);
 background: none;
 border: none;
 cursor: pointer;
 padding: 0;
 display: flex;
 align-items: center;
 gap: 0.4rem;
 transition: color 0.12s;
}
.sort-btn:hover { color: var(--accent-2); }
.sort-arrow { display: inline-block; transition: transform 0.2s; }
.sort-arrow.flipped { transform: rotate(180deg); }

/* ── TRIP CARDS ───────────────────────────────────────────── */
.trip-list { list-style: none; }

.trip {
 display: block;
 text-decoration: none;
 padding: 2rem 0;
 border-bottom: 1px solid var(--rule);
 position: relative;
}
.trip:first-child { border-top: 1px solid var(--rule); }
.trip:hover .trip-title { color: var(--accent); }
.trip:hover .trip-arrow { transform: translateX(4px); color: var(--accent); }
.trip.placeholder { pointer-events: none; opacity: 0.45; }

.trip-meta {
 font-family: var(--sans);
 font-size: 0.62rem;
 font-weight: 500;
 letter-spacing: 0.16em;
 text-transform: uppercase;
 color: var(--accent);
 margin-bottom: 0.5rem;
}
.trip.placeholder .trip-meta { color: var(--ink-3); }

.trip-row {
 display: flex;
 align-items: baseline;
 justify-content: space-between;
 gap: 1rem;
}
.trip-title {
 font-family: var(--display);
 font-size: clamp(1.7rem, 4.5vw, 2.4rem);
 font-weight: 400;
 line-height: 1.04;
 letter-spacing: -0.02em;
 font-optical-sizing: auto;
 color: var(--ink);
 transition: color 0.12s;
}
.trip-title em { font-style: italic; font-weight: 300; }
.trip-arrow {
 font-family: var(--sans);
 font-size: 1.1rem;
 color: var(--rule-2);
 flex-shrink: 0;
 transition: transform 0.15s, color 0.12s;
}
.trip-desc {
 font-family: var(--serif);
 font-size: 0.95rem;
 color: var(--ink-3);
 line-height: 1.7;
 margin-top: 0.6rem;
 max-width: 44ch;
}
.trip-foot {
 display: flex;
 align-items: center;
 gap: 0.75rem;
 margin-top: 0.6rem;
 flex-wrap: wrap;
}
.trip-dates {
 font-family: var(--sans);
 font-size: 0.62rem;
 color: var(--ink-3);
 letter-spacing: 0.04em;
}
.trip-status {
 display: inline-block;
 font-family: var(--sans);
 font-size: 0.55rem;
 font-weight: 500;
 letter-spacing: 0.11em;
 text-transform: uppercase;
 border-radius: 2px;
 padding: 0.2em 0.6em;
 line-height: 1.4;
}
.trip-status.next { color: var(--accent); background: var(--accent-lt); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
.trip-status.now { color: var(--ground); background: var(--accent); border: 1px solid var(--accent); }
.trip-status.past { color: var(--ink-3); border: 1px solid var(--rule-2); }
.trip-status.soon { color: var(--ink-3); border: 1px solid var(--rule-2); }
/* Past trips recede so the next trip reads first; they lift back on interaction. */
.trip.is-past { opacity: 0.58; transition: opacity 0.15s; }
.trip.is-past:hover, .trip.is-past:focus-visible { opacity: 1; }

/* ── ADD A TRIP ───────────────────────────────────────────── */
.add-trip {
 display: flex;
 align-items: center;
 gap: 0.9rem;
 padding: 1.6rem 0;
 text-decoration: none;
 border-bottom: 1px solid var(--rule);
 color: var(--ink-3);
 transition: color 0.12s;
}
.add-trip:hover { color: var(--accent); }
.add-trip-plus {
 display: flex;
 align-items: center;
 justify-content: center;
 width: 34px;
 height: 34px;
 flex-shrink: 0;
 border: 1px dashed var(--rule-2);
 border-radius: 50%;
 font-family: var(--sans);
 font-size: 1.2rem;
 line-height: 1;
 color: var(--ink-3);
 transition: border-color 0.12s, color 0.12s;
}
.add-trip:hover .add-trip-plus { border-color: var(--accent); color: var(--accent); }
.add-trip-label {
 font-family: var(--sans);
 font-size: 0.7rem;
 font-weight: 500;
 letter-spacing: 0.14em;
 text-transform: uppercase;
}

/* ── FOOTER ───────────────────────────────────────────────── */
footer {
 padding: 2rem 0 4rem;
 font-family: var(--sans);
 font-size: 0.62rem;
 color: var(--rule-2);
 letter-spacing: 0.12em;
 text-transform: uppercase;
}
a:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

@media (max-width: 600px) {
 .masthead { padding: 2rem 0 1.8rem; }
 .trips-section { padding: 2rem 0 3rem; }
 .trip-title { font-size: 1.8rem; }
}
</style>
</head>
<body>
<div class="wrap">

 <header class="masthead">
 <div class="mast-kicker">Cameron Death</div>
 <div class="mast-title">Trip <em>notes</em></div>
 <p class="mast-intro">Working itineraries, not brochures — built to be walked, edited as they're used, and kept honest about what's confirmed and what's still just a plan.</p>
 </header>

 <section class="trips-section">
 <div class="section-row">
 <div class="section-label">Trips</div>
 <button class="sort-btn" id="sort-btn" onclick="toggleSort()" aria-label="Change trip order">
 <span id="sort-label">Newest first</span> <span class="sort-arrow" id="sort-arrow">↓</span>
 </button>
 </div>

 <ul class="trip-list" id="trip-list"></ul>

 <a class="add-trip" href="./new/">
 <span class="add-trip-plus">+</span>
 <span class="add-trip-label">Add a trip</span>
 </a>
 </section>

 <footer>Personal use only</footer>

</div>

<script>
const TRIPS = [
 {
 date: "2026-10-23",
 end: "2026-11-01",
 meta: "China · 2026",
 title: "China <em>October 2026</em>",
 desc: "Shanghai, second visit — Yangpu waterfront, small galleries, the old walled city, Hongkou, and hairy crab season, tuned toward Michelin Bib Gourmand and solo counter seats.",
 dates: "Oct 24 – Nov 1, 2026",
 href: "./shanghai/",
 placeholder: false
 },
 {
 date: "2026-07-08",
 end: "2026-07-12",
 meta: "Australia · 2026",
 title: "Melbourne <em>2026</em>",
 desc: "Food, laneways, art, and four nights of deliberate slow travel in winter.",
 dates: "8 – 12 July 2026",
 href: "./melbourne/",
 placeholder: false
 },
 {
 date: "2026-04-01",
 end: "2026-04-12",
 meta: "China · 2026",
 title: "China <em>April 2026</em>",
 desc: "Shanghai and Shaoxing — the Bund, French Concession, Qingming Festival, a day by high-speed rail.",
 dates: "1 – 12 April 2026",
 href: "./china-april-2026.html",
 placeholder: false
 }
];

// Live trip status from today's date, so the hub always shows what's next.
function tripStatus(t) {
 if (t.placeholder) return { kind: "soon", label: "Coming soon" };
 const today = new Date(); today.setHours(0, 0, 0, 0);
 const start = new Date(t.date + "T00:00:00");
 const end = new Date((t.end || t.date) + "T00:00:00");
 const DAY = 86400000;
 if (today < start) {
  const days = Math.round((start - today) / DAY);
  if (days === 0) return { kind: "next", label: "Starts today" };
  if (days === 1) return { kind: "next", label: "Starts tomorrow" };
  return { kind: "next", label: "In " + days + " days" };
 }
 if (today <= end) {
  const dayNum = Math.round((today - start) / DAY) + 1;
  const total = Math.round((end - start) / DAY) + 1;
  return { kind: "now", label: "On now · day " + dayNum + " of " + total };
 }
 return { kind: "past", label: "Past" };
}

let newestFirst = true;

function renderTrips() {
 const list = document.getElementById("trip-list");
 const sorted = [...TRIPS].sort((a, b) => {
 return newestFirst
 ? b.date.localeCompare(a.date)
 : a.date.localeCompare(b.date);
 });

 list.innerHTML = sorted.map(t => {
 const s = tripStatus(t);
 const statusPill = `<span class="trip-status ${s.kind}">${s.label}</span>`;
 if (t.placeholder) {
 return `<li class="trip placeholder">
 <div class="trip-meta">${t.meta}</div>
 <div class="trip-row">
 <div class="trip-title">${t.title}</div>
 </div>
 <p class="trip-desc">${t.desc}</p>
 <div class="trip-foot"><span class="trip-dates">${t.dates}</span>${statusPill}</div>
 </li>`;
 }
 return `<li>
 <a class="trip ${s.kind === 'past' ? 'is-past' : ''}${s.kind === 'now' ? ' is-now' : ''}" href="${t.href}">
 <div class="trip-meta">${t.meta}</div>
 <div class="trip-row">
 <div class="trip-title">${t.title}</div>
 <span class="trip-arrow">›</span>
 </div>
 <p class="trip-desc">${t.desc}</p>
 <div class="trip-foot"><span class="trip-dates">${t.dates}</span>${statusPill}</div>
 </a>
 </li>`;
 }).join("");
}

function toggleSort() {
 newestFirst = !newestFirst;
 document.getElementById("sort-label").textContent = newestFirst ? "Newest first" : "Oldest first";
 document.getElementById("sort-arrow").classList.toggle("flipped", !newestFirst);
 renderTrips();
}

renderTrips();
</script>
</body>
</html>
