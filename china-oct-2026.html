<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shanghai &amp; Hangzhou · October 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,300;9..144,0,400;9..144,1,300;9..144,1,400&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --ground:   #f7f6f3;
  --ground-2: #eeecea;
  --ground-3: #e4e2de;
  --ink:      #1a1916;
  --ink-2:    #3a3834;
  --ink-3:    #6b6860;
  --accent:   #2d5a3d;
  --accent-2: #1e3d29;
  --accent-lt: #e8f0eb;
  --rule:     #dddbd7;
  --rule-2:   #ccc9c4;
  --good:     #2d5a3d;
  --open:     #4a6fa5;
  --serif:    'Newsreader', Georgia, serif;
  --display:  'Fraunces', Georgia, serif;
  --mono:     'Inter', -apple-system, system-ui, sans-serif;
  --col: 680px;
  --pad: 1.5rem;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; font-size: 17px; }
body { background: var(--ground); color: var(--ink); font-family: var(--serif); line-height: 1.72; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.wrap { max-width: var(--col); margin: 0 auto; padding: 0 var(--pad); }

/* ── NO GLOW ON LIGHT ─────────────────────────────────────── */
.glow { display: none; }
.content { position: relative; }

/* ── MASTHEAD ─────────────────────────────────────────────── */
.masthead { padding: 3.5rem 0 2rem; }
.mast-city { font-family: var(--display); font-size: clamp(3rem, 9vw, 5.5rem); font-weight: 400; line-height: 0.88; letter-spacing: -0.03em; font-optical-sizing: auto; color: var(--ink); }
.mast-city em { font-style: italic; color: var(--accent); font-weight: 300; }
.mast-bar { display: flex; align-items: center; gap: 1.2rem; margin-top: 1.4rem; padding-top: 1rem; border-top: 1px solid var(--rule); }
.mast-dates { font-family: var(--mono); font-size: 0.7rem; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); }
.mast-weather { display: inline-flex; align-items: center; gap: 0.4rem; font-family: var(--mono); font-size: 0.7rem; color: var(--ink-3); margin-left: auto; }
.mast-weather-temp { color: var(--ink-2); font-weight: 500; }

/* ── PLANE PIECE ──────────────────────────────────────────── */
.plane-piece { padding: 2.5rem 0 3rem; border-bottom: 1px solid var(--rule); }
.kicker { font-family: var(--mono); font-size: 0.65rem; font-weight: 500; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 0.9rem; }
.plane-piece h2 { font-family: var(--display); font-size: clamp(1.9rem, 5vw, 3rem); font-weight: 400; line-height: 1.02; letter-spacing: -0.02em; font-optical-sizing: auto; margin-bottom: 0.8rem; color: var(--ink); }
.standfirst { font-family: var(--serif); font-size: 1.18rem; font-weight: 300; font-style: italic; color: var(--accent); line-height: 1.45; margin-bottom: 2rem; max-width: 32ch; }

/* ── PROSE ────────────────────────────────────────────────── */
.prose p { margin-bottom: 1.25em; color: var(--ink-2); font-size: 1rem; }
.prose p:last-child { margin-bottom: 0; }
.prose-drop > p:first-of-type::first-letter {
  font-family: var(--display); float: left; font-size: 4em; line-height: 0.76;
  font-weight: 400; padding: 0.04em 0.1em 0 0; color: var(--accent); font-optical-sizing: auto; }

/* ── EXPAND TOGGLE ────────────────────────────────────────── */
.expand { margin-top: 0.8rem; }
.expand-btn {
  display: inline-flex; align-items: center; gap: 0.5rem; cursor: pointer;
  background: none; border: none; padding: 0.2rem 0;
  font-family: var(--mono); font-size: 0.65rem; font-weight: 500;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent);
  transition: color 0.12s;
}
.expand-btn:hover { color: var(--accent-2); }
.expand-btn .chevron { display: inline-block; transition: transform 0.18s; font-style: normal; }
.expand-btn.open .chevron { transform: rotate(90deg); }
.expand-body {
  display: none; margin-top: 1rem;
  padding: 1.2rem 1.4rem;
  background: var(--ground-2);
  border-left: 2px solid var(--accent);
}
.expand-body.open { display: block; }
.expand-body .prose p { font-size: 0.92rem; color: var(--ink-2); }
.expand-body .prose-drop > p:first-of-type::first-letter { font-size: 3em; color: var(--accent); }

/* ── ESSAY TEASER ─────────────────────────────────────────── */
.essay-teaser { margin-bottom: 0.5rem; }
.essay-teaser p { font-family: var(--serif); font-size: 1rem; color: var(--ink-3); line-height: 1.7; margin: 0; display: inline; }
.essay-continue { display: inline; font-family: var(--serif); font-size: 1rem; color: var(--ink-3); }
.essay-continue::before { content: '\2026\00a0'; color: var(--rule-2); }
.essay-continue a { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); font-family: var(--mono); font-size: 0.65rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; vertical-align: baseline; }
.essay-continue a:hover { color: var(--accent-2); border-color: var(--accent); }


.chapter { padding: 3rem 0; border-bottom: 1px solid var(--rule); }
.chapter.is-past { opacity: 0.45; }
.chapter.is-today { border-left: 2px solid var(--accent); padding-left: 1.5rem; margin-left: -1.5rem; }
.chapter-label { font-family: var(--mono); font-size: 0.62rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.6rem; }
.chapter-head { margin-bottom: 1.8rem; }
.chapter-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; margin-bottom: 0.5rem; }
.chapter-meta { font-family: var(--mono); font-size: 0.65rem; font-weight: 500; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 0.5rem; }
.chapter-meta .date-accent { color: var(--accent); }
.chapter-title { font-family: var(--display); font-size: clamp(1.7rem, 4.5vw, 2.4rem); font-weight: 400; line-height: 1.04; letter-spacing: -0.02em; font-optical-sizing: auto; color: var(--ink); }
.day-weather { display: flex; flex-direction: column; align-items: flex-end; gap: 0.1rem; flex-shrink: 0; padding-top: 0.1rem; }
.day-weather-icon { font-size: 1.3rem; line-height: 1; }
.day-weather-temps { font-family: var(--mono); font-size: 0.62rem; color: var(--ink-3); white-space: nowrap; }
.day-weather-temps .hi { color: var(--ink-2); }

/* ── SPINE ────────────────────────────────────────────────── */
.spine { position: relative; padding-left: 2rem; margin-top: 1.5rem; }
.spine::before { content: ''; position: absolute; left: 0; top: 0.6rem; bottom: 0.6rem; width: 1px; background: var(--rule); }
.stop { position: relative; margin-bottom: 1.8rem; }
.stop:last-child { margin-bottom: 0; }
.stop::before {
  content: ''; position: absolute; left: -2rem; top: 0.52rem;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--ground); border: 1px solid var(--rule-2);
}
.stop[data-kind="food"]::before { border-color: var(--accent); background: var(--ground); }
.stop[data-kind="culture"]::before { background: var(--accent); border-color: var(--accent); }
.stop-time { font-family: var(--mono); font-size: 0.62rem; font-weight: 500; letter-spacing: 0.1em; color: var(--accent); text-transform: uppercase; margin-bottom: 0.15rem; }
.stop-head { display: flex; align-items: baseline; gap: 0.7rem; flex-wrap: wrap; margin-bottom: 0.2rem; }
.stop-title { font-family: var(--display); font-size: 1.1rem; font-weight: 400; color: var(--ink); line-height: 1.2; font-optical-sizing: auto; }
.stop-title a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--rule-2); }
.stop-title a:hover { color: var(--accent); border-color: var(--accent); }
.stop-tag { font-family: var(--mono); font-size: 0.58rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; padding: 0.15em 0.55em; border-radius: 1px; flex-shrink: 0; }
.stop-tag.confirmed { color: var(--good); border: 1px solid color-mix(in srgb, var(--good) 40%, transparent); background: var(--accent-lt); }
.stop-tag.open { color: var(--open); border: 1px solid color-mix(in srgb, var(--open) 35%, transparent); }
.stop-note { font-family: var(--serif); font-size: 0.88rem; color: var(--ink-3); line-height: 1.65; }
.stop-ref { font-family: var(--mono); font-size: 0.62rem; color: var(--rule-2); margin-top: 0.3rem; letter-spacing: 0.04em; }
.stop-ref span { color: var(--ink-3); }
.stop-map { font-family: var(--mono); font-size: 0.62rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); text-decoration: none; margin-top: 0.35rem; display: inline-block; }
.stop-map:hover { color: var(--accent-2); }

/* ── BOOKINGS LEDGER ──────────────────────────────────────── */
.bookings-section { padding: 3rem 0; border-bottom: 1px solid var(--rule); }
.ledger { margin-top: 1.2rem; }
.ledger-row { display: flex; align-items: baseline; gap: 0.9rem; padding: 0.65rem 0; border-bottom: 1px solid var(--rule); }
.ledger-row:first-child { border-top: 1px solid var(--rule); }
.ldot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; align-self: center; }
.ldot.confirmed { background: var(--good); }
.ldot.open { background: var(--open); }
.ledger-body { flex: 1; min-width: 0; }
.ledger-label { font-family: var(--display); font-size: 0.98rem; font-weight: 400; color: var(--ink); font-optical-sizing: auto; }
.ledger-sub { font-family: var(--mono); font-size: 0.62rem; color: var(--ink-3); margin-top: 0.1rem; letter-spacing: 0.02em; }
.ledger-ref { font-family: var(--mono); font-size: 0.6rem; color: var(--rule-2); margin-top: 0.15rem; }
.ledger-ref span { color: var(--accent); }
.ledger-state { font-family: var(--mono); font-size: 0.58rem; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; flex-shrink: 0; }
.ledger-state.confirmed { color: var(--good); }
.ledger-state.open { color: var(--open); }
.ledger-link { font-family: var(--mono); font-size: 0.62rem; color: var(--accent); text-decoration: none; flex-shrink: 0; }
.ledger-link:hover { color: var(--accent-2); }

/* ── BACK POCKET ──────────────────────────────────────────── */
.pocket { padding: 3rem 0; border-bottom: 1px solid var(--rule); }
.pocket-group { margin-bottom: 0.25rem; }
.pocket-btn {
  width: 100%; display: flex; align-items: center; justify-content: space-between;
  background: none; border: none; border-bottom: 1px solid var(--rule);
  padding: 0.85rem 0; cursor: pointer; color: var(--ink);
  font-family: var(--serif); font-size: 1rem; font-weight: 400; text-align: left;
}
.pocket-btn .chev { font-family: var(--mono); color: var(--ink-3); font-size: 0.8rem; transition: transform 0.18s; }
.pocket-btn.open .chev { transform: rotate(90deg); }
.pocket-body { display: none; padding: 0.4rem 0 0.9rem; }
.pocket-body.open { display: block; }
.pocket-item { padding: 0.5rem 0; border-bottom: 1px solid var(--rule); }
.pocket-item:last-child { border-bottom: none; }
.pocket-item .n { font-family: var(--serif); font-size: 0.95rem; color: var(--ink-2); }
.pocket-item .d { font-family: var(--mono); font-size: 0.65rem; color: var(--ink-3); line-height: 1.55; margin-top: 0.1rem; letter-spacing: 0.01em; }

/* ── SECTION LABEL ────────────────────────────────────────── */
.section-label { font-family: var(--mono); font-size: 0.65rem; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 0; }

/* ── FAB / NOTES ──────────────────────────────────────────── */
footer { padding: 3rem 0 4rem; text-align: center; font-family: var(--mono); font-size: 0.62rem; color: var(--rule-2); letter-spacing: 0.12em; text-transform: uppercase; }
.fab { position: fixed; bottom: 1.4rem; right: 1.4rem; z-index: 50; width: 46px; height: 46px; border-radius: 50%; background: var(--accent); color: var(--ground); border: none; cursor: pointer; font-family: var(--display); font-size: 1.2rem; box-shadow: 0 2px 12px rgba(45,90,61,0.25); transition: transform 0.12s; }
.fab:hover { transform: scale(1.06); }
.notepanel { position: fixed; bottom: 5rem; right: 1.4rem; z-index: 50; width: min(300px, calc(100vw - 2.8rem)); background: var(--ground); border: 1px solid var(--rule); border-radius: 4px; padding: 1rem; box-shadow: 0 4px 24px rgba(0,0,0,0.12); display: none; }
.notepanel.open { display: block; }
.notepanel textarea { width: 100%; height: 76px; resize: none; background: var(--ground-2); color: var(--ink); border: 1px solid var(--rule); border-radius: 2px; padding: 0.55rem; font-family: var(--mono); font-size: 0.78rem; }
.notepanel textarea:focus { outline: 1px solid var(--accent); }
.notepanel .save { margin-top: 0.45rem; width: 100%; padding: 0.45rem; background: var(--accent); color: var(--ground); border: none; border-radius: 2px; font-family: var(--mono); font-weight: 500; font-size: 0.72rem; letter-spacing: 0.06em; cursor: pointer; text-transform: uppercase; }
.notelist { margin-top: 0.5rem; max-height: 120px; overflow-y: auto; }
.noteitem { font-family: var(--mono); font-size: 0.65rem; color: var(--ink-2); padding: 0.35rem 0; border-bottom: 1px solid var(--rule); line-height: 1.4; }
.noteitem:last-child { border-bottom: none; }
.notelist .empty { font-family: var(--mono); font-size: 0.65rem; color: var(--ink-3); }
a:focus-visible, button:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<div class="glow"></div>
<div class="content"><div class="wrap">

<header class="masthead">
  <div class="mast-city" id="m-title"></div>
  <div class="mast-bar">
    <span class="mast-dates" id="m-dates"></span>
    <span class="mast-weather" id="m-weather"></span>
  </div>
</header>

<section class="plane-piece" id="plane"></section>

<main id="chapters"></main>

<section class="pocket" id="pocket-section">
  <div class="section-label">Back pocket</div>
  <div id="pocket-wrap"></div>
</section>

<section class="bookings-section" id="bookings-section">
  <div class="expand">
    <button class="expand-btn" id="bookings-toggle"><em class="chevron">›</em>&nbsp;The bookings</button>
    <div class="expand-body" id="bookings-body">
      <div class="ledger" id="ledger-list"></div>
    </div>
  </div>
</section>

<footer>Melbourne · July 2026</footer>
</div></div>

</div>

<script>
const TRIP = {
  meta: {
    title: "Shanghai <em>&amp; Hangzhou</em>",
    dates: "24 Oct – 1 Nov 2026",
    flights: { out: "NZ570 CHC→AKL 7:10pm · NZ289 AKL→PVG 11:45pm → 6:55am", ret: "NZ288 PVG→AKL 2:15pm → 6:45am · NZ527 AKL→CHC 8:50am → 10:15am", ref: "D52ZEH" },
    base: { name: "Pullman Shanghai Central, 15 Dapu Road (from 27 Oct)", map: "https://maps.google.com/?q=Pullman+Shanghai+Central+15+Dapu+Road" },
    plane: {
      kicker: "Read on the plane",
      title: "The Four Waterfronts",
      standfirst: "Every regime that has held this city has written its argument on the river. Only one waterfront was never making one.",
      preview: `<p>At 830 Yangshupu Road, on the northern bank of the Huangpu, there is a Scottish castle. Crenellated parapets, a squat tower, walls of dark stone laid by men who had clearly built things like this before, in Glasgow or Aberdeen, for clients who wanted to look ancient. It was finished in 1883. It is a waterworks. It still pumps water to part of Shanghai, which means it has been doing the same unglamorous municipal job for a hundred and forty years, through the late Qing, the Republic, the Japanese occupation, the civil war, Mao, the Cultural Revolution, Deng, and whatever it is we are calling the present arrangement. The castle does not care about any of that. Water comes in dirty and leaves clean. The British who built it are gone. The empire that sent them is gone. The water remains the point.</p>`,
      full: `<p>You could organise an entire understanding of Shanghai around the question of why there is a Scottish castle pumping water on a Chinese river, and you would not be wasting your time, because the river is the oldest thing the city has to say about itself, and every regime that has held this place has written its argument onto the water's edge.</p>
<p>Start with the obvious one. Stand on the Bund with your back to the river and the buildings in front of you are a sentence in a language of stone, and the sentence is: we are never leaving. The Customs House, with its clock that has kept British time since 1927. The old Hongkong and Shanghai Bank, whose lobby was designed so that a man walking in to deposit money would feel the weight of the institution settle on him before he reached the counter. The Sassoon House, now the Peace Hotel, built by a dynasty of Baghdadi Jews who had made one fortune in Bombay and came to make a larger one here. These were not commercial buildings in the way we now mean the phrase. They were arguments about permanence, addressed to the Chinese city behind them and to each other, written in the most expensive materials available. The people who commissioned them believed, sincerely, that the arrangement which made them possible would last for centuries. It lasted, in the end, about ninety years. In May 1949 the People's Liberation Army walked up the Bund and the entire civilisation those buildings were built to announce was over inside eighteen months. The buildings are still there. The argument they were making is the deadest thing in the city.</p>
<p>Now turn around. Across the water is the reply.</p>
<p>Pudong was rice paddies and warehouses until 1990, when Deng Xiaoping designated it a special economic zone and the state began to answer the Bund directly, across four hundred metres of river, in a language the foreigners would have understood. The Pearl Tower first, which is ungainly and beloved and looks like a toy. Then the Jin Mao. Then the World Financial Center, with the hole in the top that the city nicknamed the bottle opener. Then the Shanghai Tower, twisting up to become, for a while, the second-tallest building on earth. The argument across the river is not about permanence. The Bund already tried permanence and lost. The argument is about speed, and about scale, and about the specific national satisfaction of building, in thirty-five years, on land the foreigners never bothered to develop, a skyline that makes their monuments look like a row of nice old banks. Which, now, is exactly what they are.</p>
<p>Two waterfronts, two regimes, one conversation conducted across water. This much a good guidebook will tell you, or most of it. Here is the part the guidebook will not tell you, because it requires saying something slightly impolite about the present.</p>
<p>There is a third waterfront, and it is the most interesting, and it is made of art.</p>
<p>Go south from the French Concession to the stretch of the Huangpu the city now calls the West Bund. Forty years ago this was the industrial underside of the river: a coal wharf, an aviation fuel depot, a cement works, the unglamorous machinery that fed a port. The state has spent the last fifteen years clearing it and handing it, deliberately and at enormous expense, to contemporary art. The Long Museum occupies a converted coal-hopper bridge. Tank Shanghai is five aviation fuel tanks with the art placed inside them and the tanks left frankly visible, so that you are always aware you are standing inside the thing that used to hold jet fuel. The West Bund Museum ran a long collaboration with the Centre Pompidou. The effect, walking it, is of a district that has decided culture is now the highest use of riverfront land, higher than shipping, higher than housing, higher than finance.</p>
<p>This looks, at first, like simple civic generosity. It is not. It is the third argument, and to see what it is arguing you have to look at who is making it.</p>
<p>The Long Museum belongs to a man named Liu Yiqian and his wife Wang Wei. Liu drove a taxi, then sold handbags, then made an enormous fortune trading securities in the early, lawless years of the Chinese stock market. In 2015 he bought a Modigliani nude at Christie's in New York for a hundred and seventy million dollars, and the detail that went around the world was that he put a substantial part of it on an American Express card, for the points. He built two museums to hold what that kind of money buys. He is, in other words, exactly the same character as the men who built the Bund. Private capital, accumulated fast and not always prettily, performing civilisation as a way of converting money into legitimacy. The Sassoons did it with Art Deco towers. Liu does it with a Modigliani and a coal-hopper bridge. The continuity is the whole point. Shanghai has always been the city where new money builds a monument to itself and waits to see whether the monument will be allowed to stand.</p>
<p>What is different now, and what makes the West Bund the sharpest text on the river, is the state's relationship to that money. The foreigners on the old Bund operated in concessions where Chinese law did not reach. Their monuments were arguments against the surrounding authority. Liu Yiqian's museums are the opposite. They exist because the state cleared the land, approved the project, and decided that a riverfront full of contemporary art is a useful thing for Shanghai to have, the way a great capital is supposed to have such things. The art on the West Bund is art that performs prestige. It is sophisticated, it is internationally legible, it draws the fairs and the collectors and the magazine features, and it stays, with great care, on the correct side of a line that everyone in the room can feel and no one will name. The genuinely uncomfortable work, the work that argues, lives elsewhere, in smaller rooms in the French Concession, tolerated up to a point because tolerating it up to a point is itself a kind of sophistication the city wants to be able to claim. The West Bund is what it looks like when a state learns that contemporary art is a prestige technology, the way the foreigners knew that neoclassical stone was one. It is the Bund's argument about permanence, updated for a regime that understands soft power.</p>
<p>So: the river says we are forever, and that was a lie. The river says we are faster and bigger than you, and that is true but anxious. The river says we are civilised now, look at our museums, and that is true and calculated. Three waterfronts, three performances, each addressed to an audience the performer is not quite sure of.</p>
<p>And then there is Yangpu.</p>
<p>Yangpu is the fourth waterfront and the only one where no one is performing, which is why it is the one to walk. It is the industrial northeast, where Shanghai's actual modern history happened, the factories and the waterworks and the power plant and the textile mills, the part of the city that did the work while the Bund took the credit and Pudong took the photographs. The state has been opening it as public riverfront since 2017, ten continuous kilometres of it, but the project here is different in kind from the West Bund. There is no Modigliani. There are no fairs. The Yangshupu Power Plant, once among the largest thermal stations in East Asia, is a ruin, left as a ruin, its chimney standing over the water like a punctuation mark at the end of a sentence the city has stopped speaking. The waterworks castle still pumps water. The old soap factory is a café. A tobacco warehouse has had its outer walls stripped away so that plants grow on every floor and the river comes through. People walk here. Old men fish. Couples photograph each other against the ruins without knowing or caring what the ruins were. It is, by a wide margin, the least visited stretch of the central Huangpu, and almost no one travels for it.</p>
<p>What makes it the honest one is precisely that it is not an argument. The Bund was built to convince. Pudong was built to answer. The West Bund was built to impress. Yangpu was built, originally, to do work, and now that the work is done it has been handed back not as a monument but as a place to be, which is the only thing a riverbank has ever actually wanted to be. The castle does not want you to think anything about the British Empire. It wants to pump water. The power plant is not making a point about industry. It is just very large and very quiet and very beautiful in the late afternoon, when the light comes low across the water and lands on the brick, and you can stand on the path and be, for once, in a part of Shanghai that has forgotten you are watching.</p>
<p>This is what a second visit is for. The first time, the city performs for you, and you let it, because the performance is genuinely magnificent and you have not earned the right to look past it. The Bund at dusk, the Pudong towers coming alight, the whole son-et-lumière of a city showing the world what it has become. You should see it. Everyone should see it once. But the performance is the thing the city wants you to take away, and a city, like a person, is most itself in the moments when it has stopped trying to make an impression. Shanghai has four waterfronts and three of them are working on you. Walk the fourth. The river was here before the cotton port and the concessions and the towers, and it will be here after the second-tallest building has become, like the Customs House, a quaint reminder of what one generation was sure would last forever. The water comes in dirty and leaves clean. That, in the end, is the only argument on the river that has ever been telling the truth.</p>`

      title: 'Arrival, the Canal First',
      essay: `<p>A body that has just crossed nine time zones in a flat-bed seat wants one thing on landing, and it is not an itinerary. It wants somewhere to put itself down. The drive out of Pudong does not go into Shanghai at all this time — it peels southwest along the expressway, the airport's clutter thinning into flat green delta before the first low hills show up on the horizon, and by the time you are properly awake to it, you are most of the way to a different city.</p>
<p>Hangzhou receives you the way Shanghai never quite does: without asking anything back. Base near the Grand Canal rather than the lake, in Gongshu, where the hotels are not priced for a view and the city is unhurried in a way that has nothing to do with tourism. There is no reason to fight the jet lag on arrival day. Bags down, then whenever the afternoon turns up, walk to Gongchen Bridge — the high Qing stone arch where the longest artificial waterway on earth comes to its end after seventeen hundred kilometres from Beijing. Boats still pass under it, low barges heaped with sand and coal, working traffic on a canal dug before the Normans reached England. Walk it without an agenda, because there is not one to have yet.</p>

    {
      id: 'd2', dow: 'Sunday', date: '25 October', chapter: 'II',
      title: 'Liangzhu',
      essay: `<p>Every argument this trip has been having with itself about permanence is about to meet something that actually qualifies. Northwest of the city, in Yuhang district, is a walled settlement that anchored a civilisation here for the better part of a thousand years, beginning somewhere around 3300 BC, complete with a water-management system of eleven dams and spillways that is, by a wide margin, the oldest large-scale hydraulic engineering yet found anywhere on earth. It predates the Grand Canal you walked yesterday by more than three thousand years. It predates dynastic China almost entirely — there was no Xia, no Shang, no emperor of any kind, when the people who built this were burying their dead under carved jade in ceremonial mounds a few kilometres from where you will be standing.</p>
<p>The site was found in 1936 by a local scholar named Shi Xingeng and was not properly understood for decades after — treated, for most of the twentieth century, as a regional curiosity rather than what it actually is, which is early-state China rewriting its own founding story. UNESCO agreed in 2019. The museum, a low, deliberately unshowy building by David Chipperfield, holds the jade: cong tubes, bi discs, the ceremonial axes that marked out a ruling class with a belief system sophisticated enough to need symbols for it. The site itself, city walls and ceremonial platforms and rice paddies still legible in the ground, wants the better part of a day and an electric cart to see properly. This is not a place you tick off in ninety minutes.</p>
<p>Go slow, and let the museum do the explaining before or after the walk, whichever order suits your patience for context. There is a deer park near the middle of the site if you want a break that is not intellectual. What this day is actually for is recalibrating the whole trip's sense of scale. The waterworks castle at Yangpu has been running since 1883 and that felt, a few weeks ago, like a long time. The canal at Gongchen Bridge has been moving barges for over a thousand years and that felt like something close to eternity. This was already old when both of those ideas were still unimaginable.</p>`,

    {
      id: 'd3', dow: 'Monday', date: '26 October', chapter: 'III',
      title: 'Tea, Wang Shu, the Lake at a Distance',
      essay: `<p>A hillside of tea bushes at half past nine on a weekday in late October is as close to silence as a famous place in China gets. The harvest crowds belong to spring. What remains now is the terrace itself, dark green stepping up the slope, the air carrying a faint vegetal sweetness the city never has, and a few farmers working rows that have been worked for over a thousand years.</p>
<p>Walk into Longjing village rather than the coach park, where the growers sell from their own doorways, and the move is to sit down, take the cup that is poured, and taste what is in front of you before deciding whether to buy. The leaf now is the autumn pick, lighter than the celebrated spring crop, honest on the hill where it grew. Longwu, fifteen minutes further out, is quieter still if the first village feels arranged for visitors.</p>
<p>The same southwestern reach of the city, a short drive through the hills, holds the thing that justifies calling this an art trip. The China Academy of Art's Xiangshan campus was built by Wang Shu out of millions of tiles and bricks salvaged from the villages that Chinese development was erasing, a building that argues with its own country in physical form and sees almost no foreign visitors. On the same campus, the red-brick design museum by Álvaro Siza holds a Bauhaus collection bought whole from a German collector — though it is closed on Mondays, so the argument you are here for is the campus itself, not what is inside one building on it.</p>
<p>Back in the city by afternoon, lunch on the old imperial street where Dongpo pork is braised soft enough to lift with a chopstick, and then the lake, briefly, in the last of the light. A walk along the Bai Causeway, willows going gold, mist coming up off the water, the silhouette the painters have used for a thousand years. See it once, without expectation, and leave it to the crowds it belongs to. Dinner is Hangzhou's own cooking — Longjing shrimp, lake fish, a pot of something slow — the city tasted on its own terms before you carry the appetite into Shanghai tomorrow.</p>`,

      id: 'd4', dow: 'Tuesday', date: '27 October', chapter: 'IV',
      title: 'Into Shanghai, the Fourth Waterfront',
      essay: `<p>Three days in a slower key, and now the road undoes itself: the hills give way to flat green delta, the delta thickens into towns, the towns resolve into the first towers, and by the time the driver merges onto the elevated expressway proper you are unmistakably back in the fastest city on the itinerary. It is a strange rhythm to arrive at speed on purpose, but that is what today is — the gear change in reverse.</p>
<p>Shanghai at midafternoon is not asking anything difficult of you. The Yangpu waterfront, where the day is actually spent, supplies air rather than ambition — no ticket, no queue, no sight to tick. A driver drops you at the ruin of a power station and you walk west along the river into a part of Shanghai that does not know it is being looked at. A castle that turns out to be a waterworks, still running since 1883, doing the same unglamorous job it was doing before any of the last three days' arguments about permanence got started. A warehouse with reeds growing through it. The light comes low off the water by four and lands on a century of brick, and the only other people are old men with fishing rods and couples who have come for the photographs and not the history.</p>
<p>Dinner is the one decision that matters, and it should be small. Sanbaibei, on Jin Xian Road, is a Ningbo tavern that fills with locals and serves the kind of food a single person can order without strategy: cold things, pickled things, a fish, a glass of something. No sharing, no spread, no negotiating a table built for six. Eat early. Three cities in eight days is a lot to be carrying, and the fourth waterfront, the one that is not performing for anyone, is the right place to set some of it down.</p>`,

    {
      id: 'd5', dow: 'Wednesday', date: '28 October', chapter: 'V',
      title: 'The West Bund',
      essay: `<p>Money that arrives too fast needs somewhere to put itself, and in this city it has always chosen the riverbank. Standing inside a converted coal-hopper bridge on the southern Huangpu, looking at art bought by a man who drove a taxi before he bought a Modigliani, you are looking at the newest version of the oldest story Shanghai tells.</p>
<p>Tank Shanghai gets the late morning, at opening, on a Wednesday when the galleries belong mostly to you rather than the weekend crowd. Five aviation fuel tanks, the largest wide enough to lose a sense of scale in, with the art set inside them and the tanks left honestly visible, so the building never lets you forget what it used to hold. The river path runs north from there to the Long Museum, where the concrete vaults of the old industrial structure were kept and the galleries built into their shadow. The collection is the argument: Chinese artists who came of age after 1989, hung in a building made of salvage, on a riverbank the state cleared of industry to make room for exactly this. In April you learned to read the colonial layer. This is the contemporary layer, and it rewards the same attention.</p>
<p>There is a specific helplessness in being handed a menu you cannot read, in a room where everyone clearly knows what they are doing, and it shapes a trip more than anyone admits. You eat where it is safe. You return to the hotel. You miss the city at the level it is most worth having, which is the level of dinner. The evening is built to dismantle that. A food walk through the downtown streets after dark, three and a half hours of it, exists ostensibly to feed you, and it does — pork chops over sticky rice on Yunnan Road, dumplings, a heritage dessert at the end. The real cargo is fluency. You watch how a person orders. You watch how much they actually ask for. By the time it finishes you will have stopped seeing the menu as a wall, and you will eat differently for the rest of the week because of this one evening, which is the entire reason it goes early.</p>`,

      id: 'd6', dow: 'Thursday', date: '29 October', chapter: 'VI',
      title: 'The Day With Nothing In It',
      essay: `<p>Not every day on a trip like this needs a reason, and this one is deliberately built without one — a day with no ticket in it, dropped in on purpose after three dense days in a row, because a schedule this considered still needs somewhere for the considering to stop. The neighbourhood around the hotel is the old Luwan heart of the French Concession, and it is best understood not as a set of sights but as a grain, something you read by walking across it slowly.</p>
<p>Tianzifang is eight minutes away and best entered from whichever alley looks least like an entrance, so the lane houses arrive as a neighbourhood rather than a destination, washing strung overhead, a man fixing something in a doorway, the maze closing in. West and south from there the plane trees take over, the streets the French laid out and named after their own dead, now lined with coffee that costs what coffee costs in Melbourne and shops selling single ceramic bowls as though they were jewellery. You are not looking for anything. That is the point of the day. A long lunch somewhere that does not need to be researched. A bench in Fuxing Park among the men playing cards and the women dancing in loose formation to a speaker. An afternoon that leaves no evidence.</p>
<p>Dinner can stay in the same key, small and unmanaged. Man Man Tang Bao keeps four tables and a single thing worth ordering, soup dumplings filled by hand a few feet from where you sit, and a single diner pointing at a steamer is exactly the transaction the room is built for. The skill the food walk gave you last night has somewhere to go. Eat, pay with the phone you set up in Hangzhou, walk home through a neighbourhood that has stopped performing because it never started.</p>`,

    {
      id: 'd7', dow: 'Friday', date: '30 October', chapter: 'VII',
      title: 'The Galleries That Do Not Perform',
      essay: `<p>A guide explained this neighbourhood once, in the spring, and explanation is a way of holding a place at arm's length. Walked without one, at your own speed, the French Concession stops being a lecture about plane trees and extraterritoriality and becomes a set of rooms you can enter.</p>
<p>Morning belongs to the small galleries, the ones that do not make the magazines. Capsule on Yongjia Road, sunk into a lane house. BANK. CHERUBY on Changle Road, which opened only last year. These are the rooms where the work is harder than anything on the West Bund, made to be looked at rather than collected, and this particular week they are hanging new shows before the November fairs, which means you catch the art going up in spaces that are quiet. A young Chinese artist's first serious exhibition, encountered with no one else in the room, is a different thing from the same work behind a rope at a fair with a collector's assistant hovering.</p>
<p>The afternoon holds the strangest hour in the city. On the lower floor of an ordinary residential block, behind a door the map cannot quite locate, several thousand propaganda posters from the decades when Shanghai was switched off. The visual language of the years the rest of the week keeps gesturing at, the long dormancy between the foreigners leaving and Deng turning the lights back on, kept in a private collection you have to ask your way into.</p>
<p>Evening is eating you do not have to manage. A guided walk through the Concession after dark, when the lane houses light from inside and the charcoal grills come out onto the corners and the air goes to smoke and osmanthus. Three hours, paced for someone who arrives hungry. Arrive hungry.</p>`,

    {
      id: 'd8', dow: 'Saturday', date: '31 October', chapter: 'VIII',
      title: 'Hongkou, and the Crab',
      essay: `<p>A single square mile north of the Bund holds more of the twentieth century than anywhere else in the city, and almost no one walks it. Hongkou was working-class and is still residential, indifferent to visitors, and on a Saturday morning it has more of itself on display than the polished districts ever manage.</p>
<p>Begin where the food is honest. Zhapu Lu is a street of stalls and small tables with no English and no scaffolding for outsiders, where you order by watching the plates go past and pointing, and the format — bowls and small plates for whoever turns up — suits a single diner exactly. Then walk, without much of a map, into the streets around it.</p>
<p>What those streets hold is the reason to be here. Duolun Road was the centre of the League of Left-Wing Writers, the movement that argued China toward its future in the 1930s, and Lu Xun, whose birthplace you stood in at Shaoxing in the spring, spent his last nine years a few streets from here and is buried in the park to the north. The thread you picked up at the Xianheng tavern runs straight into these blocks. A few minutes east is the old Ohel Moshe synagogue on Changyang Road, now the Jewish Refugees Museum, where twenty thousand people fleeing Europe landed between 1933 and 1941 because Shanghai was the one city on earth that asked nothing of them at the door. A literary revolution and a refugee sanctuary, conducted in overlapping streets in the same decade. Give the museum the two hours it asks for.</p>
<p>Back toward the hotel by mid-afternoon, and then the meal the whole week has been arranged around. Hairy crab is the most seasonal thing Shanghai eats, and the last week of October is the hinge when both the roe-heavy females and the meatier males are good at once, a coincidence of the lunar calendar that locals plan their autumn around. The crab is steamed plain, because anything else is held to corrupt it, and eaten with vinegar and ginger and warm yellow wine — the same Shaoxing wine you drank at its source in April. You traced that wine to the town where it is made. Now it arrives at the table doing the job it was made for. Order the crab, and if eating a whole one alone feels like work, order the crab noodles, where someone has already done the picking and the roe goes through the whole bowl. Sit at the counter. This is the last dinner in the city, and there is a real morning before the flight, so let it run long.</p>`,

      id: 'd9', dow: 'Sunday', date: '1 November', chapter: 'IX',
      title: 'Departure',
      essay: `<p>Departure days have a thinness to them, a sense of a place already withdrawing while you are still standing in it. The flight leaves Pudong at quarter past two and check-in closes at quarter to one and the airport is fifty minutes out, which leaves a real morning rather than a scramble, and the right way to spend it is on whatever the week left undone.</p>
<p>Not a new thing. A return. The lane that looked good in passing on Thursday, the coffee somewhere you meant to go back to, a last walk through the neighbourhood you have, over the past week, started to know the shape of. A second visit ends differently from a first. The first time you leave with the performance still ringing, the towers and the Bund and the whole spectacle of the place. The second time you leave with something quieter and more durable: a river no one was watching, a hillside of tea, a walled city three thousand years older than anything else on the itinerary, a square mile of history north of a river, a city caught for a moment with its face relaxed.</p>
<p>Pack the night before. Leave by eleven. The city does not perform a farewell, which is the last honest thing it does for you.</p>`,

    { label: 'Hangzhou hotel, Gongshu district', sub: '24–27 Oct, 3 nights. Near the Grand Canal. Not yet chosen.', state: 'open' },
    { label: 'Pullman Shanghai Central', sub: '27 Oct–1 Nov, 5 nights. 15 Dapu Road, Huangpu. Not yet booked for these dates.', state: 'open' },
    { label: 'Liangzhu entry', sub: 'Real-name booking via the Liangzhu Ancient City WeChat mini-program.', state: 'open' },
    { label: 'Monster After Dark Food Tour', sub: 'Wed 28 Oct evening.', state: 'open' },
    { label: 'UnTour Night Eats', sub: 'Fri 30 Oct evening — confirm running that date.', state: 'open' },
    { label: 'Cejerdary', sub: 'Sat 31 Oct, 7pm. Hairy crab, reserve ahead.', state: 'open' }
  ]
};
</script>
<script>
function el(tag, cls, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}

function makeExpand(label, bodyHtml, dropCap) {
  const wrap = el('div', 'expand');
  const btn = el('button', 'expand-btn', `<em class="chevron">›</em>&nbsp;${label}`);
  const body = el('div', 'expand-body');
  body.innerHTML = `<div class="prose${dropCap ? ' prose-drop' : ''}">${bodyHtml}</div>`;
  btn.addEventListener('click', () => {
    btn.classList.toggle('open');
    body.classList.toggle('open');
  });
  wrap.appendChild(btn);
  wrap.appendChild(body);
  return wrap;
}

function renderMasthead() {
  const m = TRIP.meta;
  document.getElementById('m-title').innerHTML = m.title;
  document.getElementById('m-dates').textContent = m.dates;
}

function renderPlanePiece() {
  const p = TRIP.meta.plane;
  const sec = document.getElementById('plane');
  const previewDiv = el('div', 'prose prose-drop', p.preview);
  sec.appendChild(el('div', 'kicker', p.kicker));
  sec.appendChild(el('h2', null, p.title));
  const sf = el('p', 'standfirst', p.standfirst);
  sec.appendChild(sf);
  sec.appendChild(previewDiv);
  sec.appendChild(makeExpand('Continue reading', p.full, false));
}

function renderChapters() {
  const wrap = document.getElementById('chapters');
  const DAY_DATES = { d1: '2026-10-24', d2: '2026-10-25', d3: '2026-10-26', d4: '2026-10-27', d5: '2026-10-28', d6: '2026-10-29', d7: '2026-10-30', d8: '2026-10-31', d9: '2026-11-01' };

  function getShanghaiDate() {
    return new Date().toLocaleString('en-CA', { timeZone: 'Asia/Shanghai' }).slice(0, 10);
  }

  const todayStr = getShanghaiDate();
  const tripActive = todayStr >= '2026-10-24' && todayStr <= '2026-11-01';
  const chapters = [];

  TRIP.days.forEach(day => {
    const ch = el('section', 'chapter');
    ch.id = day.id;
    const dayDate = DAY_DATES[day.id];

    if (tripActive) {
      if (dayDate < todayStr) ch.classList.add('is-past');
      else if (dayDate === todayStr) {
        ch.classList.add('is-today');
        ch.appendChild(el('div', 'chapter-label', 'Today'));
      }
    }

    const head = el('div', 'chapter-head');
    head.innerHTML = `<div class="chapter-top"><div><div class="chapter-meta">${day.dow} &nbsp;·&nbsp; <span class="date-accent">${day.date}</span></div><div class="chapter-title">${day.title}</div></div><div class="day-weather" id="wx-${day.id}"></div></div>`;
    ch.appendChild(head);

    // Essay teaser: first sentence visible, rest behind toggle
    const essayWrap = el('div', null);
    // Extract first sentence from first <p>
    const firstPMatch = day.essay.match(/<p>([\s\S]*?)<\/p>/);
    let teaser = '', rest = day.essay;
    if (firstPMatch) {
      const firstP = firstPMatch[1];
      // Split on first sentence boundary (. followed by space or end)
      const sentMatch = firstP.match(/^(.*?(?:\.|!|\?)(?:\s|$))([\s\S]*)$/);
      if (sentMatch && sentMatch[1].length > 40) {
        teaser = sentMatch[1].trim();
        const remainder = sentMatch[2].trim();
        rest = remainder
          ? `<p>${remainder}</p>` + day.essay.replace(firstPMatch[0], '').trim()
          : day.essay.replace(firstPMatch[0], '').trim();
      } else {
        teaser = firstP;
        rest = day.essay.replace(firstPMatch[0], '').trim();
      }
    }
    const teaserDiv = el('div', 'essay-teaser');
    teaserDiv.innerHTML = `<p>${teaser}</p>`;
    essayWrap.appendChild(teaserDiv);
    if (rest) {
      const continueSpan = el('span', 'essay-continue');
      const expandId = 'essay-' + day.id;
      continueSpan.innerHTML = `<a href="#" id="btn-${expandId}">Continue reading</a>`;
      teaserDiv.appendChild(continueSpan);
      const fullBody = el('div', null);
      fullBody.id = expandId;
      fullBody.style.display = 'none';
      fullBody.innerHTML = `<div class="prose prose-drop" style="margin-top:0.9rem;">${rest}</div>`;
      essayWrap.appendChild(fullBody);
      continueSpan.querySelector('a').addEventListener('click', e => {
        e.preventDefault();
        fullBody.style.display = 'block';
        continueSpan.style.display = 'none';
      });
    }
    ch.appendChild(essayWrap);

    // Spine
    const spine = el('div', 'spine');
    day.events.forEach(ev => {
      const stop = el('div', 'stop');
      stop.dataset.kind = ev.kind;

      const tag = ev.state === 'confirmed' ? '<span class="stop-tag confirmed">Booked</span>'
                : ev.state === 'open'      ? '<span class="stop-tag open">To book</span>' : '';

      // Title -- link if url provided
      const titleHtml = ev.url
        ? `<a href="${ev.url}" target="_blank" rel="noopener">${ev.title}</a>`
        : ev.title;

      stop.appendChild(el('div', 'stop-time', ev.time));
      stop.appendChild(el('div', 'stop-head', `<span class="stop-title">${titleHtml}</span>${tag}`));
      if (ev.note) stop.appendChild(el('div', 'stop-note', ev.note));
      if (ev.ref)  stop.appendChild(el('div', 'stop-ref', `<span>${ev.ref}</span>`));
      if (ev.map)  {
        const ml = el('a', 'stop-map', '↗ Map');
        ml.href = ev.map; ml.target = '_blank'; ml.rel = 'noopener';
        stop.appendChild(ml);
      }
      if (ev.expand) stop.appendChild(makeExpand(ev.expand.label, ev.expand.body, false));
      spine.appendChild(stop);
    });

    ch.appendChild(spine);
    chapters.push({ el: ch, date: dayDate });
  });

  if (tripActive) {
    chapters.sort((a, b) => {
      const aT = a.date === todayStr, bT = b.date === todayStr;
      const aP = a.date < todayStr,   bP = b.date < todayStr;
      if (aT && !bT) return -1; if (bT && !aT) return 1;
      if (!aP && bP) return -1; if (aP && !bP) return 1;
      return a.date < b.date ? -1 : 1;
    });
  }
  chapters.forEach(c => wrap.appendChild(c.el));
}

function renderBookings() {
  const toggle = document.getElementById('bookings-toggle');
  const body = document.getElementById('bookings-body');
  toggle.addEventListener('click', () => {
    toggle.classList.toggle('open');
    body.classList.toggle('open');
  });

  const list = document.getElementById('ledger-list');
  TRIP.bookings.forEach(b => {
    const row = el('div', 'ledger-row');
    row.innerHTML = `<span class="ldot ${b.state}"></span>
      <div class="ledger-body">
        <div class="ledger-label">${b.label}</div>
        <div class="ledger-sub">${b.sub}</div>
        ${b.ref ? `<div class="ledger-ref"><span>${b.ref}</span></div>` : ''}
      </div>
      <span class="ledger-state ${b.state}">${b.state === 'confirmed' ? 'Booked' : 'To book'}</span>
      ${b.url ? `<a class="ledger-link" href="${b.url}" target="_blank" rel="noopener">↗</a>` : ''}`;
    list.appendChild(row);
  });
}

function renderPocket() {
  const wrap = document.getElementById('pocket-wrap');
  TRIP.pocket.forEach(g => {
    const grp = el('div', 'pocket-group');
    const btn = el('button', 'pocket-btn', `${g.group}<span class="chev">›</span>`);
    const body = el('div', 'pocket-body');
    g.items.forEach(([n, d]) => {
      body.appendChild(el('div', 'pocket-item', `<div class="n">${n}</div><div class="d">${d}</div>`));
    });
    btn.addEventListener('click', () => { btn.classList.toggle('open'); body.classList.toggle('open'); });
    grp.appendChild(btn); grp.appendChild(body); wrap.appendChild(grp);
  });
}

function initNotes() {
  const fab = document.getElementById('fab');
  const panel = document.getElementById('notepanel');
  const ta = document.getElementById('note-ta');
  const list = document.getElementById('notelist');
  const draw = () => {
    const n = JSON.parse(localStorage.getItem('mel_notes') || '[]');
    list.innerHTML = n.length
      ? n.map(x => `<div class="noteitem">${x}</div>`).join('')
      : '<div class="empty">No notes yet.</div>';
  };
  fab.addEventListener('click', () => panel.classList.toggle('open'));
  document.getElementById('note-save').addEventListener('click', () => {
    const v = ta.value.trim(); if (!v) return;
    const n = JSON.parse(localStorage.getItem('mel_notes') || '[]');
    n.unshift(v); localStorage.setItem('mel_notes', JSON.stringify(n));
    ta.value = ''; draw();
  });
  draw();
}

async function fetchWeather() {
  // Two bases this trip: Hangzhou first, then Shanghai. Each is fetched once
  // and its days are populated by date lookup. Open-Meteo only forecasts
  // ~16 days out, so this stays quietly blank until mid-October.
  const wmoIcon = c => c===0?'☀':c<=2?'⛅':c===3?'☁':c<=49?'🌫':c<=59?'🌦':c<=69?'🌧':c<=79?'❄':c<=82?'🌦':'⛈';

  const cities = [
    { label: 'Hangzhou', lat: 30.2741, lon: 120.1551, dateToId: { '2026-10-24':'d1', '2026-10-25':'d2', '2026-10-26':'d3' } },
    { label: 'Shanghai', lat: 31.2304, lon: 121.4737, dateToId: { '2026-10-27':'d4', '2026-10-28':'d5', '2026-10-29':'d6', '2026-10-30':'d7', '2026-10-31':'d8', '2026-11-01':'d9' } }
  ];

  for (const c of cities) {
    try {
      const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}` +
        '&daily=weather_code,temperature_2m_max,temperature_2m_min' +
        '&temperature_unit=celsius&timezone=Asia%2FShanghai&forecast_days=16';
      const r = await fetch(url);
      if (!r.ok) continue;
      const d = await r.json();
      d.daily.time.forEach((date, i) => {
        const id = c.dateToId[date];
        if (!id) return;
        const slot = document.getElementById('wx-' + id);
        if (!slot) return;
        const icon = wmoIcon(d.daily.weather_code[i]);
        const hi = Math.round(d.daily.temperature_2m_max[i]);
        const lo = Math.round(d.daily.temperature_2m_min[i]);
        slot.innerHTML = `<span class="day-weather-icon">${icon}</span><span class="day-weather-temps"><span class="hi">${hi}°</span> / ${lo}°</span>`;
      });
    } catch (e) {}
  }
}

document.addEventListener('DOMContentLoaded', () => {
  renderMasthead();
  renderPlanePiece();
  renderChapters();
  renderBookings();
  renderPocket();
  initNotes();
  fetchWeather();
});
</script>
</body>
</html>
